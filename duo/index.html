","wiki":"start time과 finish time","tags":["SCC","trace"],"answer":13,"tol":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":1},{"id":"u10b-04","type":"num","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). F 의 start time 은?","explain":"A0, B1, C2 다음 C 의 이웃 A 는 이미 방문, F 로 가서 start 3.","src":"10강 p.15–28 (연습)","wiki":"start time과 finish time","tags":["SCC","trace"],"answer":3,"tol":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":1},{"id":"u10b-05","type":"num","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). G 의 finish time 은?","explain":"G 는 start 4, 이웃 F 가 이미 in progress 라 바로 끝나 finish 5.","src":"10강 p.15–28 (연습)","wiki":"start time과 finish time","tags":["SCC","trace"],"answer":5,"tol":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":1},{"id":"u10b-06","type":"mc","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). 2차 DFS ($G^T$, finish 내림차순) 의 **첫** tree 는?","explain":"finish 최대 A(13) 에서 시작. $G^T$ 에서 A→C, C→B, B→A 로 {A,B,C} 를 돈다. D·F 쪽으로 가는 $G^T$ 간선은 없다(D→B, F→C 는 반대 방향).","src":"10강 p.31–48 (연습)","wiki":"Kosaraju 알고리즘","tags":["SCC","trace"],"choices":["{A, B, C}","{A, B, C, D, E, F, G}","{F, G}","{A}"],"answer":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":0},{"id":"u10b-07","type":"order","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). 2차 DFS 가 SCC 를 출력하는 순서대로","explain":"남은 정점 중 finish 최대: A13 → (B12 방문됨) D11 → … → F6. D 의 $G^T$ 이웃 B 는 이미 방문이라 {D,E} 만, F 도 E·C 가 방문이라 {F,G} 만.","src":"10강 p.31–48 (연습)","wiki":"Kosaraju 알고리즘","tags":["SCC","trace"],"answer":["{A,B,C}","{D,E}","{F,G}"],"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":2},{"id":"u10b-08","type":"tf","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). 1차 DFS tree 가 이미 SCC 하나와 같다.","explain":"1차 DFS 는 A 에서 전부(A–G) 를 한 tree 로 덮는다. 1차만으로는 SCC 가 안 나온다(p.11 의 'A 에서 시작' 상황).","src":"10강 p.28 (연습)","wiki":"Kosaraju 알고리즘","tags":["SCC","trace"],"answer":false,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":1},{"id":"u10b-09","type":"mc","q":"그림의 웹 그래프에서 1차 DFS 의 finish 가 가장 큰 정점은 KAIST(12) 다. 2차 DFS($G^T$, finish 내림차순)의 첫 tree 는?","explain":"$G^T$ 에서 KAIST 는 나가는 간선이 없다(원래는 들어오는 간선이 없었으니까). 'This is one DFS tree in the DFS forest!'","src":"10강 p.32–33","wiki":"Kosaraju 알고리즘","tags":["SCC","trace"],"choices":["{KAIST}","{KAIST, DGIST, Puppy}","{DGIST, Wiki, YouTube}","모든 정점"],"answer":0,"img":"img/algo10-p13-web.png","imgAlt":"웹 그래프: DGIST, Wikipedia, YouTube, KAIST, Puppy, Google 사이 directed edge","introCard":2},{"id":"u10b-10","type":"tf","q":"2차 DFS 에서는 시작점을 고를 때 1차 DFS 의 finish time 을 그대로 쓴다 (새로 매기지 않는다).","explain":"'Notice that I'm not changing the start and finish times – I'm keeping them from the first run.'","src":"10강 p.34–40","wiki":"SCC finish time 보조정리","tags":["SCC"],"answer":true,"introCard":1},{"id":"u10b-11","type":"mc","q":"2차 DFS 를 $G^T$ 대신 **G 에서 finish 오름차순**으로 돌리면?","explain":"finish 최소 정점이 sink SCC 에 있다는 보장이 없다(CLRS Ex. 22.5-3). 반례에서 a0, b1/2, c3/4, a5 → 최소는 b 인데 b 는 sink 가 아닌 {a,b} 에 있다.","src":"10강 보충","wiki":"Kosaraju 알고리즘","tags":["SCC","trap"],"choices":["똑같이 SCC 가 나온다","틀릴 수 있다. 예: a⇄b, a→c 에서 finish 최소인 b 에서 G 로 DFS 하면 {a,b,c} 가 한 tree","시간만 더 걸린다","DAG 에서만 틀린다"],"answer":1,"introCard":0},{"id":"u10b-12","type":"mc","q":"그림의 웹 그래프에서 2차 DFS 를 finish 가 큰 KAIST 대신 finish 가 작은 Puppy(5) 부터 시작했다면?","explain":"$G^T$ 에서 Puppy → DGIST, Wiki, YouTube, KAIST, Google 이 다 있다. 순서가 결정적이다.","src":"10강 p.42–48","wiki":"Kosaraju 알고리즘","tags":["SCC","trap"],"choices":["{Puppy, Google} 만 나온다","$G^T$ 에서 Puppy 가 DGIST·KAIST 등으로 가서 여러 SCC 가 한 tree 에 섞인다","{KAIST} 만 나온다","결과는 같다"],"answer":1,"img":"img/algo10-p13-web.png","imgAlt":"웹 그래프: DGIST, Wikipedia, YouTube, KAIST, Puppy, Google 사이 directed edge","introCard":0},{"id":"u10b-13","type":"mc","q":"SCC 알고리즘이 finish time 으로 **정렬**하지 않아도 되는 이유는?","explain":"topological sort 와 같은 trick. 정렬 $O(n\\log n)$ 없이 $O(n)$ 으로 순서를 얻는다.","src":"10강 p.12, 70","wiki":"SCC 알고리즘","tags":["SCC","running time"],"choices":["finish time 이 이미 정점 번호 순이라서","finish 순간 list 에 넣으면 그 역순이 곧 finish 내림차순이라서","radix sort 를 쓰니까","2차 DFS 는 순서와 무관해서"],"answer":1,"introCard":0},{"id":"u10b-14","type":"tf","q":"$G$ 와 $G^T$ 의 SCC 는 똑같다.","explain":"$u\\rightsquigarrow v$ in $G$ ⇔ $v\\rightsquigarrow u$ in $G^T$ 라 '서로 왕복' 관계가 그대로다.","src":"10강 p.29–30","wiki":"G^T","tags":["SCC"],"answer":true,"introCard":0},{"id":"u10b-15","type":"tf","q":"1차 DFS 의 시작점 순서를 바꾸면 결과로 나오는 SCC 집합이 달라질 수 있다.","explain":"finish 숫자는 바뀌지만 Lemma 2 는 어떤 순서로 돌려도 성립하고, SCC 자체는 그래프가 정한다. 'Choose starting vertices in any order.'","src":"10강 p.12","wiki":"SCC 알고리즘","tags":["SCC"],"answer":false,"introCard":1},{"id":"u10b-16","type":"num","q":"그림은 웹 그래프의 1차 DFS 결과다. DGIST 에서 시작한 DFS 가 finish 10 으로 끝난 뒤, 아직 unvisited 인 KAIST 에서 다시 시작한다. 가려진 KAIST 의 start time 은?","explain":"재시작 정점의 start 는 직전 finish + 1 이다(L9 p.48 'Do it repeatedly!'). DGIST 가 10 에 끝났으니 KAIST 는 11 에 시작한다. KAIST 의 이웃(DGIST, Puppy)은 모두 all done 이라 바로 finish 12 가 된다. KAIST 는 들어오는 간선이 없어서 DGIST 에서는 닿을 수 없었고, 그래서 따로 시작해야 했다.","src":"10강 p.26–28","wiki":"start time과 finish time","tags":["SCC","DFS","그림"],"img":"img/algo10-p28-dfs1.png","imgAlt":"p.28 웹 그래프 1차 DFS 의 start/finish time, KAIST 의 값이 가려져 있다","explainImg":"img/algo10-p28-dfs1-ans.png","answer":11,"tol":0,"introCard":1},{"id":"u10b-17","type":"num","q":"그림은 웹 그래프의 1차 DFS 결과(정점별 start/finish)다. 1차 DFS forest 는 tree 가 몇 개인가?","explain":"DGIST 에서 시작한 DFS 가 Wiki, Puppy, Google, YouTube 까지 닿아 tree 하나가 된다. KAIST 는 들어오는 간선이 없어서 닿지 못해 두 번째 tree 가 된다. 1차 DFS tree 는 SCC 와 상관없다. 첫 tree 에 SCC 두 개가 섞여 있다. 이 tree 들은 SCC 를 직접 주지 않고 finish time 만 남긴다.","src":"10강 p.26–28","wiki":"DFS tree와 DFS forest","tags":["SCC","DFS","그림"],"img":"img/algo10-p28-dfs1-ans.png","imgAlt":"p.28 웹 그래프 1차 DFS 의 정점별 start/finish time","answer":2,"tol":0,"introCard":1},{"id":"u10b-18","type":"mc","q":"그림은 웹 그래프의 간선을 모두 뒤집은 $G^T$ 에 1차 finish time 을 적어 둔 것이다. 2차 DFS 는 KAIST(12) 에서 시작해 {KAIST} 만 얻는다. **그다음** 시작점이 되는 정점은?","explain":"남은 unvisited 정점 중 1차 finish 가 가장 큰 것을 고른다. DGIST 10, Wiki 9, YouTube 8, Puppy 5, Google 4 이니 DGIST 다. $G^T$ 에서 DGIST 의 DFS 는 Wiki, YouTube 까지만 가고 Puppy 로는 못 간다(원래 간선이 Puppy 쪽으로 들어갔으니 뒤집으면 나가는 간선이 없다). 그래서 두 번째 tree 가 {DGIST, Wiki, YouTube} 로 정확히 SCC 하나가 된다.","src":"10강 p.30–48","wiki":"Kosaraju 알고리즘","tags":["SCC","그림"],"img":"img/algo10-p30-rev.png","imgAlt":"p.30 간선을 뒤집은 웹 그래프와 1차 start/finish time","explainImg":"img/algo10-p48-dfs2-ans.png","choices":["DGIST","Wikipedia","Google","YouTube"],"answer":0,"introCard":0},{"id":"u10b-19","type":"cloze","q":"[분석 템플릿 칸] SCC 알고리즘: 1차 DFS, $G^T$ 만들기, 2차 DFS 가 각각 ___ 이다. 2차 DFS 의 시작 순서는 정렬하지 않고 1차에서 finish 순으로 쌓은 list 를 ___ 얻는다. 그래서 전체가 $O(n+m)$ 이다.","explain":"DFS 는 정점마다 한 번, 간선마다 상수 번이다. $G^T$ 도 간선마다 한 번 뒤집어 넣으면 된다. finish 내림차순을 sort 로 만들면 $O(n\\log n)$ 이 붙지만, finish 되는 순간 append 한 list 를 역순으로 읽으면 공짜다(L9 topological sort 와 같은 trick).","src":"10강 p.12, 70","wiki":"SCC 알고리즘","tags":["SCC","running time","analysis"],"answer":["O(n+m)","뒤집어서"],"bank":["O(n+m)","뒤집어서","O(n log n)","O(nm)","정렬해서"],"introCard":0}],"intro":[{"title":"Kosaraju: DFS 두 번","body":"① $G$ 에서 DFS(시작점 아무 순서)로 finish time 기록 ② 모든 간선을 뒤집은 $G^T$ 를 만든다 ③ $G^T$ 에서 **1차 finish 가 큰 정점부터** 시작점으로 골라 DFS ④ 2차 DFS forest 의 tree 하나하나가 SCC. finish 순서는 정렬 없이 'finish 순간 list 에 append → 역순' 으로 얻는다.","img":"img/algo10-p12-algo.png","imgAlt":"SCC 알고리즘 슬라이드","src":"10강 p.12"},{"title":"1차 DFS 손으로","body":"수업 DFS 시각 규약 그대로(시각 0 부터, 재시작은 직전 finish + 1). 웹 예제: DGIST 에서 시작해 DGIST 가 finish 10, 닿지 못한 KAIST 를 11 에 다시 시작해 finish 12. 1차 tree 는 SCC 와 무관하다. finish time 만 남긴다.","img":"img/algo10-p28-dfs1-ans.png","imgAlt":"웹 그래프 1차 DFS 의 start/finish","src":"10강 p.15–28"},{"title":"2차 DFS 손으로","body":"$G^T$ 에서 unvisited 중 1차 finish 최대인 정점을 시작점으로 DFS, 그 tree 를 SCC 로 출력, 반복. 웹 예제: KAIST(12) → {KAIST}, DGIST(10) → {DGIST, Wiki, YouTube}, Puppy(5) → {Puppy, Google}. finish 가 작은 쪽부터 하거나 $G$ 에서 하면 SCC 가 섞인다.","img":"img/algo10-p48-dfs2-ans.png","imgAlt":"2차 DFS forest 의 세 tree","src":"10강 p.29–48"},{"title":"$G^T$ 의 성질","body":"$G$ 와 $G^T$ 의 SCC 는 똑같다(왕복 path 를 뒤집어도 왕복). 그래서 2차 DFS 를 $G^T$ 에서 해도 된다. 1차 시작점 순서가 바뀌어도 결과 SCC 집합은 같다.","src":"10강 p.29–30"}]},{"id":"u10c","title":"왜 되는가: SCC graph 와 Lemma 2","items":[{"id":"u10c-01","type":"mc","q":"Lemma 1 'SCC graph 는 DAG 다' 의 증명 방법은?","explain":"'Proof idea: if not, then two SCCs would collapse into one.' 교수도 10/27 에 같은 말로 설명했다.","src":"10강 p.50–51 · 10/27 녹음","wiki":"SCC graph는 DAG","prof":true,"tags":["SCC","proof"],"choices":["귀납법","귀류법: cycle 이 있으면 그 SCC 들이 서로 왕복 가능해 하나로 합쳐져야 하므로 maximality 모순","parenthesis theorem","BFS layer"],"answer":1,"introCard":0},{"id":"u10c-02","type":"cloze","q":"SCC 의 finish time 은 원소 finish 의 ___, start time 은 원소 start 의 ___ 이다 (1차 DFS 기준).","explain":"예: A = {DGIST 0/10, Wiki 1/9, YouTube 7/8} 이면 A.start = 0, A.finish = 10.","src":"10강 p.52","wiki":"SCC finish time 보조정리","tags":["SCC"],"answer":["최댓값","최솟값"],"bank":["최댓값","최솟값","합","평균","중앙값"],"introCard":1},{"id":"u10c-03","type":"num","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). SCC {D, E} 의 finish time 은?","explain":"D 는 8/11, E 는 9/10. SCC finish = max = 11.","src":"10강 p.52 (연습)","wiki":"SCC finish time 보조정리","tags":["SCC","trace"],"answer":11,"tol":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F","introCard":1},{"id":"u10c-04","type":"tf","q":"(G 기준) finish time 이 가장 큰 SCC 는 나가는 간선만 있고 들어오는 간선은 없다.","explain":"교수: 'That's the key.' 이 SCC 는 G 의 source 이고, 간선을 뒤집으면 들어오는 간선만 남는 sink 가 된다.","src":"10강 p.54–55 · 10/27 녹음","wiki":"sink SCC와 source SCC","prof":true,"tags":["SCC","intuition"],"answer":true,"introCard":3},{"id":"u10c-05","type":"mc","q":"$G^T$ 에서 finish 최대 SCC 는 어떤 SCC 인가?","explain":"그래서 거기서 DFS 하면 그 SCC 밖으로 못 나가 정확히 그 SCC 만 나온다. 지우고 다음 최대에서 반복('Remove and repeat').","src":"10강 p.55","wiki":"sink SCC와 source SCC","tags":["SCC"],"choices":["source (나가는 간선만)","sink (나가는 간선 없음)","가장 큰 SCC","정점 하나짜리 SCC"],"answer":1,"introCard":3},{"id":"u10c-06","type":"cloze","q":"Lemma 2: G 의 SCC graph 에 간선 A→B 가 있으면 A 의 ___ time 이 B 보다 크다. ___ time 버전은 성립하지 않는다.","explain":"Case 1 에서는 A.start \u003c B.start, Case 2 에서는 A.start > B.start 라 start 는 어느 쪽도 될 수 있다.","src":"10강 p.60–64","wiki":"SCC finish time 보조정리","tags":["SCC","proof"],"answer":["finish","start"],"bank":["finish","start","degree","discovery","size"],"introCard":2},{"id":"u10c-07","type":"order","q":"Lemma 2 의 Case 1 (A 를 B 보다 먼저 만남) 증명을 순서대로","explain":"'Reach A before B ⟹ we will discover y via z'. 결론 B.finish \u003c A.finish.","src":"10강 p.61","wiki":"SCC finish time 보조정리","tags":["SCC","proof"],"answer":["z = A 에서 처음 발견된 정점, y = B 에서 finish 최대인 정점","z 를 발견하는 순간 A, B 의 정점은 모두 미방문이다","z 에서 A 안을 거쳐 A→B 간선으로 y 까지 미방문 path 가 있으니 y 는 z 의 descendant 다","parenthesis theorem 으로 y.finish \u003c z.finish ≤ A.finish"],"introCard":2},{"id":"u10c-08","type":"mc","q":"Lemma 2 의 Case 2 (B 를 먼저 만남) 에서 'B 에서 A 로 가는 path 가 없다' 의 근거는?","explain":"그래서 B 를 다 끝낼 때까지 A 에 닿지 못하고, B.start \u003c B.finish \u003c A.start \u003c A.finish.","src":"10강 p.62","wiki":"SCC graph는 DAG","tags":["SCC","proof"],"choices":["parenthesis theorem","Lemma 1: SCC graph 는 DAG (path 가 있으면 A→B 와 함께 cycle)","G^T 의 성질","finish 가 최대라서"],"answer":1,"introCard":0},{"id":"u10c-09","type":"mc","q":"Corollary 1: $G^T$ 에 SCC 간선 B→A 가 있으면?","explain":"$G^T$ 의 B→A = G 의 A→B → Lemma 2. 말로 하면 '$G^T$ 의 SCC 사이 화살표는 항상 finish 가 큰 쪽을 향한다'.","src":"10강 p.65","wiki":"SCC finish time 보조정리","tags":["SCC","proof"],"choices":["A.finish \u003c B.finish","A.finish > B.finish","A.start > B.start","아무 관계 없다"],"answer":1,"introCard":2},{"id":"u10c-10","type":"tf","q":"G 의 SCC graph 에 간선 A→B 가 있으면 A.start > B.start 이다.","explain":"start 는 어느 쪽이든 될 수 있다. 성질은 finish 에만 성립한다(자주 하는 실수).","src":"10강 p.63","wiki":"SCC finish time 보조정리","tags":["SCC","trap"],"answer":false,"introCard":2},{"id":"u10c-11","type":"mc","q":"Lemma 2(SCC graph 에 A→B 가 있으면 A.finish > B.finish)의 두 case 증명은 어떤 증명과 구조가 같은가?","explain":"'this is exactly the same two-case argument that we did earlier, just with the SCC DAG!'","src":"10강 p.63","wiki":"SCC finish time 보조정리","tags":["SCC","proof"],"choices":["BFS layer = distance 귀납","topological sort Claim (A→B ⇒ A.finish > B.finish)","odd cycle 논증","DFS $O(n+m)$ 논증"],"answer":1,"introCard":2},{"id":"u10c-12","type":"match","q":"용어와 뜻을 연결하시오","explain":"G 의 source 는 $G^T$ 의 sink 다. 2차 DFS 는 항상 $G^T$ 의 sink 부터 꺼낸다.","src":"10강 p.50–55","wiki":"G^T","tags":["SCC"],"pairs":[["$G^T$","모든 간선의 방향을 뒤집은 그래프"],["sink SCC","다른 SCC 로 나가는 간선이 없는 SCC"],["source SCC","다른 SCC 에서 들어오는 간선이 없는 SCC"],["SCC graph","SCC 를 정점으로 한 DAG"]]},{"id":"u10c-13","type":"num","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. G 의 SCC graph 에는 간선이 몇 개인가?","explain":"SCC {A,B,C}, {D,E}, {F,G}. 간선 B→D ({A,B,C}→{D,E}), C→F ({A,B,C}→{F,G}), E→F ({D,E}→{F,G}). 세 개이고 cycle 이 없다.","src":"10강 p.50 (연습)","wiki":"SCC graph","tags":["SCC","figure"],"answer":3,"tol":0,"img":"img/algo10-gen-u10b-03.png","imgAlt":"directed graph: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F"},{"id":"u10c-14","type":"tf","q":"DAG 에 SCC 알고리즘을 돌리면 2차 DFS 의 tree 가 모두 정점 하나짜리다.","explain":"DAG 는 모든 SCC 가 정점 하나다. 그리고 1차 finish 내림차순이 곧 topological order 다.","src":"10강 보충","wiki":"SCC 알고리즘","tags":["SCC","DAG"],"answer":true,"introCard":0},{"id":"u10c-15","type":"mc","q":"그림의 SCC 는 원소가 DGIST(start 0, finish 10), Wiki(1, 9), YouTube(7, 8) 다. 가려진 SCC 의 (start, finish) 는?","explain":"SCC 의 start 는 원소 start 의 **최솟값**, finish 는 원소 finish 의 **최댓값** 이다(p.52). 그래서 start = min(0,1,7) = 0, finish = max(10,9,8) = 10. 모든 시각은 1차 DFS 기준이다.","src":"10강 p.52","wiki":"SCC finish time 보조정리","tags":["SCC","그림"],"img":"img/algo10-p52-scctime.png","imgAlt":"p.52 SCC 하나(DGIST, Wiki, YouTube)와 원소별 start/finish, SCC 의 값은 가려져 있다","explainImg":"img/algo10-p52-scctime-ans.png","choices":["(0, 10)","(7, 10)","(0, 8)","(1, 9)"],"answer":0,"introCard":1},{"id":"u10c-16","type":"mc","q":"그림은 웹 그래프의 SCC graph 와 각 SCC 의 (start, finish) 다. 모든 간선을 뒤집었을 때 **나가는 간선이 없는** SCC 는? (2차 DFS 는 여기서 시작한다)","explain":"원래 그래프에서 KAIST 는 나가는 간선만 있다(source). 뒤집으면 들어오는 간선만 남아 sink 가 된다. 이 SCC 가 finish 최대(12)라는 것이 Lemma 2 의 결과다. sink SCC 에서 DFS 를 하면 밖으로 새지 않으니 정확히 그 SCC 만 얻는다. 뒤집어도 DAG 는 DAG 다.","src":"10강 p.53–55","wiki":"sink SCC와 source SCC","tags":["SCC","그림"],"img":"img/algo10-p54-dag.png","imgAlt":"p.54 웹 예제 SCC graph: 세 SCC 와 각각의 start/finish, 간선은 원래 방향","explainImg":"img/algo10-p55-revdag-ans.png","choices":["KAIST (finish 12)","{DGIST, Wiki, YouTube} (finish 10)","{Google, Puppy} (finish 5)","없다. 뒤집으면 cycle 이 생긴다"],"answer":0,"introCard":3},{"id":"u10c-17","type":"order","q":"[증명 칸 채우기] Lemma 1 'SCC graph 는 DAG 다' 의 귀류법 증명을 순서대로","explain":"p.51 'Proof idea: if not, then two SCCs would collapse into one.' 을 네 칸으로 늘린 것이다. 핵심은 maximality 다. SCC 는 '더 키울 수 없는' strongly connected 집합인데 cycle 이 있으면 더 키울 수 있다.","src":"10강 p.51 · 10/27 녹음","wiki":"SCC graph는 DAG","tags":["SCC","proof"],"answer":["SCC graph 에 directed cycle 이 있다고 가정한다","cycle 위의 두 SCC A, B 에 대해 A 의 정점과 B 의 정점은 서로 왕복하는 path 가 있다","그러면 A ∪ B 도 strongly connected 다","SCC 는 maximal 이어야 하므로 모순이다. 따라서 SCC graph 는 DAG 다"],"introCard":0},{"id":"u10c-18","type":"mc","q":"[Circle all 형식] 1차 DFS 기준 finish time 에 대해 옳은 것을 **모두** 고른 조합은? (1) SCC graph 에 A→B 가 있으면 A.finish > B.finish (2) SCC graph 에 A→B 가 있으면 A.start \u003c B.start (3) $G^T$ 의 SCC 간 간선은 모두 finish 가 큰 SCC 쪽을 향한다 (4) finish 가 가장 큰 SCC 는 $G$ 에서 source 다 (5) finish 가 가장 작은 정점에서 $G$ 로 DFS 하면 항상 sink SCC 하나만 얻는다","explain":"(1) 참: Lemma 2. (2) 거짓: start 버전은 성립하지 않는다. B 를 먼저 탐색하면 B.start 가 더 작다(Case 2). (3) 참: Corollary 1. 2차 DFS 가 finish 최대에서 시작하면 들어오는 간선만 남는 이유다. (4) 참: 들어오는 간선이 있다면 그 출발 SCC 의 finish 가 더 커야 한다. (5) 거짓: a⇄b, a→c 에서 finish 최소인 b 에서 $G$ 로 DFS 하면 a 를 거쳐 c 까지 가서 {a,b,c} 가 한 tree 가 된다. 정점 하나의 finish 최소는 SCC 의 finish 최소를 보장하지 않는다.","src":"10강 p.60–65 · 중간 1번 형식","wiki":"SCC finish time 보조정리","tags":["SCC","circle-all"],"choices":["(1)(3)(4)","(1)(2)(3)(4)","(1)(4)","(1)(3)(4)(5)"],"answer":0,"introCard":3}],"intro":[{"title":"Lemma 1: SCC graph 는 DAG","body":"귀류법: SCC graph 에 cycle 이 있으면 cycle 위 SCC 들의 정점이 서로 왕복 가능해 합집합도 strongly connected 다. SCC 의 maximality 에 모순.","img":"img/algo10-p51-sccgraph-ans.png","imgAlt":"웹 예제의 SCC graph","src":"10강 p.50–51"},{"title":"SCC 의 start/finish","body":"(1차 DFS 기준) SCC 의 **finish = 원소 finish 의 최댓값**, **start = 원소 start 의 최솟값**. 예: DGIST(0,10), Wiki(1,9), YouTube(7,8) 의 SCC 는 (0, 10).","src":"10강 p.52"},{"title":"Lemma 2 와 Corollary","body":"SCC graph 에 A→B 가 있으면 **A.finish > B.finish** (start 버전은 성립 안 함). 증명은 topological sort Claim 과 같은 두 case: A 를 먼저 만나면 A 의 첫 정점 z 의 자손으로 B 전체가 들어가고, B 를 먼저 만나면 Lemma 1 때문에 A 로 못 가 B 가 먼저 끝난다. Corollary: $G^T$ 의 SCC 간 간선은 finish 가 **큰** 쪽을 향한다.","src":"10강 p.56–65"},{"title":"그래서 sink 에서 시작한다","body":"finish 최대 SCC 는 $G$ 에서 source(들어오는 간선 없음)다. 간선을 뒤집은 $G^T$ 에서는 **sink**(나가는 간선 없음)가 되어, 거기서 시작한 DFS 는 그 SCC 밖으로 새지 않는다. 그 SCC 를 지우고 반복.","img":"img/algo10-p55-revdag-ans.png","imgAlt":"뒤집은 SCC graph 에서 finish 최대 SCC 를 떼어 내는 그림","src":"10강 p.53–55"}]},{"id":"u10d","title":"정확성 귀납 · 수행 시간 · HW3","items":[{"id":"u10d-01","type":"cloze","q":"SCC 알고리즘 정확성 귀납의 가설: 2차 DFS forest 의 처음 t 개 tree 는 finish 가 가장 큰 t 개의 ___ 이고, 남은 미방문 부분은 남은 SCC 들로 이루어진 ___ 다.","explain":"Base t = 0 은 자명하고 남은 것이 DAG 라는 건 Lemma 1. 결론은 t = #SCC 일 때.","src":"10강 p.67–69","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"answer":["SCC","DAG"],"bank":["SCC","DAG","DFS tree","cycle","path"],"introCard":0},{"id":"u10d-02","type":"mc","q":"SCC 알고리즘 정확성 귀납 증명의 base case (t = 0) 에서 '남은 것은 모든 SCC 로 이루어진 DAG' 를 보장하는 것은?","explain":"SCC graph 가 DAG 라는 사실 그 자체다.","src":"10강 p.67","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"choices":["Lemma 1","Lemma 2","Corollary 1","parenthesis theorem"],"answer":0,"introCard":0},{"id":"u10d-03","type":"mc","q":"SCC 알고리즘 정확성 귀납: 2차 DFS 의 (t+1)번째 tree 의 root x 가 속한 SCC 를 A 라 하자. x 에서 시작한 DFS 가 A **전체**에 닿는(더 적게는 아닌) 근거는?","explain":"'더 많이는 아니다' 는 Corollary(남은 SCC 로 나가는 간선 없음)로, '더 적게도 아니다' 는 A 가 $G^T$ 에서도 strongly connected 라는 걸로 보인다.","src":"10강 p.68","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"choices":["A 는 간선을 뒤집어도 여전히 strongly connected 이다","A 의 finish 가 최대다","Lemma 1","$G^T$ 에서 A 는 source 다"],"answer":0,"introCard":0},{"id":"u10d-04","type":"mc","q":"SCC 알고리즘 정확성 귀납: 2차 DFS 의 (t+1)번째 tree 의 root x 가 속한 SCC 를 A 라 하자. DFS 가 A 밖의 미방문 정점으로 새어 나가지 않는(더 많이는 아닌) 근거는?","explain":"A 에서 이미 찾은 SCC 로 가는 간선은 있을 수 있지만 그쪽은 방문 처리됐다.","src":"10강 p.68","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"choices":["A 가 strongly connected 라서","Corollary: $G^T$ 의 간선은 finish 가 큰 쪽으로만 가는데 남은 SCC 중 A 보다 큰 것이 없다","Lemma 1","DFS 는 항상 하나의 SCC 만 본다"],"answer":1,"introCard":0},{"id":"u10d-05","type":"tf","q":"2차 DFS 에서 (t+1)번째 tree 의 root x 에 대해, x 가 속한 SCC 의 finish 는 x.finish 와 같다.","explain":"2차 DFS 는 미방문 중 finish 최대를 root 로 고른다. A 의 다른 정점이 더 크면 그게 먼저 root 가 됐을 것이고, IH 상 A 의 일부만 방문됐을 수도 없다.","src":"10강 p.68","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"answer":true,"introCard":0},{"id":"u10d-06","type":"mc","q":"adjacency **matrix** 로 SCC 알고리즘 전체를 돌리면 시간은?","explain":"DFS 가 $O(n^2)$, 전치도 $O(n^2)$. list 면 DFS 2번 + 전치 1번 모두 $O(n+m)$.","src":"10강 보충","wiki":"SCC 알고리즘","tags":["SCC","running time"],"choices":["$O(n+m)$","$O(n^2)$","$O(n^3)$","$O(nm)$"],"answer":1,"introCard":2},{"id":"u10d-07","type":"sa","q":"adjacency list 기준 SCC 알고리즘 전체 수행 시간은? (Big-O)","explain":"1차 DFS $O(n+m)$ + $G^T$ 만들기 $O(n+m)$ + 2차 DFS $O(n+m)$. 교수 '이 알고리즘은 DFS 두 번만'.","src":"10강 p.70 · 10/27 녹음","wiki":"SCC 알고리즘","prof":true,"tags":["SCC","running time"],"answer":"O(n+m)","alts":["O(m+n)","Θ(n+m)"],"introCard":1},{"id":"u10d-08","type":"tf","q":"2차 DFS 를 $G^T$ 에서 하되 시작점은 아무 순서로 골라도 된다.","explain":"sink 가 아닌 곳에서 시작하면 여러 SCC 가 섞인다. 반드시 1차 finish 내림차순.","src":"10강 보충","wiki":"Kosaraju 알고리즘","tags":["SCC","trap"],"answer":false},{"id":"u10d-09","type":"cloze","q":"finish 순간 list 에 넣고 역순으로 쓰는 trick 은 DFS 로 하는 ___ 와 같고, 그 덕분에 SCC 알고리즘 전체가 정렬 없이 ___ 이다.","explain":"정렬을 했다면 $O(n\\log n + m)$ 이 됐을 것이다. 교수: 'DFS 를 독립적으로 두 번 → O(n+m)'.","src":"10강 p.12, 70","wiki":"SCC 알고리즘","tags":["SCC","running time"],"answer":["topological sort","O(n+m)"],"bank":["topological sort","O(n+m)","BFS","O(n log n + m)","Dijkstra"],"introCard":1},{"id":"u10d-10","type":"num","q":"반례 그래프 a→b, b→a, a→c 에서 a 부터 수업 DFS 시각 규약 DFS 를 돌리면 b 의 finish time 은?","explain":"a0 → b1, b 의 이웃 a 는 진행 중 → b2 → c3/4 → a5. finish 최소가 b(2) 인데 b 는 sink SCC {c} 가 아니라 {a,b} 에 있다.","src":"10강 보충 (CLRS Ex. 22.5-3)","wiki":"Kosaraju 알고리즘","tags":["SCC","trace"],"answer":2,"tol":0,"img":"img/algo10-gen-u10d-10.png","imgAlt":"directed graph: a→b, b→a, a→c"},{"id":"u10d-11","type":"mc","q":"도미노 문제: 도미노 i 를 밀면 j 가 넘어지는 관계를 directed graph 로 그렸다. SCC 를 하나의 정점으로 압축한 그래프는 항상 어떤 그래프인가?","explain":"Lemma 1 그대로다. 압축 그래프(condensation)에서 source/sink SCC 를 세는 것이 문제의 출발점이다.","src":"HW3 Problem 5 · 10강 p.50–51","wiki":"SCC graph는 DAG","prof":true,"tags":["SCC","HW3"],"choices":["tree","DAG","complete graph","bipartite graph"],"answer":1,"introCard":3},{"id":"u10d-12","type":"mc","q":"도미노 문제: 어떤 도미노 하나를 밀어도 전부 넘어지게 하려면 그래프가 무엇이 되어야 하나? (추가할 최소 간선 수는 SCC 가 2개 이상일 때 max(source SCC 수, sink SCC 수))","explain":"어느 정점에서 출발해도 모두에 도달 = 모든 쌍이 서로 도달 = strongly connected. SCC 가 이미 하나면 0 개.","src":"HW3 Problem 5","wiki":"strongly connected","prof":true,"tags":["SCC","HW3"],"choices":["DAG","strongly connected","bipartite","tree"],"answer":1,"introCard":3},{"id":"u10d-13","type":"tf","q":"SCC 알고리즘 정확성의 귀납 증명은 새 아이디어 없이 앞의 결과를 다시 쓴 것이다. 시험에서 핵심은 Lemma 2 와 'finish 최대 SCC 는 $G^T$ 에서 sink' 라는 논리다.","explain":"10/27 녹음. 증명 4칸 틀(IH / Base / Step / Conclusion)에 Corollary 와 'strongly connected 유지' 두 줄을 채울 수 있으면 된다.","src":"10강 p.67–69 · 10/27 녹음","wiki":"SCC 알고리즘 정확성 증명","prof":true,"tags":["SCC","proof"],"answer":true,"introCard":0},{"id":"u10d-14","type":"order","q":"[증명 칸 채우기] SCC 알고리즘 정확성 귀납의 Inductive step 을 순서대로","explain":"p.68 의 두 화살표 'not fewer'(2번째 칸)와 'not more'(3번째 칸)가 핵심이다. 귀납 가설은 '처음 t 개 tree 가 finish 큰 t 개 SCC' 다. 중간 4번처럼 IH 를 결론과 같은 문장으로 쓰지 말고 t 에 대한 진술로 둘 것.","src":"10강 p.67–69","wiki":"SCC 알고리즘 정확성 증명","tags":["SCC","proof"],"answer":["(t+1)번째 tree 의 root x 는 남은 정점 중 finish 최대이므로, x 가 속한 SCC A 는 남은 SCC 중 finish 최대다","A 는 $G^T$ 에서도 strongly connected 라 DFS(x) 가 A 전부를 방문한다","Corollary 1 에 의해 $G^T$ 에서 A 밖으로 나가는 간선은 finish 가 더 큰 SCC, 즉 이미 방문한 SCC 로만 간다","그래서 (t+1)번째 tree 는 정확히 A 이고, 남은 SCC 들은 여전히 DAG 를 이룬다"],"introCard":0}],"intro":[{"title":"정확성: 귀납","body":"IH: 2차 DFS 의 처음 t 개 tree 는 finish 가 큰 t 개 SCC 이고, 남은 정점은 남은 SCC 들의 DAG 다. Base(t=0)는 Lemma 1. Step: (t+1)번째 root x 의 SCC A 는 남은 것 중 finish 최대다.","src":"10강 p.66–69"},{"title":"not fewer, not more","body":"**더 적게는 아님**: A 는 $G^T$ 에서도 strongly connected 라 DFS(x) 가 A 전체에 닿는다. **더 많이도 아님**: Corollary 에 의해 $G^T$ 에서 A 밖으로 나가는 간선은 finish 가 더 큰, 즉 이미 방문한 SCC 로만 간다. 그래서 (t+1)번째 tree = A.","src":"10강 p.68"},{"title":"수행 시간","body":"DFS 두 번 + $G^T$ 만들기 모두 $O(n+m)$ (adjacency list). finish 순서는 append 후 역순이라 정렬 비용이 없다. matrix 면 $O(n^2)$.","src":"10강 p.70"},{"title":"응용: 도미노","body":"도미노 i 를 밀면 j 가 넘어지는 관계를 그래프로. SCC 를 압축하면 DAG 이고, 어떤 하나를 밀어도 다 넘어지려면 전체가 strongly connected 여야 한다. 추가할 최소 간선 수는 (SCC ≥ 2 일 때) max(source SCC 수, sink SCC 수).","src":"HW3 Problem 5"}]}]},{"id":"u11","title":"11강 Shortest Path","desc":"weighted graph · Dijkstra · Bellman-Ford · negative cycle","lessons":[{"id":"u11a","title":"weighted graph 와 shortest path","items":[{"id":"u11a-01","type":"mc","q":"weighted graph 에서 path 의 cost 와 distance $d(u,v)$ 의 정의로 옳은 것은?","explain":"p.8 정의. 간선 수로 재는 건 BFS(무가중치) 의 거리다.","src":"11강 p.8","wiki":"shortest path problem","tags":["shortest path"],"choices":["cost = 간선 수, $d$ = 최소 간선 수","cost = 지나는 weight 의 합, $d(u,v)$ = u–v path cost 의 최솟값","cost = 가장 큰 weight, $d$ = 그 최솟값","cost = weight 평균"],"answer":1,"introCard":0},{"id":"u11a-02","type":"tf","q":"캠퍼스 지도(weight = 걷는 시간)에서 BFS 를 돌리면 Gates→Park 의 가장 빠른 길이 나온다.","explain":"BFS 는 간선 2개짜리 Gates→Halmae Gomtang→Park 을 준다. 걷는 시간으로는 R1→E3→Park(6)이 최단. 'Just running BFS is not a solution for weighted graph.'","src":"11강 p.6–7 · 10/27 녹음","wiki":"weighted graph","prof":true,"tags":["BFS","shortest path"],"answer":false,"introCard":0},{"id":"u11a-03","type":"num","q":"캠퍼스 그래프: Gates–R1 1, Gates–HG 25, R1–E3 1, R1–HG 22, E3–Park 4, Park–HG 20 (무향 = 양방향). $d(\\text{Gates}, \\text{Park})$ 은?","explain":"Gates–R1–E3–Park = 1 + 1 + 4 = 6. HG 경유는 25 + 20 = 45.","src":"11강 p.9, 15","wiki":"d(s,v)","tags":["shortest path"],"answer":6,"tol":0,"img":"img/algo11-p15-graph.png","imgAlt":"p.15 Gates, R1, E3, Park, Halmae Gomtang 과 간선 weight 1, 1, 4, 25, 20, 22","introCard":0},{"id":"u11a-04","type":"num","q":"그림의 캠퍼스 그래프(Gates–R1 1, Gates–HG 25, R1–E3 1, R1–HG 22, E3–Park 4, Park–HG 20)에서 $d(\\text{Gates}, \\text{HG})$ 는?","explain":"직접 간선 25 보다 Gates–R1–HG = 1 + 22 = 23 이 짧다. Park 경유는 6 + 20 = 26.","src":"11강 p.11, 15","wiki":"d(s,v)","tags":["shortest path"],"answer":23,"tol":0,"img":"img/algo11-p15-graph.png","imgAlt":"캠퍼스 그래프: Gates, R1, E3, Park, Halmae Gomtang 과 간선 weight 1, 1, 4, 25, 20, 22","introCard":0},{"id":"u11a-05","type":"order","q":"'shortest path 의 sub-path 는 shortest path 다' 귀류법 증명을 순서대로","explain":"교수가 칠판에서 두 번 반복한 증명. 이 성질이 Dijkstra Claim 1·2 와 L12 의 optimal substructure 로 이어진다.","src":"11강 p.10 · 10/27 녹음","wiki":"최단경로의 부분경로","prof":true,"tags":["proof","optimal substructure"],"answer":["P = s⇝x⇝t 가 shortest 이고, 앞부분을 P1 = s⇝x, 뒷부분을 P2 라 하자","P1 보다 짧은 s⇝x path P1' 이 있다고 가정한다","P1' + P2 도 s⇝t path 이고 cost 가 P 보다 작다","P 가 shortest 라는 가정에 모순"],"introCard":1},{"id":"u11a-06","type":"mc","q":"'shortest path 의 sub-path 도 shortest path 다' 는 dynamic programming 에서 어떤 이름의 성질인가?","explain":"큰 문제의 최적해 안에 작은 문제의 최적해가 들어 있다는 성질. FW 점화식 Case 2 에서도 쓴다.","src":"11강 p.10 · 12강 p.28","wiki":"optimal substructure","tags":["optimal substructure"],"choices":["overlapping subproblems","optimal substructure","memoization","greedy choice"],"answer":1,"introCard":1},{"id":"u11a-07","type":"tf","q":"최단경로 문제에서 undirected 간선은 같은 weight 의 directed 간선 두 개(양방향)로 읽는다.","explain":"'For this lecture all graphs are directed, but to save on notation I'm just going to draw undirected edges.' BF 음수 예제(p.81)만 실제 화살표가 있다.","src":"11강 p.8","wiki":"weighted graph","tags":["shortest path"],"answer":true,"introCard":0},{"id":"u11a-08","type":"mc","q":"single-source shortest-path problem 이란?","explain":"p.11 'from one vertex (Gates) to all other vertices'. 모든 쌍은 L12 Floyd-Warshall.","src":"11강 p.11","wiki":"single-source shortest path","tags":["shortest path"],"choices":["모든 쌍의 최단경로","한 정점 s 에서 다른 **모든** 정점까지의 최단경로","s 에서 t 하나까지의 최단경로만","가장 긴 simple path"],"answer":1,"introCard":2},{"id":"u11a-09","type":"cloze","q":"single-source shortest path 의 답(정점마다 거리와 경로)은 표로 다 적을 필요 없이, 각 vertex 의 ___ 만 기억한 shortest-path ___ 로 충분하다.","explain":"Dijkstra 도 tree 를 만든다(p.22, p.52 'We could post this tree in Gates!').","src":"11강 p.11, 52","wiki":"single-source shortest path","tags":["shortest path"],"answer":["parent","tree"],"bank":["parent","tree","degree","table","cycle"],"introCard":2},{"id":"u11a-10","type":"mc","q":"Dijkstra 의 줄과 중력 직관에서 'a vertex is done' 인 순간은?","explain":"Gates 를 들어 올리면 가까운 순서대로 바닥에서 떨어진다. 처음 떠오르는 순간 매달린 경로가 최단경로다(Claim 2 의 직관).","src":"11강 p.16–22","wiki":"Dijkstra 줄과 중력 직관","tags":["Dijkstra","intuition"],"choices":["줄이 끊어질 때","바닥에서 떨어질 때 (매달린 줄이 팽팽해질 때)","모든 이웃이 떠오를 때","Gates 와 직접 연결될 때"],"answer":1,"introCard":2},{"id":"u11a-11","type":"tf","q":"줄 직관에서 끝까지 느슨한 줄(Gates–HG 25, Park–HG 20)은 shortest-path tree 에 들어가지 않는다.","explain":"팽팽해진 줄 Gates–R1, R1–E3, E3–Park, R1–HG 만 모으면 tree 가 되고 그게 shortest-path tree 다.","src":"11강 p.21–22","wiki":"Dijkstra 줄과 중력 직관","tags":["Dijkstra","intuition"],"answer":true,"img":"img/algo11-p22-tree.png","imgAlt":"p.22 Gates 를 들어 올린 줄 그림: 팽팽한 줄이 shortest-path tree 를 이룬다","introCard":2},{"id":"u11a-12","type":"match","q":"상황과 알고리즘을 연결하시오","explain":"p.62 OSPF = Dijkstra, p.87 RIP = Bellman-Ford 계열. 무가중치는 BFS, all-pairs 는 L12 FW.","src":"11강 p.62, 87 · 12강 p.42","wiki":"OSPF와 RIP","tags":["shortest path"],"pairs":[["OSPF (IP routing)","Dijkstra"],["RIP (distributed routing)","Bellman-Ford"],["모든 간선 weight 가 같다","BFS"],["모든 쌍의 최단경로","Floyd-Warshall"]],"introCard":3},{"id":"u11a-13","type":"num","q":"그림의 캠퍼스 그래프(Gates–R1 1, Gates–HG 25, R1–E3 1, R1–HG 22, E3–Park 4, Park–HG 20)에서 R1 에서 Park 까지의 shortest path cost 는?","explain":"R1–E3–Park = 1 + 4 = 5. Gates→Park 최단경로(6)의 부분경로이고 그 자체로도 최단이다 → 다음 슬라이드의 warm-up.","src":"11강 p.9–10","wiki":"최단경로의 부분경로","tags":["shortest path"],"answer":5,"tol":0,"img":"img/algo11-p15-graph.png","imgAlt":"캠퍼스 그래프: Gates, R1, E3, Park, Halmae Gomtang 과 간선 weight 1, 1, 4, 25, 20, 22","introCard":0}],"intro":[{"title":"weighted graph 와 distance","body":"간선마다 weight $w(u,v)$(걷는 시간 등). path 의 **cost** = weight 합, $d(u,v)$ = u–v path cost 의 최솟값. 수업 그래프의 undirected 간선은 같은 weight 의 양방향 간선으로 읽는다. BFS 는 간선 수만 세서 weight 가 다르면 틀린다.","img":"img/algo11-p15-graph.png","imgAlt":"캠퍼스 그래프: Gates, R1, E3, Park, Halmae Gomtang","src":"11강 p.6–9, 15"},{"title":"sub-path 도 shortest path","body":"$s\\rightsquigarrow x\\rightsquigarrow t$ 가 최단이면 앞부분 $s\\rightsquigarrow x$ 도 최단이다. 더 짧은 게 있으면 바꿔 끼워 전체가 더 짧아지니 모순. DP 의 **optimal substructure** 다.","src":"11강 p.10"},{"title":"single-source 와 shortest-path tree","body":"한 정점 s 에서 **모든** 정점까지의 최단경로. 정점마다 parent 만 기억하면 shortest-path tree 가 된다. Dijkstra 직관: 정점을 줄로 이어 s 를 들어 올리면 바닥에서 떠오르는 순서가 확정 순서이고, 팽팽한 줄이 tree 다.","img":"img/algo11-p22-tree.png","imgAlt":"들어 올린 줄이 만든 shortest-path tree","src":"11강 p.11–22"},{"title":"쓰임","body":"IP routing: OSPF 는 Dijkstra, RIP 는 Bellman-Ford(분산). 모든 weight 가 같으면 BFS, 모든 쌍이면 Floyd-Warshall.","src":"11강 p.62, 87"}]},{"id":"u11b","title":"Dijkstra 손으로 돌리기","items":[{"id":"u11b-01","type":"order","q":"Dijkstra 반복 한 번의 순서","explain":"교수 37분 정리: 'pick the not-sure node with the smallest estimate, and update only its neighbors.'","src":"11강 p.24–38 · 10/29 녹음","wiki":"Dijkstra","prof":true,"tags":["Dijkstra"],"answer":["not-sure 중 $d[u]$ 가 가장 작은 u 를 고른다","u 의 이웃 v 마다 $d[v] \\leftarrow \\min(d[v], d[u]+w(u,v))$","u 를 sure 로 표시한다","not-sure 가 남아 있으면 반복한다"],"introCard":0},{"id":"u11b-02","type":"cloze","q":"초기화: source 가 아닌 모든 v 에 $d[v] =$ ___ , 그리고 $d[s] =$ ___ .","explain":"$d[v]$ 는 'best over-estimate'. 처음엔 아무 path 도 모르니 ∞.","src":"11강 p.24","wiki":"d 값과 sure·not-sure","tags":["Dijkstra"],"answer":["∞","0"],"bank":["∞","0","1","−∞","w(s,v)"],"introCard":0},{"id":"u11b-03","type":"cloze","q":"relaxation: $d[v] \\leftarrow \\min(\\ d[v],\\ $ ___ $+ w(u,v)\\ )$","explain":"u 까지의 추정치 + 간선 하나. Prim 은 여기서 d[u] 가 빠진 $\\min(k[v], w(u,v))$ 다(L15).","src":"11강 p.38","wiki":"relaxation","tags":["Dijkstra","pseudocode"],"answer":["d[u]"],"bank":["d[u]","d[v]","k[v]","w(s,u)"],"introCard":0},{"id":"u11b-04","type":"num","q":"그림의 캠퍼스 그래프에서 Gates 부터 Dijkstra 를 돌린다. Gates 다음으로 R1 을 골라 이웃을 갱신한 직후 $d[\\text{HG}]$ 는?","explain":"Gates 단계에서 HG ← 25, R1 단계에서 min(25, 1 + 22) = 23. (녹음에서 교수가 22 라고 말실수했다.)","src":"11강 p.27–29 · 10/29 녹음","wiki":"Dijkstra","tags":["Dijkstra","trace"],"answer":23,"tol":0,"img":"img/algo11-p28-dij-r1.png","imgAlt":"p.28 Dijkstra 진행: R1 이 current node, d 값 Gates 0, R1 1, E3 ∞, Park ∞, HG 25","explainImg":"img/algo11-p29-dij-r1-ans.png","introCard":1},{"id":"u11b-05","type":"mc","q":"그림의 캠퍼스 그래프에서 Gates 부터 Dijkstra 를 돌리면 sure 가 되는 순서는?","explain":"d 값 0, 1, 2, 6, 23 순서. 줄 직관에서 바닥에서 떨어지는 순서와 같다.","src":"11강 p.24–37","wiki":"Dijkstra","tags":["Dijkstra","trace"],"choices":["Gates, R1, E3, Park, HG","Gates, R1, HG, E3, Park","Gates, HG, R1, E3, Park","Gates, E3, R1, Park, HG"],"answer":0,"img":"img/algo11-p15-graph.png","imgAlt":"캠퍼스 그래프: Gates, R1, E3, Park, Halmae Gomtang 과 간선 weight 1, 1, 4, 25, 20, 22","introCard":1},{"id":"u11b-06","type":"tf","q":"그림의 캠퍼스 그래프 Dijkstra(Gates 부터)에서 Park($d=6$) 를 current node 로 처리할 때 HG 의 값은 $6 + 20 = 26$ 으로 바뀐다.","explain":"min(23, 26) = 23. 교수: '23 vs 6+20 = 26, so stay as it is'.","src":"11강 p.33–34 · 10/29 녹음","wiki":"relaxation","prof":true,"tags":["Dijkstra","trace"],"answer":false,"img":"img/algo11-p34-dij-park.png","imgAlt":"p.34 Dijkstra 진행: Park 가 current node, d 값 Park 6, HG 23","introCard":1},{"id":"u11b-07","type":"num","q":"directed G: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9. source s, 동점은 이름순. 끝났을 때 $d[d]$ 는?","explain":"s0 → b(2): a 5, c 9, d 11 → a(5): c 6, d 10 → c(6): d 8 → d. 경로 s→b→a→c→d = 2+3+1+2 = 8.","src":"11강 p.24–38 (연습)","wiki":"Dijkstra","tags":["Dijkstra","trace"],"answer":8,"tol":0,"img":"img/algo11-gen-u11b-07.png","imgAlt":"weighted directed graph: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9"},{"id":"u11b-08","type":"num","q":"directed G: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9. source s, 동점은 이름순. b 를 sure 로 처리한 직후 $d[d]$ 는?","explain":"b 의 이웃 갱신: a ← min(6, 2+3) = 5, c ← 2+7 = 9, d ← 2+9 = 11.","src":"11강 p.24–38 (연습)","wiki":"Dijkstra","tags":["Dijkstra","trace"],"answer":11,"tol":0,"img":"img/algo11-gen-u11b-07.png","imgAlt":"weighted directed graph: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9"},{"id":"u11b-09","type":"num","q":"directed G: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9. source s, 동점은 이름순. a 를 sure 로 처리한 직후 $d[c]$ 는?","explain":"a 는 d=5 로 세 번째에 뽑힌다. c ← min(9, 5+1) = 6, d ← min(11, 5+5) = 10.","src":"11강 p.24–38 (연습)","wiki":"Dijkstra","tags":["Dijkstra","trace"],"answer":6,"tol":0,"img":"img/algo11-gen-u11b-07.png","imgAlt":"weighted directed graph: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9"},{"id":"u11b-10","type":"order","q":"directed G: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9. source s, 동점은 이름순. sure 가 되는 순서대로","explain":"매번 not-sure 중 d 최소: s(0), b(2), a(5), c(6), d(8).","src":"11강 p.24–38 (연습)","wiki":"Dijkstra","tags":["Dijkstra","trace"],"answer":["s","b","a","c","d"],"img":"img/algo11-gen-u11b-07.png","imgAlt":"weighted directed graph: s→a 6, s→b 2, b→a 3, b→c 7, a→c 1, a→d 5, c→d 2, b→d 9","introCard":0},{"id":"u11b-11","type":"tf","q":"Dijkstra 실행 중 $d[v]$ 는 커질 수도 있다.","explain":"자기 자신과의 min 이라 절대 증가하지 않는다. 그래서 sure 가 된 뒤에는 값이 그대로다.","src":"11강 p.40 · 10/29 녹음","wiki":"d 값과 sure·not-sure","tags":["Dijkstra"],"answer":false,"introCard":0},{"id":"u11b-12","type":"mc","q":"heapq 로 짠 Dijkstra 에서 `if u in sure: continue` 줄의 역할은?","explain":"heapq 에는 updateKey 가 없어서 새 값을 push 하고, 꺼낼 때 이미 sure 인 정점은 버린다.","src":"11강 p.38 (구현)","wiki":"priority queue와 heap","tags":["Dijkstra","pseudocode"],"choices":["음수 간선 검출","예전에 넣은 오래된 (d, u) 항목을 건너뛴다 (lazy deletion)","source 처리","동점 처리"],"answer":1,"introCard":2},{"id":"u11b-13","type":"mc","q":"일방통행 도로 그래프에서 모든 도시 h 에 대해 h→X 최단시간과 X→h 최단시간이 필요하다. Dijkstra 몇 번이면 되나?","explain":"h→X 는 $G^T$ 에서 X→h 와 같다. L10 의 '간선 뒤집기' 를 최단경로에 쓰는 것.","src":"HW3 Problem 3","wiki":"G^T","prof":true,"tags":["Dijkstra","HW3"],"choices":["도시마다 한 번, 총 N 번","두 번: G 에서 X 출발, 그리고 간선을 뒤집은 $G^T$ 에서 X 출발","한 번: G 에서 X 출발","Bellman-Ford 가 필요하다"],"answer":1,"introCard":3},{"id":"u11b-14","type":"num","q":"일방통행 도로: 1→2 2, 2→1 3, 3→2 3, 2→3 4, 4→2 10, 2→4 1 (간선 = 걸리는 시간). 모두 도시 X = 2 에 모였다가 돌아간다. 도시 4 학생의 왕복(4→2→4) 최단시간은?","explain":"4→2 는 10, 2→4 는 1 → 11. (도시 1 은 2 + 3 = 5, 도시 3 은 3 + 4 = 7.)","src":"HW3 Problem 3","wiki":"Dijkstra","prof":true,"tags":["Dijkstra","HW3"],"answer":11,"tol":0,"img":"img/algo11-gen-u11b-14.png","imgAlt":"일방통행 도로: 1→2 2, 2→1 3, 3→2 3, 2→3 4, 4→2 10, 2→4 1","introCard":3},{"id":"u11b-15","type":"tf","q":"Dijkstra 는 끝나면 source 에서의 shortest-path tree 를 만든다.","explain":"p.52 'nice tree'. 각 정점의 최종 d 를 준 이웃을 parent 로 두면 된다.","src":"11강 p.52","wiki":"Dijkstra","tags":["Dijkstra"],"answer":true,"introCard":2},{"id":"u11b-16","type":"num","q":"그림은 캠퍼스 그래프에서 Gates 부터 돌린 Dijkstra 의 한 장면이다. 지금 current node 는 E3 다. E3 의 이웃을 update 한 직후 $d[\\text{Park}]$ 는?","explain":"$d[\\text{Park}] = \\min(\\infty,\\ d[\\text{E3}] + w(\\text{E3},\\text{Park})) = \\min(\\infty, 2 + 4) = 6$. 이 6 은 다음 iteration 에 Park 가 sure 가 될 때 그대로 $d(\\text{Gates},\\text{Park})$ 가 된다. HG 는 23 그대로다($2 + \\infty$ 쪽 길은 없다).","src":"11강 p.31–32","wiki":"relaxation","tags":["Dijkstra","그림"],"img":"img/algo11-p31-dij-e3.png","imgAlt":"p.31 Dijkstra 진행: E3 가 current node, d 값 Gates 0, R1 1, E3 2, Park ∞, HG 23","explainImg":"img/algo11-p32-dij-e3-ans.png","answer":6,"tol":0,"introCard":1}],"intro":[{"title":"Dijkstra 의사코드","body":"$d[s]=0$, 나머지 $\\infty$, 모두 not-sure. 반복: not-sure 중 $d[u]$ 최소인 u 를 고른다 → u 의 이웃 v 마다 $d[v] \\leftarrow \\min(d[v],\\ d[u]+w(u,v))$ (**relaxation**) → u 를 sure 로. 동점은 이름순. 끝나면 $d[v]=d(s,v)$.","img":"img/algo11-p38-dijkstra.png","imgAlt":"Dijkstra 의사코드","src":"11강 p.24–38"},{"title":"캠퍼스 그래프 trace","body":"Gates 0 → R1(1): E3 = 2, HG = $\\min(25, 1+22) = 23$ → E3(2): Park = 6 → Park(6): HG 는 $\\min(23, 26)=23$ 그대로 → HG(23). sure 순서 Gates, R1, E3, Park, HG.","img":"img/algo11-p32-dij-e3-ans.png","imgAlt":"E3 처리 후 Park = 6 이 된 장면","src":"11강 p.24–37"},{"title":"구현 메모","body":"heap(heapq)으로 짜면 updateKey 대신 새 (d, v) 를 넣고, 꺼낼 때 이미 sure 면 건너뛴다(lazy deletion). 끝나면 parent 로 shortest-path tree 를 얻는다.","src":"11강 p.38, 52"},{"title":"응용: 왕복 최단시간","body":"모든 도시 h 에 대해 h→X 와 X→h 가 필요하면 Dijkstra 두 번: $G$ 에서 X 출발(X→h), 간선을 뒤집은 $G^T$ 에서 X 출발(h→X).","src":"HW3 Problem 3"}]},{"id":"u11c","title":"Dijkstra 정당성과 수행 시간","items":[{"id":"u11c-01","type":"match","q":"Dijkstra 정리의 조각을 연결하시오","explain":"Claim 2 로 sure 순간 정확, 그 뒤엔 줄지 않고(Claim 1) 늘지도 않으니 고정. 모든 정점이 결국 sure 가 된다.","src":"11강 p.40","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"pairs":[["Claim 1","항상 $d[v] \\ge d(s,v)$"],["Claim 2","u 가 sure 가 되는 순간 $d[u] = d(s,u)$"],["$d[v]$ never increases","update 가 자기 자신과의 min 이라서"],["Theorem","끝나면 모든 v 에서 $d[v]=d(s,v)$"]]},{"id":"u11c-02","type":"cloze","q":"Claim 1 의 step: $d(s,v) \\le d(s,u) + d(u,v) \\le d(s,u) +$ ___ $\\le$ ___ $+ w(u,v)$","explain":"첫째는 triangle inequality, 둘째는 간선 하나도 u–v path 라서, 셋째는 d[u] 에 IH. min 의 두 후보가 모두 $\\ge d(s,v)$.","src":"11강 p.42","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"answer":["w(u,v)","d[u]"],"bank":["w(u,v)","d[u]","d[v]","k[v]","d(s,v)"],"introCard":0},{"id":"u11c-03","type":"tf","q":"Claim 1 ($d[v] \\ge d(s,v)$) 을 증명하려면 non-negative weight 가정이 필요하다.","explain":"필요 없다. relaxation 만 쓰는 모든 알고리즘(BF 포함)에서 성립한다. 가정이 쓰이는 건 Claim 2.","src":"11강 p.42","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"answer":false,"introCard":0},{"id":"u11c-04","type":"mc","q":"Claim 2 증명에서 non-negative weight 가정이 쓰이는 부등식은?","explain":"z 는 s→u shortest path 위에 있으니 path 를 더 가면 cost 가 줄지 않아야 한다. 음수 간선이 z 뒤에 있으면 이게 깨진다.","src":"11강 p.47","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"choices":["$d[z] = d(s,z)$","$d(s,z) \\le d(s,u)$","$d(s,u) \\le d[u]$","$d[z'] \\le d[z] + w(z,z')$"],"answer":1,"introCard":1},{"id":"u11c-05","type":"order","q":"Claim 2 (BWOC) 증명을 순서대로","explain":"교수 24–36분. z = s 일 수도, z' = u 일 수도 있다.","src":"11강 p.45–50 · 10/29 녹음","wiki":"Dijkstra 정확성 증명","prof":true,"tags":["Dijkstra","proof"],"answer":["u 가 good($d[u]=d(s,u)$) 이 아니라고 가정한다","s⇝u shortest path 위에서 u 이전 마지막 good 을 z, 그 다음을 z' 라 한다","$d[z] = d(s,z) \\le d(s,u) \\le d[u]$","$d[z] = d[u]$ 이면 u 가 good → 모순","$d[z] \u003c d[u]$ 이면 z 는 이미 sure, z' 를 갱신했으므로 z' 가 good → 모순"],"img":"img/algo11-p47-claim2.png","imgAlt":"p.47 Claim 2 증명 그림: s ⇝ z → z' ⇝ u 의 true shortest path 와 부등식","introCard":1},{"id":"u11c-06","type":"mc","q":"Case B ($d[z] \u003c d[u]$) 에서 'z 는 이미 sure 다' 의 근거는?","explain":"'We chose u so that d[u] was smallest of the unsure vertices.' 그러면 z 를 처리할 때 z' 가 갱신돼 $d[z'] \\le d[z] + w(z,z')$.","src":"11강 p.47–48","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"choices":["z 가 good 이라서","u 를 unsure 중 d 가 가장 작은 것으로 골랐으니, unsure 인 z 가 있었다면 z 가 뽑혔어야 한다","non-negative weight","Claim 1"],"answer":1,"introCard":1},{"id":"u11c-07","type":"tf","q":"Claim 2 증명에서 z = s 일 수 있고, z' = u 일 수도 있다.","explain":"슬라이드가 둘 다 명시한다('It may be that z = s', 'It may be that z' = u'). z' = u 면 'u 는 good 아님' 에 바로 모순.","src":"11강 p.45–46","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"answer":true,"introCard":1},{"id":"u11c-08","type":"num","q":"G: s→a 2, s→b 4, b→a −3, a→c 1. 수업 의사코드의 Dijkstra(current 의 모든 이웃을 갱신, 한 번 sure 면 다시 고르지 않음)가 끝났을 때 $d[c]$ 는? (실제 거리는 2)","explain":"s → a(2, c ← 3) → c(3) → b(4, a 는 1 로 줄지만) — c 는 이미 sure 라 3 으로 남는다. 실제 $d(s,c) = 4 - 3 + 1 = 2$.","src":"11강 p.47 보충","wiki":"음수 간선 가중치","tags":["Dijkstra","negative"],"answer":3,"tol":0,"img":"img/algo11-gen-u11c-08.png","imgAlt":"weighted directed graph: s→a 2, s→b 4, b→a −3, a→c 1"},{"id":"u11c-09","type":"tf","q":"negative edge 가 하나라도 있으면 Dijkstra 는 항상 틀린 답을 낸다.","explain":"'might not work' 다. 운 좋게 맞을 수도 있다(예: 음수 간선 끝점이 아직 sure 가 아닐 때).","src":"11강 p.63 · 12강 p.57","wiki":"음수 간선 가중치","tags":["Dijkstra","negative","trap"],"answer":false,"introCard":2},{"id":"u11c-10","type":"match","q":"Dijkstra 구현 자료구조와 전체 시간을 연결하시오","explain":"총합 $= n(T_{findMin} + T_{removeMin}) + m\\,T_{updateKey}$ 에 대입. RB tree 는 sparse 에서 array 보다 낫다.","src":"11강 p.56–61","wiki":"Dijkstra 수행 시간","tags":["Dijkstra","running time"],"pairs":[["Array","$O(n^2)$"],["Red-black tree","$O((n+m)\\log n)$"],["Fibonacci heap","$O(n\\log n + m)$ amortized"],["(비교) BFS, unweighted","$O(n+m)$"]]},{"id":"u11c-11","type":"mc","q":"Dijkstra 수행 시간을 자료구조 연산으로 쓴 식은?","explain":"while 루프가 정점마다 한 번(findMin, removeMin), 간선은 출발점이 sure 가 될 때 한 번(updateKey).","src":"11강 p.55","wiki":"Dijkstra 수행 시간","tags":["Dijkstra","running time"],"choices":["$n\\,T_{updateKey} + m(T_{findMin}+T_{removeMin})$","$n(T_{findMin}+T_{removeMin}) + m\\,T_{updateKey}$","$nm\\,T_{findMin}$","$(n+m)\\,T_{removeMin}$"],"answer":1,"introCard":3},{"id":"u11c-12","type":"tf","q":"Fibonacci heap 의 $O(1)$ updateKey 는 연산 하나하나의 worst-case bound 다.","explain":"amortized 다. 교수: 'the important thing is this is the amortized time complexity, not the worst case.' 개별 연산은 더 오래 걸릴 수 있다.","src":"11강 p.61 · 10/29 녹음","wiki":"Fibonacci heap","prof":true,"tags":["Dijkstra","running time"],"answer":false,"introCard":1},{"id":"u11c-13","type":"mc","q":"dense graph ($m = \\Theta(n^2)$) 에서 가장 **느린** Dijkstra 구현은?","explain":"RB tree 는 $O(n^2\\log n)$, array 와 Fibonacci heap 은 $O(n^2)$.","src":"11강 p.56–61","wiki":"Dijkstra 수행 시간","tags":["Dijkstra","running time"],"choices":["Array","Red-black tree","Fibonacci heap","셋 다 같다"],"answer":1,"introCard":3},{"id":"u11c-14","type":"mc","q":"간선 weight 가 바뀌면 Dijkstra 는 어떻게 해야 하나?","explain":"'For Dijkstra, the node ordering is important to prove its correctness.' OSPF 는 변화를 broadcast 하고 모두 재실행한다.","src":"11강 p.63 · 10/29 녹음","wiki":"Dijkstra","prof":true,"tags":["Dijkstra"],"choices":["바뀐 간선 끝점만 다시 relax","처음부터 다시 돌린다(from scratch) — 정당성이 node ordering 에 달려 있어서","아무것도 안 해도 된다","BFS 로 보정한다"],"answer":1,"introCard":3},{"id":"u11c-15","type":"sa","q":"Dijkstra 를 쓰는 IP 네트워크 routing protocol 의 약어는?","explain":"Open Shortest Path First. Bellman-Ford 계열은 RIP.","src":"11강 p.62","wiki":"OSPF와 RIP","tags":["Dijkstra"],"answer":"OSPF","alts":["Open Shortest Path First"]},{"id":"u11c-16","type":"mc","q":"[Circle all 형식] Dijkstra(not-sure 중 $d$ 최소를 고르는 기본 버전)에 대해 옳은 것을 **모두** 고른 조합은? (1) Claim 1 ($d[v] \\ge d(s,v)$) 은 음수 간선이 있어도 성립한다 (2) 음수 간선이 하나라도 있으면 항상 틀린 답을 낸다 (3) array 로 구현하면 $O(n^2)$ (4) 실행 중 $d[v]$ 는 늘어나지 않는다 (5) Fibonacci heap 의 updateKey $O(1)$ 은 worst-case bound 다","explain":"(1) 참: Claim 1 은 '지금 생각하는 path 의 길이 ≥ 최단경로' 일 뿐 weight 부호를 안 쓴다. 음수 가정이 쓰이는 곳은 Claim 2 의 $d(s,z) \\le d(s,u)$ 다. (2) 거짓: 운 좋게 맞는 그래프도 있다. '항상 맞는다는 보장이 없다' 가 정확한 말이다. (3) 참: $n(O(n)+O(n)) + m\\cdot O(1)$. (4) 참: 자기 자신과의 min 이다. (5) 거짓: amortized 다(교수 10/29). 함정은 (2)와 (5)다.","src":"11강 p.40–61 · 중간 1번 형식","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","circle-all"],"choices":["(1)(3)(4)","(1)(2)(3)(4)","(3)(4)","(1)(3)(4)(5)"],"answer":0,"introCard":3},{"id":"u11c-17","type":"order","q":"[증명 칸 채우기] Claim 1 '모든 $v$ 에 대해 $d[v] \\ge d(s,v)$' 를 귀납으로 증명하시오","explain":"p.42 의 틀이다. Step 의 두 부등식 중 첫째가 IH, 둘째가 'shortest path 보다 짧은 path 는 없다' 는 삼각부등식이다. 중간 4번에서 IH 를 결론과 같은 문장으로 써서 0점이었다. 여기서는 IH 가 t 에 대한 진술이고 결론은 '모든 t' 라는 점이 다르다.","src":"11강 p.42","wiki":"Dijkstra 정확성 증명","tags":["Dijkstra","proof"],"answer":["IH: t 번째 iteration 뒤 모든 v 에 대해 $d[v] \\ge d(s,v)$","Base (t = 0): $d[s] = 0 = d(s,s)$, 나머지는 $\\infty \\ge d(s,v)$","Step: 새 값 $d[u] + w(u,v) \\ge d(s,u) + w(u,v) \\ge d(s,v)$ (IH 와 삼각부등식), 안 바뀐 값은 IH 그대로","Conclusion: 모든 iteration 뒤에도 $d[v] \\ge d(s,v)$"],"introCard":0}],"intro":[{"title":"증명 틀: Claim 1 + Claim 2","body":"**Claim 1**: 언제나 $d[v] \\ge d(s,v)$ (update 는 실제 path 의 길이). **Claim 2**: u 가 sure 되는 순간 $d[u] = d(s,u)$. 둘을 합치면 끝날 때 모두 정답. 그리고 $d[v]$ 는 자기 자신과의 min 이라 늘지 않는다.","src":"11강 p.40–42"},{"title":"Claim 2 (BWOC)","body":"u 가 good($d[u]=d(s,u)$)이 아니라 하자. 최단경로 위 u 이전 마지막 good 을 z. $d[z]=d(s,z) \\le d(s,u) \\le d[u]$ — 가운데 부등식에 **non-negative weight** 를 쓴다. $d[z]=d[u]$ 면 u 가 good, $d[z]\u003cd[u]$ 면 z 가 이미 sure 라 z' 가 갱신돼 good → 모순.","img":"img/algo11-p47-claim2.png","imgAlt":"Claim 2 증명 그림","src":"11강 p.43–50"},{"title":"음수 간선이면","body":"Claim 2 가 깨져 틀릴 수 있다. 예: s→a 2, s→b 4, b→a −3, a→c 1 이면 c 가 3 으로 확정된 뒤 a 가 1 로 줄어도 c 는 다시 안 고친다(실제 2). '항상 틀린다' 는 아니다.","src":"11강 p.63"},{"title":"수행 시간","body":"$n(T_{findMin}+T_{removeMin}) + m\\,T_{updateKey}$. array $O(n^2)$, RB tree $O((n+m)\\log n)$, Fibonacci heap $O(n\\log n + m)$ (amortized). weight 가 바뀌면 처음부터 다시(OSPF).","src":"11강 p.54–63"}]},{"id":"u11d","title":"Bellman-Ford 와 $d^{(i)}$","items":[{"id":"u11d-01","type":"mc","q":"Bellman-Ford 와 Dijkstra 의 관계를 가장 정확히 말한 것은?","explain":"'Instead of picking u cleverly, just update for all of the u's.' 교수가 'Dijkstra 와 BF 의 차이를 이해했나?' 를 두 번 물었다.","src":"11강 p.69 · 10/29 녹음","wiki":"Bellman-Ford","prof":true,"tags":["BF"],"choices":["BF 는 update rule 이 Dijkstra 와 다르다","update rule 은 같고, u 를 고르지 않고 **모든 u** 에 대해 n−1 번 반복한다","BF 는 heap 을 쓴다","BF 는 음수 cycle 이 있어도 정답을 준다"],"answer":1,"introCard":0},{"id":"u11d-02","type":"cloze","q":"Bellman-Ford*: `d(i+1)[v] ← min( d(i)[v], ___[u] + w(u,v) )` — 오른쪽은 모두 ___ 라운드 값이다.","explain":"같은 라운드에서 새로 갱신한 값을 쓰지 않아야 '$d^{(i)}$ = 간선 ≤ i 개' 해석이 정확해진다.","src":"11강 p.70","wiki":"d^(i) 배열","tags":["BF","pseudocode"],"answer":["d(i)","이전"],"bank":["d(i)","이전","d(i+1)","다음","d(n)"],"introCard":1},{"id":"u11d-03","type":"tf","q":"$d^{(i)}[v]$ 는 간선을 **정확히** i 개 쓰는 s–v 최단경로 cost 다.","explain":"**at most** i 개. 교수: 'the cost of the shortest path between source and v with at most i edges.'","src":"11강 p.76 · 10/29 녹음","wiki":"d^(i) 배열","prof":true,"tags":["BF","trap"],"answer":false,"introCard":1},{"id":"u11d-04","type":"num","q":"그림의 캠퍼스 그래프에 Bellman-Ford*(Gates 기준, 이전 행만 참조)를 돌린다. $d^{(2)}[\\text{Park}]$ 은?","explain":"간선 2개 이하로 Park 에 가는 길은 Gates→HG→Park(25+20) 뿐이다. R1–E3–Park 경로는 간선 3개라 $d^{(3)}$ 에서 6 이 된다.","src":"11강 p.73 · 10/29 녹음","wiki":"d^(i) 배열","prof":true,"tags":["BF","trace"],"answer":45,"tol":0,"img":"img/algo11-p74-bf.png","imgAlt":"p.74 Bellman-Ford d(0)~d(3) 표와 그래프, d(2)[Park] 칸이 ① 로 가려져 있다","explainImg":"img/algo11-p74-bf-ans.png","introCard":1},{"id":"u11d-05","type":"mc","q":"그 $d^{(2)}[\\text{Park}]$ 계산에서 E3 값으로 무엇을 써야 하나?","explain":"이전 행만 본다. $d^{(2)}$ 의 2 를 바로 쓰면 6 이 나오는데 그건 배열 하나 버전의 값이다.","src":"11강 p.73","wiki":"d^(i) 배열","tags":["BF","trace"],"choices":["$d^{(2)}[E3] = 2$","$d^{(1)}[E3] = \\infty$","$d^{(3)}[E3]$","최종 거리 2"],"answer":1,"introCard":2},{"id":"u11d-06","type":"num","q":"directed G: s→a 4, s→b 3, a→c 2, b→a −2, b→c 6 (n = 4). Bellman-Ford* (이전 행만 참조). $d^{(2)}[c]$ 는?","explain":"$d^{(1)}$: a 4, b 3, c ∞. $d^{(2)}[c] = \\min(\\infty,\\ d^{(1)}[a]+2 = 6,\\ d^{(1)}[b]+6 = 9) = 6$. (같은 라운드의 $d^{(2)}[a]=1$ 은 아직 못 쓴다.)","src":"11강 p.71–75 (연습)","wiki":"d^(i) 배열","tags":["BF","trace"],"answer":6,"tol":0,"img":"img/algo11-gen-u11d-06.png","imgAlt":"weighted directed graph: s→a 4, s→b 3, a→c 2, b→a −2, b→c 6","introCard":1},{"id":"u11d-07","type":"num","q":"directed G: s→a 4, s→b 3, a→c 2, b→a −2, b→c 6 (n = 4). Bellman-Ford* (이전 행만 참조). $d^{(3)}[c]$ 는?","explain":"$d^{(2)}[a] = \\min(4, 3-2) = 1$ 이므로 $d^{(3)}[c] = \\min(6, 1+2) = 3$. $d^{(4)} = d^{(3)}$ 이라 negative cycle 은 없다.","src":"11강 p.71–75 (연습)","wiki":"d^(i) 배열","tags":["BF","trace"],"answer":3,"tol":0,"img":"img/algo11-gen-u11d-06.png","imgAlt":"weighted directed graph: s→a 4, s→b 3, a→c 2, b→a −2, b→c 6","introCard":1},{"id":"u11d-08","type":"tf","q":"Bellman-Ford 를 배열 $d$ 하나에 바로 덮어쓰며 돌려도($d^{(i)}$ 를 따로 두지 않아도) negative cycle 이 없으면 최종 답은 Bellman-Ford* 와 같다.","explain":"값이 더 빨리 줄 뿐 결과는 같다. 다만 '$d^{(i)}$ 표를 채워라' 문제는 이전 행만 참조하는 방식으로 채워야 슬라이드와 같다.","src":"11강 p.69–70","wiki":"Bellman-Ford","tags":["BF"],"answer":true,"introCard":1},{"id":"u11d-09","type":"mc","q":"BF 를 n−1 라운드만 돌리면 충분한 이유는?","explain":"교수: 'source 에서 destination 까지는 간선이 최대 n−1 개 → n−1 번 반복하면 끝.'","src":"11강 p.76 · 10/29 녹음","wiki":"Bellman-Ford 정확성 증명","tags":["BF","proof"],"choices":["정점이 n 개라 heap 크기가 n 이라서","negative cycle 이 없으면 최단경로를 simple path 로 잡을 수 있고, simple path 는 간선이 ≤ n−1 개라서","매 라운드 정점 하나가 sure 가 돼서","m ≤ n² 이라서"],"answer":1,"introCard":3},{"id":"u11d-10","type":"order","q":"BF 정당성 귀납 증명을 순서대로","explain":"교수: 'has both upper bound and lower bound'. 끝에 i = n−1 + no negative cycle → $d^{(n-1)} = d$.","src":"11강 p.77–79 · 10/29 녹음","wiki":"Bellman-Ford 정확성 증명","tags":["BF","proof"],"answer":["IH: $d^{(i)}[v]$ = 간선 ≤ i 개인 s–v path 의 최소 cost","Base i = 0: s 만 0, 나머지 ∞","u = (간선 ≤ i+1 인 최적 path) 에서 v 바로 앞 정점, 앞부분은 간선 ≤ i 개","상한: update 로 $d^{(i+1)}[v] \\le d^{(i)}[u] + w(u,v)$","하한: $d^{(i+1)}[v]$ 는 어떤 간선 ≤ i+1 path 의 cost","상한 = 하한이므로 IH 가 i+1 에서도 성립"],"introCard":3},{"id":"u11d-11","type":"mc","q":"Bellman-Ford 의 수행 시간은?","explain":"바깥 루프 n−1 번 × 모든 u 의 모든 이웃(간선 m 개). 교수: 'n·m, much slower than Dijkstra'.","src":"11강 p.80","wiki":"Bellman-Ford","tags":["BF","running time"],"choices":["$O(n+m)$","$O(n\\log n + m)$","$O(nm)$","$O(n^3)$"],"answer":2,"introCard":0},{"id":"u11d-12","type":"tf","q":"BF 정당성 증명에는 non-negative weight 가정이 쓰인다.","explain":"어디에도 없다. 그래서 음수 간선도 처리한다. 필요한 건 'negative cycle 이 없다' 뿐.","src":"11강 p.79","wiki":"Bellman-Ford 정확성 증명","tags":["BF","proof"],"answer":false,"introCard":3},{"id":"u11d-13","type":"mc","q":"Bellman-Ford 가 Dijkstra 보다 나은 점으로, RIP 같은 분산 routing protocol 에 쓰이는 이유는?","explain":"'Bellman-Ford 에는 specific ordering 이 없다. 멈추고 from scratch 로 돌릴 필요가 없다.' 대신 less efficient.","src":"11강 p.80, 87 · 10/29 녹음","wiki":"OSPF와 RIP","prof":true,"tags":["BF"],"choices":["Dijkstra 보다 빠르다","특정 node ordering 이 없어서, weight 가 바뀌어도 계속 update 하면 변화가 전체로 propagate 된다","메모리를 안 쓴다","MST 도 구한다"],"answer":1,"introCard":0},{"id":"u11d-14","type":"sa","q":"'Dijkstra 는 greedy algorithm 의 예이고, Bellman-Ford 는 ___ 의 예다.' 빈칸은?","explain":"'하나를 고른다' 와 '전부 갱신한다' 의 차이가 곧 greedy 와 DP 의 차이다.","src":"12강 p.21 · 11/3 녹음","wiki":"Bellman-Ford는 DP","prof":true,"tags":["BF","DP"],"answer":"dynamic programming","alts":["DP"]},{"id":"u11d-15","type":"num","q":"정점 5개 그래프에서 Bellman-Ford* 로 $d^{(n-1)}$ 까지 구하려면 바깥 루프를 몇 라운드 돌리나?","explain":"$d^{(0)} \\to d^{(4)}$, 즉 i = 0..n−2 로 n−1 = 4 라운드. negative cycle 검출판은 한 라운드 더(5).","src":"11강 p.69–71","wiki":"Bellman-Ford","tags":["BF"],"answer":4,"tol":0,"introCard":1},{"id":"u11d-16","type":"num","q":"그림은 캠퍼스 그래프의 Bellman-Ford* 표다. 가린 ② $d^{(3)}[\\text{Park}]$ 는?","explain":"$d^{(3)}[\\text{Park}] = \\min(d^{(2)}[\\text{Park}],\\ d^{(2)}[\\text{E3}] + 4,\\ d^{(2)}[\\text{HG}] + 20) = \\min(45,\\ 2+4,\\ 23+20) = 6$. 오른쪽 항은 모두 **이전 행** $d^{(2)}$ 값이다. 간선 3개(Gates–R1–E3–Park)를 써야 6 이 나오니 $d^{(3)}$ 에서 처음 나타난다.","src":"11강 p.73–74","wiki":"d^(i) 배열","tags":["BF","그림"],"img":"img/algo11-p74-bf.png","imgAlt":"p.74 Bellman-Ford d(0)~d(3) 표와 그래프, d(2)[Park] 은 ①, d(3)[Park] 은 ② 로 가려져 있다","explainImg":"img/algo11-p74-bf-ans.png","answer":6,"tol":0,"introCard":1},{"id":"u11d-17","type":"mc","q":"[Circle all 형식] Bellman-Ford* 에 대해 옳은 것을 **모두** 고른 조합은? (1) 수행 시간 $O(nm)$ (2) 음수 간선이 있어도 된다 (3) negative cycle 이 없으면 $n-1$ 라운드로 충분하다 (4) 그래프 안의 모든 negative cycle 을 검출한다 (5) $d^{(i)}[v]$ 는 간선을 정확히 $i$ 개 쓰는 최단경로 cost 다","explain":"(1) 참: 라운드 $n-1$ 번 × 간선 $m$ 개. (2) 참: 음수 간선은 괜찮고 문제는 negative cycle 이다. (3) 참: 최단경로를 simple path 로 잡을 수 있고 simple path 는 간선이 $n-1$ 개 이하다. (4) 거짓: $s$ 에서 **도달 가능한** negative cycle 만 $d$ 값을 바꾼다. (5) 거짓: '**at most** $i$ edges' 다. $d^{(i+1)}[v]$ 가 $d^{(i)}[v]$ 와의 min 이라 개수가 적은 path 도 포함한다.","src":"11강 p.76–86 · 중간 1번 형식","wiki":"Bellman-Ford","tags":["BF","circle-all"],"choices":["(1)(2)(3)","(1)(2)(3)(4)","(1)(3)(5)","(2)(3)"],"answer":0,"introCard":1},{"id":"u11d-18","type":"num","q":"[분석 템플릿 칸] 정점 5개, directed 간선 7개 그래프에서 Bellman-Ford* 를 $d^{(n-1)}$ 까지 돌리면 `d(i+1)[v] ← min(...)` 갱신을 총 몇 번 하나?","explain":"바깥 루프가 $i = 0, \\dots, n-2$ 로 $n-1 = 4$ 라운드, 한 라운드에 모든 $u$ 의 모든 out-edge 를 한 번씩 보니 $m = 7$ 번. $4 \\times 7 = 28$. 이 곱이 $O(nm)$ 의 정체다. Dijkstra 처럼 'u 하나를 고르는' 단계가 없어서 매 라운드 간선 전체를 본다.","src":"11강 p.69, 80","wiki":"Bellman-Ford","tags":["BF","running time","analysis"],"answer":28,"tol":0,"introCard":1}],"intro":[{"title":"Bellman-Ford = 같은 update, 모든 u","body":"Dijkstra 와 update rule 은 같다. 다른 점은 u 를 고르지 않고 **모든 u 의 모든 간선**을 $n-1$ 라운드 반복한다는 것. 수행 시간 $O(nm)$, 음수 간선 OK, 분산(RIP) 가능.","src":"11강 p.65–69, 80"},{"title":"Bellman-Ford* 와 $d^{(i)}$","body":"$d^{(0)}[s]=0$, 나머지 ∞. $d^{(i+1)}[v] = \\min(d^{(i)}[v],\\ \\min_u d^{(i)}[u]+w(u,v))$ — 오른쪽은 모두 **이전 행**. $d^{(i)}[v]$ = 간선 **최대 i 개**를 쓰는 s–v 최단경로 cost. 배열 하나에 덮어써도 (negative cycle 없으면) 최종 답은 같다.","img":"img/algo11-p70-bfstar.png","imgAlt":"Bellman-Ford* 의사코드","src":"11강 p.69–70"},{"title":"캠퍼스 그래프 표","body":"Gates 기준: $d^{(1)}$ = R1 1, HG 25. $d^{(2)}$ = E3 2, Park 45(HG 25 + 20), HG 23. $d^{(3)}$ = Park 6. $d^{(4)}$ 는 그대로.","img":"img/algo11-p74-bf-ans.png","imgAlt":"Bellman-Ford 표 d(0)~d(3)","src":"11강 p.71–76"},{"title":"왜 n−1 라운드면 되나","body":"negative cycle 이 없으면 최단경로를 simple path 로 잡을 수 있고 simple path 는 간선 ≤ $n-1$ 개다. 귀납: IH '$d^{(i)}[v]$ = 간선 ≤ i 개 최단', Step 은 마지막 간선 (u,v) 를 떼어 상한·하한. weight 부호는 안 쓴다.","src":"11강 p.76–79"}]},{"id":"u11e","title":"negative cycle 과 최단경로 비교","items":[{"id":"u11e-01","type":"tf","q":"negative edge weight 가 있으면 shortest path 가 정의되지 않는다.","explain":"교수: 'Negative edge weight itself is not a problem. The problem is if there exists a negative cycle.' 음수 간선 때문에 6 대신 2 가 나오는 건 괜찮다.","src":"11강 p.67 · 10/29 녹음","wiki":"negative cycle","prof":true,"tags":["negative","trap"],"answer":false,"introCard":0},{"id":"u11e-02","type":"mc","q":"negative cycle 의 정의는?","explain":"합이 음수면 돌 때마다 cost 가 줄어 $-\\infty$. 음수 간선이 있어도 합이 0 이상이면 negative cycle 이 아니다.","src":"11강 p.67","wiki":"negative cycle","tags":["negative"],"choices":["음수 간선이 하나 이상 있는 cycle","간선 weight 의 합이 음수인 cycle","source 를 지나는 cycle","길이가 홀수인 cycle"],"answer":1,"introCard":0},{"id":"u11e-03","type":"num","q":"undirected G: Gates–R1 1, R1–HG −2, HG–Gates −3, R1–E3 1, E3–Park 4. 경로 G→R→H→G→R→E3→Park 의 cost 는?","explain":"1 − 2 − 3 + 1 + 1 + 4 = 2. 그냥 G–R–E3–Park 은 6.","src":"11강 p.67","wiki":"negative cycle","tags":["negative"],"answer":2,"tol":0,"img":"img/algo11-p67-negcycle.png","imgAlt":"음수 weight 캠퍼스 그래프와 G—R—H—G 를 반복하는 경로들","introCard":0},{"id":"u11e-04","type":"num","q":"그림의 그래프(Gates–R1 1, R1–HG −2, HG–Gates −3, R1–E3 1, E3–Park 4)에서 cycle G→R→H→G 의 cost 는?","explain":"1 − 2 − 3 = −4 \u003c 0. 돌 때마다 4씩 줄어 최단경로가 −∞ 로 간다. 'Shortest Paths aren't well-defined if there are negative cycles!'","src":"11강 p.67","wiki":"negative cycle","tags":["negative"],"answer":-4,"tol":0,"img":"img/algo11-p67-negcycle.png","imgAlt":"p.67 negative weight 그래프와 G—R—H—G 를 반복하는 경로들","introCard":0},{"id":"u11e-05","type":"cloze","q":"검출판 BF*: `For i = 0, …, ___` 로 $d^{(n)}$ 까지 계산하고, $d^{(n-1)}$ ___ $d^{(n)}$ 이면 NEGATIVE CYCLE.","explain":"한 라운드 더. 바뀌었다면 간선을 n−1 개보다 많이 쓰는 더 싼 경로가 있다는 뜻이고 그건 cycle 이 음수라는 뜻이다.","src":"11강 p.85","wiki":"negative cycle","tags":["negative","pseudocode"],"answer":["n−1","≠"],"bank":["n−1","≠","n−2","=","n"],"introCard":1},{"id":"u11e-06","type":"tf","q":"BF 실행 중 source 의 d 값이 음수가 되지 않았다면 negative cycle 은 없다.","explain":"source 를 지나지 않는 negative cycle 도 있다. 교수: 'even if you don't go through the source node, there could be a negative cycle' → 한 라운드 더.","src":"11강 p.81–82 · 10/29 녹음","wiki":"negative cycle","prof":true,"tags":["negative","trap"],"answer":false,"introCard":0},{"id":"u11e-07","type":"tf","q":"G: s→a 2, a→b 1, b→c −3, c→a 1 (n = 4). BF* 의 $d^{(3)}$ 과 $d^{(4)}$ 는 다르다.","explain":"cycle a→b→c→a 의 합이 1 − 3 + 1 = −1. $d^{(3)}$ = (s0, a2, b3, c0), $d^{(4)}$ = (s0, a1, b3, c0) 로 a 가 바뀐다 → NEGATIVE CYCLE.","src":"11강 p.84–85 (연습)","wiki":"negative cycle","tags":["negative","trace"],"answer":true,"img":"img/algo11-gen-u11e-07.png","imgAlt":"weighted directed graph: s→a 2, a→b 1, b→c −3, c→a 1","introCard":1},{"id":"u11e-08","type":"num","q":"G: s→a 2, a→b 1, b→c −3, c→a 1 (n = 4). $d^{(4)}[a]$ 는?","explain":"$d^{(3)}[c] = 0$ (s→a→b→c = 2+1−3) 이므로 $d^{(4)}[a] = \\min(2, 0+1) = 1$. 간선 4개짜리 s→a→b→c→a 가 더 싸다 = cycle 이 음수. source 는 cycle 위에 없어 0 그대로다.","src":"11강 p.84–85 (연습)","wiki":"negative cycle","tags":["negative","trace"],"answer":1,"tol":0,"img":"img/algo11-gen-u11e-07.png","imgAlt":"weighted directed graph: s→a 2, a→b 1, b→c −3, c→a 1","introCard":1},{"id":"u11e-09","type":"num","q":"그림은 음수 weight 그래프의 Bellman-Ford* 표다. $d^{(3)}[\\text{E3}] = -4$ 이고 간선 E3→Park 의 weight 는 4 다. 그러면 $d^{(4)}[\\text{Park}]$ 은 많아야 얼마인가? (표에는 6 으로 잘못 적혀 있다)","explain":"$-4 + 4 = 0$. 슬라이드가 E3→Park 갱신을 빠뜨린 칸이다(py 검산). 결론 $d^{(4)} \\ne d^{(5)}$ → negative cycle 은 같다.","src":"11강 p.81–82 · 12강 p.17","wiki":"d^(i) 배열","tags":["negative","trace"],"answer":0,"tol":0,"img":"img/algo11-p82-bfneg5.png","imgAlt":"p.82 음수 예제의 d(0)~d(5) 표, d(4)[Park] 칸에 6 이 적혀 있다","introCard":1},{"id":"u11e-10","type":"mc","q":"negative cycle 이 없으면 $d^{(n)} = d^{(n-1)}$ 인 이유는?","explain":"그래서 '한 라운드 더 돌려 바뀌면 negative cycle' 이 맞는 검사다.","src":"11강 p.84","wiki":"negative cycle","tags":["negative","proof"],"choices":["n 라운드면 heap 이 빈다","간선 n 개 path 는 정점을 반복해 cycle 을 포함하고, cycle cost ≥ 0 이라 빼도 손해가 없다","source 가 0 이라서","Dijkstra 와 같아서"],"answer":1,"introCard":0},{"id":"u11e-11","type":"match","q":"최단경로 알고리즘과 특징을 연결하시오","explain":"Dijkstra 는 어떤 정점을 고를지 알려면 전체를 봐야 해서 centralized, BF 는 이웃 정보만 쓰니 distributed.","src":"11강 p.88 · 12강 p.57","wiki":"최단경로 알고리즘 비교표","tags":["comparison"],"pairs":[["BFS","$O(n+m)$, unweighted 만"],["Dijkstra","음수 간선 불가, centralized"],["Bellman-Ford","$O(nm)$, 음수 간선 OK, distributed"],["Floyd-Warshall","all-pairs, $O(n^3)$"]],"introCard":2},{"id":"u11e-12","type":"tf","q":"Dijkstra 와 Bellman-Ford 는 같은 update rule $d[v] \\leftarrow \\min(d[v], d[u]+w(u,v))$ 을 쓴다.","explain":"다른 것은 '어떤 u 에서 relax 하느냐' 하나뿐(교수 10/29). 이 차이가 L12·L14 의 DP vs greedy 다.","src":"11강 p.69 · 10/29 녹음","wiki":"Bellman-Ford","prof":true,"tags":["BF","Dijkstra"],"answer":true,"introCard":2},{"id":"u11e-13","type":"mc","q":"Bellman-Ford 가 검출하는 negative cycle 은?","explain":"s 에서 못 가는 곳은 d 가 계속 ∞ 라 바뀌지 않는다. 전체를 보려면 FW 의 대각선 검사.","src":"12강 p.55","wiki":"negative cycle","tags":["negative"],"choices":["그래프의 모든 negative cycle","s 에서 도달 가능한 negative cycle","s 를 지나는 negative cycle 만","간선 3개 이하 cycle"],"answer":1,"introCard":1},{"id":"u11e-14","type":"tf","q":"Bellman-Ford* 실행 중 $d^{(3)}[\\text{source}] = -4$ 처럼 source 의 값이 음수가 됐다면, source 를 지나는 negative cycle 이 있다.","explain":"원래 0 이던 source 가 줄었다는 건 source 에서 출발해 source 로 돌아오는 cost \u003c 0 경로가 있다는 뜻. 교수: 'Something strange? Look at Gates.'","src":"11강 p.81 · 10/29 녹음","wiki":"negative cycle","prof":true,"tags":["negative"],"answer":true,"introCard":1},{"id":"u11e-15","type":"mc","q":"그림은 음수 weight 그래프의 Bellman-Ford* 표다. 가린 ① $d^{(2)}[\\text{R1}]$ 과 ② $d^{(3)}[\\text{Gates}]$ 는?","explain":"① $d^{(1)}[\\text{HG}] = -3$ (Gates→HG −3) 이고 HG→R1 이 −2 라서 $d^{(2)}[\\text{R1}] = \\min(1, -3-2) = -5$. ② $d^{(3)}[\\text{Gates}] = \\min(0,\\ d^{(2)}[\\text{R1}] + 1) = -5 + 1 = -4$. source 의 값이 0 아래로 내려갔다는 것은 Gates 를 지나는 negative cycle(Gates→HG→R1→Gates, cost −4)이 있다는 뜻이다. 슬라이드가 'This is not looking good!' 이라고 쓴 장면이다.","src":"11강 p.81","wiki":"negative cycle","tags":["BF","negative cycle","그림"],"img":"img/algo11-p81-bfneg.png","imgAlt":"p.81 음수 weight 그래프와 Bellman-Ford d(0)~d(3) 표, 두 칸이 ①② 로 가려져 있다","explainImg":"img/algo11-p81-bfneg-ans.png","choices":["① −5, ② −4","① −2, ② −4","① −5, ② 0","① −2, ② −3"],"answer":0,"introCard":1}],"intro":[{"title":"negative cycle","body":"weight 합이 음수인 cycle. 그 위를 돌수록 cost 가 줄어 최단경로가 정의되지 않는다. 음수 **간선** 자체는 문제 없다.","img":"img/algo11-p67-negcycle.png","imgAlt":"G—R—H—G 를 반복하는 경로들","src":"11강 p.66–67"},{"title":"검출판 Bellman-Ford","body":"한 라운드 더 돌려 $d^{(n)}$ 까지 계산하고 $d^{(n-1)} \\ne d^{(n)}$ 이면 NEGATIVE CYCLE. cycle 이 없으면 $n$ 번째 간선은 cycle 을 만들 뿐이라 손해가 없어 값이 안 변한다. s 에서 **도달 가능한** negative cycle 만 잡힌다. source 값이 음수가 되면 source 를 지나는 negative cycle 이 있다.","img":"img/algo11-p82-bfneg5.png","imgAlt":"음수 예제의 d(0)~d(5) 표","src":"11강 p.81–85"},{"title":"최단경로 알고리즘 비교","body":"BFS $O(n+m)$ unweighted 만 · Dijkstra 음수 불가, $O(n\\log n+m)$, centralized · Bellman-Ford $O(nm)$, 음수 OK, distributed · Floyd-Warshall all-pairs $O(n^3)$.","src":"11강 p.88"}]}]},{"id":"u12","title":"12강 DP I","desc":"BF = DP · Fibonacci · DP 두 요소 · Floyd-Warshall · longest path","lessons":[{"id":"u12a","title":"Bellman-Ford 는 DP · Fibonacci","items":[{"id":"u12a-01","type":"mc","q":"Dijkstra 와 Bellman-Ford 는 각각 어떤 설계 기법의 예인가?","explain":"Dijkstra 는 d 가 가장 작은 노드 **하나를 골라** 갱신(greedy), BF 는 고르지 않고 **모두** 갱신(DP). 교수가 두 번 말했다.","src":"12강 p.21 · 11/3 녹음","wiki":"Bellman-Ford는 DP","prof":true,"tags":["DP","greedy"],"choices":["Dijkstra = DP, Bellman-Ford = greedy","Dijkstra = greedy, Bellman-Ford = DP","둘 다 DP","둘 다 divide-and-conquer"],"answer":1,"introCard":0},{"id":"u12a-02","type":"num","q":"이 강의 convention $F(0)=F(1)=1$, $F(n)=F(n-1)+F(n-2)$ 에서 $F(8)$ 은?","explain":"1, 1, 2, 3, 5, 8, 13, 21, 34. CLRS 는 $F_0=0, F_1=1$ 이라 한 칸 밀리니 주의.","src":"12강 p.22","wiki":"Fibonacci 수 계산","tags":["Fibonacci"],"answer":34,"tol":0,"introCard":1},{"id":"u12a-03","type":"num","q":"naive 재귀 `Fibonacci(8)` 을 부르면 함수 호출이 모두 몇 번 일어나나? (base case 호출 포함)","explain":"호출 수 $c(n) = 1 + c(n-1) + c(n-2)$, $c(0)=c(1)=1$ → 1, 1, 3, 5, 9, 15, 25, 41, 67. 서로 다른 subproblem 은 0..8 의 9개뿐이다.","src":"12강 p.24","wiki":"Fibonacci 수 계산","tags":["Fibonacci","running time"],"answer":67,"tol":0,"introCard":1},{"id":"u12a-04","type":"mc","q":"naive 재귀 Fibonacci 의 수행 시간은?","explain":"$T(n) \\ge T(n-1)+T(n-2)$ 라 Fibonacci 수만큼 빨리 자란다 — exponential. 간단한 하한은 $T(n)\\ge 2T(n-2)$ → $\\Omega(2^{n/2})$.","src":"12강 p.23","wiki":"Fibonacci 수 계산","tags":["Fibonacci","running time"],"choices":["$\\Theta(n)$","$\\Theta(n^2)$","$\\Theta(\\varphi^n)$, $\\varphi \\approx 1.618$","$\\Theta(n\\log n)$"],"answer":2,"introCard":1},{"id":"u12a-05","type":"mc","q":"naive 재귀 Fibonacci 가 느린 근본 원인은?","explain":"처방: '처음 계산할 때 저장하고 다음엔 재사용하라 — that's the key of dynamic programming.'","src":"12강 p.24 · 11/3 녹음","wiki":"overlapping subproblems","prof":true,"tags":["Fibonacci","DP"],"choices":["재귀 깊이","repeated computation (같은 subproblem 을 여러 번 계산)","덧셈이 느려서","메모리 부족"],"answer":1,"introCard":1},{"id":"u12a-06","type":"cloze","q":"fasterFibonacci: `for i in range(2, ___): F[i] = F[i-1] + ___` 후 `return F[n]`.","explain":"i = 2..n 까지 채워야 F[n] 이 있다. Python range 의 끝은 미포함이라 n+1. 시간 $O(n)$.","src":"12강 p.25","wiki":"bottom-up","tags":["Fibonacci","pseudocode"],"answer":["n+1","F[i-2]"],"bank":["n+1","F[i-2]","n","n-1","F[i+1]"],"introCard":2},{"id":"u12a-07","type":"tf","q":"fasterFibonacci(F[0..n] 을 채우고 F[n] 을 반환)의 배열 F 는 주석에 적힌 대로 길이 n 이면 충분하다.","explain":"F[0]..F[n] 을 쓰니 길이 **n+1** 이어야 한다. 슬라이드 주석 'F has length n' 은 오류다.","src":"12강 p.25","wiki":"bottom-up","tags":["Fibonacci","trap"],"answer":false,"introCard":2},{"id":"u12a-08","type":"tf","q":"naive `Fibonacci(8)` 의 재귀 tree 에서 `Fibonacci(6)` 은 두 번 계산된다.","explain":"8 → 7 → 6 과 8 → 6. 내려갈수록 늘어서 Fib(5) 3번, Fib(4) 5번 … 호출 횟수가 또 Fibonacci 수다.","src":"12강 p.24","wiki":"overlapping subproblems","tags":["Fibonacci"],"answer":true,"introCard":1},{"id":"u12a-09","type":"num","q":"naive `Fibonacci(8)` 에서 `Fibonacci(4)` 는 몇 번 호출되나?","explain":"n 에서 k 가 불리는 횟수는 F 수열을 따른다: Fib(7) 1, Fib(6) 2, Fib(5) 3, Fib(4) 5.","src":"12강 p.24","wiki":"overlapping subproblems","tags":["Fibonacci"],"answer":5,"tol":0,"img":"img/algo12-p24-fibtree.png","imgAlt":"p.24 naive Fib(8) 재귀 호출 tree (아래쪽은 etc 로 생략)","introCard":1},{"id":"u12a-10","type":"mc","q":"Bellman-Ford 를 DP 로 볼 때 subproblem 은?","explain":"점화식 $d^{(i+1)}[v] = \\min\\{d^{(i)}[v],\\ \\min_u d^{(i)}[u]+w(u,v)\\}$ 가 optimal substructure. 내부 정점 {1..k} 는 FW.","src":"12강 p.8, 28","wiki":"d^(i) 배열","tags":["BF","DP"],"choices":["정점 v 에 대해 '간선 최대 i 개를 쓰는 s→v 최단경로 cost' ($d^{(i)}[v]$)","내부 정점이 {1..k} 인 최단경로","prefix 쌍","subtree"],"answer":0,"introCard":0},{"id":"u12a-11","type":"tf","q":"Bellman-Ford 는 centralized, Dijkstra 는 distributed 알고리즘이다.","explain":"반대다. Dijkstra 는 전체에서 최소를 골라야 해서 centralized, BF 는 각 노드가 이웃과만 통신하며 갱신하는 distributed.","src":"12강 p.19 · 11/3 녹음","wiki":"최단경로 알고리즘 비교표","prof":true,"tags":["BF","Dijkstra"],"answer":false,"introCard":0},{"id":"u12a-12","type":"mc","q":"Bellman-Ford 에서 $d^{(0)}[\\text{Gates}]$ 한 값이 $d^{(1)}$ 의 여러 이웃 칸 계산에 다시 쓰인다. 이것은 DP 의 어떤 성질인가?","explain":"이전 subproblem 의 해가 multiple times 쓰인다 = overlap.","src":"12강 p.11, 29 · 11/3 녹음","wiki":"overlapping subproblems","prof":true,"tags":["DP"],"choices":["optimal substructure","overlapping subproblems","greedy choice","memoization"],"answer":1,"introCard":0},{"id":"u12a-13","type":"tf","q":"Bellman-Ford* 는 $d^{(i)}$ 로 $d^{(i+1)}$ 을 계산하므로 직전 배열 하나만 들고 있으면 된다.","explain":"p.15 Note on implementation. 배열 n 개를 다 둘 필요가 없다(공간 $O(n)$).","src":"12강 p.15 · 11/3 녹음","wiki":"d^(i) 배열","tags":["BF"],"answer":true,"introCard":0},{"id":"u12a-14","type":"sa","q":"작은 subproblem 의 해를 표에 저장해 재사용하며 optimization problem 을 푸는 설계 paradigm 의 이름은?","explain":"'a fancy name for a pretty common-sense idea'. Richard Bellman 이 붙인 이름.","src":"12강 p.27, 38","wiki":"dynamic programming","tags":["DP"],"answer":"dynamic programming","alts":["DP","동적 계획법"],"introCard":0},{"id":"u12a-15","type":"num","q":"그림은 naive `Fibonacci(8)` 의 재귀 tree 다. 이 tree 전체에서 `Fibonacci(5)` 는 몇 번 호출되나? (그림 아래쪽은 생략돼 있으니 규칙으로 세라)","explain":"Fib(8) 은 Fib(7), Fib(6) 을 부른다. Fib(5) 는 Fib(7) 안에서 한 번, Fib(6) 안에서 한 번, 그리고 Fib(7) 이 부른 Fib(6) 안에서 또 한 번 불린다. 일반적으로 Fib(n) 안에서 Fib(k) 의 호출 횟수는 $F(n-k)$ 다 ($F(0)=F(1)=1$ convention). $F(3) = 3$. 같은 방식으로 Fib(4) 는 $F(4)=5$ 번이다. 이 중복이 'repeated computation' 이다.","src":"12강 p.24","wiki":"overlapping subproblems","tags":["Fibonacci","그림"],"img":"img/algo12-p24-fibtree.png","imgAlt":"p.24 naive Fib(8) 재귀 호출 tree (아래쪽은 etc 로 생략)","explainImg":"img/algo12-p37-memo-ans.png","answer":3,"tol":0,"introCard":1}],"intro":[{"title":"Bellman-Ford 는 DP","body":"Dijkstra 는 greedy(가장 가까운 하나를 확정), Bellman-Ford 는 **dynamic programming**: subproblem '간선 ≤ i 개 최단경로' $d^{(i)}$ 를 작은 i 부터 표로 채운다. $d^{(i)}$ 한 행으로 다음 행을 만들어 직전 행만 있으면 된다.","src":"12강 p.8–21"},{"title":"naive Fibonacci","body":"$F(0)=F(1)=1$, $F(n)=F(n-1)+F(n-2)$. 재귀 그대로 짜면 $T(n) \\ge T(n-1)+T(n-2)$ 라 $\\Theta(\\varphi^n)$. Fib(8) 안에서 Fib(k) 는 $F(8-k)$ 번 불린다. 원인은 **repeated computation**.","img":"img/algo12-p24-fibtree.png","imgAlt":"naive Fib(8) 재귀 tree","src":"12강 p.22–24"},{"title":"fasterFibonacci (bottom-up)","body":"`F = [1, 1, None, …]`, `for i in 2..n: F[i] = F[i-1] + F[i-2]`, `return F[n]`. 배열은 $F[0..n]$ 이라 길이 **n+1** 이 필요하다. $O(n)$.","src":"12강 p.25"}]},{"id":"u12b","title":"DP 의 두 요소 · top-down / bottom-up","items":[{"id":"u12b-01","type":"match","q":"용어와 뜻을 연결하시오","explain":"p.30 정의 문장: 'Optimal solutions to sub-problems are sub-solutions to the optimal solution of the original problem.' / 'The subproblems show up again and again.'","src":"12강 p.28–35","wiki":"dynamic programming","tags":["DP"],"pairs":[["optimal substructure","subproblem 의 최적해가 원래 문제 최적해의 일부"],["overlapping subproblems","subproblem 이 계속 다시 나온다"],["memoization","이미 푼 subproblem 의 답을 저장해 재사용"],["bottom-up","작은 subproblem 부터 표를 채운다"],["top-down","큰 문제에서 재귀로 내려가며 memo 를 확인"]]},{"id":"u12b-02","type":"mc","q":"문제에 dynamic programming 을 쓰려면 반드시 있어야 할 두 요소는?","explain":"'이 둘을 정의하면 코드는 바로 쓸 수 있다.' 그리고 key property 로 memoization.","src":"12강 p.30 · 11/3 녹음","wiki":"optimal substructure","prof":true,"tags":["DP"],"choices":["divide 와 combine","optimal substructure 와 overlapping sub-problems","memoization 과 recursion","greedy choice 와 exchange"],"answer":1,"introCard":0},{"id":"u12b-03","type":"mc","q":"divide-and-conquer 와 DP 의 차이로 맞는 것은?","explain":"교수가 D&C 세 단계(divide, conquer, combine)를 물은 뒤 설명했다. 겹칠수록 DP 가 효율적이다.","src":"12강 p.29 · 11/3 녹음","wiki":"overlapping subproblems","prof":true,"tags":["DP","D&C"],"choices":["D&C 는 subproblem 이 겹치게, DP 는 disjoint 하게 나눈다","D&C 는 disjoint(independent) 하게, DP 는 가능한 많이 겹치게(shared) 나눈다","둘 다 겹치지 않는다","D&C 는 재귀를 안 쓴다"],"answer":1,"introCard":0},{"id":"u12b-04","type":"tf","q":"D&C 와 DP 모두 overlapping subproblem 을 이용한다.","explain":"merge sort 같은 D&C 는 subproblem 이 겹치지 않아 저장할 이유가 없다.","src":"12강 p.29","wiki":"overlapping subproblems","tags":["DP","D&C","trap"],"answer":false,"introCard":0},{"id":"u12b-05","type":"cloze","q":"top-down Fibonacci: `if F[n] != ___: return F[n]` / `else: ___ = Fibonacci(n-1) + Fibonacci(n-2)` / `return F[n]`.","explain":"저장된 값이 있으면 재귀 없이 바로 돌려준다(memo lookup). 없을 때만 계산하고 저장. F[0], F[1] 은 초기값이라 base case 가 따로 없다.","src":"12강 p.35 · 11/3 녹음","wiki":"top-down과 memoization","tags":["DP","pseudocode"],"answer":["None","F[n]"],"bank":["None","F[n]","0","F[n-1]","n"],"introCard":1},{"id":"u12b-06","type":"mc","q":"bottom-up DP 에서 표를 채우는 순서가 만족해야 할 조건은?","explain":"Fibonacci 는 0, 1 → 2 → …, BF 는 $d^{(0)} \\to d^{(1)} \\to \\dots$, FW 는 $D^{(0)} \\to D^{(1)} \\to \\dots$.","src":"12강 p.32–33","wiki":"bottom-up","tags":["DP"],"choices":["아무 순서나 된다","필요한 칸이 먼저 채워지도록, 의존 관계의 topological order","큰 것부터","무작위"],"answer":1,"introCard":1},{"id":"u12b-07","type":"tf","q":"memo 를 쓰는 top-down Fibonacci 는 $O(n)$ 시간이다.","explain":"각 F[i] 는 한 번만 계산되고 나머지 호출은 $O(1)$ lookup. 총 호출 약 2n.","src":"12강 p.35","wiki":"top-down과 memoization","tags":["DP","running time"],"answer":true,"introCard":1},{"id":"u12b-08","type":"mc","q":"DP 설계에서 가장 중요하고 가장 어려운 부분은?","explain":"Fibonacci 는 정의 자체가, BF 는 update rule 이 optimal substructure 다. 11/10 복습에서도 같은 말.","src":"12강 p.28 · 11/3 녹음","wiki":"optimal substructure","prof":true,"tags":["DP"],"choices":["표 크기 정하기","optimal substructure (subproblem 사이의 관계) 정의","코드 작성","수행 시간 분석"],"answer":1,"introCard":0},{"id":"u12b-09","type":"mc","q":"DP 가 주로 쓰이는 문제 유형은?","explain":"가능한 해가 여럿이고 부분 해가 많이 겹치는 경우. Fibonacci 는 최적화 문제는 아니지만 좋은 예시.","src":"12강 p.27","wiki":"dynamic programming","tags":["DP"],"choices":["decision problem 만","optimization problem (여러 해 중 최선)","정렬","검색"],"answer":1,"introCard":3},{"id":"u12b-10","type":"tf","q":"Bellman-Ford 의사코드는 $d^{(0)}$ 부터 쌓아 올리므로 bottom-up DP 다.","explain":"교수 11/3: 'Bellman-Ford 의사코드도 d(0) 부터 쌓으므로 bottom-up.'","src":"12강 p.32 · 11/3 녹음","wiki":"bottom-up","tags":["DP","BF"],"answer":true,"introCard":1},{"id":"u12b-11","type":"order","q":"DP 알고리즘 설계의 3단계를 순서대로","explain":"bottom-up 이든 top-down 이든 이 틀이다.","src":"12강 p.30","wiki":"dynamic programming","tags":["DP"],"answer":["작은 문제의 해를 table 에 저장한다","table 의 해로 더 큰 문제를 푼다","마지막에 모은 정보로 전체 해를 얻는다"],"introCard":1},{"id":"u12b-12","type":"mc","q":"그림은 naive Fib(8) 의 재귀 tree 다. memoization 으로 같은 숫자 노드를 하나로 합치면 무엇이 되나?","explain":"'Collapse repeated nodes and don't do the same work twice!' subproblem graph 가 DAG 가 되고, 시간 ≈ subproblem 수 × 하나당 일.","src":"12강 p.36–37","wiki":"top-down과 memoization","tags":["DP"],"choices":["완전 이진 tree","8 → 7 → … → 0 의 일렬 사슬 모양 DAG","cycle","forest"],"answer":1,"img":"img/algo12-p24-fibtree.png","imgAlt":"p.24 naive Fib(8) 재귀 호출 tree","explainImg":"img/algo12-p37-memo-ans.png","introCard":2},{"id":"u12b-13","type":"sa","q":"DP 의 key idea 로, 이미 푼 subproblem 의 답을 저장해 다시 풀지 않는 기법은?","explain":"D&C 와 top-down DP 의 모양은 같고 다른 점은 memoization 하나다.","src":"12강 p.34 · 11/3 녹음","wiki":"top-down과 memoization","prof":true,"tags":["DP"],"answer":"memoization","alts":["memo-ization","메모이제이션","memo"]},{"id":"u12b-14","type":"tf","q":"dynamic programming 의 'programming' 은 코드를 짠다는 뜻이 아니라 표(tabular)로 계획을 세운다는 뜻이다.","explain":"Bellman(1950년대)이 붙인 이름. 시험보다는 교양.","src":"12강 p.38","wiki":"dynamic programming","diff":1,"tags":["DP"],"answer":true,"introCard":2},{"id":"u12b-15","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) DP 가 통하려면 optimal substructure 와 overlapping subproblems 가 있어야 한다 (2) divide-and-conquer 의 subproblem 도 많이 겹친다 (3) memo 를 쓰는 top-down Fibonacci 는 $O(n)$ (4) bottom-up 은 필요한 칸이 먼저 채워지는 순서로 채워야 한다 (5) naive 재귀 Fibonacci 는 $\\Theta(n^2)$","explain":"(1) 참: p.30 'You should remember those two elements.' (2) 거짓: D&C 는 disjoint(independent) 하게 나눈다. 겹치면 DP 를 써야 한다. (3) 참: F[k] 마다 한 번만 계산한다. (4) 참: 의존 관계의 topological order 다. (5) 거짓: $\\Theta(\\varphi^n)$ 지수 시간이다. $T(n) \\ge T(n-1)+T(n-2)$ 라서 Fibonacci 수만큼 빨리 자란다.","src":"12강 p.23–35 · 중간 1번 형식","wiki":"dynamic programming","tags":["DP","circle-all"],"choices":["(1)(3)(4)","(1)(2)(3)(4)","(1)(4)","(1)(3)(4)(5)"],"answer":0,"introCard":1}],"intro":[{"title":"DP 의 두 요소","body":"**optimal substructure**: 큰 문제의 최적해가 subproblem 최적해로 이뤄진다. **overlapping subproblems**: 같은 subproblem 이 계속 다시 나온다. 겹치지 않으면 divide-and-conquer 다. 가장 어렵고 중요한 건 subproblem 사이의 관계(점화식)를 찾는 것.","src":"12강 p.27–30"},{"title":"bottom-up vs top-down","body":"**bottom-up**: 작은 subproblem 부터 의존 순서(topological order)대로 표를 채운다(Fibonacci 배열, Bellman-Ford). **top-down**: 재귀 그대로 쓰되 답을 저장(**memoization**)해 다시 풀지 않는다. 둘 다 Fibonacci 가 $O(n)$.","src":"12강 p.31–35"},{"title":"memo 를 하면","body":"Fib(8) 재귀 tree 에서 같은 숫자 노드를 합치면 8→7→…→0 의 사슬 모양 DAG 가 된다. 'dynamic programming' 의 programming 은 코딩이 아니라 표(tabular)로 계획한다는 뜻.","img":"img/algo12-p37-memo-ans.png","imgAlt":"memoization 으로 합친 Fib 사슬","src":"12강 p.36–38"},{"title":"DP 설계 3단계","body":"① 작은 문제의 해를 table 에 저장 ② table 로 더 큰 문제를 푼다 ③ 마지막에 모은 정보로 전체 해. DP 는 주로 optimization problem 에 쓴다.","src":"12강 p.27, 30"}]},{"id":"u12c","title":"Floyd-Warshall 점화식","items":[{"id":"u12c-01","type":"mc","q":"Floyd-Warshall 이 푸는 문제는?","explain":"출력은 n×n 배열(행 = source, 열 = destination).","src":"12강 p.42","wiki":"all-pairs shortest path","tags":["FW"],"choices":["single-source shortest path","all-pairs shortest path","MST","longest path"],"answer":1,"introCard":0},{"id":"u12c-02","type":"mc","q":"APSP 를 모든 s 에서 Bellman-Ford 를 돌려 풀면? (dense 일 때 포함)","explain":"BF $O(nm)$ 을 n 번. FW 는 $O(n^3)$ 이라 'Better than running BF n times!'","src":"12강 p.43 · 11/3 녹음","wiki":"all-pairs shortest path","tags":["FW","running time"],"choices":["$O(n^3)$","$O(n^2 m)$, $m = n^2$ 이면 $O(n^4)$","$O(nm\\log n)$","$O(n^2)$"],"answer":1,"introCard":0},{"id":"u12c-03","type":"mc","q":"Bellman-Ford 는 '사용하는 간선 수' 로 subproblem 을 나눴다. Floyd-Warshall 은 무엇으로 subproblem 을 나누나?","explain":"Sub-problem(k): 모든 u, v 에 대해 internal vertex ⊆ {1..k} 인 u⇝v 최단 cost = $D^{(k)}[u,v]$.","src":"12강 p.44–45 · 11/3 녹음","wiki":"D^(k)(u,v)","prof":true,"tags":["FW"],"choices":["경로 길이로","노드 수로: 내부 정점이 모두 {1, …, k} 안에 있는 최단경로","source 로","간선 weight 로"],"answer":1,"introCard":1},{"id":"u12c-04","type":"tf","q":"$D^{(k)}[u,v]$ 에서 끝점 u, v 자신도 {1..k} 안에 있어야 한다.","explain":"끝점은 internal 이 아니다. 제약은 **중간에 지나는** 정점에만 걸린다.","src":"12강 p.44","wiki":"D^(k)(u,v)","tags":["FW","trap"],"answer":false,"introCard":1},{"id":"u12c-05","type":"cloze","q":"FW 점화식: $D^{(k)}[u,v] = \\min\\{$ ___ $,\\ D^{(k-1)}[u,k] +$ ___ $\\}$","explain":"Case 1: k 가 필요 없으면 그대로. Case 2: u⇝k, k⇝v 두 조각이 각각 {1..k−1} 경유 최단경로.","src":"12강 p.46–51","wiki":"Floyd-Warshall","tags":["FW","pseudocode"],"answer":["D(k−1)[u,v]","D(k−1)[k,v]"],"bank":["D(k−1)[u,v]","D(k−1)[k,v]","D(k)[u,v]","D(k−1)[v,k]","D(k)[k,v]"],"introCard":2},{"id":"u12c-06","type":"match","q":"FW 유도 조각을 연결하시오","explain":"교수 11/3: 'That's good.' — overlap 확인까지 해야 DP 의 두 요소가 다 갖춰진다.","src":"12강 p.46–52 · 11/3 녹음","wiki":"Floyd-Warshall","tags":["FW","DP"],"pairs":[["Case 1","최단경로에 k 가 필요 없다 → $D^{(k-1)}[u,v]$"],["Case 2","k 를 지난다 → $D^{(k-1)}[u,k]+D^{(k-1)}[k,v]$"],["no negative cycle 가정","simple 최단경로가 있어 k 를 정확히 한 번 지난다"],["overlapping","$D^{(k-1)}[k,v]$ 하나가 여러 u 에 재사용"]],"introCard":2},{"id":"u12c-07","type":"mc","q":"Case 2 에 'negative cycle 이 없다' 가 필요한 이유는?","explain":"negative cycle 이 k 를 지나면 k 를 여러 번 도는 게 더 싸서 분해가 깨진다. longest simple path 가 실패하는 지점과 같은 구조.","src":"12강 p.49–50","wiki":"simple path","tags":["FW","proof"],"choices":["∞ 를 더할 수 없어서","그래야 최단경로가 simple 이라 k 를 정확히 한 번 지나고, 두 조각의 내부가 {1..k−1} 이 된다","Dijkstra 를 쓰려고","표 크기 때문에"],"answer":1,"img":"img/algo12-p50-case2.png","imgAlt":"p.50 Case 2: u ⇝ k ⇝ v 가 {1..k} 를 지나는 simple shortest path 그림","introCard":2},{"id":"u12c-08","type":"order","q":"$D^{(k)}$ 점화식 유도를 순서대로","explain":"교수 11/3: 'Case 1 … Case 2 … 둘 중 작은 쪽이 $D^{(k)}$, 이게 optimal substructure.'","src":"12강 p.46–51 · 11/3 녹음","wiki":"D^(k)(u,v)","prof":true,"tags":["FW","proof"],"answer":["$D^{(k)}[u,v]$ 의 최단경로 P 가 정점 k 를 쓰는지로 case 를 나눈다","안 쓰면 P 의 내부는 {1..k−1} 이라 $D^{(k-1)}[u,v]$","쓰면 (no negative cycle → simple) k 를 정확히 한 번 지나 u⇝k, k⇝v 로 쪼갠다","sub-path 도 최단이므로 $D^{(k-1)}[u,k] + D^{(k-1)}[k,v]$","두 case 중 작은 값"],"introCard":2},{"id":"u12c-09","type":"cloze","q":"FW 초기화: $D^{(0)}[u,u] =$ ___ , 간선 (u,v) 가 있으면 $D^{(0)}[u,v] =$ ___ , 없으면 ∞.","explain":"'the only path through zero other vertices are edges directly from u to v' → $D^{(0)}$ = 가중치 행렬.","src":"12강 p.53","wiki":"Floyd-Warshall","tags":["FW","pseudocode"],"answer":["0","weight(u,v)"],"bank":["0","weight(u,v)","∞","1","−∞"],"introCard":3},{"id":"u12c-10","type":"tf","q":"FW 의 세 겹 루프에서 k 가 가장 바깥 루프여야 한다.","explain":"(u,v) 를 바깥에 두면 $D^{(k-1)}$ 이 완성되기 전에 쓰게 되어 틀린다. 빈칸·T/F 단골.","src":"12강 p.53","wiki":"Floyd-Warshall","tags":["FW","pseudocode"],"answer":true,"introCard":3},{"id":"u12c-11","type":"mc","q":"FW 는 DP 의 어느 구현 방식인가?","explain":"슬라이드: 'This is a bottom-up DP algorithm.'","src":"12강 p.53","wiki":"bottom-up","tags":["FW","DP"],"choices":["top-down (memo 재귀)","bottom-up (k = 0, 1, …, n 순으로 표 채우기)","greedy","randomized"],"answer":1,"introCard":3},{"id":"u12c-12","type":"sa","q":"subproblem 축이 '사용하는 간선 개수 ≤ i' 인 최단경로 알고리즘은?","explain":"FW 는 '사용 가능한 중간 정점 집합 {1..k}', BF 는 '간선 개수 i'.","src":"12강 p.45","wiki":"Bellman-Ford는 DP","tags":["BF","FW"],"answer":"Bellman-Ford","alts":["BF","Bellman Ford"],"introCard":1},{"id":"u12c-13","type":"num","q":"정점 10개 그래프에 FW 를 돌릴 때 점화식 min 계산은 모두 몇 번인가?","explain":"k 가 n 번 × 쌍 (u,v) 가 n² 개 = $n^3 = 1000$. 그래서 $\\Theta(n^3)$, 그래프 모양과 무관.","src":"12강 p.54","wiki":"Floyd-Warshall","tags":["FW","running time"],"answer":1000,"tol":0,"introCard":2},{"id":"u12c-14","type":"mc","q":"Floyd-Warshall 의 공간 사용량은?","explain":"'As with Bellman-Ford, we don't really need to store all n of the $D^{(k)}$.'","src":"12강 p.54","wiki":"Floyd-Warshall","tags":["FW"],"choices":["$O(n^3)$ — $D^{(0)}..D^{(n)}$ 을 모두 저장해야 한다","$O(n^2)$ — n×n 배열 두 개면 된다","$O(n)$","$O(m)$"],"answer":1,"introCard":3},{"id":"u12c-15","type":"cloze","q":"[분석 템플릿 칸] Floyd-Warshall: 바깥 루프 $k$ 가 ___ 번, 각 $k$ 마다 $(u,v)$ 쌍이 ___ 개, 칸 하나는 min 한 번 $O(1)$ → $\\Theta($___$)$.","explain":"$k = 1..n$, $(u,v) \\in V^2$ 라 $n \\cdot n^2 \\cdot O(1) = \\Theta(n^3)$. 간선 수 $m$ 과 무관하다. 그래서 dense 에서는 BF 를 $n$ 번($O(n^2 m) = O(n^4)$) 돌리는 것보다 낫고, sparse·음수 없음이면 Dijkstra 를 $n$ 번 돌리는 쪽이 나을 수 있다.","src":"12강 p.53–54","wiki":"Floyd-Warshall","tags":["FW","running time","analysis"],"answer":["n","n^2","n^3"],"bank":["n","n^2","n^3","m","n^4"],"introCard":3}],"intro":[{"title":"all-pairs shortest path","body":"모든 쌍 $(u,v)$ 의 최단경로. 모든 s 에서 Bellman-Ford 를 돌리면 $O(n^2 m)$, dense 면 $O(n^4)$. Floyd-Warshall 은 $\\Theta(n^3)$.","src":"12강 p.40–43"},{"title":"subproblem: 거쳐도 되는 정점","body":"정점에 1..n 번호를 붙이고 $D^{(k)}[u,v]$ = **내부 정점이 모두 {1..k}** 안인 u→v 최단경로 cost. 끝점 u, v 자신은 제한 없음. Bellman-Ford 는 '간선 수' 로, FW 는 '쓸 수 있는 정점' 으로 나눈다.","src":"12강 p.42–45"},{"title":"점화식","body":"$D^{(k)}[u,v] = \
