ard":1},{"id":"u15a-10","type":"num","q":"그림의 그래프에서 cut {A, B, D, E} / {C, I, H, G, F} 를 건너는 간선은 몇 개인가?","explain":"B–C, A–H, B–H, C–D, D–F, E–F. 교수: '예에서 여섯 개'.","src":"15강 p.15 · 11/12 녹음","wiki":"cut","tags":["MST","cut"],"answer":6,"tol":0,"img":"img/algo15-p12-cut.png","imgAlt":"p.12 9정점 그래프와 cut {A,B,D,E} / {C,I,H,G,F} (빨간 점선)","introCard":1},{"id":"u15a-11","type":"tf","q":"간선 가중치가 모두 다르면 MST 는 유일하다.","explain":"동점이 없으면 매 cut 의 light edge 가 하나로 정해진다(CLRS 연습문제).","src":"15강 p.8 보충","wiki":"minimum spanning tree","diff":3,"tags":["MST"],"answer":true,"introCard":0},{"id":"u15a-12","type":"match","q":"MST 의 응용 분야와 쓰임을 연결하시오","explain":"교수: 'MST 를 왜 외워야 하나 → 어디에 쓰이는지 알면 된다.'","src":"15강 p.9 · 11/12 녹음","wiki":"minimum spanning tree","diff":1,"tags":["MST"],"pairs":[["network design","도시를 도로·전기·통신선으로 최소 비용 연결"],["cluster analysis","유전자 관계로 가까운 것끼리 묶기"],["image segmentation","이웃 픽셀 사이 간선으로 비슷한 픽셀 묶기"],["다른 알고리즘의 부품","더 큰 그래프 알고리즘의 subroutine"]],"introCard":0},{"id":"u15a-13","type":"mc","q":"MST 를 greedy 로 찾는 두 가지 선택 '가장 작은 weight 간선부터' 와 '한 정점에서 트리를 키우기' 를 알고리즘 이름과 짝지으면?","explain":"교수: 'That's the actual algorithm. That's the Kruskal algorithm.' / 'another idea … growing tree' = Prim.","src":"15강 p.8 · 11/12 녹음","wiki":"Prim vs Kruskal 비교표","prof":true,"tags":["MST"],"choices":["가장 작은 weight 부터 = Prim, 한 정점에서 키우기 = Kruskal","가장 작은 weight 부터 = Kruskal, 한 정점에서 키우기 = Prim","둘 다 Dijkstra","둘 다 Kruskal"],"answer":1,"introCard":0},{"id":"u15a-14","type":"num","q":"G: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9 (무향, 가중치 모두 다름). MST 의 cost 는?","explain":"B–C 1 + B–D 2 + A–C 3 + C–E 6 + D–F 7 = 19. A–B 4, C–D 5 는 cycle 이라 빠진다.","src":"15강 (연습)","wiki":"minimum spanning tree","tags":["MST","trace"],"answer":19,"tol":0,"img":"img/algo15-gen-u15a-09.png","imgAlt":"undirected weighted graph: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9","introCard":0},{"id":"u15a-15","type":"num","q":"그림의 cut 은 {B, C, E, G, H} / {A, D, I, F} 다(양쪽 다 끊겨 있어도 cut 이다). 이 cut 의 light edge 는 몇 개인가?","explain":"건너는 간선은 A–B 4, A–H 8, C–I 2, C–D 7, C–F 4, D–E 9, E–F 10, F–G 2, G–I 6, H–I 7 이다. 최소 weight 는 2 이고 C–I 와 F–G 두 개가 동점이다. light edge 는 '건너는 간선 중 weight 가 최소인 것' 이라 동점이면 여러 개일 수 있고, 보조정리는 그중 아무거나 써도 된다.","src":"15강 p.13–14","wiki":"light edge","tags":["MST","cut","그림"],"img":"img/algo15-p13-cut2.png","imgAlt":"p.13 9정점 그래프와 cut {B,C,E,G,H} / {A,D,I,F} (빨간 점선 여러 조각)","answer":2,"tol":0,"introCard":1},{"id":"u15a-16","type":"tf","q":"그림에서 주황색 굵은 간선이 S 다. 빨간 점선 cut {A, B, D, E} / {C, I, H, G, F} 는 S 를 respect 한다.","explain":"S = {A–B, C–I, C–F, H–G, G–F}. A–B 는 둘 다 왼쪽, 나머지 넷은 둘 다 오른쪽이다. cut 을 건너는 S 간선이 없으니 respect 한다. 이 cut 의 light edge 는 C–D 7 이라(p.15) 보조정리로 S ∪ {C–D} 를 포함하는 MST 가 있다.","src":"15강 p.14–15","wiki":"cut이 S를 respect","tags":["MST","cut","그림"],"img":"img/algo15-p14-respect.png","imgAlt":"p.14 9정점 그래프, 주황 굵은 간선 S, 빨간 점선 cut","explainImg":"img/algo15-p15-light-ans.png","answer":true,"introCard":1},{"id":"u15a-17","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) cut 의 두 부분은 끊겨 있어도 된다 (2) 간선 weight 가 모두 다르면 MST 는 유일하다 (3) cut 을 건너는 간선이면 무엇이든 안전하게 더할 수 있다 (4) S 를 respect 하는 cut 의 light edge 는 안전하다 (S 를 포함하는 MST 가 있을 때) (5) 정점 $n$ 개 그래프의 spanning tree 는 간선이 $n$ 개다","explain":"(1) 참: p.13 'One or both of the two parts might be disconnected.' (2) 참. (3) 거짓: light 한 간선이어야 한다. 무거운 crossing edge 를 넣으면 cost 가 커질 수 있다. (4) 참: MST 보조정리. (5) 거짓: tree 는 간선 $n-1$ 개.","src":"15강 p.4–17 · 중간 1번 형식","wiki":"MST 보조정리","tags":["MST","circle-all"],"choices":["(1)(2)(4)","(1)(2)(3)(4)","(2)(4)","(1)(4)(5)"],"answer":0,"introCard":0}],"intro":[{"title":"MST","body":"undirected weighted connected 그래프에서 **spanning tree** = 모든 정점을 잇는 tree(간선 $n-1$ 개). **MST** = weight 합이 최소인 것. weight 가 모두 다르면 유일. 예제 9정점 그래프의 MST cost 는 37.","img":"img/algo15-p8-mst.png","imgAlt":"9정점 그래프와 MST(주황, cost 37)","src":"15강 p.4–8"},{"title":"cut 과 respect","body":"**cut** = 정점 집합을 두 부분으로 나눈 partition(각 부분이 끊겨 있어도 됨). 간선 집합 S 의 어떤 간선도 cut 을 건너지 않으면 cut 이 S 를 **respect** 한다.","img":"img/algo15-p14-respect.png","imgAlt":"S(주황)와 이를 respect 하는 cut","src":"15강 p.12–14"},{"title":"light edge","body":"cut 을 건너는 간선 중 weight 최소인 것. 동점이면 여러 개. 예: cut {A,B,D,E}/{C,I,H,G,F} 의 light edge 는 C–D 7.","img":"img/algo15-p15-light-ans.png","imgAlt":"light edge C–D 7","src":"15강 p.14–15"}]},{"id":"u15b","title":"MST 보조정리 (Remember this well)","items":[{"id":"u15b-01","type":"cloze","q":"보조정리: S 를 포함하는 MST 가 있고, cut 이 S 를 respect 하며, (u,v) 가 그 cut 의 ___ edge 이면, S ∪ {(u,v)} 를 포함하는 ___ 가 있다.","explain":"'It's safe to add this edge!' 교수: 정의 뒤 'This is important', 증명 뒤 'Remember this well'.","src":"15강 p.16–17 · 11/12 녹음","wiki":"MST 보조정리","prof":true,"tags":["MST","proof"],"answer":["light","MST"],"bank":["light","MST","heavy","cycle","path"],"introCard":2},{"id":"u15b-02","type":"order","q":"MST 보조정리의 교환 증명을 순서대로","explain":"마지막 줄((x,y) ∉ S, respect 가 쓰이는 곳)은 수업에서 말로 짚지 않았으니 서술할 때 꼭 쓴다.","src":"15강 p.18–23 · 11/12 녹음","wiki":"MST 보조정리","prof":true,"tags":["MST","proof"],"answer":["S 를 포함하는 MST T 가 있고 (u,v) ∉ T 라 하자","T 에 (u,v) 를 더하면 cycle 이 생긴다","u, v 가 cut 의 양쪽이라 cycle 은 cut 을 두 번 건너고, 다른 crossing edge (x,y) 가 있다","T' = T − (x,y) + (u,v): $w(u,v) \\le w(x,y)$ 라 cost 가 늘지 않아 T' 도 MST","(x,y) 는 cut 을 건너므로 S 에 없다 → T' ⊇ S ∪ {(u,v)}"],"introCard":0},{"id":"u15b-03","type":"match","q":"보조정리의 가정과 쓰이는 곳을 연결하시오","explain":"셋 중 하나라도 빼면 증명이 깨진다.","src":"15강 p.16–23","wiki":"MST 보조정리","tags":["MST","proof"],"pairs":[["S 를 포함하는 MST T 가 있다","증명의 출발점"],["cut 이 S 를 respect","빼는 (x,y) 가 S 에 없다"],["(u,v) 가 light","$w(u,v) \\le w(x,y)$ 라 cost 가 안 는다"],["T 는 spanning tree","(u,v) 를 더하면 cycle 이 생긴다"]],"introCard":0},{"id":"u15b-04","type":"mc","q":"MST 보조정리 증명에서 T 에 (u,v) 를 더해 생긴 cycle 이 cut 을 '두 번' 건너는 이유는?","explain":"'You have to go back and forth in this cut to create a cycle.' u→v 로 건넜으면 x–y 로 다시 건너온다.","src":"15강 p.21 · 11/12 녹음","wiki":"MST 보조정리","prof":true,"tags":["MST","proof"],"choices":["cycle 의 길이가 짝수라서","cycle 은 출발점으로 돌아와야 하니 cut 을 back and forth 로 건너야 한다","cut 이 S 를 respect 해서","light edge 가 둘이라서"],"answer":1,"introCard":0},{"id":"u15b-05","type":"tf","q":"cut 을 건너는 간선이라면 아무거나 더해도 안전하다.","explain":"light edge 여야 한다. 무거운 crossing edge 를 넣으면 교환에서 cost 가 늘 수 있다.","src":"15강 p.16","wiki":"MST 보조정리","tags":["MST","trap"],"answer":false,"introCard":0},{"id":"u15b-06","type":"tf","q":"cut 의 light edge 가 여러 개(동점)면 그중 아무거나 더해도 안전하다.","explain":"보조정리는 light edge 하나를 고정하지 않는다. 동점이면 각각이 light 이다.","src":"15강 p.16","wiki":"light edge","tags":["MST"],"answer":true,"introCard":0},{"id":"u15b-07","type":"mc","q":"MST 보조정리 증명이 Huffman Lemma 1 증명과 같은 종류라고 하는 이유는?","explain":"Huffman Lemma 1 의 x ↔ a swap 과 같은 기법.","src":"15강 p.18 · 11/12 녹음","wiki":"MST 보조정리","prof":true,"tags":["MST","proof"],"choices":["둘 다 heap 을 써서","최적해에 우리 선택이 없으면, 바꿔 넣어도 여전히 최적임을 보이는 교환 논증이라서","둘 다 tree 라서","둘 다 귀류법이 아니라서"],"answer":1,"introCard":1},{"id":"u15b-08","type":"mc","q":"보조정리에서 'cut 이 S 를 respect' 조건이 없다면 어디가 깨지나?","explain":"respect 덕분에 crossing edge (x,y) 는 S 에 없다.","src":"15강 p.22–23","wiki":"cut이 S를 respect","tags":["MST","proof"],"choices":["cycle 이 안 생긴다","빼낸 (x,y) 가 S 의 간선일 수 있어 T' 가 S 를 잃는다","cost 가 늘어난다","T' 가 tree 가 아니다"],"answer":1,"introCard":2},{"id":"u15b-09","type":"tf","q":"T' = T − (x,y) + (u,v) 는 여전히 spanning tree 다.","explain":"(u,v) 로 생긴 cycle 위의 (x,y) 를 지웠으니 cycle 이 끊기고, 연결성은 유지된다.","src":"15강 p.22","wiki":"MST 보조정리","tags":["MST","proof"],"answer":true,"introCard":1},{"id":"u15b-10","type":"mc","q":"MST 보조정리를 'light edge 는 더해도 safe 하다' 라고 줄여 말한다. 여기서 safe 의 뜻은?","explain":"L14 의 'each choice doesn't rule out success' 와 같은 말.","src":"15강 p.17","wiki":"MST 보조정리","tags":["MST"],"choices":["cycle 을 만들지 않는다","지금까지 성공 가능성(어떤 MST 에 포함됨)을 없애지 않았다면 이 간선을 더해도 여전히 없애지 않는다","가중치가 양수다","정렬돼 있다"],"answer":1,"introCard":0},{"id":"u15b-11","type":"sa","q":"cut 을 건너는 간선 중 가중치가 가장 작은 간선을 무엇이라 하나?","explain":"보조정리의 안전한 선택이다. Prim 과 Kruskal 은 cut 만 다르게 잡는다.","src":"15강 p.14","wiki":"light edge","tags":["MST"],"answer":"light edge","alts":["light"]},{"id":"u15b-12","type":"tf","q":"보조정리 하나로 Prim 과 Kruskal 의 정확성을 모두 증명한다.","explain":"교수: 'with this one theorem, it can be used to prove its correctness for both algorithms … That would be interesting.'","src":"15강 p.3 · 11/12 녹음","wiki":"MST 보조정리","prof":true,"tags":["MST"],"answer":true,"introCard":0},{"id":"u15b-13","type":"mc","q":"G: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9 (무향, 가중치 모두 다름). S = {B–C} 이고 cut 이 {A, B, C} / {D, E, F} 일 때, 보조정리로 안전하게 더할 수 있는 간선은?","explain":"S 의 B–C 는 같은 쪽이라 respect. 건너는 간선 B–D 2, C–D 5, C–E 6 중 light 는 B–D 2.","src":"15강 p.16 (연습)","wiki":"MST 보조정리","tags":["MST","figure"],"choices":["A–B 4","B–D 2","C–D 5","D–F 7"],"answer":1,"img":"img/algo15-gen-u15a-09.png","imgAlt":"undirected weighted graph: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9","introCard":0}],"intro":[{"title":"MST 보조정리 (Remember this well)","body":"S 를 포함하는 MST 가 있고, cut 이 S 를 respect 하고, (u,v) 가 그 cut 의 light edge 면 → **S ∪ {(u,v)} 를 포함하는 MST 가 있다.** 즉 light edge 를 더해도 성공 가능성을 잃지 않는다(safe). 이 하나로 Prim 과 Kruskal 을 모두 증명한다.","img":"img/algo15-p15-light-ans.png","imgAlt":"S 를 respect 하는 cut 과 light edge","src":"15강 p.16–17"},{"title":"교환 증명","body":"MST T 가 (u,v) 를 안 가지면 T + (u,v) 에 cycle 이 생긴다. u, v 가 cut 양쪽이라 cycle 은 cut 을 한 번 더 건너야 출발점에 돌아온다 — 그 간선 (x,y). (x,y) 는 S 에 없고(respect), $w(u,v)\\le w(x,y)$ (light) 라 T − (x,y) + (u,v) 도 spanning tree 이며 cost 가 안 는다. Huffman 과 같은 exchange 논증.","src":"15강 p.18–23"},{"title":"가정 하나하나의 역할","body":"'S 를 포함하는 MST 가 있다' 는 출발점, 'cut 이 S 를 respect' 는 빼낸 (x,y) 가 S 의 간선이 아니게 해 주고, 'light' 는 cost 가 늘지 않게 해 준다. 하나라도 빠지면 증명이 깨진다. 아무 crossing edge 나 더하면 안 되고, 동점 light edge 는 아무거나 괜찮다.","src":"15강 p.16–23"}]},{"id":"u15c","title":"Prim: slowPrim 과 정확성","items":[{"id":"u15c-01","type":"mc","q":"Prim 알고리즘의 아이디어는?","explain":"'Start growing a tree, greedily add the shortest edge we can to grow the tree.' 첫째 보기는 Kruskal.","src":"15강 p.27","wiki":"Prim's algorithm","tags":["Prim"],"choices":["가장 싼 간선부터 cycle 이 아니면 추가","트리 하나를 키우며, 트리에서 나가는 가장 짧은 간선을 greedy 하게 붙인다","모든 간선을 n−1 번 relax","간선을 무작위로 contract"],"answer":1,"introCard":0},{"id":"u15c-02","type":"order","q":"G: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9 (무향, 가중치 모두 다름). A 에서 시작한 Prim 이 MST 에 넣는 간선을 순서대로","explain":"트리 {A}: A–C 3 \u003c A–B 4 → +C: B–C 1 → +B: B–D 2 → +D: C–E 6 \u003c D–F 7 → +E: D–F 7 (E–F 9 보다 작다).","src":"15강 p.27–36 (연습)","wiki":"Prim's algorithm","tags":["Prim","trace"],"answer":["A–C","C–B","B–D","C–E","D–F"],"img":"img/algo15-gen-u15a-09.png","imgAlt":"undirected weighted graph: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9","introCard":0},{"id":"u15c-03","type":"mc","q":"slowPrim 의 수행 시간은?","explain":"교수: 'But this is called slow Prim. It is an inefficient algorithm.'","src":"15강 p.36 · 11/12 녹음","wiki":"Prim's algorithm","prof":true,"tags":["Prim","running time"],"choices":["$O(n+m)$","$O(m\\log n)$","$O(nm)$ — while 문 n−1 번 × 매번 간선 전체 훑기","$O(n^3)$"],"answer":2,"introCard":1},{"id":"u15c-04","type":"cloze","q":"slowPrim: 매번 x 는 ___ 에, v 는 ___ 에 있는 가장 가벼운 간선 (x, v) 를 MST 에 넣고 v 를 visited 에 추가한다.","explain":"visited 와 unvisited 를 잇는 간선 = cut {visited, unvisited} 의 crossing edge.","src":"15강 p.36","wiki":"Prim's algorithm","tags":["Prim","pseudocode"],"answer":["visited","unvisited"],"bank":["visited","unvisited","MST","S","queue"],"introCard":1},{"id":"u15c-05","type":"mc","q":"Prim 정확성 증명에 쓰는 cut 은?","explain":"지금까지 고른 간선은 모두 visited 끼리라 respect, Prim 이 고르는 간선은 그 cut 의 light edge.","src":"15강 p.40–41 · 11/12 녹음","wiki":"Prim 정확성 증명","tags":["Prim","proof"],"choices":["{T1, V − T1}","{visited, unvisited}","{s, V − s}","{S, V − S} (S = 고른 간선의 끝점)"],"answer":1,"introCard":0},{"id":"u15c-06","type":"tf","q":"Prim 이 다음에 고르는 간선은 cut {visited, unvisited} 의 light edge 다.","explain":"visited → unvisited 중 최소를 고르는 것이 정의 그대로 light edge. 보조정리로 안전.","src":"15강 p.41","wiki":"Prim 정확성 증명","tags":["Prim","proof"],"answer":true,"introCard":0},{"id":" mg/algo15-gen-u15a-09.png","imgAlt":"undirected weighted graph: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9","introCard":0},{"id":"u15d-14","type":"mc","q":"Dijkstra 와 Prim 은 거의 같은 코드다. 둘의 결정적 차이(big difference)는?","explain":"Dijkstra 는 s 에서의 경로 길이, Prim 은 트리에서 간선 하나의 길이.","src":"15강 p.68","wiki":"Dijkstra vs Prim","tags":["Prim","Dijkstra"],"choices":["p[v] 를 기억하는지","갱신 식: Dijkstra $d[v] = \\min(d[v], d[u]+w(u,v))$, Prim $k[v] = \\min(k[v], w(u,v))$","자료구조","시작 정점"],"answer":1,"introCard":0}],"intro":[{"title":"효율적 Prim: key 와 parent","body":"정점마다 $k[x]$ = 지금 트리까지의 거리(간선 하나의 최소 weight), $p[x]$ = 그 간선의 트리 쪽 끝. unreached 중 $k$ 최소 u 를 activate → 이웃 v 마다 $k[v] = \\min(k[v], w(u,v))$, 갱신되면 $p[v]=u$ → u 를 reached 로 하고 (p[u], u) 를 MST 에.","img":"img/algo15-p63-prim-ans.png","imgAlt":"효율적 Prim 진행 중 key 와 parent","src":"15강 p.48–65"},{"title":"Dijkstra vs Prim","body":"코드가 거의 같다. 대응: not-sure ↔ unreached, $d[v]$ ↔ $k[v]$, sure ↔ reached. **차이는 갱신 식**: Dijkstra $d[u]+w(u,v)$, Prim $w(u,v)$. 그래서 shortest-path tree 는 MST 가 아닐 수 있다(S–U 2, U–T 2, S–T 3 이면 SPT cost 5, MST 4).","src":"15강 p.66–68"},{"title":"수행 시간","body":"Dijkstra 와 같다: RB tree $O(m\\log n)$, Fibonacci heap $O(m + n\\log n)$.","src":"15강 p.71"}]},{"id":"u15e","title":"Kruskal · union-find · 비교","items":[{"id":"u15e-01","type":"mc","q":"Kruskal 의 아이디어는?","explain":"p.74 'what if we just always take the cheapest edge?' + p.80 cycle 이면 skip.","src":"15강 p.74–80","wiki":"Kruskal's algorithm","tags":["Kruskal"],"choices":["트리 하나를 키운다","연결 여부와 상관없이 가장 싼 간선부터, cycle 을 만들지 않으면 더한다","가장 비싼 간선부터 지운다","간선을 무작위로 contract 한다"],"answer":1,"introCard":0},{"id":"u15e-02","type":"order","q":"G: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9 (무향, 가중치 모두 다름). Kruskal 이 MST 에 넣는 간선을 순서대로","explain":"1, 2, 3 추가 → A–B 4 는 A, B 가 이미 같은 tree 라 skip, C–D 5 skip → C–E 6, D–F 7 추가로 간선 5개 완성.","src":"15강 p.74–85 (연습)","wiki":"Kruskal's algorithm","tags":["Kruskal","trace"],"answer":["B–C","B–D","A–C","C–E"," 강 p.106","wiki":"union-find","tags":["Kruskal","trap"],"answer":false,"introCard":0},{"id":"u15e-08","type":"tf","q":"Kruskal 은 매 단계 연결된 tree 하나를 유지한다.","explain":"forest(서로 겹치지 않는 tree 들)를 유지하다가 마지막에 하나가 된다. 'Stop when we have one big tree!'","src":"15강 p.87–105","wiki":"forest","tags":["Kruskal","trap"],"answer":false,"introCard":0},{"id":"u15e-09","type":"mc","q":"Kruskal 정확성에 쓰는 cut 은?","explain":"S 의 간선은 모두 tree 안이라 respect. 나머지는 Prim 과 '완전히 같은 슬라이드'.","src":"15강 p.110–114 · 11/19 녹음","wiki":"Kruskal 정확성 증명","tags":["Kruskal","proof"],"choices":["{visited, unvisited}","{T1, V − T1} (새 간선이 합치는 두 tree 중 하나 T1)","{s, t}","무작위 cut"],"answer":1,"introCard":0},{"id":"u15e-10","type":"tf","q":"Kruskal 의 새 간선이 cut {T1, V − T1} 의 light edge 인 이유: 더 가벼운 crossing edge 가 있었다면 먼저 봤을 것이고, 다른 tree 를 잇는 간선이니 이미 더했을 것이다.","explain":"정렬 순서로 처리하기 때문이다.","src":"15강 p.111","wiki":"Kruskal 정확성 증명","tags":["Kruskal","proof"],"answer":true,"introCard":2},{"id":"u15e-11","type":"mc","q":"Kruskal 의 worst-case 수행 시간은?","explain":"union-find 연산은 amortized $O(\\alpha(n))$ 로 거의 상수.","src":"15강 p.106–107, 116","wiki":"Kruskal's algorithm","tags":["Kruskal","running time"],"choices":["$O(nm)$","$O(m\\log n)$ (정렬이 지배), 가중치가 작은 정수면 radix sort 로 사실상 $O(m)$","$O(n^2)$","$O(m + n\\log n)$"],"answer":1,"introCard":0},{"id":"u15e-12","type":"sa","q":"union-find 연산의 amortized 시간 $O(\\alpha(n))$ 에서 $\\alpha$ 는 무슨 함수인가?","explain":"'α(n) ≤ 4 provided that n is smaller than the number of atoms in the universe.'","src":"15강 p.106","wiki":"inverse Ackermann function","tags":["union-find"],"answer":"inverse Ackermann function","alts":["inverse Ackermann","역 아커만 함수"],"introCard":1},{"id":"u15e-13","type":"match","q":"Prim 과 Kruskal 을 비교해 연결하시오","explain":"공통점: 둘 다 greedy, 안전한 선택 = cut 을 건너는 light edge.","src":"15강 p.117–118","wiki":"Prim vs Kruskal 비교표","tags":["Prim","Kruskal"],"pairs":[["Prim 의 자료구조","priority queue"],["Kruskal 의 자료구조","union-find"],["Prim 이 키우는 것","tree 하나"],["Kruskal 이 키우는 것","forest"]],"introCard":0},{"id":"u15e-14","type":"mc","q":"어떤 그래프에 어느 알고리즘이 유리한가?","explain":"p.117 비교표. 11/19 수업에서도 dense/sparse, radix sort 로 정리했다.","src":"15강 p.117 · 11/19 녹음","wiki":"Prim vs Kruskal 비교표","tags":["Prim","Kruskal"],"choices":["dense 에 Kruskal, sparse 에 Prim","dense 에 Prim, sparse + radix sort 가능한 정수 가중치에 Kruskal","항상 Prim","항상 Kruskal"],"answer":1,"introCard":0},{"id":"u15e-15","type":"num","q":"그림의 9정점 14간선 그래프에서 Kruskal 이 실제로 MST 에 넣는 간선은 몇 개인가?","explain":"n − 1 = 8. 14개 중 6개는 cycle 이라 버려진다.","src":"15강 p.97–105","wiki":"Kruskal's algorithm","tags":["Kruskal"],"answer":8,"tol":0,"img":"img/algo15-p4-graph.png","imgAlt":"9정점 undirected weighted graph: A–B 4, A–H 8, B–C 8, B–H 11, C–I 2, C–D 7, C–F 4, D–E 9, D–F 14, E–F 10, F–G 2, G–H 1, G–I 6, H–I 7","introCard":0},{"id":"u15e-16","type":"tf","q":"greedy 단원 정리: 세부 알고리즘은 나중에 찾아봐도 되지만 D&C·DP·greedy 의 subproblem 그래프 모양은 기억해야 한다.","explain":"'if you remember the graph with different shapes it will be easier to remember.' greedy 가 안 되면 DP 로 간다는 판단을 할 수 있으면 좋다고 덧붙였다.","src":"11/19 녹음","wiki":"sub-problem graph 비교","prof":true,"tags":["greedy","DP"],"answer":true,"introCard":2},{"id":"u15e-17","type":"mc","q":"그림은 Kruskal 이 G–H 1, C–I 2, G–F 2, A–B 4 까지 더한 상태다(주황 간선). 정렬 순서상 다음 두 간선 C–F 4 와 I–G 6 은 각각 어떻게 되나?","explain":"C–F 는 tree {C, I} 와 tree {H, G, F} 를 잇는다. 서로 다른 tree 라 더하고 두 tree 를 merge 한다(p.90). 그러면 I 와 G 가 같은 tree 에 들어가서, I–G 를 더하면 cycle 이 생겨 건너뛴다. 이후 H–I 7, A–H 8 도 같은 이유로 건너뛴다. 판단은 union-find 의 `find(u) != find(v)` 한 줄이다.","src":"15강 p.87–90","wiki":"Kruskal's algorithm","tags":["Kruskal","그림"],"img":"img/algo15-p87-kruskal.png","imgAlt":"p.87 9정점 그래프, Kruskal 이 고른 주황 간선 A–B, C–I, H–G, G–F","explainImg":"img/algo15-p90-kruskal-ans.png","choices":["C–F 더함, I–G 건너뜀","C–F 더함, I–G 더함","C–F 건너뜀, I–G 더함","둘 다 건너뜀"],"answer":0,"introCard":0},{"id":"u15e-18","type":"cloze","q":"[분석 템플릿 칸] Kruskal: 간선 정렬 $O($___$)$, find 는 ___ 번, union 은 ___ 번 이하이고 각각 amortized $O(\\alpha(n))$ → 정렬이 지배한다.","explain":"정렬은 $O(m\\log m) = O(m\\log n)$ ($m \\le n^2$ 라 $\\log m \\le 2\\log n$). 간선마다 양 끝 find 두 번이라 $2m$. union 은 tree 둘을 합칠 때만, 즉 MST 간선 수 $n-1$ 번. union-find 부분이 $O(m\\,\\alpha(n))$ 이라 정렬 $O(m\\log n)$ 이 전체를 정한다. 정수 weight 를 radix sort 하면 사실상 $O(m)$.","src":"15강 p.106–107","wiki":"union-find","tags":["Kruskal","running time","analysis"],"answer":["m log n","2m","n−1"],"bank":["m log n","2m","n−1","n log n","m","n^2"],"introCard":1}],"intro":[{"title":"Kruskal","body":"연결 여부와 상관없이 **가장 싼 간선부터** 보며 cycle 을 만들지 않으면 더한다. 진행 중에는 tree 여러 개(forest)를 유지하고, 간선을 더할 때마다 두 tree 를 merge 한다.","img":"img/algo15-p90-kruskal-ans.png","imgAlt":"Kruskal 진행 중 forest","src":"15강 p.82–90"},{"title":"union-find","body":"`makeSet(v)` n 번, 간선 (u,v) 마다 `find(u) != find(v)` 면 MST 에 넣고 `union(u,v)`. find $2m$ 번, union $n-1$ 번, 각 amortized $O(\\alpha(n))$ ($\\alpha$ = inverse Ackermann). 정렬 $O(m\\log n)$ 이 지배, 작은 정수 weight 면 radix sort 로 사실상 $O(m)$.","img":"img/algo15-p96-kruskal.png","imgAlt":"정점마다 집합 하나로 시작하는 Kruskal","src":"15강 p.91–107"},{"title":"정확성과 비교","body":"새 간선이 합치는 두 tree 중 하나 T1 으로 cut {T1, V−T1} 을 잡으면 지금까지 간선을 respect 하고, 새 간선은 그 cut 의 light edge(더 가벼운 crossing edge 는 이미 봤고 더했을 것)라 보조정리. Prim: priority queue · tree 하나 · dense 에 유리. Kruskal: union-find · forest · sparse + 정수 weight 에 유리.","src":"15강 p.108–117"}]}]},{"id":"u16","title":"16강 Advanced I (Karger)","desc":"global min cut · Monte Carlo · contraction · 1/C(n,2) · 반복","lessons":[{"id":"u16a","title":"global minimum cut 과 Monte Carlo","items":[{"id":"u16a-01","type":"mc","q":"Karger 알고리즘(global min cut)에서 말하는 cut 의 정의는? (그래프는 undirected, unweighted)","explain":"p.4. 한쪽이 비어 있으면 cut 이 아니다(p.6 'This is not a cut').","src":"16강 p.4–7","wiki":"global minimum cut","tags":["min cut"],"choices":["간선 집합의 분할","정점을 nonempty 한 두 부분으로 나눈 partition","s 와 t 를 분리하는 간선 집합","spanning tree 에서 간선 하나 뺀 것"],"answer":1,"introCard":0},{"id":"u16a-02","type":"mc","q":"(global) minimum cut 이란?","explain":"'a cut that has the fewest edges possible crossing it.' 교수 11/19: 'it has a fewest edge'.","src":"16강 p.9 · 11/19 녹음","wiki":"global minimum cut","tags":["min cut"],"choices":["weight 합이 최소인 spanning tree","건너는 간선 수가 가장 적은 cut","정점 수가 가장 비슷한 두 부분","s–t 를 분리하는 cut"],"answer":1,"introCard":0},{"id":"u16a-03","type":"mc","q":"왜 'global' minimum cut 이라 부르나?","explain":"교수: 'Next time, we will focus on source and destination node for S and T.'","src":"16강 p.11 · 11/19 녹음","wiki":"global minimum cut","tags":["min cut"],"choices":["그래프 전체 간선을 쓰니까","지정된 s, t 가 없어서 — s 와 t 를 분리하는 min s–t cut(다음 시간)과 구별","weighted 라서","directed 라서"],"answer":1,"introCard":0},{"id":"u16a-04","type":"mc","q":"global min cut 의 응용은?","explain":"p.13–14. 오늘은 unweighted 지만 알고리즘은 weight 에 맞게 고칠 수 있다.","src":"16강 p.13–14","wiki":"global minimum cut","diff":1,"tags":["min cut"],"choices":["image segmentation (비슷한 픽셀 사이에 큰 weight)","패키지 설치 순서","압축","최단경로"],"answer":0,"introCard":0},{"id":"u16a-05","type":"match","q":"randomized algorithm 의 두 종류를 연결하시오","explain":"교수 11/19: '지금까지 본 알고리즘은 모두 Las Vegas. This is Monte Carlo algorithm.'","src":"16강 p.15–17 · 11/19 녹음","wiki":"Las Vegas와 Monte Carlo","prof":true,"tags":["randomized"],"pairs":[["Las Vegas","항상 맞다, 느릴 수 있다"],["Monte Carlo","항상 빠르다, 틀릴 수 있다"],["QuickSort","Las Vegas 의 예"],["Karger's algorithm","Monte Carlo 의 예"]]},{"id":"u16a-06","type":"tf","q":"Karger's algorithm 은 항상 최소 cut 을 돌려주지만, 실행 시간이 운에 따라 길어질 수 있다.","explain":"반대다. Monte Carlo: 항상 빠르고(확률 1 로 시간 bound) 틀릴 수 있다. 그런 설명은 QuickSort(Las Vegas).","src":"16강 p.15–17","wiki":"Las Vegas와 Monte Carlo","tags":["randomized","trap"],"answer":false,"introCard":0},{"id":"u16a-07","type":"mc","q":"Karger 처럼 틀릴 수도 있는 알고리즘을 쓰는 이유는?","explain":"p.15 'With high probability it won't be wrong. Maybe the losses are low and the cost of a deterministic algorithm is high.'","src":"16강 p.15","wiki":"Karger's algorithm","tags":["randomized"],"choices":["구현이 짧아서","높은 확률로 틀리지 않고, 손실은 작은데 deterministic 알고리즘의 비용이 클 수 있어서","항상 더 정확해서","메모리를 안 써서"],"answer":1,"introCard":1},{"id":"u16a-08","type":"order","q":"Karger's algorithm 의 동작을 순서대로","explain":"p.19 'Pick a random edge. Contract it. Repeat until you only have two vertices left.'","src":"16강 p.19–34 · 11/19 녹음","wiki":"Karger's algorithm","tags":["Karger"],"answer":["간선 하나를 uniformly random 하게 고른다","그 간선을 contract 해 두 끝점을 supernode 하나로 합친다 (사이 간선은 지우고 나머지는 superedge 로)","supernode 가 2개 남을 때까지 반복한다","남은 두 supernode 가 주는 cut 을 돌려준다"],"img":"img/algo16-p19-contract.png","imgAlt":"p.19 간선 a–b 를 골라(주사위) contract 해 supernode 하나로 합치는 그림","introCard":2},{"id":"u16a-09","type":"tf","q":"contract 할 때 합쳐지는 두 supernode 사이의 간선들은 모두 지운다 (self-loop 를 남기지 않는다).","explain":"의사코드 `F ← F ∖ E(ū, v̄)`: 두 supernode 사이 superedge 를 통째로 지운다. 다른 정점으로 가는 간선은 합쳐서 superedge 가 된다.","src":"16강 p.37","wiki":"super node와 contraction","tags":["Karger"],"answer":true,"introCard":2},{"id":"u16a-10","type":"num","q":"정점 n 개 그래프에서 Karger 의 while 루프(contraction)는 몇 번 도나? n = 8 일 때 답하시오.","explain":"contraction 한 번에 정점이 하나 준다. 2개가 남을 때까지 $n-2 = 6$ 번.","src":"16강 p.37–38","wiki":"super node와 contraction","tags":["Karger"],"answer":6,"tol":0,"introCard":2},{"id":"u16a-11","type":"mc","q":"Karger 한 번 실행의 수행 시간 (naive 구현) 은?","explain":"union-find 로 $O(m\\cdot\\alpha(n))$ 까지 줄일 수 있지만 오늘은 $O(n^2)$ 로 충분.","src":"16강 p.37–39","wiki":"Karger's algorithm","tags":["Karger","running time"],"choices":["$O(n)$","$O(n^2)$ — contraction n−2 번 × merge 한 번 $O(n)$","$O(m\\log n)$","$O(n^4)$"],"answer":1,"introCard":2},{"id":"u16a-12","type":"tf","q":"Karger 가 min cut 을 가로지르는 간선을 한 번이라도 contract 하면 그 min cut 은 돌려줄 수 없다.","explain":"그 간선의 양 끝이 한 supernode 가 되어 그 cut 의 양쪽으로 다시 나뉠 수 없다(p.42 'no way we could return a cut that separates b and e').","src":"16강 p.41–43","wiki":"super node와 contraction","tags":["Karger"],"answer":true,"explainImg":"img/algo16-p42-bad.png","introCard":3},{"id":"u16a-13","type":"num","q":"삼각형 a–b–c 에 c–d 가 붙은 그래프(간선 4개). min cut 은 {d} / 나머지로 크기 1 이다. Karger 의 **첫** contraction 이 min cut 간선을 피할 확률은? (소수로)","explain":"간선 4개 중 c–d 하나만 피하면 된다: 3/4.","src":"16강 p.43 (연습)","wiki":"super node와 contraction","tags":["Karger","probability"],"answer":0.75,"tol":0.001,"img":"img/algo16-gen-u16a-13.png","imgAlt":"삼각형 a–b–c 에 c–d 가 붙은 그래프","introCard":3},{"id":"u16a-14","type":"tf","q":"그림처럼 간선 하나 위에 빨간 점선을 그었다. 이것은 (정점을 두 부분으로 나누는 partition 이라는 정의로) cut 이다.","explain":"L16 의 cut 은 **정점** 집합을 nonempty 한 두 부분으로 나눈 partition 이다. 점선이 간선 하나를 자른다고 정점이 두 무리로 나뉘지 않는다. p.6 제목이 'This is not a cut' 이다. p.7 처럼 정점 두 개를 한쪽, 나머지를 다른 쪽으로 묶어야 cut 이다.","src":"16강 p.4–7","wiki":"global minimum cut","tags":["Karger","cut","그림"],"img":"img/algo16-p6-notcut.png","imgAlt":"p.6 8정점 그래프, 간선 하나 위에 짧은 빨간 점선","explainImg":"img/algo16-p7-cut.png","answer":false,"introCard":0},{"id":"u16a-15","type":"num","q":"그림의 cut 은 진한 두 정점 / 나머지 여섯 정점이다. 이 cut 을 건너는 간선은 몇 개인가?","explain":"진한 두 정점(아래 가운데 d, 위 f)에서 나가는 간선을 센다. d 는 a, b, c, e 와 이어져 4개, f 는 e, g, h 와 이어져 3개다. 두 정점 사이에는 간선이 없으니 7개가 모두 cut 을 건넌다(p.8 주황 간선).","src":"16강 p.7–8","wiki":"global minimum cut","tags":["Karger","cut","그림"],"img":"img/algo16-p7-cut.png","imgAlt":"p.7 8정점 그래프, 정점 두 개가 빨간 점선으로 묶여 있다","explainImg":"img/algo16-p8-cross-ans.png","answer":7,"tol":0,"introCard":0},{"id":"u16a-16","type":"num","q":"그림은 Karger 예제 그래프(정점 a~h, 간선 14개)다. global minimum cut 의 크기(건너는 간선 수)는?","explain":"{a, b, c, d} / {e, f, g, h} 로 나누면 b–e, d–e 두 간선만 건넌다. 모든 정점의 degree 가 3 이상이라 정점 하나만 떼어 내는 cut 은 3 이상이고, 다른 분할도 2 보다 작을 수 없다. p.35 'The minimum cut is given by {a,b,c,d} and {e,h,f,g}'.","src":"16강 p.20, 34–35","wiki":"global minimum cut","tags":["Karger","그림"],"img":"img/algo16-p20-karger.png","imgAlt":"p.20 정점 a~h, 간선 14개 그래프","explainImg":"img/algo16-p35-mincut-ans.png","answer":2,"tol":0,"introCard":0}],"intro":[{"title":"global minimum cut","body":"이 강의의 그래프는 undirected, unweighted. **cut** = 정점을 nonempty 한 두 부분으로 나눈 partition(간선에 선을 긋는 게 아니다). 건너는 간선이 가장 적은 cut 이 global min cut. 정해진 s, t 가 없어서 'global'(s–t cut 은 max flow 에서). 응용: image segmentation.","img":"img/algo16-p8-cross-ans.png","imgAlt":"cut 을 건너는 간선(주황)","src":"16강 p.4–14"},{"title":"Las Vegas vs Monte Carlo","body":"**Las Vegas**: 항상 맞고 느릴 수 있다(QuickSort). **Monte Carlo**: 항상 빠르고 틀릴 수 있다(Karger). 높은 확률로 맞고 deterministic 알고리즘보다 싸면 쓸 만하다.","src":"16강 p.15–17"},{"title":"Karger 의 contraction","body":"random edge 하나를 골라 **contract**: 두 끝점을 supernode 하나로 합치고, 둘 사이 간선은 지우고(self-loop 없음) 나머지는 superedge 로 남긴다. supernode 가 2 개 남을 때까지 반복($n-2$ 번), 남은 두 supernode 가 cut. naive 구현 $O(n^2)$.","img":"img/algo16-p19-contract.png","imgAlt":"간선 a–b 를 골라 supernode 로 합치기","src":"16강 p.19–39"},{"title":"예제 그래프와 실패","body":"정점 a~h, 간선 14개, min cut {a,b,c,d}/{e,f,g,h} (b–e, d–e 두 간선). min cut 을 건너는 간선을 한 번이라도 contract 하면 그 cut 은 영영 못 돌려준다.","img":"img/algo16-p35-mincut-ans.png","imgAlt":"예제 그래프와 min cut","src":"16강 p.20–43"}]},{"id":"u16b","title":"성공 확률과 반복으로 증폭하기","items":[{"id":"u16b-01","type":"num","q":"그림의 그래프(정점 8개, min cut 2개)에서 cut 을 완전히 무작위로 고르면 min cut 일 확률은 $\\frac{2}{2^8-2}$ 이다. 퍼센트로 대략 몇 % 인가? (소수 첫째 자리)","explain":"$2/254 \\approx 0.008$ = 0.8%. 10,000 번 실험한 Karger 는 약 20%.","src":"16강 p.46–48 · 11/19 녹음","wiki":"반복으로 성공 확률 올리기","tags":["Karger","probability"],"answer":0.8,"unit":"%","tol":0.05,"img":"img/algo16-p20-karger.png","imgAlt":"정점 a~h, 간선 14개 그래프 (min cut 은 b–e, d–e)","introCard":0},{"id":"u16b-02","type":"mc","q":"Karger 가 완전 무작위 cut 보다 훨씬 잘 맞는 이유는?","explain":"Thing 1: 작은 cut 일수록 안 건드려질 가능성이 크다. Thing 2: 연결이 끊긴 조각을 만드는 not-minimal cut 은 반환 불가.","src":"16강 p.49–50","wiki":"반복으로 성공 확률 올리기","tags":["Karger"],"choices":["min cut 은 간선이 적어 그 간선을 끝까지 안 고를 확률이 큰 cut 보다 높고, contraction 은 정말 크고 이상한 cut 은 아예 내지 못하기 때문","heap 을 써서","cut 을 정렬해서","DFS 로 검사해서"],"answer":0,"introCard":0},{"id":"u16b-03","type":"mc","q":"성공 확률 20% 짜리 Monte Carlo 알고리즘의 성공 확률을 올리는 핵심 방법은?","explain":"'Just repeat this algorithm several times … That is the core of Monte Carlo algorithm.' 100% 는 아니어도 확률 보장(probability guarantee)을 줄 수 있다.","src":"16강 p.51 · 11/19 녹음","wiki":"반복으로 성공 확률 올리기","prof":true,"tags":["Karger","randomized"],"choices":["알고리즘을 더 복잡하게","독립적으로 여러 번 반복하고 가장 좋은 답을 고른다","deterministic 으로 바꾼다","확률을 무시한다"],"answer":1,"introCard":1},{"id":"u16b-04","type":"num","q":"한 번 성공 확률이 0.2 일 때, 성공할 때까지 누르는 버튼 횟수의 기댓값은?","explain":"geometric: $E = 1/p = 1/0.2 = 5$. 교수 'magic button' 예.","src":"16강 p.52–53 · 11/19 녹음","wiki":"반복으로 성공 확률 올리기","tags":["probability"],"answer":5,"tol":0,"introCard":1},{"id":"u16b-05","type":"num","q":"성공 확률 0.2 인 시행을 독립적으로 10 번 했는데 한 번도 성공하지 못할 확률은? (소수 둘째 자리)","explain":"$(1-0.2)^{10} = 0.8^{10} \\approx 0.107$. 슬라이드는 ≈ 0.1, 5 번이면 $0.8^5 \\approx 0.33$.","src":"16강 p.53","wiki":"반복으로 성공 확률 올리기","tags":["probability"],"answer":0.11,"tol":0.05,"introCard":1},{"id":"u16b-06","type":"num","q":"그림의 그래프에서 Karger 한 번의 성공률은 약 20%, 완전 무작위 cut 은 약 0.8% 다. 무작위 cut 으로 Karger 5 번과 비슷한 효과를 보려면 대략 몇 번 골라야 하나?","explain":"$1/0.008 = 125$. 교수: 'Compare five times and 125 times. 20 percent of success rate is actually very high.'","src":"16강 p.55 · 11/19 녹음","wiki":"반복으로 성공 확률 올리기","tags":["Karger","probability"],"answer":125,"tol":0.02,"img":"img/algo16-p20-karger.png","imgAlt":"정점 a~h, 간선 14개 그래프 (min cut 은 b–e, d–e)","introCard":0},{"id":"u16b-07","type":"mc","q":"Claim: 정점 n 개 그래프에서 Karger 한 번이 min cut 을 돌려줄 확률은?","explain":"p.57. (p.58·62 의 'at most' 는 오타 — Claim 과 증명은 at least.) n = 8 이면 1/28 ≈ 3.6%.","src":"16강 p.57 · 11/19 녹음","wiki":"Karger 성공 확률 증명","tags":["Karger","probability"],"choices":["정확히 1/2","**at least** $1/\\binom{n}{2}$","at most $1/\\binom{n}{2}$","at least $1/n$"],"answer":1,"introCard":2},{"id":"u16b-08","type":"num","q":"n = 8 일 때 Claim 이 보장하는 Karger 한 번의 성공 확률 하한 $1/\\binom{8}{2}$ 은? (소수 셋째 자리)","explain":"$\\binom{8}{2} = 28$, $1/28 \\approx 0.0357$. 실험값 20% 는 이 그래프에 한정된 empirical 값이다.","src":"16강 p.57","wiki":"Karger 성공 확률 증명","tags":["Karger","probability"],"answer":0.036,"tol":0.03,"introCard":2},{"id":"u16b-09","type":"tf","q":"Karger 의 '성공률 20%' 는 특정 그래프에서 실험으로 얻은 값이라 일반 그래프에는 그대로 쓸 수 없다. 그래서 일반적인 하한 $1/\\binom{n}{2}$ 을 증명해야 한다.","explain":"'This 20 percent is only valid for this particular graph … Empirically calculate it.'","src":"16강 p.55 · 11/19 녹음","wiki":"Karger 성공 확률 증명","prof":true,"tags":["Karger"],"answer":true,"introCard":2},{"id":"u16b-10","type":"cloze","q":"성공 확률 p 인 Monte Carlo 를 독립적으로 T 번 돌려 모두 실패할 확률은 $(1-p)^T \\le$ ___ 이다. $T = \\frac{1}{p}\\ln\\frac{1}{\\delta}$ 로 잡으면 이 값은 ___ 가 된다.","explain":"$1 - p \\le e^{-p}$ 를 쓴다. Karger 는 $p = 1/\\binom{n}{2}$ 라 $T = \\binom{n}{2}\\ln(1/\\delta)$.","src":"16강 p.60","wiki":"반복으로 성공 확률 올리기","tags":["Karger","probability"],"answer":["e^(−pT)","δ"],"bank":["e^(−pT)","δ","1−pT","p","1/δ"],"introCard":1},{"id":"u16b-11","type":"num","q":"n = 10, 실패 확률 δ = 0.01 을 원할 때 필요한 반복 횟수 $T = \\binom{n}{2}\\ln(1/\\delta)$ 는? (소수 첫째 자리까지)","explain":"$\\binom{10}{2} = 45$, $\\ln 100 \\approx 4.605$ → $45 \\times 4.605 \\approx 207.2$.","src":"16강 p.60–62 (연습)","wiki":"반복으로 성공 확률 올리기","tags":["Karger","probability"],"answer":207.2,"tol":0.01,"introCard":2},{"id":"u16b-12","type":"mc","q":"Karger 를 $\\binom{n}{2}\\ln(1/\\delta)$ 번 반복하는 알고리즘의 전체 수행 시간은? (δ 는 상수)","explain":"반복 $O(n^2)$ 번 × 한 번 $O(n^2)$ = $O(n^4)$, 확률 0.99 이상으로 min cut.","src":"16강 p.63–64","wiki":"반복으로 성공 확률 올리기","tags":["Karger","running time"],"choices":["$O(n^2)$","$O(n^3)$","$O(n^4)$","$O(n^2\\log n)$"],"answer":2,"introCard":2},{"id":"u16b-13","type":"tf","q":"성공 확률이 작은 Monte Carlo 알고리즘이라도 여러 번 반복해 가장 좋은 해를 고르면 성공 확률을 원하는 만큼 높일 수 있다.","explain":"p.75 'More generally'. 각 시행이 독립이라는 게 전제.","src":"16강 p.75","wiki":"반복으로 성공 확률 올리기","tags":["randomized"],"answer":true,"introCard":1},{"id":"u16b-14","type":"num","q":"그림의 그래프(간선 14개, min cut 간선 b–e, d–e)에서 Karger 의 **첫** contraction 이 min cut 간선을 피할 확률은? (소수 셋째 자리)","explain":"간선을 uniformly random 하게 하나 고르니 $\\Pr = \\frac{14-2}{14} = \\frac{12}{14} \\approx 0.857$. 일반 하한 식 $1 - \\frac{k}{nk/2} = 1 - \\frac{2}{n} = \\frac{6}{8} = 0.75$ 보다 크다. 이 그래프의 간선 수 14 가 하한에 쓴 $nk/2 = 8$ 보다 많기 때문이다. 하한은 '최악의 그래프에서도' 성립하는 값이다.","src":"16강 p.20, 66–69","wiki":"Karger 성공 확률 증명","tags":["Karger","그림"],"img":"img/algo16-p20-karger.png","imgAlt":"p.20 정점 a~h, 간선 14개 그래프","answer":0.857,"tol":0.002},{"id":"u16b-15","type":"num","q":"그림에서 random edge 로 a–b 가 뽑혔다. contract 한 뒤 그래프에 남는 간선(superedge 안의 원래 간선을 하나씩 셈)은 몇 개인가?","explain":"a 와 b 사이 간선은 a–b 하나뿐이라 그것만 사라지고 나머지 13 개는 superedge 로 묶여 남는다. 예를 들어 {a,b}–d 사이 superedge 에는 {d,a}, {d,b} 두 간선이 들어간다(p.23). 두 supernode 사이 간선이 여러 개였다면 그 전부가 지워진다(self-loop 를 남기지 않는다).","src":"16강 p.21–23, 37","wiki":"super node와 contraction","tags":["Karger","그림"],"img":"img/algo16-p21-random.png","imgAlt":"p.21 Karger 예제 그래프에서 a–b 간선이 random edge 로 표시됨","explainImg":"img/algo16-p23-super-ans.png","answer":13,"tol":0}],"intro":[{"title":"무작위 cut 보다 낫다","body":"예제에서 Karger 한 번은 약 20% 성공, 완전 무작위 cut 은 $2/(2^8-2) \\approx 0.8\\%$. min cut 은 간선이 적어 끝까지 안 고를 확률이 크고, contraction 은 크고 이상한 cut 은 아예 만들지 못한다.","src":"16강 p.44–50"},{"title":"반복으로 증폭","body":"성공 확률 p 를 독립으로 T 번 반복해 가장 좋은 답을 고르면 실패 확률 $(1-p)^T \\le e^{-pT}$. $T = \\frac1p \\ln\\frac1\\delta$ 면 δ 이하. 첫 성공까지 기대 횟수는 $1/p$ (p = 0.2 면 5번).","src":"16강 p.51–60"},{"title":"일반 하한과 Theorem","body":"Claim: Karger 한 번이 min cut 을 돌려줄 확률은 **at least** $1/\\binom{n}{2}$ (n = 8 이면 0.036). 그러니 $\\binom n2 \\ln\\frac1\\delta$ 번 반복 × 한 번 $O(n^2)$ = $O(n^4)$ 로 확률 $1-\\delta$ (예: 0.99).","src":"16강 p.57–64"}]},{"id":"u16c","title":"Claim 증명: $1/\\binom{n}{2}$","items":[{"id":"u16c-01","type":"mc","q":"Claim 증명에서 $\\Pr[\\text{return } S^*]$ 를 어떻게 쓰나? ($e_1, \\dots, e_{n-2}$ = contract 한 간선)","explain":"$\\Pr[e_1 \\text{ 안 건넘}] \\times \\Pr[e_2 \\text{ 안 건넘} \\mid e_1 \\text{ 안 건넘}] \\times \\cdots$ (chain rule).","src":"16강 p.66","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"choices":["각 $e_i$ 가 $S^*$ 를 건너지 않을 조건부 확률들의 곱","각 간선의 확률 합","$1 - (n-2)/m$","$k/m$"],"answer":0,"introCard":0},{"id":"u16c-02","type":"order","q":"j 번째 contraction 에서 '망칠' 확률의 상한 논증을 순서대로","explain":"supernode 하나를 한쪽으로 떼는 cut 도 cut 이라 그 degree 가 k 보다 작을 수 없다.","src":"16강 p.67–69","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"answer":["min cut $S^*$ 를 건너는 간선이 k 개라 하자","j−1 번 동안 안 망쳤다면 남은 supernode 는 n−j+1 개이고, 모두 degree ≥ k 다 (아니면 더 작은 cut)","그래서 남은 간선은 적어도 $(n-j+1)k/2$ 개","$S^*$ 의 간선을 고를 확률 ≤ $\\frac{k}{(n-j+1)k/2} = \\frac{2}{n-j+1}$"]},{"id":"u16c-03","type":"tf","q":"Karger 진행 중 남은 모든 supernode 의 degree 는 min cut 크기 k 이상이다.","explain":"supernode 하나 대 나머지도 하나의 cut 이다. degree 가 k 보다 작으면 더 작은 cut 이 있다는 뜻이라 모순.","src":"16강 p.68","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"answer":true,"introCard":1},{"id":"u16c-04","type":"num","q":"supernode 가 7개 남았을 때(n−j+1 = 7), 이번 contraction 이 $S^*$ 를 건드리지 **않을** 확률의 하한은? (분수 → 소수 셋째 자리)","explain":"$1 - \\frac{2}{7} = \\frac{5}{7} \\approx 0.714$. 일반식 $\\frac{n-j-1}{n-j+1}$.","src":"16강 p.69 (연습)","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"answer":0.714,"tol":0.01,"introCard":1},{"id":"u16c-05","type":"cloze","q":"$\\Pr[\\text{return } S^*] \\ge \\frac{n-2}{n}\\cdot\\frac{n-3}{n-1}\\cdots\\frac{2}{4}\\cdot\\frac{1}{3} =$ ___ $= 1/$ ___","explain":"telescoping: 분자와 분모가 두 칸씩 어긋나 지워지고 분모 n(n−1), 분자 2·1 만 남는다.","src":"16강 p.71–72","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"answer":["2/(n(n−1))","C(n,2)"],"bank":["2/(n(n−1))","C(n,2)","1/n","2/n","n!"],"introCard":0},{"id":"u16c-06","type":"mc","q":"telescoping 곱 $\\prod_{j=1}^{n-2}\\frac{n-j-1}{n-j+1}$ 에서 끝까지 살아남는 것은?","explain":"분자 (n−2)(n−3)…1, 분모 n(n−1)…3. 공통인 (n−2)…3 이 지워진다.","src":"16강 p.72","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"choices":["분자 2·1, 분모 n(n−1)","분자 1, 분모 n","분자 n−2, 분모 n","아무것도 안 지워진다"],"answer":0,"introCard":2},{"id":"u16c-07","type":"num","q":"n = 5 일 때 $\\frac{3}{5}\\cdot\\frac{2}{4}\\cdot\\frac{1}{3}$ 의 값은? (소수 첫째 자리)","explain":"$= \\frac{6}{60} = \\frac{1}{10} = 1/\\binom{5}{2}$.","src":"16강 p.71–72 (연습)","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"answer":0.1,"tol":0.001,"introCard":2},{"id":"u16c-08","type":"mc","q":"Karger 를 반복하는 알고리즘에 대한 최종 Theorem 은?","explain":"δ = 0.01 은 구체성을 위해 고른 값. union-find 를 쓰면 더 빠르다.","src":"16강 p.64, 73–74","wiki":"Karger 성공 확률 증명","tags":["Karger"],"choices":["항상 min cut 을 $O(n^2)$ 에","확률 0.99 이상으로 global min cut 을 $O(n^4)$ 에 찾는다","기대 시간 $O(n\\log n)$","min s–t cut 을 찾는다"],"answer":1,"introCard":2},{"id":"u16c-09","type":"tf","q":"Karger 는 성공 확률을 높이려 반복할 때 각 실행이 서로 독립이어야 $(1-p)^T$ 계산이 맞다.","explain":"p.60 'Independent'. 매 실행 새 random choice 를 쓴다.","src":"16강 p.60","wiki":"Karger 성공 확률 증명","tags":["Karger","probability"],"answer":true,"introCard":2},{"id":"u16c-10","type":"mc","q":"min cut 을 건너는 간선이 k 개이고 supernode 가 r 개 남았을 때, 남은 간선 수의 하한은?","explain":"degree 합 ≥ rk 이고 간선 하나가 degree 두 개를 차지하니 간선 ≥ rk/2.","src":"16강 p.68","wiki":"Karger 성공 확률 증명","tags":["Karger","proof"],"choices":["$rk$","$rk/2$","$k$","$r(r-1)/2$"],"answer":1,"introCard":1},{"id":"u16c-11","type":"tf","q":"Karger 알고리즘은 그래프가 unweighted(그리고 undirected)라고 가정한다.","explain":"'For today, all graphs are undirected and unweighted.' weight 가 있어도 알고리즘은 고칠 수 있다(p.14 주석).","src":"16강 p.4, 14","wiki":"Karger 성공 확률 증명","diff":1,"tags":["Karger"],"answer":true,"introCard":2},{"id":"u16c-12","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) Karger 는 Monte Carlo 알고리즘이다 (2) QuickSort 는 Las Vegas 알고리즘이다 (3) Karger 한 번이 min cut 을 돌려줄 확률은 적어도 $1/\\binom{n}{2}$ (4) Karger 를 $\\binom{n}{2}\\ln(1/\\delta)$ 번 반복하면 실패 확률이 $\\delta$ 이하다 (5) Karger 는 weighted directed graph 의 min s–t cut 을 구한다","explain":"(1) 참: 항상 빠르고 틀릴 수 있다. (2) 참: 항상 맞고 느릴 수 있다. (3) 참: Claim. (4) 참: $(1-p)^T \\le e^{-pT} = \\delta$. (5) 거짓: L16 은 undirected·unweighted 의 **global** min cut 이다. s–t cut 은 L17(max flow)에서 다룬다. 중간 i.i 처럼 '확률 $p$' 와 '반복 횟수 $1/p$' 를 섞지 않도록 조심.","src":"16강 p.4, 15–17, 57–64 · 중간 1번 형식","wiki":"Karger 성공 확률 증명","tags":["Karger","circle-all"],"choices":["(1)(2)(3)(4)","(1)(2)(3)","(1)(3)(4)","(1)(2)(3)(4)(5)"],"answer":0},{"id":"u16c-13","type":"cloze","q":"[분석 템플릿 칸] 반복 Karger: 반복 횟수 ___ × 한 번 실행 ___ $= O(n^4)$ (δ 는 상수).","explain":"$\\binom{n}{2} = O(n^2)$ 번 반복하고, 한 번은 contraction $n-2$ 번 × merge $O(n)$ 이라 $O(n^2)$. 곱해서 $O(n^4)$. union-find 를 쓰면 한 번 실행을 더 줄일 수 있다(p.63). 중간 i.i 의 '$E[\\text{시행 횟수}] = 1/p$' 와 같은 계산이 여기서는 $1/p = \\binom{n}{2}$ 이다.","src":"16강 p.60–64","wiki":"반복으로 성공 확률 올리기","tags":["Karger","running time","analysis"],"answer":["C(n,2)·ln(1/δ)","O(n^2)"],"bank":["C(n,2)·ln(1/δ)","O(n^2)","n","O(n)","1/δ"]}],"intro":[{"title":"곱으로 쓰기","body":"min cut $S^*$, contract 한 간선 $e_1..e_{n-2}$. $\\Pr[\\text{return } S^*] = \\prod_j \\Pr[e_j \\text{ 가 } S^* \\text{ 를 안 건넘} \\mid \\text{앞에서 안 망침}]$.","src":"16강 p.66"},{"title":"j 번째에 망칠 확률","body":"$S^*$ 를 건너는 간선 k 개. j−1 번 안 망쳤으면 supernode 가 $n-j+1$ 개이고 모두 degree ≥ k (아니면 더 작은 cut 이 있다) → 간선 ≥ $(n-j+1)k/2$. 그래서 망칠 확률 ≤ $\\frac{k}{(n-j+1)k/2} = \\frac{2}{n-j+1}$, 안 망칠 확률 ≥ $\\frac{n-j-1}{n-j+1}$.","src":"16강 p.67–69"},{"title":"telescoping","body":"$\\frac{n-2}{n}\\cdot\\frac{n-3}{n-1}\\cdots\\frac{2}{4}\\cdot\\frac13 = \\frac{2}{n(n-1)} = 1/\\binom n2$. 분자 2·1, 분모 n(n−1) 만 남는다. 반복할 때 각 실행이 독립이어야 $(1-p)^T$ 가 맞다.","src":"16강 p.70–74"}]}]},{"id":"u17","title":"17강 Advanced II (Max flow)","desc":"min s–t cut · max flow · residual graph · Ford-Fulkerson · 응용 (11/24 수업: p.1–53, 그 뒤는 슬라이드 기준)","lessons":[{"id":"u17a","title":"s–t cut 과 flow 정의","items":[{"id":"u17a-01","type":"mc","q":"최대 유량(max flow) 문제에서 쓰는 그래프(flow network)의 설정으로 옳은 것은?","explain":"L16 은 undirected·unweighted 의 global min cut, L17 은 directed·capacity 의 s–t cut. s 는 나가는 간선만, t 는 들어오는 간선만(이 수업 가정).","src":"17강 p.3–4","tags":["flow"],"choices":["undirected, unweighted","directed, 간선마다 capacity, 특별한 source s 와 sink t","undirected, weighted, s 없음","DAG 만"],"answer":1,"wiki":"L17 Advanced Algorithms II","introCard":0},{"id":"u17a-02","type":"mc","q":"s–t cut 의 cost(capacity) 는?","explain":"'An edge crosses the cut if it goes from s's side to t's side.' 반대 방향 간선은 세지 않는다(p.8 'going in the wrong direction').","src":"17강 p.6–8","tags":["cut","flow"],"choices":["cut 을 건너는 모든 간선 capacity 의 합 (방향 무관)","s 쪽 → t 쪽으로 건너는 간선의 capacity 합","t 쪽 → s 쪽 간선의 합","건너는 간선 수"],"answer":1,"wiki":"s-t cut","introCard":0},{"id":"u17a-03","type":"num","q":"G: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity). s 쪽 = {s, b}, t 쪽 = {a, t} 인 s–t cut 의 cost 는?","explain":"s→a 4 + b→t 5 = 9. a→b 3 은 t 쪽 → s 쪽이라 세지 않는다.","src":"17강 p.8 (연습)","tags":["cut","flow","trace"],"answer":9,"tol":0,"wiki":"s-t cut","img":"img/algo17-gen-u17a-03.png","imgAlt":"flow network: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity)","introCard":0},{"id":"u17a-04","type":"num","q":"G: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity). min s–t cut 의 cost 는?","explain":"{s}: 4 + 2 = 6, {s, a}: 2 + 3 + 1 = 6, {s, a, b}: 1 + 5 = 6, {s, b}: 9. 최소 6.","src":"17강 p.9 (연습)","tags":["cut","flow","trace"],"answer":6,"tol":0,"wiki":"s-t cut","img":"img/algo17-gen-u17a-03.png","imgAlt":"flow network: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity)","introCard":0},{"id":"u17a-05","type":"tf","q":"s–t cut 의 cost 를 셀 때, t 쪽에서 s 쪽으로 가는 간선의 capacity 도 더한다.","explain":"p.8: 'this edge does not cross the cut; it's going in the wrong direction.'","src":"17강 p.8","tags":["cut","trap"],"answer":false,"wiki":"s-t cut","introCard":0},{"id":"u17a-06","type":"cloze","q":"flow 의 두 조건: 간선마다 flow ≤ ___ , 그리고 s, t 를 뺀 각 정점에서 들어오는 flow = ___ flow.","explain":"conservation of flow. 예: 4 units in, 1+1+2 = 4 units out.","src":"17강 p.11","tags":["flow"],"answer":["capacity","나가는"],"bank":["capacity","나가는","0","들어오는","weight 합"],"wiki":"flow","introCard":1},{"id":"u17a-07","type":"mc","q":"flow 의 value 는?","explain":"보존 법칙 때문에 넣은 양 = 빼는 양. 슬라이드 예의 flow value 는 4, 최대는 11.","src":"17강 p.12–14","tags":["flow"],"choices":["모든 간선 flow 의 합","s 에서 나오는 양 (= t 로 들어가는 양)","capacity 의 합","가장 큰 간선 flow"],"answer":1,"wiki":"flow","introCard":1},{"id":"u17a-08","type":"mc","q":"1955 년 Ford 와 Fulkerson 이 RAND 에서 풀었던 실제 문제는?","explain":"1999 년 기밀 해제된 지도. 'The USSR and the USA were trying to solve the same problem…'","src":"17강 p.10, 54","diff":1,"tags":["flow"],"choices":["인터넷 routing","소련–동유럽 철도망의 bottleneck 을 가장 효율적으로 끊는 것 (최적 s–t cut)","패키지 의존성","DNA 비교"],"answer":1,"wiki":"L17 Advanced Algorithms II","introCard":2},{"id":"u17a-09","type":"tf","q":"max-flow min-cut theorem: s 에서 t 로의 max flow 의 value 는 min s–t cut 의 cost 와 같다.","explain":"직관: max flow 에서는 bottleneck 이 꽉 찬다.","src":"17강 p.15","tags":["flow"],"answer":true,"wiki":"max-flow min-cut theorem","introCard":0},{"id":"u17a-10","type":"num","q":"그림의 flow network(간선 숫자 = capacity)에서 s 에서 t 로의 max flow value 는?","explain":"Ford-Fulkerson 을 끝까지 돌리면 value 11 이 나오고(p.52–53), 마지막 residual graph 에서 s 로부터 도달 가능한 정점을 한쪽으로 묶은 cut 의 cost 가 $4 + 3 + 4 = 11$ 이다. max flow = min cut 이 실제로 확인된다. t 로 들어가는 간선 capacity 합 $4+4+4 = 12$ 는 상한일 뿐 답이 아니다.","src":"17강 p.9, 14, 53","tags":["flow"],"answer":11,"tol":0,"explainImg":"img/algo17-p53-ff-ans.png","img":"img/algo17-p5-graph.png","imgAlt":"p.5 s–t 예제 그래프: 정점 8개, 간선 capacity 표시","wiki":"max-flow min-cut theorem","introCard":1},{"id":"u17a-11","type":"num","q":"G: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity). max flow value 는?","explain":"max-flow min-cut theorem 으로 min cut 6 과 같다. 예: s→a→t 1, s→a→b→t 3, s→b→t 2.","src":"17강 p.15 (연습)","tags":["flow","trace"],"answer":6,"tol":0,"wiki":"max-flow min-cut theorem","img":"img/algo17-gen-u17a-03.png","imgAlt":"flow network: s→a 4, s→b 2, a→b 3, a→t 1, b→t 5 (capacity)","introCard":1},{"id":"u17a-12","type":"num","q":"그림은 flow network 의 capacity(간선 숫자)와 현재 flow(네모 안 숫자)다. 이 그래프의 max flow value 는?","explain":"지금 flow 의 value 는 s 에서 나가는 $3 + 1 = 4$. residual graph 에 s→a→b→t (residual 1, 5, 1) 가 남아 있어 1 을 더 보낼 수 있다(p.24). 보내고 나면 a→t, b→t 가 포화돼 s 에서 t 로 갈 수 없다. cut {s, a, b} / {t} 의 cost 가 $2 + 3 = 5$ 라 max flow = min cut = 5.","src":"17강 p.21–26","wiki":"max-flow min-cut theorem","tags":["flow","그림"],"img":"img/algo17-p21-flow.png","imgAlt":"p.21 s, a, b, t 그래프: capacity s→a 4, s→b 8, a→b 6, a→t 2, b→t 3 와 flow 3, 1, 1, 2, 2","explainImg":"img/algo17-p26-final-ans.png","answer":5,"tol":0,"introCard":1},{"id":"u17a-13","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) max flow value = min s–t cut cost (2) s–t cut 의 cost 에는 t 쪽 → s 쪽 간선의 capacity 도 더한다 (3) BFS 로 path 를 고르는 Ford-Fulkerson 은 $O(nm^2)$ (4) capacity 가 모두 정수면 정수 max flow 가 있다 (5) residual graph 의 backward 간선 weight 는 $c - f$ 다","explain":"(1) 참: max-flow min-cut theorem. (2) 거짓: s 쪽에서 t 쪽으로 가는 간선만 센다(p.8). (3) 참: Edmonds-Karp(증명은 시험 범위 밖). (4) 참: Ford-Fulkerson 의 update 가 정수끼리 더하고 빼기만 한다(p.64). (5) 거짓: forward 가 남은 양 $c - f$, backward 가 쓴 양 $f$ 다.","src":"17강 p.8, 15, 21, 63–64 · 중간 1번 형식","wiki":"max-flow min-cut theorem","tags":["flow","circle-all"],"choices":["(1)(3)(4)","(1)(2)(3)(4)","(1)(4)","(1)(3)(4)(5)"],"answer":0,"introCard":0}],"intro":[{"title":"flow network 와 s–t cut","body":"directed graph, 간선마다 **capacity**, 특별한 **source s** 와 **sink t**. **s–t cut** 은 s 와 t 를 갈라놓는 cut 이고, cost 는 **s 쪽 → t 쪽**으로 건너는 간선의 capacity 합(반대 방향은 안 센다). 이 cost 가 최소인 것이 min s–t cut.","img":"img/algo17-p5-graph.png","imgAlt":"s 에서 t 로 가는 capacity 그래프","src":"17강 p.3–9"},{"title":"flow","body":"간선마다 $0 \\le f \\le$ capacity, s·t 를 뺀 정점에서 들어오는 양 = 나가는 양. flow 의 **value** = s 에서 나가는 양 = t 로 들어가는 양. max flow = value 최대인 flow.","src":"17강 p.11–14"},{"title":"max-flow min-cut theorem","body":"s→t max flow 의 value = min s–t cut 의 cost. 예제 그래프는 둘 다 11. 1955 년 RAND 가 소련–동유럽 철도망의 bottleneck 을 끊는 문제(최적 s–t cut)로 다뤘다.","img":"img/algo17-p53-ff-ans.png","imgAlt":"Ford-Fulkerson 이 끝난 상태와 min cut","src":"17강 p.10, 15"}]},{"id":"u17b","title":"residual graph 와 Ford-Fulkerson","items":[{"id":"u17b-01","type":"mc","q":"Lemma 1 (max flow ≤ min cut) 의 내용은?","explain":"'All that stuff has to cross the cut at some point.' proof-by-picture.","src":"17강 p.17–18","tags":["flow","proof"],"choices":["어떤 flow 든 어떤 s–t cut 이든 flow value ≤ cut cost","max flow 는 항상 정수","min cut 은 유일","flow 는 cut 을 한 번만 건넌다"],"answer":0,"wiki":"max-flow min-cut theorem","introCard":2},{"id":"u17b-02","type":"tf","q":"max-flow min-cut 의 Lemma 1(flow ≤ cut)은 결과만 쓰면 되고, 그 엄밀한 증명(CLRS Lemma 26.4)은 기말 범위가 아니다.","explain":"'You are not responsible for proof-by-proof on the final.' proof-by-picture 는 알아 둔다.","src":"17강 p.18","prof":true,"tags":["flow","exam"],"answer":true,"wiki":"max-flow min-cut theorem","introCard":2},{"id":"u17b-03","type":"mc","q":"residual graph $G_f$ 에서 원래 간선 (u,v) (capacity c, flow f) 가 만드는 두 간선은?","explain":"'Forward edges are the amount that's left. Backwards edges are the amount that's been used.'","src":"17강 p.21–22","tags":["residual"],"choices":["forward u→v 에 c, backward v→u 에 c","forward u→v 에 c − f(남은 양), backward v→u 에 f(쓴 양)","forward 에 f, backward 에 c − f","forward 만 c − f"],"answer":1,"wiki":"residual graph","introCard":1},{"id":"u17b-04","type":"num","q":"capacity 5, flow 3 인 간선 u→v. residual graph 의 backward 간선 v→u 의 weight 는?","explain":"backward = 이미 쓴 양 3. forward u→v 는 5 − 3 = 2.","src":"17강 p.21 (연습)","tags":["residual","trace"],"answer":3,"tol":0,"wiki":"residual graph","introCard":1},{"id":"u17b-05","type":"cloze","q":"Lemma: $G_f$ 에서 s 로부터 t 에 도달할 수 ___ ⇔ f 는 max flow. s→t path 가 있으면 그걸 ___ path 라 부른다.","explain":"⇐ 는 대우: augmenting path 로 flow 를 늘릴 수 있으니 max 가 아니다. ⇒ 는 reachable 집합 cut 으로.","src":"17강 p.23, 28","tags":["residual","proof"],"answer":["없다","augmenting"],"bank":["없다","augmenting","있다","shortest","Hamiltonian"],"wiki":"augmenting path","introCard":2},{"id":"u17b-06","type":"order","q":"increaseFlow(P, f) 의 동작을 순서대로","explain":"backward 간선을 따라가면 그 원래 간선의 flow 를 **줄인다** — 모든 간선을 늘리면 conservation 이 깨진다(p.31).","src":"17강 p.30–35","tags":["residual","pseudocode"],"answer":["x = P 위 간선 weight 의 최솟값","P 의 각 (u,v) 가 원래 간선이면 f'(u,v) = f(u,v) + x","(v,u) 가 원래 간선(즉 backward)이면 f'(v,u) = f(v,u) − x","f' 를 돌려주고 $G_f$ 를 갱신한다"],"wiki":"augmenting path","introCard":2},{"id":"u17b-07","type":"mc","q":"augmenting path 가 backward 간선을 지날 때 하는 일은?","explain":"p.32 'We will remove flow here, since our augmenting path is going backwards along this edge.' 결과는 여전히 legit 하고 value 가 x 만큼 크다.","src":"17강 p.32–34","tags":["residual"],"choices":["그 간선 flow 를 늘린다","그 원래 간선의 flow 를 x 만큼 줄인다 (보낸 걸 되돌린다)","무시한다","알고리즘을 멈춘다"],"answer":1,"wiki":"augmenting path","introCard":2},{"id":"u17b-08","type":"mc","q":"Lemma ⇒ 방향(도달 불가 → max flow)에서 쓰는 cut 은?","explain":"그 cut 의 간선은 $G_f$ 에 없으니 꽉 차 있다 → flow value = 이 cut cost ≥ min cut ≥ max flow → 같다.","src":"17강 p.38–40","tags":["residual","proof"],"choices":["{s}, 나머지","{$G_f$ 에서 s 로부터 reachable}, {not reachable}","무작위 cut","{V − t}, {t}"],"answer":1,"wiki":"max-flow min-cut theorem","introCard":2},{"id":"u17b-09","type":"order","q":"Ford-Fulkerson 을 순서대로","explain":"끝나면 f 가 max flow, s 쪽 reachable 집합이 min cut.","src":"17강 p.41","tags":["Ford-Fulkerson"],"answer":["f ← 모두 0 인 flow, $G_f$ ← G","$G_f$ 에서 s 로부터 t 에 도달할 수 있는 동안 반복","s→t path P 를 찾는다 (예: BFS)","f ← increaseFlow(P, f) 하고 $G_f$ 를 갱신"],"wiki":"Ford-Fulkerson","introCard":3},{"id":"u17b-10","type":"tf","q":"Ford-Fulkerson 은 path 를 아무렇게나 골라도 끝나기만 하면 정답이다. 다만 오래 걸리거나 끝나지 않을 수도 있다.","explain":"p.42 'the algorithm will be correct if it terminates … may not be efficient!!!'","src":"17강 p.42","tags":["Ford-Fulkerson"],"answer":true,"wiki":"Ford-Fulkerson","introCard":3},{"id":"u17b-11","type":"num","q":"G: s→a 3, s→b 2, a→b 1, a→t 2, b→t 3. Ford-Fulkerson 이 끝났을 때 max flow value 는?","explain":"s 에서 나가는 capacity 가 3 + 2 = 5 이고, s→a→t 2, s→b→t 2, s→a→b→t 1 로 다 채운다. min cut {s} = 5.","src":"17강 p.43–53 (연습)","tags":["Ford-Fulkerson","trace"],"answer":5,"tol":0,"wiki":"Ford-Fulkerson","img":"img/algo17-gen-u17b-11.png","imgAlt":"flow network: s→a 3, s→b 2, a→b 1, a→t 2, b→t 3 (capacity)","introCard":3},{"id":"u17b-12","type":"mc","q":"그림 왼쪽은 flow network 의 capacity 와 flow, 오른쪽은 그 flow 로 만든 residual graph $G_f$ 다. 가린 ① s→b (forward), ② b→s (backward), ③ a→b (forward) 의 weight 는?","explain":"원래 간선 (u,v) 에 capacity $c$, flow $f$ 가 있으면 forward u→v 는 남은 양 $c - f$, backward v→u 는 쓴 양 $f$ 다. ① s→b: $8 - 1 = 7$. ② b→s: $f(s,b) = 1$. ③ a→b: $6 - 1 = 5$. ①과 ②를 더하면 항상 capacity 8 이 된다.","src":"17강 p.21–22","wiki":"residual graph","tags":["residual","그림"],"img":"img/algo17-p21-residual.png","imgAlt":"p.21 왼쪽 flow 그래프와 오른쪽 residual graph, 세 weight 가 ①②③ 으로 가려져 있다","explainImg":"img/algo17-p21-residual-ans.png","choices":["① 7, ② 1, ③ 5","① 8, ② 1, ③ 6","① 1, ② 7, ③ 1","① 7, ② 8, ③ 5"],"answer":0,"introCard":1},{"id":"u17b-13","type":"tf","q":"그림은 augmenting path 로 1 을 더 보낸 뒤의 flow(왼쪽)와 residual graph(오른쪽)다. 이 residual graph 에서 s 로부터 t 에 도달할 수 있다.","explain":"s 에서 나가는 residual 간선은 s→b (7) 뿐이다(s→a 는 포화돼 backward 만 남았다). b 에서는 b→a (2) 와 b→s 만 있고 b→t 는 포화됐다. a 에서는 a→b, a→s 뿐이고 a→t 도 포화됐다. 그래서 t 에 닿지 못한다. Lemma 에 의해 지금 flow(value 5)는 max flow 이고, {s, a, b} / {t} 가 min cut 이다.","src":"17강 p.23–26","wiki":"augmenting path","tags":["residual","그림"],"img":"img/algo17-p26-final.png","imgAlt":"p.26 갱신된 flow 그래프와 residual graph, 결론 문장이 가려져 있다","explainImg":"img/algo17-p26-final-ans.png","answer":false,"introCard":2},{"id":"u17b-14","type":"num","q":"그림은 Ford-Fulkerson 첫 단계의 residual graph(처음엔 원래 그래프와 같다)와 고른 augmenting path(노란 선)다. 이 path 로 보낼 수 있는 양 x 는?","explain":"increaseFlow 의 첫 줄 'x = min weight on any edge in P'. 노란 path 는 s→(아래) 6, 10, 4→t 를 지나니 $x = \\min(6, 10, 4) = 4$. 그다음 path 위 원래 간선의 flow 를 4 씩 늘리고 residual 을 다시 만든다(p.47).","src":"17강 p.43–47","wiki":"Ford-Fulkerson","tags":["FF","그림"],"img":"img/algo17-p46-ff.png","imgAlt":"p.46 Ford-Fulkerson 예제 residual graph 와 노란 augmenting path","explainImg":"img/algo17-p47-ff-ans.png","answer":4,"tol":0,"introCard":3},{"id":"u17b-15","type":"cloze","q":"[빈칸 의사코드] increaseFlow(P, f): `x =` ___ `weight on any edge in P` / `for (u,v) in P:` `if (u,v) in E: f'(u,v) ← f(u,v) + x` / `else: f'(v,u) ← f(v,u)` ___ `x`","explain":"path 의 bottleneck 만큼만 보낼 수 있으니 min. (u,v) 가 원래 간선이 아니면 residual 의 backward 간선이고, 원래 간선 (v,u) 로 보냈던 flow 를 x 만큼 되돌린다(빼기). 여기서 + 를 쓰면 capacity 를 넘거나 flow 보존이 깨진다.","src":"17강 p.35","wiki":"augmenting path","tags":["FF","빈칸"],"answer":["min","−"],"bank":["min","−","max","+","sum"],"introCard":2},{"id":"u17b-16","type":"order","q":"[증명 칸 채우기] Lemma 의 ⇐ 방향 '$G_f$ 에서 t 에 도달 불가 ⇒ f 는 max flow' 를 순서대로","explain":"p.38–40 의 논증이다. 덤으로 이 A, B 가 min cut 이다. Ford-Fulkerson 이 끝나면 min cut 도 함께 얻는 이유가 이것이다. Lemma 1 자체의 엄밀한 증명(p.18)은 시험 범위 밖이니 '결과로 인용' 만 하면 된다.","src":"17강 p.38–40","wiki":"max-flow min-cut theorem","tags":["FF","proof"],"answer":["$G_f$ 에서 s 로부터 도달 가능한 정점 집합 A, 나머지 B 로 cut 을 잡는다 (t ∈ B)","A→B 원래 간선은 포화(flow = capacity)다. 아니면 forward residual 간선으로 B 에 닿았을 것이다","B→A 원래 간선의 flow 는 0 이다. 아니면 backward residual 간선으로 B 에 닿았을 것이다","그래서 flow value = 이 cut 의 cost 이고, Lemma 1 (flow ≤ cut) 에 의해 f 는 max flow 다"],"introCard":2}],"intro":[{"title":"Lemma 1: flow ≤ cut","body":"어떤 flow 든 어떤 s–t cut 이든 flow value ≤ cut cost. 그러니 max flow ≤ min cut. (엄밀한 증명은 시험 범위 밖, 결과만 쓴다.)","src":"17강 p.16–19"},{"title":"residual graph $G_f$","body":"원래 간선 (u,v) (capacity c, flow f) 마다 forward u→v 에 **남은 양 $c-f$**, backward v→u 에 **쓴 양 $f$**. 예: s→b capacity 8, flow 1 이면 forward 7, backward 1.","img":"img/algo17-p21-residual-ans.png","imgAlt":"flow 와 residual graph","src":"17강 p.20–22"},{"title":"augmenting path 와 increaseFlow","body":"$G_f$ 의 s→t path 가 **augmenting path**. x = path 위 weight 의 **min**. 원래 간선이면 flow + x, backward 간선이면 원래 간선 (v,u) 의 flow − x(보낸 걸 되돌림). Lemma: $G_f$ 에서 t 에 도달 불가 ⇔ f 가 max flow.","img":"img/algo17-p26-final-ans.png","imgAlt":"더 이상 s→t path 가 없는 residual graph","src":"17강 p.23–40"},{"title":"Ford-Fulkerson","body":"f = 0 에서 시작해 $G_f$ 에 s→t path 가 있는 동안 찾아서(예: BFS) increaseFlow, $G_f$ 갱신. 끝나면 max flow 이고, s 에서 도달 가능한 정점 집합이 min cut 의 s 쪽. path 를 아무렇게나 골라도 끝나기만 하면 맞다.","img":"img/algo17-p47-ff-ans.png","imgAlt":"Ford-Fulkerson 첫 augment 뒤","src":"17강 p.41–53"}]},{"id":"u17c","title":"Edmonds-Karp · 정수성 · 응용","items":[{"id":"u17c-01","type":"mc","q":"path 를 아무렇게나 고를 때의 나쁜 예(capacity C 인 네 간선 + 가운데 1)에서 무슨 일이 생기나?","explain":"'This will go on for C steps.' C 가 크면 끔찍하게 느리다 — 시간이 capacity 에 좌우된다.","src":"17강 p.55–62","tags":["Ford-Fulkerson"],"choices":["한 번에 끝난다","가운데 간선 (b,a) 를 따라 1 씩 보냈다 되돌리기를 반복해 약 C 단계가 걸린다","음수 flow 가 생긴다","틀린 답을 낸다"],"answer":1,"img":"img/algo17-p55-bad.png","imgAlt":"p.55 s, a, b, t 그래프: 바깥 네 간선 capacity C, 가운데 a–b 간선 capacity 1","wiki":"Edmonds-Karp","introCard":0},{"id":"u17c-02","type":"mc","q":"Ford-Fulkerson 에서 path 를 BFS 로 고른 것을 무엇이라 하고, 수행 시간은?","explain":"edge weight 와 무관한 bound. 증명은 수업에서 생략, 'It will not be on the exam.'","src":"17강 p.63","tags":["Edmonds-Karp","running time"],"choices":["Dinic, $O(n^2m)$","Edmonds-Karp, $O(nm^2)$","Prim, $O(m\\log n)$","Karger, $O(n^4)$"],"answer":1,"wiki":"Edmonds-Karp","introCard":1},{"id":"u17c-03","type":"tf","q":"Edmonds-Karp 의 $O(nm^2)$ 증명은 기말 범위다.","explain":"슬라이드: 'We will skip the proof in class … It will not be on the exam.' 아이디어(간선 제거 O(n) 번 × m 간선 × BFS O(m))만 알면 된다.","src":"17강 p.63","prof":true,"tags":["Edmonds-Karp","exam"],"answer":false,"wiki":"Edmonds-Karp","introCard":1},{"id":"u17c-04","type":"mc","q":"Edmonds-Karp 는 Ford-Fulkerson 에서 augmenting path 를 BFS 로 고른다. 이것은 residual graph 에서 어떤 path 를 고른다는 뜻인가? ($O(nm^2)$ 증명 자체는 시험 범위 밖)","explain":"BFS 는 unweighted 최단경로, 즉 **간선 수**가 가장 적은 path 를 준다(L9). residual capacity 는 보지 않는다. 이렇게 고르면 p.55 처럼 가운데 1짜리 간선을 오가며 $2C$ 번 도는 일이 없고 $O(nm^2)$ 이 보장된다. 그 증명(CLRS 26.2)은 슬라이드에 'not on the exam' 이라 적혀 있다.","src":"17강 p.55–63","tags":["Edmonds-Karp"],"choices":["간선 수가 가장 적은 s→t path","bottleneck(최소 residual capacity)이 가장 큰 path","capacity 합이 가장 작은 path","아무 s→t path"],"answer":0,"wiki":"Edmonds-Karp","introCard":1},{"id":"u17c-05","type":"tf","q":"capacity 가 모두 정수면, Ford-Fulkerson 이 찾는 max flow 의 간선 flow 도 모두 정수다.","explain":"0 에서 시작해 정수만 더하고 빼니 정수가 유지된다. 매칭 응용의 핵심.","src":"17강 p.64","tags":["flow"],"answer":true,"wiki":"Ford-Fulkerson","introCard":1},{"id":"u17c-06","type":"mc","q":"bipartite matching 을 max flow 로 푸는 구성은?","explain":"정수성 때문에 flow 는 0 또는 1, 보존 법칙 때문에 학생마다 최대 하나 → flow 가 있는 간선이 matching, value = matching 크기.","src":"17강 p.66–70","wiki":"maximum bipartite matching","tags":["matching","flow"],"choices":["s → 학생 → 동아리 → t, 모든 간선 capacity 1","학생끼리 간선, capacity ∞","s → 동아리 → 학생 → t, capacity = 인원","MST 를 구한다"],"answer":0,"explainImg":"img/algo17-p69-match-ans.png","introCard":2},{"id":"u17c-07","type":"num","q":"학생 x1, x2, x3, 동아리 y1, y2, y3. x1 은 y1·y2 를, x2 와 x3 은 y1 만 원한다. 최대 matching 크기(= max flow)는?","explain":"y1 은 한 명만 받을 수 있다. x1–y2, x2–y1 (또는 x3–y1) 로 2. x2, x3 이 둘 다 y1 만 원하니 3 은 불가.","src":"17강 p.66–70 (연습)","wiki":"maximum bipartite matching","tags":["matching","trace"],"answer":2,"tol":0,"introCard":2},{"id":"u17c-08","type":"order","q":"'max flow = maximum matching' 논증을 순서대로","explain":"p.70 슬라이드의 1–5 번.","src":"17강 p.70","wiki":"maximum bipartite matching","tags":["matching","proof"],"answer":["capacity 가 모두 1 인 정수라 flow 도 0 또는 1","stuff in = stuff out 이라 각 학생·동아리에 배정되는 수는 0 또는 1","그래서 flow 가 있는 간선들이 matching 이다 (반대로 matching 은 flow 를 준다)","flow value = matching 크기이므로 max flow 는 maximum matching"],"introCard":2},{"id":"u17c-09","type":"mc","q":"assignment problem (학생은 최대 c(x) 스쿱, 통은 c(y) 스쿱, 쌍은 c(x,y) 스쿱) 을 flow 로 바꿀 때 capacity 배치는?","explain":"매칭의 일반화. '이 학생은 4 스쿱, 초콜릿 최대 1' 같은 제약이 그대로 capacity 가 된다.","src":"17강 p.71–73","tags":["flow"],"choices":["s→x 에 c(x), x→y 에 c(x,y), y→t 에 c(y)","모든 간선 1","s→y 에 c(y)","x→t 에 c(x)"],"answer":0,"wiki":"assignment problem","introCard":2},{"id":"u17c-10","type":"tf","q":"Ford-Fulkerson 은 max flow 를 구하면서 min s–t cut 도 함께 알려 준다.","explain":"끝났을 때 $G_f$ 에서 s 로부터 reachable 한 정점들이 s 쪽인 cut 이 min cut. p.53 'here's the cut to prove it'.","src":"17강 p.53","tags":["Ford-Fulkerson"],"answer":true,"wiki":"Ford-Fulkerson","introCard":3},{"id":"u17c-11","type":"tf","q":"Karger 알고리즘(global min cut)과 Ford-Fulkerson(max flow)은 같은 종류의 cut 을 찾는다.","explain":"Karger 는 undirected·unweighted 의 **global** min cut (s, t 없음), Ford-Fulkerson 은 directed·capacity 의 **min s–t cut**.","src":"16강 p.11 · 17강 p.3","wiki":"Karger's algorithm","tags":["cut","trap"],"answer":false,"introCard":3},{"id":"u17c-12","type":"cloze","q":"[분석 템플릿 칸] bipartite matching 을 max flow 로 풀 때 capacity 가 모두 1 이면, augment 한 번에 flow value 가 정확히 ___ 늘고 max flow ≤ n 이라 반복은 n 번 이하, BFS 한 번 ___ → 전체 ___.","explain":"정수 capacity 라 x 는 1 이상인데 모든 capacity 가 1 이라 x = 1. value 는 학생 수(또는 동아리 수) 이하라 n 번 안에 끝난다. 한 번은 residual 에서 BFS $O(n+m)$ 이니 전체 $O(nm)$. Edmonds-Karp 일반 bound $O(nm^2)$ 보다 작다.","src":"17강 p.64–70","wiki":"maximum bipartite matching","tags":["flow","running time","analysis"],"answer":["1","O(m)","O(nm)"],"bank":["1","O(m)","O(nm)","C","O(n)","O(nm^2)"],"introCard":1}],"intro":[{"title":"path 를 잘못 고르면","body":"바깥 네 간선 capacity C, 가운데 1 인 그래프에서 가운데 간선을 오가는 path 를 번갈아 고르면 1 씩 늘어 $2C$ 번 돈다.","img":"img/algo17-p55-bad.png","imgAlt":"바깥 capacity C, 가운데 1 인 그래프","src":"17강 p.55–62"},{"title":"Edmonds-Karp 와 정수성","body":"augmenting path 를 **BFS**(간선 수 최소)로 고르면 $O(nm^2)$ (증명은 시험 범위 밖). capacity 가 모두 정수면 Ford-Fulkerson 의 flow 도 모두 정수다(정수끼리 더하고 빼기만).","src":"17강 p.63–64"},{"title":"응용: bipartite matching, assignment","body":"s → 학생 → 동아리 → t, 모든 capacity 1 로 두면 max flow = 최대 matching(정수 flow 라 0/1, 보존 법칙으로 각자 하나). 학생 최대 c(x), 통 c(y), 쌍 c(x,y) 스쿱이면 s→x c(x), x→y c(x,y), y→t c(y).","img":"img/algo17-p69-match-ans.png","imgAlt":"학생–동아리 matching 을 flow 로","src":"17강 p.65–75"},{"title":"min cut 두 종류","body":"Ford-Fulkerson 은 max flow 와 함께 min **s–t** cut 을 준다(directed, capacity). Karger 는 undirected·unweighted 의 **global** min cut. 서로 다른 문제다.","src":"16강 p.11 · 17강 p.53"}]},{"id":"u17d","title":"min cut 증명: cut 선 긋기","items":[{"id":"u17d-01","type":"order","q":"[증명 칸 채우기] '$G_f$ 에 s→t 경로가 없으면 f 는 max flow' 의 증명을 순서대로","explain":"L17 p.38–40 의 ⇒ 방향. 교수(11/24)는 '선을 넘는 간선은 $G_f$ 에 없으니 full', 그리고 마지막 부등식 사슬을 짚었다. 셋째 줄의 'T→S 는 0' 은 슬라이드가 글로 적지 않은 부분이다.","src":"17강 p.38–40 · 11/24 녹음 60:05–64:30","wiki":"max-flow min-cut 증명 (cut 선 긋기)","prof":true,"tags":["proof","cut"],"answer":["f 로 residual graph $G_f$ 를 만든다","$G_f$ 에서 s 부터 BFS 해서 닿는 정점을 S, 나머지를 T 로 둔다 (t ∈ T)","S→T 원래 간선은 꽉 차 있고, T→S 원래 간선은 flow 가 0 이다","그래서 flow 값 = (S→T flow) − (T→S flow) = 이 cut 의 cost","value(f) = cost ≥ min cut ≥ max flow ≥ value(f) 이라 모두 같다"],"introCard":0},{"id":"u17d-02","type":"mc","q":"max-flow min-cut 증명에서 cut 의 s 쪽 S 는 어떻게 정하나?","explain":"'{things reachable from s in $G_f$}'. G 에서는 거의 모든 정점이 이어져 있어서 아무 정보가 없다. '더 보낼 수 있는 길' 은 남은 양(forward)과 되돌릴 수 있는 양(backward)을 담은 $G_f$ 에만 있다.","src":"17강 p.38","wiki":"max-flow min-cut 증명 (cut 선 긋기)","prof":true,"tags":["cut","residual"],"choices":["원래 그래프 G 에서 s 와 이어진 정점들","residual graph $G_f$ 에서 s 로부터 화살표를 따라 갈 수 있는(reachable) 정점들","flow 가 0 인 간선으로만 갈 수 있는 정점들","t 에서 출발해 갈 수 없는 정점들"],"answer":1,"introCard":1},{"id":"u17d-03","type":"mc","q":"그림 위쪽은 flow f(값 5)이고 아래쪽은 그 residual graph $G_f$ 다. $G_f$ 에서 s 부터 갈 수 있는 정점 집합 S 는?","explain":"s 에서 나가는 $G_f$ 간선은 s→b (7) 뿐이라 b 에 간다. b 에서 backward b→a (2) — 원래 a→b 로 2 를 보내고 있어서 되돌릴 수 있다 — 로 a 에 간다. a 에서는 a→b, a→s 뿐이고 a→t, b→t 는 꽉 차서 forward 가 없다. 그래서 S = {s, a, b}, t 는 못 간다.","src":"17강 p.39","wiki":"max-flow min-cut 증명 (cut 선 긋기)","tags":["cut","residual","그림"],"img":"img/algo17-cut-gf.png","imgAlt":"위: s→a 4/4, s→b 1/8, a→b 2/6, a→t 2/2, b→t 3/3. 아래: residual graph (forward 파랑, backward 초록)","explainImg":"img/algo17-cut-line.png","choices":["{s}","{s, b}","{s, a, b}","{s, a, b, t}"],"answer":2,"introCard":1},{"id":"u17d-04","type":"num","q":"같은 그림에서 S = {s, a, b}, T = {t} 로 나눈 s–t cut 의 cost 는?","explain":"S→T 로 건너는 간선은 a→t (capacity 2) 와 b→t (capacity 3). cost = 2 + 3 = 5. flow 값도 s 에서 나가는 4 + 1 = 5 라 같다. 그래서 이 flow 는 max flow 이고 이 cut 은 min cut 이다.","src":"17강 p.39–40","wiki":"max-flow min-cut 증명 (cut 선 긋기)","tags":["cut","그림"],"img":"img/algo17-cut-gf.png","imgAlt":"p.39 flow 와 residual graph","explainImg":"img/algo17-cut-sum.png","answer":5,"tol":0,"introCard":3},{"id":"u17d-05","type":"tf","q":"$G_f$ 에서 s 가 닿는 집합 S 로 cut 을 잡으면, S 쪽 → T 쪽으로 건너는 원래 간선은 모두 꽉 차 있다(flow = capacity).","explain":"꽉 차지 않았다면 남은 양 c − f > 0 이라 $G_f$ 에 forward 간선이 있고, 꼬리가 S 에 있으니 BFS 가 머리까지 갔을 것이다. 그런데 머리는 T 에 있다 — 모순. 슬라이드: 'The edges in the cut are 2-gf.png","imgAlt":"p.4 그래프의 flow/capacity 와 residual graph","explainImg":"img/algo17-cut2-sum.png","answer":11,"tol":0,"introCard":3},{"id":"u17d-10","type":"mc","q":"같은 예(S = {s, B, C, F})에서 T 쪽 → S 쪽으로 거꾸로 건너는 원래 간선과 그 flow 는?","explain":"T = {A, D, E, t}. 원래 간선 중 T→S 는 A→B (0/2), E→F (0/6). 둘 다 flow 0 이다 — 0 이 아니었다면 $G_f$ 에 B→A 또는 F→E backward 간선이 생겨 A 나 E 가 S 에 들어왔을 것이다. F→B 는 F, B 모두 S 라 선을 넘지 않는다.","src":"17강 p.14 (슬라이드 생략분)","wiki":"max-flow min-cut 증명 (cut 선 긋기)","tags":["cut","그림"],"img":"img/algo17-cut2-line.png","imgAlt":"S 와 T 로 칠하고 cut 을 그은 그림","explainImg":"img/algo17-cut2-back.png","choices":["A→B, E→F — 둘 다 flow 0","F→B — flow 1","A→B — flow 2","거꾸로 건너는 간선은 없다"],"answer":0,"introCard":2},{"id":"u17d-11","type":"cloze","q":"[빈칸] value(f) = cost(이 cut) ≥ ___ ≥ ___ ≥ value(f). 양 끝이 같으니 모두 같다.","explain":"첫 ≥: min cut 은 모든 cut 중 최소. 둘째 ≥: Lemma 1(어떤 flow ≤ 어떤 cut). 셋째 ≥: max flow 는 모든 flow 중 최대. 교수(11/24): 'larger than or equal to the cost of minimum cut, and by lemma 1, larger than or equal to maximum flow.'","src":"17강 p.39–40 · 11/24 녹음 63:27","wiki":"max-flow min-cut 증명 (cut 선 긋기)","prof":true,"tags":["proof","빈칸"],"answer":["min cut","max flow"],"bank":["min cut","max flow","max cut","min flow","cost(G)"],"introCard":0},{"id":"u17d-12","type":"mc","q":"capacity/flow 가 s→x 3/3, s→y 1/2, x→y 0/1, x→t 3/4, y→t 1/1 이다(값 4). $G_f$ 에서 s 부터 갈 수 있는 집합 S 는?","explain":"$G_f$: s→x 는 꽉 차서 forward 없음, s→y 1 남음 → y. y 에서 y→t 는 꽉 참, y→x 는 원래 x→y 의 flow 0 이라 backward 없음, y→s(backward)는 이미 S. 그래서 S = {s, y}. x→t 에 1 이 남았지만 x 에 못 가니 상관없다.","src":"17강 p.38–40 응용","wiki":"max-flow min-cut 증명 (cut 선 긋기)","tags":["cut","residual"],"choices":["{s}","{s, y}","{s, x, y}","{s, x, y, t}"],"answer":1,"introCard":1},{"id":"u17d-13","type":"num","q":"바로 앞 문제(S = {s, y})의 s–t cut cost 는?","explain":"S→T 간선: s→x 3 (꽉 참), y→t 1 (꽉 참) → 3 + 1 = 4. T→S 간선 x→y 는 flow 0 이고 cost 에 안 넣는다. flow 값 4 와 같으니 max flow = 4, 이 cut 이 min cut.","src":"17강 p.38–40 응용","wiki":"max-flow min-cut 증명 (cut 선 긋기)","tags":["cut"],"answer":4,"tol":0,"introCard":3},{"id":"u17d-14","type":"mc","q":"Ford-Fulkerson 이 끝난 뒤 min s–t cut 을 얻는 방법은?","explain":"끝난 순간 $G_f$ 에 s→t 경로가 없으니 위 증명 그대로다. BFS 한 번 $O(n+m)$ 으로 min cut 이 나온다. p.53 의 짙은 정점 {s, B, C, F} 가 이렇게 얻은 S 다. bottleneck 간선을 모으는 방법은 일반적으로 cut 이 되지 않는다.","src":"17강 p.53 · 11/24 녹음 69:45","wiki":"max-flow min-cut 증명 (cut 선 긋기)","prof":true,"tags":["cut","FF"],"choices":["마지막 $G_f$ 에서 s 부터 BFS(또는 DFS)해 닿는 정점을 S 로 잡는다","capacity 가 가장 작은 간선들을 고른다","원래 그래프에서 s 에 붙은 간선을 모두 자른다","augmenting path 마다 bottleneck 간선을 모아 둔다"],"answer":0,"introCard":3}],"intro":[{"title":"무엇을 증명하나","body":"Lemma 1 로 '아무 flow ≤ 아무 cut' 은 끝났다. 이제 **값이 같은 flow f 와 cut 하나**를 찾으면 value(f) ≤ max flow ≤ min cut ≤ cost(cut) = value(f) 라서 넷이 모두 같다. f 는 '$G_f$ 에 s→t 경로가 없는 flow'(Ford-Fulkerson 이 끝난 flow), cut 은 아래 방법으로 만든다.","src":"17강 p.16, 38"},{"title":"1. $G_f$ 그리기 2. s 부터 칠하기","body":"f 로 residual graph 를 만든다(forward = 남은 양 c−f, backward = 보낸 양 f). 그 위에서 s 부터 BFS 해서 **화살표를 따라 갈 수 있는** 정점을 모두 칠한다 = S. backward 간선도 길이다. t 는 못 칠한다(가정).","img":"img/algo17-cut-gf.png","imgAlt":"p.39: 위 flow(값 5), 아래 residual graph","src":"17강 p.38–39"},{"title":"3. 선 긋기 4. 선을 넘는 간선","body":"S 와 나머지 T 사이에 선을 긋는다. **S→T 원래 간선은 꽉 찼다**(아니면 forward 로 T 에 닿았을 것). **T→S 원래 간선은 flow 0**(아니면 backward 로 T 에 닿았을 것). 둘 다 'S 에서 T 로 가는 $G_f$ 간선은 없다' 의 다른 표현.","img":"img/algo17-cut-line.png","imgAlt":"S = {s, a, b} 를 칠하고 cut 을 그은 그림","src":"17강 p.39–40"},{"title":"5. flow 값 = cut cost 6. 사슬","body":"flow 값 = (S→T flow) − (T→S flow) = Σ capacity(S→T) − 0 = cut cost. 그래서 value(f) = cost ≥ min cut ≥ max flow ≥ value(f) → f 는 max flow, 이 cut 은 min cut. Ford-Fulkerson 이 끝나면 BFS 한 번으로 min cut 이 나온다.","img":"img/algo17-cut-sum.png","imgAlt":"cut cost 2 + 3 = 5 = flow 값","src":"17강 p.39–40, 53"}]}]}]}]</script>
<script>
/* 한입 학습 — core logic shared by the app (browser), build.mjs, report.mjs, test.mjs.
   No DOM access here. Works as a plain <script> (sets globalThis.DuoCore) and as CommonJS. */
(function (root) {
  'use strict';

  var TYPES = ['mc', 'tf', 'cloze', 'match', 'order', 'sa', 'num'];
  var TYPE_KO = { mc: '객관식', tf: 'O/X', cloze: '빈칸', match: '짝 맞추기', order: '순서', sa: '단답', num: '계산' };
  var MIN = 60e3, DAY = 864e5;
  var BOX_DAYS = [0, 1, 2, 4, 8, 16];
  var LOG_CAP = 20000;

  /* ---------- dates (Asia/Seoul) ---------- */
  var dfmt = null;
  function dateKey(ms) {
    try {
      if (!dfmt) dfmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return dfmt.format(new Date(ms));
    } catch (e) {
      var d = new Date(ms + 9 * 3600e3);
      return d.toISOString().slice(0, 10);
    }
  }
  function shiftDay(key, delta) {
    var d = new Date(key + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }
  /** streak = consecutive days with lessons>0 ending today (or yesterday if today not yet done). */
  function calcStreak(days, today) {
    days = days || {};
    var k = today, n = 0;
    if (!(days[k] && days[k].lessons > 0)) k = shiftDay(k, -1);
    while (days[k] && days[k].lessons > 0) { n++; k = shiftDay(k, -1); }
    return n;
  }

  /* ---------- grading ---------- */
  function normSA(s) {
    return String(s == null ? '' : s).normalize('NFKC').trim().toLowerCase()
      .replace(/[.。]+$/, '')
      .replace(/[\s\-‐-―−·・•‧∙_]/g, '');
  }
  function parseNum(s, unit) {
    if (typeof s === 'number') return s;
    var t = String(s == null ? '' : s).normalize('NFKC').trim();
    if (unit) { var u = String(unit).trim(); if (u && t.toLowerCase().endsWith(u.toLowerCase())) t = t.slice(0, -u.length); }
    t = t.replace(/[,\s]/g, '').replace(/[−–]/g, '-').replace(/%$/, '');
    if (t === '') return NaN;
    var m = /^([-+]?[\d.]+(?:e[-+]?\d+)?)\/([-+]?[\d.]+(?:e[-+]?\d+)?)$/i.exec(t);
    if (m) return Number(m[1]) / Number(m[2]);
    m = /^([-+]?[\d.]+)\^([-+]?[\d.]+)$/.exec(t);
    if (m) return Math.pow(Number(m[1]), Number(m[2]));
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
    return Number(t);
  }
  function numOk(item, given) {
    var g = parseNum(given, item.unit), a = Number(item.answer);
    if (!isFinite(g)) return false;
    var tol = item.tol == null ? 0.01 : Number(item.tol);
    if (tol === 0) return Math.abs(g - a) <= 1e-9 * Math.max(1, Math.abs(a));
    if (a === 0) return Math.abs(g) <= tol;
    return Math.abs(g - a) <= tol * Math.abs(a) + 1e-12;
  }
  function arrEq(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (String(a[i]).trim() !== String(b[i]).trim()) return false;
    return true;
  }
  /** match: given = list of attempted [left,right] pairs in tap order. ok iff no wrong attempt and every left matched. */
  function matchOk(item, given) {
    if (!Array.isArray(given)) return false;
    var map = {}; item.pairs.forEach(function (p) { map[p[0]] = p[1]; });
    var covered = {}, wrong = 0;
    given.forEach(function (p) { if (map[p[0]] === p[1]) covered[p[0]] = 1; else wrong++; });
    return wrong === 0 && Object.keys(covered).length === item.pairs.length;

    }
    else go(scr);
  }

  /* ---------- keyboard shortcuts (mouse/keyboard users) ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '', typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if ($zoom) { if (e.key === 'Escape') closeZoom(); return; }
    if ($intro) {
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); introGo(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); introGo(-1); }
      else if (e.key === 'Escape') finishIntro(true);
      return;
    }
    if ($modal.classList.contains('show') || $wiki.classList.contains('show')) return;
    if ($sheet.classList.contains('show')) {
      if (e.key === 'Enter' || e.key === ' ') { var cb = $sheet.querySelector('.btn'); if (cb) { e.preventDefault(); cb.click(); } }
      return;
    }
    if (typing) return;
    if (CF) {
      if (e.key === '1' || e.key === 'ArrowLeft') cfMark(false);
      else if (e.key === '2' || e.key === 'ArrowRight') cfMark(true);
      else if (e.key === ' ') { e.preventDefault(); cfPause(); }
      else if (e.key === 'Enter') { if (CF.phase === 'q') { CF.gen++; cfReveal(); } else cfNext(); }
      return;
    }
    if (!S) return;
    if (/^[1-9]$/.test(e.key)) {
      var selfBtns = document.querySelectorAll('.selfrow button');
      var btns = selfBtns.length ? selfBtns : document.querySelectorAll('.qbody .choice, .qbody .tf');
      var b = btns[Number(e.key) - 1];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (e.key === 'Enter') {
      var c = document.querySelector('.lfoot .check');
      if (c && !c.disabled) { e.preventDefault(); c.click(); }
    }
  });

  /* ---------- boot ---------- */
  if (DEMO) { seedDemo(); if (P.get('input')) G.input = P.get('input'); if (P.get('bed')) enterBed(); }
  ORDER.forEach(function (c) { touchCourse(DATA[c]); });
  heartsNow(); saveG();
  var scr = P.get('screen');
  if (scr) demoScreen(scr); else go(current);
  if (!DEMO && SYNC.token && SYNC.repo) setTimeout(function () { syncNow(true); }, 1500);
  if (P.has('probe')) setTimeout(function () {
    var info = { sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth, screen: scr, auto: window.__autoplay || null, imgOk: [].filter.call(document.images, function (i) { return i.complete && i.naturalWidth > 0; }).length, imgBroken: document.querySelectorAll('.qimg.broken').length };
    var pr = document.createElement('pre'); pr.id = 'probe'; pr.textContent = JSON.stringify(info);
    document.body.appendChild(pr);
    try { if (window.parent !== window) window.parent.postMessage({ duoProbe: info }, '*'); } catch (e) { /* ignore */ }
  }, 600);
  window.addEventListener('online', function () { if (current === 'wiki') renderWikiTab(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DEMO) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache optional */ });
  }
})();
