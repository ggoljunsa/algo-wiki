<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa463" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한입 학습">
<title>컴퓨터알고리즘 기말 · 한입 학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f7f4; --card: #ffffff; --fg: #1f2a24; --muted: #6b7570; --line: #e1e5df;
  --acc: #1fa463; --acc-d: #15804c; --acc-soft: #dff4e8;
  --red: #e5484d; --red-soft: #fde4e4; --gold: #f2b01e; --blue: #3478f6;
  --chip: #ffffff; --chip-b: #d7dcd5; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c221f; --fg: #e8ece9; --muted: #96a09a; --line: #2e3632;
    --acc: #2fc27a; --acc-d: #22955c; --acc-soft: #173826; --red: #ff6b6e; --red-soft: #3a1d1e;
    --gold: #f5c04a; --chip: #232a26; --chip-b: #3a443f; --shadow: 0 2px 0 rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .hidden { display: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + var(--sa-t)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cswitch { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 14px; max-width: 42%; display: flex; align-items: center; cursor: pointer; }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstats { display: flex; align-items: center; gap: 8px; }
.hs { display: flex; align-items: center; gap: 2px; font-size: 15px; }
.hs b { font-variant-numeric: tabular-nums; }
.hs.goal { border: 0; background: none; padding: 0; min-width: 40px; min-height: 40px; justify-content: center; cursor: pointer; }
#view { flex: 1; padding: 12px 14px calc(84px + var(--sa-b)); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--sa-b); }
#tabs button { flex: 1; max-width: 140px; min-height: 56px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; }
#tabs button i { font-style: normal; font-size: 22px; line-height: 1.1; }
#tabs button.on { color: var(--acc); font-weight: 700; }
body.insession #top, body.insession #tabs { display: none; }
body.insession #view { padding-bottom: 12px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 8px 0 0; padding: 10px 16px; border-radius: 14px;
  border: 2px solid var(--chip-b); background: var(--card); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.btn.primary { background: var(--acc); border-color: var(--acc-d); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost.danger { color: var(--red); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
.link { border: 0; background: none; color: var(--blue); padding: 8px 0; min-height: 40px; cursor: pointer; }

/* path */
.exam { margin: 0 0 10px; }
.duecard { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; border: 2px solid var(--gold); background: var(--card); cursor: pointer; }
.duecard span { font-size: 13px; color: var(--muted); }
.unit { margin-bottom: 18px; }
.uhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: var(--u); box-shadow: 0 3px 0 var(--ud); }
.utitle { font-weight: 800; font-size: 17px; } .udesc { font-size: 13px; opacity: .9; }
.uprog { font-weight: 700; font-size: 14px; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
.hue0 { --u: #1fa463; --ud: #15804c; } .hue1 { --u: #3478f6; --ud: #2459bd; } .hue2 { --u: #b4579f; --ud: #87407a; }
.hue3 { --u: #e07a1f; --ud: #a95a14; } .hue4 { --u: #0f9fa8; --ud: #0b767c; } .hue5 { --u: #6f5bd6; --ud: #5243a5; }
.nodes { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; }
.nwrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 120px; margin: 6px 0; }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; position: relative; padding: 0;
  background: conic-gradient(var(--u) var(--p), var(--line) 0); display: flex; align-items: center; justify-content: center; }
.node > span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--u); box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.node.done > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
.node.gold > span { background: var(--gold); color: #fff; }
.node.fresh { opacity: .75; }
.node.rec { animation: pulse 1.6s ease-in-out infinite; }
.node.rec > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.bubble { position: absolute; top: -26px; background: var(--card); border: 2px solid var(--u); color: var(--u); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 10px; z-index: 1; }
.crown { position: absolute; top: 50px; right: 12px; font-size: 12px; font-weight: 800; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.nlabel { font-size: 13px; text-align: center; margin-top: 4px; line-height: 1.25; max-width: 120px; }
.pend { text-align: center; margin: 10px 0; }
.lmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 14px; }

/* modal / toast */
#modal { display: none; position: fixed; inset: 0; z-index: 20; }
#modal.show { display: block; }
.mback { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.mbox { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + var(--sa-b)); animation: up .18s ease-out; }
.mbox h3 { margin: 4px 0 8px; font-size: 19px; }
.big { font-size: 56px; text-align: center; line-height: 1.2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.crow { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 700; }
.crow.me { border-color: var(--acc); background: var(--acc-soft); }
.crow .muted { font-weight: 400; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--sa-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 30;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; transition: .2s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
textarea.rep { width: 100%; height: 42vh; margin-top: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.lbar { display: flex; align-items: center; gap: 10px; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pfill { height: 100%; background: var(--acc); border-radius: 99px; transition: width .3s; }
.lh { font-weight: 700; min-width: 44px; text-align: right; }
.qbody { flex: 1; padding: 10px 2px; }
.qtype { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
.prof { color: #a35b00; background: #fff0d6; border-radius: 99px; padding: 0 8px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .prof { color: #ffcf7a; background: #3a2c12; } }
.combo { color: var(--gold); } .again { color: var(--red); }
.q { font-size: 19px; font-weight: 700; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); }
.choice.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.cnum { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--chip-b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tfrow { display: flex; gap: 12px; }
.tf { flex: 1; min-height: 140px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
.tfbig { font-size: 56px; font-weight: 900; line-height: 1; }
.tf.t .tfbig { color: var(--acc); } .tf.f .tfbig { color: var(--red); }
.tf.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); font-size: 15px; text-align: left; max-width: 100%; }
.chip.used { visibility: hidden; }
.chip.mini { min-width: 48px; text-align: center; }
.cloze { line-height: 2.2; }
.slot { display: inline-block; min-width: 64px; min-height: 40px; margin: 2px 2px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--chip)); font-size: 15px; font-weight: 700; line-height: 1.4; vertical-align: middle; cursor: pointer; max-width: 100%; }
.slot.empty { border-style: dashed; border-color: var(--chip-b); background: transparent; color: var(--muted); font-weight: 400; }
.seq { min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 2px dashed var(--chip-b); border-radius: 14px; }
.chip.step { display: flex; align-items: center; gap: 8px; width: 100%; border-color: var(--blue); }
.snum { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mitem { min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
.mitem.r { font-size: 13px; }
.mitem.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.mitem.ok { border-color: var(--acc); background: var(--acc-soft); opacity: .55; box-shadow: none; }
.mitem.bad { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.inp { width: 100%; min-height: 54px; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.sm { min-height: 46px; font-size: 15px; }
.numrow { display: flex; gap: 8px; align-items: center; }
.numrow .inp { flex: 1; min-width: 0; }
.unit { font-weight: 700; color: var(--muted); }
.lfoot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + var(--sa-b)); background: var(--bg); }
.lfoot .skip { margin-top: 0; min-height: 40px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 560px; margin: 0 auto; transform: translateY(110%); transition: transform .2s ease-out;
  padding: 16px 16px calc(14px + var(--sa-b)); border-radius: 20px 20px 0 0; max-height: 75vh; overflow: auto; }
.sheet.show { transform: none; }
.sheet.ok { background: var(--acc-soft); } .sheet.bad { background: var(--red-soft); }
.shead { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
.sheet.ok .shead { color: var(--acc-d); } .sheet.bad .shead { color: var(--red); }
@media (prefers-color-scheme: dark) { .sheet.ok .shead { color: var(--acc); } }
.sans, .sgiven { margin: 4px 0; } .sans b { color: var(--acc-d); } .sgiven b { color: var(--red); }
@media (prefers-color-scheme: dark) { .sans b { color: var(--acc); } }
.sexp { margin: 8px 0; font-size: 15px; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.smeta a { font-weight: 700; padding: 6px 0; }

/* result */
.result { text-align: center; padding: calc(30px + var(--sa-t)) 4px 10px; }
.result h2 { margin: 6px 0 10px; }
.pill { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 99px; background: var(--acc-soft); font-weight: 700; font-size: 14px; }
.pill.gold { background: #fff0c2; color: #7a5600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; text-align: center; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.tk { font-size: 13px; color: var(--muted); } .tv { font-size: 21px; font-weight: 800; }
.xpbreak { margin-bottom: 8px; }

/* pages */
.page h2 { margin: 4px 0 12px; }
.ptop { display: flex; align-items: center; gap: 8px; } .ptop h2 { margin: 4px 0; }
.back { border: 0; background: none; color: var(--blue); font-size: 16px; min-height: 44px; padding: 0 6px 0 0; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { background: var(--acc-soft); color: var(--acc-d); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.badge.red { background: var(--red-soft); color: var(--red); }
.tagrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 8px; align-items: center; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; padding: 0; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tbar { display: block; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.tbar.wide { height: 12px; margin-top: 3px; }
.tpct { font-size: 13px; text-align: right; font-weight: 700; }
.ubar { margin: 10px 0; } .ulabel { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 6px; }
.hm { aspect-ratio: 1; border-radius: 8px; background: var(--line); position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.hm i { position: absolute; top: -2px; right: -2px; font-style: normal; font-size: 11px; }
.hm.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--line)); } .hm.l2 { background: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.hm.l3 { background: color-mix(in srgb, var(--acc) 80%, var(--line)); color: #fff; } .hm.l4 { background: var(--acc-d); color: #fff; }
.hm.today { outline: 2px solid var(--blue); }
.topmiss { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tmq { display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.miss .mq { font-weight: 600; margin: 6px 0; }
.mexp { padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.seg button { min-height: 46px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.fld { display: block; margin: 8px 0; } .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.warn { background: #fff4d6; color: #6b4b00; border-radius: 10px; padding: 8px 10px; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #ffd98a; } .pill.gold { background: #3a2f12; color: #ffd98a; } }
.katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
#probe { display: none; }

/* ---------- hub / shared extras ---------- */
.hs.moon { border: 0; background: none; font-size: 20px; min-width: 40px; min-height: 40px; padding: 0; cursor: pointer; }
#top .cswitch { flex: 1 1 auto; min-width: 0; max-width: none; }
#top .hstats { flex: none; gap: 6px; }
#focusbar { display: none; }
#focusbar.show { display: flex; position: sticky; top: calc(57px + var(--sa-t)); z-index: 4; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--acc-soft); font-size: 14px; font-weight: 700; }
#focusbar button { border: 1px solid var(--chip-b); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; }
body.insession #focusbar { display: none; }
.cchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; scrollbar-width: none; }
.cchips button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; font-size: 14px; cursor: pointer; }
.cchips button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.row2.slim { margin-bottom: 10px; } .row2.slim .btn { min-height: 42px; font-size: 14px; margin-top: 0; }
.cbadge { background: var(--line); color: var(--fg); border-radius: 99px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.pill.red { background: var(--red-soft); color: var(--red); }
.card.hl { border: 2px solid var(--acc); }
.crow.big { width: 100%; background: var(--card); cursor: pointer; font: inherit; font-weight: 700; min-height: 60px; }
.wlink { border: 0; background: none; color: var(--blue); font-weight: 700; padding: 6px 0; min-height: 36px; cursor: pointer; font-size: 13px; }
/* today */
.hello { display: flex; justify-content: space-between; align-items: center; }
.hello h2 { margin: 2px 0 8px; font-size: 24px; }
.ddays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 12px; }
.dd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; }
.ddn { font-weight: 900; font-size: 18px; color: var(--red); }
.ddc { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ddd { font-size: 11px; }
.tbd { display: block; font-size: 10px; color: var(--gold); font-weight: 800; }
.btn.go { flex-direction: column; min-height: 78px; font-size: 20px; }
.btn.go small { font-size: 13px; font-weight: 600; opacity: .9; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.sp { border: 0; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; min-width: 0; }
.spn { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.btn.bedbtn { background: #2b2118; color: #e6c48f; border-color: #3d2f22; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
ol.check { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.check li { margin: 6px 0; }
.wrow, .erow { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.erow { grid-template-columns: 1fr 150px 64px; }
.wrow .inp, .erow .inp { min-height: 42px; padding: 6px 8px; min-width: 0; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
/* wiki viewer */
#wiki { display: none; position: fixed; inset: 0; z-index: 25; background: var(--bg); flex-direction: column; }
#wiki.show { display: flex; }
#wiki iframe { flex: 1; width: 100%; border: 0; background: var(--card); }
.wbar { display: flex; align-items: center; gap: 8px; padding: calc(4px + var(--sa-t)) 8px 4px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 48px; }
.wback { border: 0; background: none; color: var(--blue); font-weight: 700; min-height: 44px; padding: 0 8px; cursor: pointer; font-size: 16px; }
.wtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.wext { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; }
.woff { background: var(--red-soft); color: var(--red); padding: 10px 12px; font-size: 14px; border-radius: 10px; margin: 8px; }
/* ---------- bed mode: warm, dim, no pure white ---------- */
body.bed {
  --bg: #0a0705; --card: #140e0a; --fg: #c79a5e; --muted: #7a6142; --line: #2a1f16;
  --acc: #9c6a2a; --acc-d: #7a521f; --acc-soft: #20170e; --red: #a8553f; --red-soft: #24130d;
  --gold: #a87c2c; --blue: #b08447; --chip: #120c08; --chip-b: #33261a; --shadow: none;
  font-size: 19px; color-scheme: dark;
}
body.bed .btn.primary, body.bed .btn.danger, body.bed .node.done > span, body.bed .node.rec > span, body.bed .uhead { color: #120c08; }
body.bed .q { font-size: 23px; }
body.bed .choice, body.bed .chip, body.bed .mitem { font-size: 18px; }
body.bed code { background: #241a12; }
body.bed .lesson { justify-content: flex-end; }
body.bed .qbody { flex: 0 1 auto; margin-top: auto; }
body.bed #toast { background: #20170e; color: var(--fg); }
body.bed .prof { background: #2a1d0c; color: #b8893a; }
body.bed .warn { background: #241a0f; color: var(--fg); }
.bedwrap { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.bedtop { text-align: center; padding-top: 6vh; }
.bclock { font-size: 64px; font-weight: 300; letter-spacing: 2px; line-height: 1.1; }
.bedctl { margin-top: auto; padding-bottom: calc(6px + var(--sa-b)); }
.btn.tall { min-height: 76px; font-size: 18px; }
.card-flow .cftop { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
.cfbody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }
.cfq { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.cflist { padding-left: 24px; margin: 4px 0; } .cflist li { margin: 4px 0; }
.cfback { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cfans { font-size: 22px; margin-bottom: 8px; } .cfans b { color: var(--acc); margin-right: 6px; }
.cfexp { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
.cfbar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.cfbar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cfrow { display: grid; grid-template-columns: 1fr 76px 1fr; gap: 10px; }
.cfb { min-height: 84px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--fg); }
.cfb.no { border-color: var(--red); color: var(--red); } .cfb.yes { border-color: var(--acc); color: var(--acc); }
.cfb.pp { font-size: 26px; }
.sleep { animation: dusk 2.5s ease-out both; }
.moonbig { font-size: 72px; filter: saturate(.5) brightness(.8); }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
body.sleeping { --fg: #8a6a40; --muted: #5a4630; }

/* ---------- 탭만으로 풀기 + mouse friendliness ---------- */
.modechip { margin-left: auto; border: 1px solid var(--chip-b); background: var(--chip); color: var(--fg); border-radius: 99px; min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.selfans { background: var(--card); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 18px; }
.selfans b { color: var(--acc-d); }
.selfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.selfrow .btn { min-height: 64px; font-size: 18px; }
.lfoot .row2.slim { margin-bottom: 4px; }
.lfoot .row2.slim .btn { min-height: 44px; margin-top: 0; font-size: 14px; }
.seg.two { grid-template-columns: 1fr 1fr; }
body.bed .selfans b { color: var(--acc); }
@media (hover: hover) and (pointer: fine) {
  .choice:hover:not(:disabled), .tf:hover:not(:disabled), .mitem:hover:not(:disabled), .chip:hover:not(:disabled), .slot:hover,
  .seg button:hover, .cchips button:hover, .crow:hover, .modechip:hover, .cfb:hover { border-color: var(--blue); }
  .btn:hover:not(:disabled), .node:hover, .duecard:hover, .tagrow:hover, .sp:hover { filter: brightness(1.06); }
  body.bed .btn:hover:not(:disabled), body.bed .cfb:hover { filter: brightness(1.25); }
  .x:hover, .link:hover, .back:hover, .wlink:hover, .wback:hover { text-decoration: underline; }
}

/* ---------- question images ---------- */
.qimg { position: relative; margin: 4px 0 12px; border-radius: 12px; background: #f4f4f1; border: 1px solid var(--line); padding: 6px; text-align: center; }
.qimg img { display: block; margin: 0 auto; max-width: 100%; max-height: 42vh; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
.qimg .zoomhint { position: absolute; right: 8px; bottom: 8px; font-size: 14px; background: rgba(0,0,0,.45); color: #f5f5f5; border-radius: 99px; padding: 1px 7px; pointer-events: none; }
.qimg.exp { margin: 6px 0 10px; }
.qimg.exp img { max-height: 32vh; }
.qimg.thumb { display: inline-block; padding: 3px; margin: 0 0 8px; }
.qimg.thumb img { max-height: 18vh; }
.qimg.broken { background: var(--card); }
.imgalt { padding: 14px 10px; font-size: 14px; color: var(--muted); text-align: left; }
@media (prefers-color-scheme: dark) { .qimg { background: #e9e9e4; border-color: transparent; } .qimg img { filter: brightness(.92); } }
body.bed .qimg { background: #c9c2b4; border-color: transparent; }
body.bed .qimg img { max-height: 35vh; filter: brightness(.8) sepia(.25); }
body.bed .qimg.thumb img { max-height: 16vh; }
body.bed .qimg.broken { background: var(--card); }
.cfbody .qimg { margin-bottom: 10px; }
#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(8,8,8,.94); display: flex; flex-direction: column; }
#zoom .zbar { display: flex; align-items: center; gap: 8px; padding: calc(6px + var(--sa-t)) 10px 6px; color: #ddd; }
#zoom .zalt { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .zbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #555; background: #222; color: #eee; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
#zoom .zwrap { flex: 1; overflow: auto; touch-action: pinch-zoom pan-x pan-y; -webkit-overflow-scrolling: touch; padding: 8px; }
#zoom .zwrap img { display: block; max-width: none; margin: 0 auto; background: #f4f4f1; border-radius: 6px; }
#zoom.fit .zwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
body.bed #zoom .zwrap img { filter: brightness(.8) sepia(.25); background: #c9c2b4; }
.sheet { -webkit-overflow-scrolling: touch; }

/* ---------- 📖 intro cards ---------- */
#intro { position: fixed; inset: 0; z-index: 50; max-width: 560px; margin: 0 auto; background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: calc(8px + var(--sa-t)) 14px calc(10px + var(--sa-b)); }
#intro .ibar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#intro .ititle { font-size: 14px; font-weight: 800; color: var(--acc-d); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#intro .iskip { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; min-height: 44px; padding: 0 6px; cursor: pointer; text-decoration: underline; }
#intro .idots { display: flex; align-items: center; gap: 6px; }
#intro .idots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
#intro .idots i.past { background: var(--acc-soft); border: 1px solid var(--acc); }
#intro .idots i.on { width: 22px; background: var(--acc); }
#intro .idots span { margin-left: auto; }
#intro .icard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
#intro .icard h3 { margin: 4px 0 8px; font-size: 22px; }
#intro .ibody { font-size: 17px; line-height: 1.7; }
#intro .inav { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; background: var(--bg); padding-top: 4px; }
#intro .inav .btn { margin-top: 0; min-height: 56px; }
.qimg.intro img { max-height: 38vh; }
body.bed #intro .ititle { color: var(--acc); }
body.bed #intro .ibody { font-size: 19px; }
@media (prefers-color-scheme: dark) { #intro .ititle { color: var(--acc); } }
.nintro { position: absolute; left: -20px; top: 16px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.cfrow.two { grid-template-columns: 76px 1fr; }
.cfexp.intro { color: var(--fg); font-size: 18px; line-height: 1.65; }
@media (hover: hover) and (pointer: fine) { .nintro:hover, #intro .iskip:hover { border-color: var(--blue); color: var(--fg); } }

<script type="application/json" id="duo-content">[{"course":{"id":"algo","title":"컴퓨터알고리즘 기말","subtitle":"CSE301 · Prof. Hoon Sung Chwa","exam":"기말 범위 9강~17강 · 형식(중간 기준): Circle all 객관식 · 빈칸 의사코드 · 그림 판정 · 증명 4칸 · 손으로 돌리기","wiki":"../index.html"},"units":[{"id":"u9","title":"9강 Graph I","desc":"그래프 표현 · DFS start/finish · topological sort · BFS · bipartite","lessons":[{"id":"u9a","title":"그래프 기초와 두 가지 표현","items":[{"id":"u9a-01","type":"mc","q":"undirected graph 에서 모든 정점의 degree 를 더한 값 $\\sum_v \\deg(v)$ 는?","explain":"간선 $\\{u,v\\}$ 하나가 $u$ 쪽에서 한 번, $v$ 쪽에서 한 번 세어진다. 그래서 $2m$ 이고, 이게 DFS/BFS 가 $O(n+m)$ 인 근거다. $m$ 은 directed graph 의 in-degree 합.","src":"9강 p.13","wiki":"degree","tags":["degree"],"choices":["$m$","$2m$","$n+m$","$n^2$"],"answer":1,"introCard":0},{"id":"u9a-02","type":"num","q":"undirected graph $V=\\{1,2,3,4\\}$, $E=\\{\\{1,3\\},\\{2,4\\},\\{3,4\\},\\{2,3\\}\\}$ 에서 정점 3 의 degree 는?","explain":"3 이 끝점인 간선은 $\\{1,3\\}, \\{3,4\\}, \\{2,3\\}$ 세 개다. (슬라이드는 4 의 degree = 2 를 예로 들었다.)","src":"9강 p.13","wiki":"degree","tags":["degree"],"answer":3,"tol":0,"img":"img/algo9-gen-u9a-02.png","imgAlt":"undirected graph: 1–3, 2–4, 3–4, 2–3","introCard":0},{"id":"u9a-03","type":"num","q":"directed graph $E=\\{(1,3),(2,4),(3,4),(4,3),(3,2)\\}$ 에서 정점 3 의 out-degree 는?","explain":"3 에서 나가는 간선은 $(3,4)$, $(3,2)$ 두 개다. $(1,3)$ 은 3 으로 **들어오는** 간선이라 in-degree 쪽이다.","src":"9강 p.14","wiki":"in-degree와 out-degree","tags":["degree","directed"],"answer":2,"tol":0,"img":"img/algo9-gen-u9a-03.png","imgAlt":"directed graph: 1→3, 2→4, 3→4, 4→3, 3→2","introCard":0},{"id":"u9a-04","type":"tf","q":"undirected graph 의 adjacency matrix 는 항상 대칭 행렬이다 ($A = A^T$).","explain":"$\\{u,v\\}$ 가 있으면 $A[u][v]=A[v][u]=1$ 이다. directed 로 가면 $(3,4)$ 와 $(4,3)$ 이 따로라 대칭이 깨진다.","src":"9강 p.15","wiki":"adjacency matrix","tags":["matrix"],"answer":true,"introCard":1},{"id":"u9a-05","type":"tf","q":"directed graph 의 adjacency matrix 에서 행(row)은 destination, 열(column)은 source 다.","explain":"반대다. 슬라이드 p.17: **row = Source, column = Destination**. 그래서 행 하나가 out-neighbor, 열 하나가 in-neighbor 를 보여 준다.","src":"9강 p.17 · 10/20 녹음","wiki":"adjacency matrix","prof":true,"tags":["matrix","directed"],"answer":false,"introCard":1},{"id":"u9a-06","type":"match","q":"그래프 표현(adjacency matrix / adjacency list)과 연산의 비용을 연결하시오 ($n$ = 정점 수, $m$ = 간선 수)","explain":"matrix 는 칸 하나를 바로 보니 membership 이 $O(1)$ 이지만, 이웃을 찾으려면 행 전체($n$칸)를 훑는다. list 는 실제 이웃만큼만 본다. 교수가 학생에게 칸마다 물어보며 채운 표다.","src":"9강 p.20 · 10/20 녹음","wiki":"matrix vs list 비교표","prof":true,"tags":["matrix","list"],"pairs":[["matrix · edge membership","$O(1)$"],["matrix · neighbor query","$O(n)$"],["list · neighbor query","$O(\\deg(v))$"],["list · space","$O(n+m)$"],["matrix · space","$O(n^2)$"]],"introCard":1},{"id":"u9a-07","type":"mc","q":"이 과목에서 따로 말이 없으면 그래프를 어떤 자료구조로 저장한다고 가정하나? (이후 모든 $O(n+m)$ 이 이 가정 위에 있다)","explain":"'Generally better for sparse graphs … We'll assume this representation for the rest of the class.' 이후 모든 $O(n+m)$ 은 adjacency list 가정이다.","src":"9강 p.20","wiki":"adjacency list","prof":true,"tags":["list"],"choices":["adjacency matrix","adjacency list","edge list","incidence matrix"],"answer":1,"introCard":1},{"id":"u9a-08","type":"cloze","q":"adjacency list 에서 undirected 간선 $\\{u,v\\}$ 는 ___ 개의 리스트에 나타나므로 리스트 길이의 총합은 ___ 이다.","explain":"$u$ 의 리스트에 $v$, $v$ 의 리스트에 $u$. 간선마다 두 번이라 총합 $2m$. directed 면 $u$ 쪽에만 있어서 $m$.","src":"9강 p.18","wiki":"adjacency list","tags":["list"],"answer":["2","2m"],"bank":["2","2m","1","m","n+m"],"introCard":2},{"id":"u9a-09","type":"mc","q":"adjacency **matrix** 위에서 DFS 나 BFS 를 돌리면 수행 시간은?","explain":"정점마다 이웃을 찾으려고 행 전체 $n$칸을 본다. $n$개 정점 × $n$칸 = $O(n^2)$. '$O(n+m)$' 은 list 일 때만 맞는 답이라 시험 함정이다.","src":"9강 p.20","wiki":"matrix vs list 비교표","tags":["matrix","running time"],"choices":["$O(n+m)$","$O(n^2)$","$O(nm)$","$O(m\\log n)$"],"answer":1,"introCard":1},{"id":"u9a-10","type":"tf","q":"dense graph ($m=\\Theta(n^2)$) 에서는 adjacency matrix 와 list 의 공간이 점근적으로 같다.","explain":"list 공간 $O(n+m) = O(n+n^2) = O(n^2)$ 로 matrix 와 같아진다. 그때는 matrix 의 $O(1)$ membership 이 이득이다.","src":"9강 p.20","wiki":"matrix vs list 비교표","tags":["matrix","list"],"answer":true,"introCard":1},{"id":"u9a-11","type":"sa","q":"정점 $n$개, 간선 $m$개인 그래프를 adjacency list 로 저장할 때 공간 복잡도는? (Big-O 로)","explain":"정점 배열 $n$칸 + 리스트 원소 $2m$개(undirected) 또는 $m$개(directed) → $O(n+m)$.","src":"9강 p.20","wiki":"adjacency list","tags":["list"],"answer":"O(n+m)","alts":["O(m+n)","Θ(n+m)"],"introCard":2},{"id":"u9a-12","type":"num","q":"정점 5개인 undirected graph 를 adjacency list 로 저장했더니 리스트 원소가 모두 12개였다. 간선 수 $m$ 은?","explain":"undirected 는 간선마다 두 리스트에 들어가므로 총 길이 $=2m=12$, $m=6$.","src":"9강 p.18","wiki":"n과 m (그래프)","tags":["list","degree"],"answer":6,"tol":0,"introCard":2},{"id":"u9a-13","type":"mc","q":"adjacency list 에서 'edge $\\{v,w\\}$ 가 있는가' 를 확인하는 비용을 가장 정확하게 쓴 것은?","explain":"$v$ 의 리스트를 훑으면 된다. 최악은 $O(n)$ 일 수 있지만 교수 말로 'more specifically depends on degree' → $O(\\deg(v))$ (또는 $O(\\deg(w))$).","src":"9강 p.20 · 10/20 녹음","wiki":"matrix vs list 비교표","prof":true,"tags":["list"],"choices":["$O(1)$","$O(\\deg(v))$","$O(m)$","$O(n^2)$"],"answer":1,"introCard":2},{"id":"u9a-14","type":"tf","q":"directed graph 에서 $\\sum_v \\text{in-deg}(v) = \\sum_v \\text{out-deg}(v) = m$ 이다.","explain":"간선 $(u,v)$ 하나는 $u$ 의 out-degree 에 1, $v$ 의 in-degree 에 1 을 보탠다. 둘 다 합이 $m$.","src":"9강 p.14","wiki":"in-degree와 out-degree","tags":["degree","directed"],"answer":true,"introCard":0},{"id":"u9a-15","type":"cloze","q":"directed graph 의 adjacency list 는 $u$ 의 리스트에 ___ 만 저장한다. in-neighbor 가 필요하면 ___ 리스트를 따로 둔다.","explain":"간선 $(u,v)$ 는 $u$ 의 리스트에만 한 번. in-neighbor 용 reverse 리스트는 L10 SCC 의 $G^T$ 에서 다시 나온다.","src":"9강 p.18 · 10/20 녹음","wiki":"adjacency list","tags":["list","directed"],"answer":["out-neighbor","reverse"],"bank":["out-neighbor","reverse","in-neighbor","undirected","sorted"],"introCard":2},{"id":"u9a-16","type":"mc","q":"그림은 directed graph 와 그 adjacency matrix 다 (row = Source, column = Destination). 가린 칸 ①(2행 4열)과 ②(4행 2열)의 값은?","explain":"①은 간선 $(2,4)$ 가 있느냐다. $E$ 에 $(2,4)$ 가 있으니 1. ②는 $(4,2)$ 인데, 4 에서 나가는 간선은 $(4,3)$ 하나뿐이라 0이다. directed 행렬은 대칭이 아니어서 ①과 ②가 다르다. 둘 다 1로 고르면 undirected 처럼 읽은 것이다.","src":"9강 p.17","wiki":"adjacency matrix","tags":["matrix","directed","그림"],"img":"img/algo9-p17-matrix.png","imgAlt":"p.17 directed graph(1,2,3,4)와 4×4 adjacency matrix, 두 칸이 ①② 로 가려져 있다","explainImg":"img/algo9-p17-matrix-ans.png","choices":["① 1, ② 0","① 1, ② 1","① 0, ② 1","① 0, ② 0"],"answer":0,"introCard":1},{"id":"u9a-17","type":"mc","q":"[Circle all 형식] adjacency **list** ($n$ 정점, $m$ 간선) 에 대해 옳은 것을 **모두** 고른 조합은? (1) space 는 $O(n+m)$ (2) edge membership 은 $O(1)$ (3) neighbor query 는 $O(\\deg(v))$ (4) undirected 면 리스트 길이 합은 $2m$ (5) 이 표현 위 DFS 는 $O(n^2)$","explain":"(1) 참: 정점 배열 $n$ + 리스트 원소 $2m$. (2) 거짓: $\\{v,w\\}$ 를 찾으려면 $v$ 의 리스트를 훑어야 해서 $O(\\deg(v))$. $O(1)$ 은 matrix 다. (3) 참. (4) 참: 간선 하나가 양쪽 리스트에 한 번씩. (5) 거짓: list 위 DFS 는 $O(n+m)$, $O(n^2)$ 은 matrix 위 DFS. 중간고사 1번처럼 부분점수가 없으니 (2) 같은 matrix 쪽 사실을 하나 더 고르면 0점이다.","src":"9강 p.18–20 · 중간 1번 형식","wiki":"matrix vs list 비교표","tags":["list","circle-all"],"choices":["(1)(3)(4)","(1)(2)(3)(4)","(1)(3)","(3)(4)(5)"],"answer":0,"introCard":2}],"intro":[{"title":"그래프와 degree","body":"그래프 $G=(V,E)$: 정점 $n$ 개, 간선 $m$ 개. undirected 에서 정점의 **degree** 는 닿은 간선 수이고, 간선 하나가 양 끝에서 한 번씩 세어져 $\\sum_v \\deg(v) = 2m$. directed 에서는 **in-degree**(들어오는 간선)와 **out-degree**(나가는 간선)를 따로 세고, 각각의 합이 $m$ 이다.","src":"9강 p.12–14"},{"title":"adjacency matrix","body":"$n\\times n$ 표에서 $A[u][v]=1$ 이면 간선이 있다. undirected 면 대칭($A=A^T$). directed 면 **row = Source, column = Destination** 이라 행 하나가 out-neighbor, 열 하나가 in-neighbor 다. 칸 하나를 바로 보니 edge membership $O(1)$, 이웃 찾기는 행 전체 $O(n)$, 공간 $O(n^2)$.","img":"img/algo9-p17-matrix-ans.png","imgAlt":"directed graph 와 adjacency matrix (row = Source)","src":"9강 p.15–17"},{"title":"adjacency list","body":"정점마다 이웃 리스트를 둔다. undirected 간선 $\\{u,v\\}$ 는 $u$ 리스트와 $v$ 리스트에 한 번씩 들어가 리스트 길이 합이 $2m$, directed 는 $m$(out-neighbor 만; in-neighbor 가 필요하면 reverse list 를 따로). 공간 $O(n+m)$, 이웃 찾기 $O(\\deg(v))$, edge membership 도 $O(\\deg(v))$.","img":"img/algo9-p18-list.png","imgAlt":"정점 1~4 의 linked list 표현","src":"9강 p.18"},{"title":"trade-off 와 수업의 가정","body":"sparse 그래프($m \\ll n^2$)에서는 list 가 공간·이웃 찾기 모두 유리하다. dense($m=\\Theta(n^2)$)면 공간은 둘 다 $\\Theta(n^2)$. **이 과목은 따로 말이 없으면 adjacency list 를 가정**하고, 그래서 DFS/BFS 가 $O(n+m)$ 이다. matrix 위에서 돌리면 $O(n^2)$.","src":"9강 p.20"}]},{"id":"u9b","title":"DFS 와 start/finish time","items":[{"id":"u9b-01","type":"mc","q":"DFS 의 세 상태 중, 그 시점의 재귀 call stack 위에 있는 정점들의 상태는?","explain":"in progress(주황, CLRS 의 GRAY) 정점은 start 에서 현재 위치까지의 '실' 한 줄이고, 그게 call stack 이다. all done 은 이미 return 한 정점.","src":"9강 p.23–39","wiki":"DFS 세 가지 색","tags":["DFS"],"choices":["unvisited","in progress","all done","세 상태가 섞여 있다"],"answer":1,"introCard":0},{"id":"u9b-02","type":"cloze","q":"수업의 DFS 의사코드: `w.startTime = t; t++` → 이웃 v 가 ___ 이면 `t = DFS(v, t)` 다음 ___ → 루프 끝나면 `w.finishTime = t`.","explain":"재귀 호출 **직후** `t++` 가 있다. 그래서 정점마다 시각이 정확히 두 번 오르고, leaf 는 finish = start + 1 이 된다.","src":"9강 p.40","wiki":"DFS","tags":["DFS","pseudocode"],"answer":["unvisited","t++"],"bank":["unvisited","t++","in progress","done","t--"],"introCard":1},{"id":"u9b-03","type":"num","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 이웃은 알파벳 순, 시작점도 알파벳 순, 수업 DFS 시각 규약(시각 0 부터, 재시작은 직전 finish+1). A 의 finish time 은?","explain":"A0 → B1 → C2, C 는 이웃 없음 → C3 → B4 → (A 로 와서 ++) D5 → C 는 done, E6 → E7 → D8 → A9.","src":"9강 p.40–46 (연습)","wiki":"start time과 finish time","diff":2,"tags":["DFS","trace"],"answer":9,"tol":0,"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":1},{"id":"u9b-04","type":"num","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 이웃은 알파벳 순, 시작점도 알파벳 순, 수업 DFS 시각 규약(시각 0 부터, 재시작은 직전 finish+1). D 의 start time 은?","explain":"B 가 4 에 끝나고 A 로 돌아오며 ++ 해서 5. D.start = 5.","src":"9강 p.40–46 (연습)","wiki":"start time과 finish time","tags":["DFS","trace"],"answer":5,"tol":0,"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":1},{"id":"u9b-05","type":"num","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 이웃은 알파벳 순, 시작점도 알파벳 순, 수업 DFS 시각 규약(시각 0 부터, 재시작은 직전 finish+1). A 에서 시작한 DFS 가 끝난 뒤 F 에서 다시 시작한다. F 의 start time 은?","explain":"A.finish = 9, 재시작은 직전 finish + 1 → 10 (슬라이드 SCC 예제에서 KAIST 가 DGIST 10 다음 11 로 시작한 것과 같은 규약). F 는 E 가 이미 done 이라 finish 11.","src":"9강 p.48 · 10강 p.28","wiki":"DFS tree와 DFS forest","tags":["DFS","trace"],"answer":10,"tol":0,"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":1},{"id":"u9b-06","type":"mc","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 이웃은 알파벳 순, 시작점도 알파벳 순, 수업 DFS 시각 규약(시각 0 부터, 재시작은 직전 finish+1). C 의 (start, finish) 는?","explain":"A0 → B1 → C2. C 는 나가는 간선이 없어 바로 끝나므로 finish 3. 나중에 D 가 C 를 다시 보지만 이미 done 이라 건너뛴다.","src":"9강 p.40–46 (연습)","wiki":"start time과 finish time","tags":["DFS","trace"],"choices":["(2, 3)","(3, 4)","(2, 5)","(1, 4)"],"answer":0,"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":1},{"id":"u9b-07","type":"tf","q":"수업 DFS 시각 규약에서 새 이웃이 없는 정점(leaf)은 finish = start + 1 이다.","explain":"start 대입 뒤 `t++` 한 번, 루프를 안 돌고 바로 finish = t. 그래서 +1.","src":"9강 p.40","wiki":"start time과 finish time","tags":["DFS"],"answer":true,"introCard":1},{"id":"u9b-08","type":"tf","q":"수업 DFS 의 start/finish 값(시각 0 부터)은 CLRS 의 $d, f$ 값(시각 1 부터)보다 1 크다.","explain":"1 **작다**. CLRS 는 time=0 에서 먼저 ++ 해서 1..2n, 슬라이드는 0..2n−1. 예: p.41 A 는 슬라이드 0/7, CLRS 1/8.","src":"9강 p.40–46","wiki":"start time과 finish time","tags":["DFS"],"answer":false,"introCard":1},{"id":"u9b-09","type":"mc","q":"parenthesis theorem 에서 두 정점의 구간 [start, finish] 가 **가질 수 없는** 관계는?","explain":"DFS 는 재귀라서, $u$ 가 진행 중일 때 시작한 $v$ 는 $u$ 보다 먼저 끝나야 $u$ 로 돌아온다. 그래서 포함 아니면 서로소고, 엇갈림 `( [ ) ]` 은 없다.","src":"9강 p.61","wiki":"parenthesis theorem","prof":true,"tags":["parenthesis"],"choices":["한 구간이 다른 구간을 포함","두 구간이 서로소","$s_u \u003c s_v \u003c f_u \u003c f_v$ 처럼 일부만 겹침","$v$ 가 $u$ 의 descendant 일 때 포함"],"answer":2,"introCard":1},{"id":"u9b-10","type":"tf","q":"parenthesis theorem 은 DAG 에서만 성립한다.","explain":"cycle 이 있어도 성립한다. DAG 가정이 필요한 건 topo sort Claim 증명의 Case 2 뿐이다.","src":"9강 p.61–63","wiki":"parenthesis theorem","tags":["parenthesis","DAG"],"answer":false,"introCard":2},{"id":"u9b-11","type":"mc","q":"'DFS 한 번이 $O(m)$ 이고 정점마다 다시 시작하니 전체 DFS 는 $O(n\\cdot m)$' 이라는 주장에 대한 올바른 답은?","explain":"전체 탐색에서 각 정점은 최대 한 번 방문, 각 간선은 최대 두 번(undirected) 스캔된다. 전부 고립이면 $O(n)$, 전부 연결이면 $O(m)$ → 합쳐 $O(n+m)$. 시험에 $O(nm)$ 보기가 나오면 오답.","src":"9강 p.51 · 10/20 녹음","wiki":"O(n+m)","prof":true,"tags":["running time"],"choices":["맞다, $O(nm)$","not n times m, **n plus m**","$O(n^2)$","$O(m\\log n)$"],"answer":1,"introCard":3},{"id":"u9b-12","type":"order","q":"DFS 전체 수행 시간이 $O(n+m)$ 인 논증을 순서대로","explain":"분석 템플릿: 'Each vertex is processed once, each edge is scanned twice → O(n+m)'. matrix 면 둘째 줄이 $O(n)$ 이 되어 $O(n^2)$.","src":"9강 p.50–51","wiki":"O(n+m)","tags":["running time","proof"],"answer":["각 정점에서 DFS 는 정확히 한 번 호출된다 (unvisited 일 때만, 호출 즉시 in progress)","한 번의 호출 비용은 재귀 제외 $O(1)+O(\\deg(v))$","모두 더하면 $\\sum_v (1+\\deg(v)) = n+2m$","바깥 루프의 unvisited 확인 $O(n)$ 까지 합쳐 $O(n+m)$"],"introCard":3},{"id":"u9b-13","type":"match","q":"그림의 directed graph 를 A 에서 시작해 DFS 했다(이웃은 알파벳 순, 숫자는 start/finish). 각 간선이 처음 검사될 때의 종류를 연결하시오 (CLRS 22.3)","explain":"간선 (u,v) 를 볼 때 v 의 상태로 판정한다. **A→B**: B 가 unvisited → tree. **C→A**: A 는 아직 in progress(스택에 있음, C 의 조상) → back. **A→C**: C 는 B 를 거쳐 이미 done, A.start 0 \u003c C.start 2 → A 의 자손으로 가는 지름길 = forward. **D→C**: C 는 done, C.start 2 \u003c D.start 5 → 조상도 자손도 아님 = cross. 괄호 (A (B (C C) B) (D D) A) 로 보면 C 는 A 안(forward), D 와는 옆 괄호(cross).","src":"9강 보충 (CLRS 22.3)","wiki":"DFS tree와 DFS forest","tags":["edge classification"],"pairs":[["A→B","tree edge"],["C→A","back edge"],["A→C","forward edge"],["D→C","cross edge"]],"img":"img/algo9-gen-u9b13-graph.png","imgAlt":"A→B, A→C, A→D, B→C, C→A, D→C 그래프. start/finish A 0/7, B 1/4, C 2/3, D 5/6","explainImg":"img/algo9-gen-u9b13-graph-ans.png","introCard":1},{"id":"u9b-14","type":"tf","q":"undirected graph 의 DFS 에는 cross edge 가 생기지 않는다.","explain":"undirected DFS 에는 tree edge 와 back edge 만 있다 (CLRS Thm 22.10). p.49 DFS tree 의 점선이 전부 조상–자손을 잇는 이유.","src":"9강 p.49","wiki":"DFS tree와 DFS forest","tags":["edge classification"],"answer":true,"introCard":3},{"id":"u9b-15","type":"mc","q":"directed graph 에서 DFS(w) 가 방문하는 정점 집합은?","explain":"p.52: A→C, B→A 에서 A 에서 시작하면 C 만 가고 B 는 못 간다. reachable set 이지 component 가 아니다 (SCC 는 L10).","src":"9강 p.47, 52","wiki":"DFS","tags":["DFS","directed"],"choices":["w 와 같은 SCC 의 정점들","w 에서 간선 방향을 따라 도달 가능한 정점 전부, 그리고 그것만","w 로 들어오는 경로가 있는 정점","모든 정점"],"answer":1,"introCard":3},{"id":"u9b-16","type":"num","q":"정점이 7개인 그래프 전체를 수업 DFS 시각 규약 DFS 로 탐색할 때 (재시작 없이 한 tree 라고 하자) 가장 큰 시각 값은?","explain":"정점마다 시각이 두 번 오르고 0 부터 시작하므로 시각은 0, 1, …, 2n−1 이 모두 다르다. $2\\cdot7-1 = 13$.","src":"9강 p.40","wiki":"start time과 finish time","tags":["DFS"],"answer":13,"tol":0,"introCard":1},{"id":"u9b-17","type":"num","q":"그림은 패키지 의존 그래프에 DFS(dpkg 에서 시작)를 돌려 정점마다 start/finish 를 적은 것이다. 가려진 coreutils 의 finish time 은?","explain":"coreutils 는 start 9 에 들어간다. 그 이웃(libbz2, libselinux1)은 이미 all done 이라 재귀 호출이 없다. 그래서 `currentTime++` 한 번 뒤 바로 끝나 finish = 9 + 1 = 10 이다. 그다음 dpkg 로 돌아와 finish 11. 새 이웃이 없는 정점은 finish = start + 1 이다.","src":"9강 p.59","wiki":"start time과 finish time","tags":["DFS","그림"],"img":"img/algo9-p59-dpkg.png","imgAlt":"p.59 dpkg 의존 그래프와 정점별 start/finish, coreutils 의 finish 가 가려져 있다","explainImg":"img/algo9-p59-dpkg-ans.png","answer":10,"tol":0,"introCard":1},{"id":"u9b-18","type":"mc","q":"[Circle all 형식] DFS 에 대해 옳은 것을 **모두** 고른 조합은? (1) 같은 그래프의 DFS tree 는 하나로 정해진다 (2) parenthesis theorem 은 cycle 이 있어도 성립한다 (3) 그래프 전체를 탐색하는 DFS 는 $O(n+m)$ (4) directed graph 에서 DFS(w) 한 번이면 모든 정점을 방문한다 (5) 새 이웃이 없는 정점은 finish = start + 1","explain":"(1) 거짓: 이웃을 보는 순서·시작점에 따라 tree 가 달라진다. (2) 참: p.61 빨간 글씨 '(this holds even if there are cycles)'. (3) 참: component 마다 다시 시작해도 $O(n+m)$. (4) 거짓: DFS(w) 는 w 에서 **도달 가능한** 정점만 본다(p.52 'Only walk to C, not to B'). (5) 참: `startTime = t; t++` 뒤 재귀 없이 `finishTime = t`. 함정은 (1)과 (4)다.","src":"9강 p.40–52, 61 · 중간 1번 형식","wiki":"parenthesis theorem","tags":["DFS","circle-all"],"choices":["(2)(3)(5)","(1)(2)(3)(5)","(2)(3)","(3)(4)(5)"],"answer":0,"introCard":1},{"id":"u9b-19","type":"cloze","q":"[분석 템플릿 칸] undirected graph 에서 DFS 전체 수행 시간: Each vertex is processed ___ time(s), each edge is scanned ___ time(s) → $O(n+m)$. 그래서 $n$ 번 DFS 를 '반복' 하는 것처럼 보여도 ___ 이 아니다.","explain":"정점은 unvisited 일 때만 DFS 가 불리니 한 번. 간선 $\\{u,v\\}$ 는 $u$ 의 리스트에서 한 번, $v$ 의 리스트에서 한 번 해서 두 번 본다. 합치면 $n + 2m = O(n+m)$. 교수가 'not n times m, n plus m' 이라고 고친 지점이다. 중간 8b·9b 에서 이런 분석 줄을 안 써서 4점씩 잃었다. 그래프 설계 문제에서는 이 문장이 master method 자리를 대신한다.","src":"9강 p.50–51 · 주간문제집 TEMPLATE §0-5","wiki":"O(n+m)","tags":["DFS","running time","analysis"],"answer":["1","2","O(nm)"],"bank":["1","2","O(nm)","0","O(n)"],"introCard":3}],"intro":[{"title":"DFS 의 세 상태","body":"Depth-First Search 는 미로를 분필과 실로 탐험하듯 갈 수 있는 데까지 깊이 들어갔다 돌아온다. 정점 상태는 **unvisited**(아직 안 감), **in progress**(들어갔지만 아직 나가지 않음, 즉 재귀 call stack 위), **all done**(모든 길을 다 봄) 세 가지다.","src":"9강 p.23–39"},{"title":"수업 DFS 시각 규약","body":"`DFS(w, t)`: `w.start = t; t++` → 이웃 v 가 **unvisited** 일 때만 `t = DFS(v, t); t++` → 루프가 끝나면 `w.finish = t`. 시각은 **0 부터**, 이웃은 문제에 적힌 순서(보통 알파벳 순). 새 이웃이 없는 정점은 finish = start + 1. 다 끝났는데 unvisited 가 남으면 **직전 finish + 1** 로 다시 시작한다. 정점 $n$ 개면 시각은 0 ~ $2n-1$ (CLRS 는 1 부터라 1 작다).","img":"img/algo9-p40-dfs.png","imgAlt":"DFS(w, currentTime) 의사코드","src":"9강 p.40–48"},{"title":"parenthesis theorem","body":"두 정점의 구간 [start, finish] 는 **포함되거나(조상–자손) 서로소**다. $s_u \u003c s_v \u003c f_u \u003c f_v$ 처럼 일부만 겹치는 일은 없다. cycle 이 있어도 성립한다. DFS 가 실제로 만든 tree(DFS tree, 재시작하면 forest)는 이웃 순서에 따라 달라진다.","img":"img/algo9-p61-paren.png","imgAlt":"세 경우의 start/finish 구간 그림","src":"9강 p.49, 61"},{"title":"DFS 의 범위와 수행 시간","body":"DFS(w) 한 번은 w 에서 **도달 가능한** 정점만 방문한다(directed 면 방향을 따라). 전체를 보려면 unvisited 정점에서 다시 시작한다. 정점마다 한 번 호출, 호출마다 이웃 리스트를 한 번 훑으니 $\\sum_v (1+\\deg v) = O(n+m)$. 'n 번 × O(m)' 이 아니다.","src":"9강 p.47–52"}]},{"id":"u9c","title":"DAG 와 topological sort","items":[{"id":"u9c-01","type":"mc","q":"DAG 의 topological ordering 의 정의는?","explain":"정의 그대로다. finish 내림차순은 그런 순서를 **만드는 방법**이지 정의가 아니다.","src":"9강 p.58","wiki":"topological ordering","tags":["topo"],"choices":["start time 오름차순","모든 directed edge $(u,v)$ 에 대해 $u$ 가 $v$ 보다 앞에 오는 순서","in-degree 오름차순","BFS layer 순서"],"answer":1,"introCard":1},{"id":"u9c-02","type":"mc","q":"directed graph $G$ 가 DAG 인 것과 동치인 것은?","explain":"G 가 DAG ⇔ topological order 존재 ⇔ DFS 에 back edge 없음. 방향을 무시한 cycle 은 상관없다.","src":"9강 p.58","wiki":"DAG","tags":["DAG"],"choices":["topological order 가 존재한다","방향을 무시해도 cycle 이 없다","모든 정점의 in-degree ≥ 1","strongly connected 다"],"answer":0,"introCard":0},{"id":"u9c-03","type":"tf","q":"방향을 무시하면 cycle 이 보이는 directed graph 는 DAG 가 아니다.","explain":"DAG 는 **directed** cycle 만 따진다. 화살표가 한 방향으로 돌지 않으면 DAG 다 (p.56–57 그림 판정).","src":"9강 p.56–57","wiki":"DAG","tags":["DAG"],"answer":false,"introCard":0},{"id":"u9c-04","type":"mc","q":"DAG 의 topological order 를 DFS 로 얻으려면 정점을 무엇 순으로 나열해야 하나? ('start time 오름차순' 은 반례가 있다)","explain":"coreutils 가 libbz2 보다 먼저인데 start 가 더 늦다는 반례. 정답은 finish 내림차순이고 '왜 되는지 생각해 와라' 는 숙제성 질문이 붙었다.","src":"9강 p.59–65 · 10/20 녹음","wiki":"topological sort","prof":true,"tags":["topo"],"choices":["start time 내림차순","finish time 오름차순","finish time 내림차순","in-degree 오름차순"],"answer":2,"introCard":2},{"id":"u9c-05","type":"order","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 이웃은 알파벳 순, 시작점도 알파벳 순, 수업 DFS 시각 규약(시각 0 부터, 재시작은 직전 finish+1). finish time 내림차순으로 정점을 나열하시오.","explain":"finish: F11, A9, D8, E7, B4, C3. 검증: A→B, A→D, B→C, D→C, D→E, F→E 모두 앞 → 뒤.","src":"9강 p.64 (연습)","wiki":"topological sort","tags":["topo","trace"],"answer":["F","A","D","E","B","C"],"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":2},{"id":"u9c-06","type":"tf","q":"한 DAG 의 topological order 는 하나뿐이다.","explain":"서로 간선이 없는 두 정점은 순서가 자유라 여러 개일 수 있다. 위 G 에서도 F, A, D, E, B, C 와 A, D, B, C, F, E 둘 다 맞다.","src":"9강 p.58","wiki":"topological ordering","tags":["topo"],"answer":false,"introCard":0},{"id":"u9c-07","type":"cloze","q":"DAG 에서 간선 A→B 가 있으면 A.finish ___ B.finish 이다. 이 Claim 의 증명에서 ___ 가정은 Case 2 에서만 쓰인다.","explain":"Case 1(B 가 A 의 descendant)은 parenthesis theorem 만으로 끝나고, Case 2 에서 'B 진행 중 A 에 닿으면 cycle' 이라는 부분에 DAG 가 쓰인다.","src":"9강 p.60–63","wiki":"topological sort","tags":["topo","proof"],"answer":[">","acyclic"],"bank":[">","acyclic","\u003c","=","connected"],"introCard":3},{"id":"u9c-08","type":"order","q":"Claim (A→B ⇒ B.finish \u003c A.finish) 의 Case 2 증명을 순서대로","explain":"교수가 10/22 판서로 2 case 를 보였다. '왜 B 를 먼저 explore 해야 하나?' 가 핵심 질문.","src":"9강 p.62–63 · 10/22 녹음","wiki":"topological sort","prof":true,"tags":["topo","proof"],"answer":["B 가 A 의 descendant 가 아니라고 하자","A 를 먼저 시작했다면 A→B 를 따라 B 가 descendant 가 됐을 것이므로, B 를 먼저 시작했다","B 진행 중 A 에 닿으면 B⇝A 경로와 A→B 로 cycle 이 생겨 DAG 에 모순","그러므로 B 는 A 가 시작하기 전에 끝나고 B.finish \u003c A.finish"],"introCard":3},{"id":"u9c-09","type":"mc","q":"Claim 증명의 Case 1 (B 가 DFS tree 에서 A 의 descendant) 은 무엇으로 바로 끝나는가?","explain":"descendant 이면 A.start \u003c B.start \u003c B.finish \u003c A.finish. 구간 포함이 곧 결론이다.","src":"9강 p.62","wiki":"parenthesis theorem","tags":["topo","proof"],"choices":["parenthesis theorem","white-path theorem","BFS layer 성질","Kőnig 정리"],"answer":0,"introCard":3},{"id":"u9c-10","type":"cloze","q":"topo sort 코드: dfs 가 u 를 done 으로 칠하는 순간 리스트에 u 를 ___ 하고, 모든 DFS 가 끝나면 그 리스트를 ___ 한다.","explain":"append 하면 finish 오름차순이 쌓이니 뒤집으면 내림차순 = topo order. 정렬이 필요 없어서 $O(n+m)$ 이다.","src":"9강 p.66–67 · 10/22 녹음","wiki":"topological sort","tags":["topo","pseudocode"],"answer":["append","reverse"],"bank":["append","reverse","sort","pop","insert"]},{"id":"u9c-11","type":"mc","q":"DFS 도중 이웃 v 의 상태가 무엇이면 그 간선이 back edge 이고 cycle 이 있다는 뜻인가?","explain":"in progress 인 v 는 지금 call stack 위의 조상이다. 조상으로 돌아가는 간선 = back edge = directed cycle. topo sort 코드에 이 검사를 넣으면 cycle 검출이 된다.","src":"9강 p.67","wiki":"DAG","tags":["cycle","DFS"],"choices":["unvisited","in progress","done","상태와 무관"],"answer":1,"introCard":0},{"id":"u9c-12","type":"mc","q":"G: A→B, A→D, B→C, D→C, D→E, F→E. 다음 중 topological order 가 **아닌** 것은?","explain":"마지막은 E 가 D 보다 앞인데 간선 D→E 가 있다. 나머지 셋은 여섯 간선이 모두 앞 → 뒤 방향이다.","src":"주간문제집 W01 유형","wiki":"topological ordering","tags":["topo","figure"],"choices":["F, A, D, E, B, C","A, D, B, C, F, E","A, B, D, C, F, E","A, B, C, E, D, F"],"answer":3,"img":"img/algo9-gen-u9b-03.png","imgAlt":"directed graph: A→B, A→D, B→C, D→C, D→E, F→E","introCard":1},{"id":"u9c-13","type":"num","q":"directed G: A→C, C→D, C→B, D→B. A 에서 DFS 를 시작하고 C 는 D 를 B 보다 먼저 방문한다(수업 DFS 시각 규약, 시각 0 부터). C 의 finish time 은?","explain":"A0, C1, D2, B3 → B leave 4 → D leave 5 → C leave 6 → A leave 7. topo order A C D B.","src":"9강 p.68–75","wiki":"topological sort","tags":["topo","trace"],"answer":6,"tol":0,"img":"img/algo9-p75-topo.png","imgAlt":"A, B, C, D 그래프와 start time (finish 는 가려져 있다)","introCard":2},{"id":"u9c-14","type":"tf","q":"간선을 'u 가 v 에 의존한다(u depends on v)' 로 그렸다면, 설치 순서는 finish **오름차순** 이다.","explain":"수업 DFS 시각 규약은 $u\\to v$ = 'u 를 먼저'. 의존 방향으로 간선을 그리면 화살표가 반대라 오름차순으로 설치한다. 시험에서는 간선 의미부터 확인.","src":"9강 p.64–65","wiki":"topological sort","tags":["topo"],"answer":true,"introCard":1},{"id":"u9c-15","type":"mc","q":"BST (5; 3, 7; 2, 4, 8; 1 은 2 의 왼쪽) 를 **post-order** 로 출력하면?","explain":"post-order = DFS 에서 '나올 때' 출력. in-order(왼쪽 끝난 뒤·오른쪽 전)는 1 2 3 4 5 7 8, pre-order 는 5 3 2 1 4 7 8. 교수가 print 줄 위치만 바꿔 시연했다.","src":"9강 p.77 · 10/22 녹음","wiki":"tree traversal과 DFS","tags":["traversal"],"choices":["1 2 3 4 5 7 8","5 3 2 1 4 7 8","1 2 4 3 8 7 5","1 2 4 3 7 8 5"],"answer":2,"img":"img/algo9-p77-bst.png","imgAlt":"p.77 BST: 5 아래 3·7, 3 아래 2·4, 2 아래 1, 7 아래 8","introCard":4},{"id":"u9c-16","type":"num","q":"그림의 여섯 그래프 중 DAG(directed cycle 이 없는 directed graph) 는 몇 개인가?","explain":"화살표를 따라가다 제자리로 돌아오는 경로가 있으면 DAG 가 아니다. 위 줄 셋은 화살표를 따라가도 출발점으로 돌아오지 않는다. 아래 줄 셋은 둘레를 한 방향으로 돌거나 두 정점이 서로를 가리켜(2-cycle) directed cycle 이 생긴다. 방향을 무시했을 때 보이는 고리는 상관없다. p.57 에서 위 줄 셋에 동그라미가 쳐졌다.","src":"9강 p.56–57","wiki":"DAG","tags":["DAG","그림"],"img":"img/algo9-p56-dags.png","imgAlt":"p.56 작은 directed graph 여섯 개 (위 3개, 아래 3개)","explainImg":"img/algo9-p57-dags-ans.png","answer":3,"tol":0,"introCard":0},{"id":"u9c-17","type":"order","q":"그림은 A 에서 시작한 DFS 의 start time 만 남기고 Leave(finish) 를 가린 것이다. 간선은 A→C, C→D, C→B, D→B 다. finish 를 채워 topological order 를 만드시오.","explain":"start 가 A0, C1, D2, B3 이니 방문 순서는 A→C→D→B 다. B 는 나가는 간선이 없어 바로 끝나 finish 4. 돌아가며 D 5, C 6, A 7. finish 내림차순이 A(7), C(6), D(5), B(4) 다. 슬라이드의 'Do them in this order: A C D B' 다.","src":"9강 p.68–75","wiki":"topological sort","tags":["topo","그림"],"img":"img/algo9-p75-topo.png","imgAlt":"p.75 A,B,C,D 그래프와 start time, Leave 값은 가려져 있다","explainImg":"img/algo9-p75-topo-ans.png","answer":["A","C","D","B"],"introCard":2},{"id":"u9c-18","type":"sa","q":"그림은 패키지 의존 그래프와 DFS 의 start/finish time 이다. finish time 내림차순 목록(=topological order)을 만들 때 **세 번째** 패키지는?","explain":"finish 를 큰 순서로 놓으면 dpkg 11, coreutils 10, tar 8, libbz2 6, libselinux1 5, multiarch-support 4 다. 세 번째는 tar. p.65 처럼 'all done 이 될 때마다 리스트 맨 앞에 넣는' 방식과 결과가 같다.","src":"9강 p.59, 65","wiki":"topological sort","tags":["topo","그림"],"img":"img/algo9-p59-dpkg-ans.png","imgAlt":"p.59 dpkg 의존 그래프와 정점별 start/finish time","answer":"tar","introCard":2}],"intro":[{"title":"DAG","body":"**DAG** = directed cycle 이 없는 directed graph. 화살표를 따라가다 제자리로 돌아올 수 없으면 DAG 다. 방향을 무시하고 보이는 고리는 상관없다. 패키지 의존 관계가 대표적인 예다.","img":"img/algo9-p57-dags-ans.png","imgAlt":"여섯 그래프 중 위 줄 셋이 DAG","src":"9강 p.55–57"},{"title":"topological ordering","body":"DAG 의 정점을 일렬로 놓되 **모든 간선 $(u,v)$ 에 대해 $u$ 가 $v$ 앞**에 오게 한 순서. DAG ⇔ topological order 가 존재. 보통 여러 개다.","src":"9강 p.58"},{"title":"DFS 로 만들기: finish 내림차순","body":"DAG 에 DFS 를 돌려 **finish time 이 큰 순서**로 놓으면 topological order 다. 코드에서는 정점이 done 이 되는 순간 리스트에 append 하고 마지막에 reverse(또는 맨 앞에 넣기). start 오름차순은 반례가 있다.","img":"img/algo9-p67-topocode.png","imgAlt":"reversed_topological_list 에 append 하는 dfs 코드","src":"9강 p.64–67"},{"title":"왜 되는가: A→B ⇒ A.finish > B.finish","body":"Case 1: B 가 A 의 자손이면 parenthesis theorem 으로 B 가 먼저 끝난다. Case 2: 자손이 아니면 B 를 먼저 탐색했어야 하고(A 를 먼저 갔다면 A→B 로 B 에 닿았다), B 진행 중 A 에 닿으면 cycle 이라 DAG 에 모순 → B 는 A 시작 전에 끝난다. Case 2 에서만 acyclic 가정을 쓴다.","img":"img/algo9-p75-topo-ans.png","imgAlt":"A→C, C→D, C→B, D→B 예제의 start/leave 시각","src":"9강 p.60–75"},{"title":"트리 순회도 DFS","body":"BST 에서 '왼쪽을 다 본 뒤, 오른쪽 전에' 출력하면 in-order(정렬 순서), 들어갈 때 출력하면 pre-order, **나올 때** 출력하면 post-order 다. print 줄의 위치만 다르다.","img":"img/algo9-p77-bst.png","imgAlt":"BST: 5 아래 3·7, 3 아래 2·4, 2 아래 1, 7 아래 8","src":"9강 p.77"}]},{"id":"u9d","title":"BFS · 무가중치 최단거리 · bipartite","items":[{"id":"u9d-01","type":"mc","q":"DFS 와 BFS 가 각각 쓰는 자료구조는?","explain":"DFS 는 깊이 들어갔다 되돌아오는 재귀(stack), BFS 는 $L_0, L_1, \\dots$ 를 차례로 처리하는 FIFO queue 와 같다.","src":"9강 보충","wiki":"BFS","tags":["BFS"],"choices":["DFS = queue, BFS = stack","DFS = stack(재귀), BFS = queue(layer 리스트)","둘 다 queue","둘 다 priority queue"],"answer":1,"introCard":0},{"id":"u9d-02","type":"cloze","q":"BFS: $L_0=\\{w\\}$ 로 두고 w 를 ___ 로 표시한다. $L_i$ 의 각 u 의 이웃 v 가 아직 방문 전이면 표시하고 ___ 에 넣는다.","explain":"슬라이드에는 'mark w as visited' 가 빠져 있지만 꼭 필요하다(없으면 w 가 $L_2$ 에 다시 들어간다). 빈칸 문제에서 노리는 줄.","src":"9강 p.86","wiki":"BFS","tags":["BFS","pseudocode"],"answer":["visited","L[i+1]"],"bank":["visited","L[i+1]","unvisited","L[i]","L[i-1]"],"introCard":0},{"id":"u9d-03","type":"num","q":"undirected G: s–a, s–b, a–c, b–c, b–d, c–e, d–e. s 에서 BFS, 이웃은 알파벳 순. e 가 속한 layer 번호는?","explain":"$L_0=\\{s\\}$, $L_1=\\{a,b\\}$, $L_2=\\{c,d\\}$ (c 는 a 가, d 는 b 가 발견), $L_3=\\{e\\}$.","src":"9강 p.80–86 (연습)","wiki":"layer","tags":["BFS","trace"],"answer":3,"tol":0,"img":"img/algo9-gen-u9d-03.png","imgAlt":"undirected graph: s–a, s–b, a–c, b–c, b–d, c–e, d–e","introCard":0},{"id":"u9d-04","type":"num","q":"undirected G: s–a, s–b, a–c, b–c, b–d, c–e, d–e. s 에서 BFS, 이웃은 알파벳 순. s 에서 d 까지의 distance (간선 수) 는?","explain":"d 는 $L_2$ 에 있으므로 $d(s,d) = 2$ (s–b–d). $v \\in L_i \\iff d(w,v)=i$.","src":"9강 p.92","wiki":"무가중치 최단거리","tags":["BFS","distance"],"answer":2,"tol":0,"img":"img/algo9-gen-u9d-03.png","imgAlt":"undirected graph: s–a, s–b, a–c, b–c, b–d, c–e, d–e","introCard":0},{"id":"u9d-05","type":"tf","q":"BFS 에서 정점이 들어간 layer 번호는 '모든 간선 weight 가 같을 때' 의 최단거리다.","explain":"교수가 전제를 분명히 했다: all edges have the same weight. 어느 layer 에도 없으면 distance = ∞.","src":"9강 p.92 · 10/22 녹음","wiki":"무가중치 최단거리","prof":true,"tags":["BFS","distance"],"answer":true,"introCard":0},{"id":"u9d-06","type":"tf","q":"BFS 는 weighted graph 에서도 최단경로를 준다.","explain":"간선 수가 최소인 경로를 줄 뿐이다. L11 p.6 의 Gates→Halmae Gomtang→Park 처럼 weight 로 보면 엉뚱하다 → Dijkstra/BF.","src":"9강 p.117 · 11강 p.6","wiki":"BFS","tags":["BFS","distance"],"answer":false,"introCard":1},{"id":"u9d-07","type":"mc","q":"undirected graph 의 BFS tree 에서 tree 에 안 쓰인 간선이 잇는 두 정점의 layer 는?","explain":"차이가 2 이상이면 위쪽 끝점을 처리할 때 아래쪽을 더 일찍 발견했을 것이라 모순. 이 성질이 bipartite 판정의 열쇠다.","src":"9강 p.89","wiki":"layer","tags":["BFS"],"choices":["항상 같은 layer","같은 layer 이거나 인접 layer (차이 ≤ 1)","차이가 2 이상일 수 있다","항상 인접 layer"],"answer":1,"introCard":0},{"id":"u9d-08","type":"mc","q":"BFS layer 를 번갈아 두 색으로 칠했더니 **같은 layer 안** 두 정점을 잇는 간선이 있었다. 결론은?","explain":"같은 layer 간선이 있으면 odd cycle 이 있고, odd cycle 은 어떤 2-coloring 으로도 안 된다. 그래서 '이 coloring 실패' 가 곧 'not bipartite' 다.","src":"9강 p.100 · 10/22 녹음","wiki":"bipartite graph","prof":true,"tags":["bipartite"],"choices":["다른 시작점으로 다시 칠해 봐야 한다","not bipartite","bipartite","그래프가 disconnected 다"],"answer":1,"introCard":0},{"id":"u9d-09","type":"tf","q":"undirected G: s–a, s–b, a–c, b–c, b–d, c–e, d–e. G 는 bipartite 다.","explain":"layer 가 s0 | a,b 1 | c,d 2 | e 3 이고, 일곱 간선이 모두 홀짝이 다른 layer 를 잇는다. 같은 layer 간선이 없다.","src":"9강 p.100 (연습)","wiki":"bipartite graph","tags":["bipartite","figure"],"answer":true,"img":"img/algo9-gen-u9d-03.png","imgAlt":"undirected graph: s–a, s–b, a–c, b–c, b–d, c–e, d–e","introCard":2},{"id":"u9d-10","type":"num","q":"undirected G: s–a, s–b, a–c, b–c, b–d, c–e, d–e. s 에서 BFS, 이웃은 알파벳 순. 여기에 간선 c–d 를 추가하면 c, d 가 둘 다 $L_2$ 다. BFS tree 의 LCA 를 이용해 찾은 odd cycle 의 길이는?","explain":"c 의 부모 a, d 의 부모 b, LCA 는 s. s–a–c (2) + c–d (1) + d–b–s (2) = 5. 일반식 $2k+1$, $k = 2$.","src":"9강 p.112–113 (연습)","wiki":"odd cycle","tags":["bipartite","proof"],"answer":5,"tol":0,"img":"img/algo9-gen-u9d-03.png","imgAlt":"undirected graph: s–a, s–b, a–c, b–c, b–d, c–e, d–e","introCard":3},{"id":"u9d-11","type":"order","q":"'BFS 가 같은 색 이웃 x, y 를 찾으면 not bipartite' 증명을 순서대로","explain":"'Make this proof sketch formal!' 슬라이드. 교수가 '왜 다른 coloring 도 없다고 할 수 있나?' 를 물으며 판서했다.","src":"9강 p.111–113 · 10/22 녹음","wiki":"odd cycle","prof":true,"tags":["bipartite","proof"],"answer":["x, y 는 같은 색이고 layer 차가 ≤ 1 이므로 같은 layer $L_i$ 에 있다","BFS tree 에서 x, y 의 lowest common ancestor z 를 잡는다","z⇝x, z⇝y 트리 경로는 길이가 똑같이 k 다","두 경로와 간선 x–y 로 길이 2k+1 인 odd cycle 이 생긴다","odd cycle 은 2-coloring 이 불가능하므로 그래프는 bipartite 가 아니다"],"introCard":2},{"id":"u9d-12","type":"mc","q":"다음 중 'graph 가 bipartite' 와 동치인 것은? (Kőnig)","explain":"even cycle 은 번갈아 칠할 수 있다. 막는 건 odd cycle 뿐이고 BFS 알고리즘이 이 정리의 constructive 증명이다.","src":"9강 p.113","wiki":"bipartite graph","tags":["bipartite"],"choices":["cycle 이 없다","odd-length cycle 이 없다","even-length cycle 이 없다","connected 다"],"answer":1,"introCard":3},{"id":"u9d-13","type":"mc","q":"신입생 N 명 중 충돌 관계(M 쌍)인 둘은 서로 다른 그룹에 가야 한다(그룹은 두 개). 가능 여부를 판정하는 방법과 시간은?","explain":"bipartite test 그 자체다. 충돌 그래프가 연결돼 있지 않을 수 있다고 문제에 적혀 있으니 **component 마다** 시작해야 한다.","src":"HW3 Problem 1","wiki":"bipartite graph","prof":true,"tags":["bipartite","HW3"],"choices":["모든 2-분할을 시도, $O(2^N)$","각 component 마다 BFS 로 2-coloring 하고 같은 색 간선 검사, $O(N+M)$","Dijkstra, $O(M\\log N)$","DFS 한 번이면 component 를 신경 쓸 필요 없다"],"answer":1,"introCard":2},{"id":"u9d-14","type":"sa","q":"adjacency list 위 BFS 의 수행 시간은? (Big-O)","explain":"각 정점은 visited 로 표시될 때 한 번만 어떤 $L_{i+1}$ 에 들어가고, 처리될 때 이웃 리스트를 한 번 훑는다. DFS 와 같은 논증. 교수가 학생에게 'O(m)? O(n+m)' 으로 정리했다.","src":"9강 p.88 · 10/22 녹음","wiki":"O(n+m)","tags":["BFS","running time"],"answer":"O(n+m)","alts":["O(m+n)","Θ(n+m)"],"introCard":0},{"id":"u9d-15","type":"cloze","q":"u 와 v 가 서로 연결되어 있지 않으면 distance 는 ___ 다. 그래서 shortest path 를 찾기 전 'step zero' 로 ___ 부터 찾는다.","explain":"BFS 로 한 번도 발견되지 않은 정점은 거리 ∞. '연결 안 된 두 노드 사이 shortest path 는 의미가 없다.'","src":"9강 p.92 · 10/20 녹음","wiki":"connected component","prof":true,"tags":["BFS","component"],"answer":["∞","connected component"],"bank":["∞","connected component","0","n−1","topological order"],"introCard":1},{"id":"u9d-16","type":"tf","q":"connected 인 무가중치 그래프에서 u–v 최단경로는 BFS 로 $O(m)$ 에 찾을 수 있다.","explain":"connected 면 $m \\ge n-1$ 이라 $O(n+m) = O(m)$. p.95 'What did we just learn?' 의 문장이다.","src":"9강 p.95","wiki":"무가중치 최단거리","tags":["BFS","running time"],"answer":true,"introCard":0},{"id":"u9d-17","type":"tf","q":"그림의 그래프는 bipartite 다. (start 에서 BFS 를 돌려 layer 를 번갈아 칠해 보라.)","explain":"start 가 $L_0$, 그 두 이웃이 $L_1$, 그다음 셋이 $L_2$, 오른쪽 아래 하나가 $L_3$ 이다. 같은 layer 끼리 잇는 간선이 하나도 없어서 짝수·홀수 layer 두 색으로 나뉜다. 슬라이드가 'CLEARLY BIPARTITE!' 라고 쓴 그림이다.","src":"9강 p.101–105","wiki":"bipartite graph","tags":["bipartite","그림"],"img":"img/algo9-p101-g1.png","imgAlt":"p.101 정점 7개 그래프와 start 정점","explainImg":"img/algo9-p105-g1-ans.png","answer":true,"introCard":0},{"id":"u9d-18","type":"tf","q":"그림의 그래프는 bipartite 다. (start 에서 BFS 를 돌려 layer 를 번갈아 칠해 보라.)","explain":"BFS layer 를 칠하면 왼쪽 위 정점과 왼쪽 아래 정점이 둘 다 $L_2$ 인데 그 둘을 잇는 간선이 있다. 같은 layer 안 간선이 있으니 odd cycle(길이 5)이 있고 bipartite 가 아니다. 슬라이드 p.110 'WHOA NOT BIPARTITE!'.","src":"9강 p.106–110","wiki":"bipartite graph","tags":["bipartite","그림"],"img":"img/algo9-p106-g2.png","imgAlt":"p.106 정점 7개 그래프와 start 정점","explainImg":"img/algo9-p110-g2-ans.png","answer":false,"introCard":0},{"id":"u9d-19","type":"num","q":"그림의 그래프에서 start 로 BFS 를 돌리면 가장 큰 layer 번호 $i$ (마지막으로 채워지는 $L_i$) 는?","explain":"$L_0$ = start. $L_1$ = start 의 두 이웃(오른쪽 위, 가운데). $L_2$ = 그 이웃들(왼쪽 위, 오른쪽, 왼쪽 아래). 오른쪽 아래 정점은 $L_2$ 정점들을 거쳐야 닿아서 $L_3$ 이다. 슬라이드 p.85 의 초록 정점이다. start 에서 가장 먼 거리가 3이라는 뜻이기도 하다.","src":"9강 p.81–85","wiki":"layer","tags":["BFS","그림"],"img":"img/algo9-p81-bfs.png","imgAlt":"p.81 정점 7개 그래프, 왼쪽에 start 정점","explainImg":"img/algo9-p85-bfs-ans.png","answer":3,"tol":0,"introCard":0},{"id":"u9d-20","type":"num","q":"그림의 그래프에서 start 로 BFS 를 돌렸더니 같은 layer($L_2$) 의 두 정점을 잇는 간선이 나왔다. BFS tree 에서 두 정점의 LCA 를 이용해 만든 odd cycle 의 길이는?","explain":"두 정점의 BFS 부모를 따라 올라가면 둘 다 2단계 만에 start 에 닿는다. 그래서 LCA 는 start, 각 경로 길이 $k=2$. 두 경로와 같은 layer 간선을 합치면 $2k+1 = 5$ 다.","src":"9강 p.110–113","wiki":"odd cycle","tags":["bipartite","그림","proof"],"img":"img/algo9-p106-g2.png","imgAlt":"p.106 정점 7개 그래프와 start 정점","explainImg":"img/algo9-p110-g2-ans.png","answer":5,"tol":0,"introCard":3},{"id":"u9d-21","type":"cloze","q":"[빈칸 의사코드] bipartite test: BFS 로 layer 를 구한 뒤 `color[v] = ` ___ ` % 2` 로 칠한다. 모든 간선 $(u,v)$ 에 대해 `if color[u]` ___ `color[v]: return False` 를 검사하고, 연결 안 된 그래프면 ___ 마다 BFS 를 새로 시작한다.","explain":"layer 를 번갈아 칠하는 것이 p.100 의 'Color the levels of the BFS tree in alternating colors' 다. 실패 조건은 같은 색(==)끼리 이어진 간선이고, 그런 간선은 같은 layer 안에만 생긴다. HW3 Problem 1 처럼 그래프가 끊겨 있을 수 있으니 component 마다 다시 시작해야 한다. `!=` 를 넣으면 bipartite 그래프를 거꾸로 판정한다.","src":"9강 p.100 · HW3 Problem 1","wiki":"bipartite graph","tags":["bipartite","빈칸"],"answer":["layer[v]","==","component"],"bank":["layer[v]","==","component","start[v]","!=","edge"],"introCard":0},{"id":"u9d-22","type":"cloze","q":"[2025 중간 7번 형식] not bipartite 인 그래프에서 **가장 짧은** odd cycle 길이를 구하려면 ___ 정점 $s$ 에서 BFS 를 돌려, 같은 layer $k$ 에 있는 두 정점을 잇는 간선마다 $2k+1$ 을 후보로 두고 최솟값을 고른다. 수행 시간은 ___ 이다.","explain":"BFS 한 번은 시작점 근처의 odd cycle 만 정확히 잡는다. 가장 짧은 odd cycle 위의 정점에서 BFS 를 돌리면 그 cycle 이 잡히는데, 그 정점이 어디인지 모르니 모든 정점에서 돌린다. BFS 한 번이 $O(n+m)$ 이고 $n$ 번이니 $O(n(n+m))$. 2025 중간 7번이 'Not bipartite 가정하고 최소 odd length circuit 구하는 알고리즘' 이었다.","src":"9강 p.111–113 · 2025 중간 7번","wiki":"odd cycle","tags":["bipartite","족보"],"answer":["모든","O(n(n+m))"],"bank":["모든","O(n(n+m))","한","O(n+m)","O(n^2 m)"],"introCard":0}],"intro":[{"title":"BFS 와 layer","body":"Breadth-First Search 는 시작점 $w$ 에서 0걸음, 1걸음, 2걸음… 으로 퍼진다. $L_0=\\{w\\}$, $L_i$ 의 각 u 의 이웃 v 가 아직 visited 가 아니면 visited 로 표시하고 $L_{i+1}$ 에 넣는다. 자료구조는 queue(또는 layer 리스트), DFS 는 stack(재귀). 수행 시간 $O(n+m)$.","img":"img/algo9-p86-bfs.png","imgAlt":"BFS 의사코드와 layer 색","src":"9강 p.80–88"},{"title":"무가중치 최단거리","body":"$v \\in L_i$ ⇔ $w$ 에서 $v$ 까지 최단거리(간선 수) $= i$. BFS tree 의 경로가 최단경로다. 한 번도 발견되지 않으면 거리 ∞(다른 connected component). 간선 weight 가 다르면 BFS 는 최단경로를 주지 않는다(→ Dijkstra).","img":"img/algo9-p85-bfs-ans.png","imgAlt":"BFS 가 칠한 layer L0~L3","src":"9강 p.89–95"},{"title":"bipartite 판정","body":"**bipartite** = 정점을 두 색으로 칠해 같은 색끼리 간선이 없게 할 수 있음. BFS layer 를 번갈아 칠하고, **같은 layer 안**의 두 정점을 잇는 간선이 하나라도 있으면 not bipartite. (BFS tree 밖 간선은 layer 차이가 0 또는 1 이다.) 그래프가 끊겨 있으면 component 마다 BFS.","img":"img/algo9-p105-g1-ans.png","imgAlt":"layer 를 번갈아 칠한 bipartite 그래프","src":"9강 p.96–105"},{"title":"odd cycle 이 증거","body":"같은 layer $L_k$ 의 x, y 가 이어져 있으면, BFS tree 에서 둘의 LCA z 까지 경로 길이가 같아(각 $j$) z⇝x–y⇝z 가 길이 $2j+1$ 의 **odd cycle** 이 된다. odd cycle 은 두 색으로 못 칠하므로 어떤 coloring 도 실패한다. bipartite ⇔ odd cycle 없음.","img":"img/algo9-p110-g2-ans.png","imgAlt":"같은 layer 의 두 정점을 잇는 빨간 간선","src":"9강 p.106–113"}]}]},{"id":"u10","title":"10강 Graph II (SCC)","desc":"strongly connected · DFS 두 번 · SCC graph DAG · Lemma 2","lessons":[{"id":"u10a","title":"SCC 정의와 직관","items":[{"id":"u10a-01","type":"mc","q":"directed graph $G$ 가 **strongly connected** 라는 뜻은?","explain":"양방향 path 가 다 있어야 한다. path 는 중간 정점을 거쳐도 되고 두 path 가 같은 간선을 쓸 필요도 없다(교수 10/27).","src":"10강 p.5","wiki":"strongly connected","tags":["SCC"],"choices":["방향을 무시하면 connected","모든 $v,w$ 에 대해 $v\\rightsquigarrow w$ path 와 $w\\rightsquigarrow v$ path 가 둘 다 있다","모든 쌍 사이에 직접 간선이 있다","DAG 다"],"answer":1,"introCard":0},{"id":"u10a-02","type":"tf","q":"strongly connected 는 undirected graph 의 connected 와 같은 개념이다.","explain":"directed 에서 한 방향 path 만 있으면 strongly connected 가 아니다. p.5 오른쪽 그림은 간선 하나의 방향 때문에 왼쪽 정점에서 나갈 수가 없다.","src":"10강 p.5","wiki":"strongly connected","tags":["SCC"],"answer":false,"introCard":0},{"id":"u10a-03","type":"match","q":"'서로 도달 가능' 관계 $u\\sim v$ 가 equivalence relation 인 이유를 연결하시오","explain":"equivalence class 하나하나가 SCC (maximal strongly connected 집합) 다.","src":"10강 p.6","wiki":"strongly connected component","tags":["SCC"],"pairs":[["reflexive","길이 0 path 로 $u\\rightsquigarrow u$"],["symmetric","정의 자체가 양방향"],["transitive","path 를 이어 붙인다"],["그 결과","$V$ 가 SCC 들로 겹치지 않게 partition 된다"]],"introCard":0},{"id":"u10a-04","type":"tf","q":"모든 정점은 정확히 하나의 SCC 에 속한다 (혼자서도 SCC 가 될 수 있다).","explain":"partition 이라 겹침도 빠짐도 없다. p.14 KAIST 처럼 들어오는 간선이 없으면 혼자 SCC.","src":"10강 p.6, 14","wiki":"strongly connected component","tags":["SCC"],"answer":true,"introCard":0},{"id":"u10a-05","type":"mc","q":"그림의 웹 그래프에서 KAIST 가 혼자 SCC 를 이루는 이유는?","explain":"KAIST→DGIST, KAIST→Puppy 로 나가기만 한다. 다른 정점에서 KAIST 로 돌아오는 path 가 없으니 누구와도 왕복이 안 된다.","src":"10강 p.14","wiki":"웹 그래프와 SCC","tags":["SCC"],"choices":["나가는 간선이 없어서","들어오는 간선이 없어서","degree 가 가장 커서","DFS 를 KAIST 에서 시작해서"],"answer":1,"img":"img/algo10-p13-web.png","imgAlt":"웹 그래프: DGIST, Wikipedia, YouTube, KAIST, Puppy, Google 사이 directed edge","introCard":1},{"id":"u10a-06","type":"num","q":"그림의 웹 그래프(DGIST, Wiki, YouTube, KAIST, Puppy, Google)의 SCC 개수는?","explain":"{DGIST, Wiki, YouTube}, {Puppy, Google}, {KAIST}. 교수: '웹 그림의 SCC 는 3개'.","src":"10강 p.14 · 10/27 녹음","wiki":"웹 그래프와 SCC","prof":true,"tags":["SCC"],"answer":3,"tol":0,"img":"img/algo10-p13-web.png","imgAlt":"p.13 웹 그래프: DGIST, Wikipedia, YouTube, KAIST, Puppy, Google 사이 directed edge","explainImg":"img/algo10-p14-web-ans.png","introCard":1},{"id":"u10a-07","type":"mc","q":"순진한 방법: 정점마다 DFS 를 한 번씩 돌려 reachability 를 다 구한 뒤 묶는다. 수행 시간은?","explain":"DFS $O(n+m)$ 을 $n$번. 교수: '$n^2$ 보다 크다'. 목표는 DFS 두 번, $O(n+m)$.","src":"10강 p.10 · 10/27 녹음","wiki":"SCC 알고리즘","prof":true,"tags":["SCC","running time"],"choices":["$O(n+m)$","$O(n(n+m))$","$O(m\\log n)$","$O(2^n)$"],"answer":1,"introCard":3},{"id":"u10a-08","type":"mc","q":"SCC 가 {A,B,C}, {D,E,F} 이고 SCC 사이 간선은 C→D 하나다. **A 에서** DFS 를 시작하면?","explain":"C→D 로 넘어가 버린다. D 에서 시작하면 {D,E,F} 만 나오고, 그다음 A 에서 {A,B,C} 가 나와 성공. 'The starting node is important.'","src":"10강 p.11 · 10/27 녹음","wiki":"sink SCC와 source SCC","prof":true,"tags":["SCC","intuition"],"choices":["{A,B,C} 만 나온다","A 부터 F 까지 전부 한 DFS tree 가 되어 두 SCC 가 섞인다","{D,E,F} 만 나온다","DFS 가 끝나지 않는다"],"answer":1,"introCard":2},{"id":"u10a-09","type":"cloze","q":"DFS 는 시작점에서 ___ 모든 정점을 한 tree 로 묶는다. 그래서 SCC graph 의 ___ 에서 시작해야 tree 하나가 정확히 SCC 하나가 된다.","explain":"다른 SCC 로 새어 나가는 간선이 없는 곳(sink)에서 시작해야 한다. 그런데 sink 를 미리 모르니 1차 DFS 의 finish time 이 그 정보를 준다.","src":"10강 p.11","wiki":"sink SCC와 source SCC","tags":["SCC","intuition"],"answer":["도달 가능한","sink"],"bank":["도달 가능한","sink","인접한","source","root"],"introCard":1},{"id":"u10a-10","type":"tf","q":"그래프에 간선을 하나 추가하면 SCC 의 개수가 늘어날 수 있다.","explain":"기존 path 는 전부 유지되니 SCC 는 합쳐지기만 한다. 개수는 같거나 줄어든다 (CLRS Ex. 22.5-1).","src":"10강 보충","wiki":"strongly connected component","tags":["SCC"],"answer":false,"introCard":0},{"id":"u10a-11","type":"sa","q":"각 SCC 를 정점 하나로 보고, SCC 사이에 원래 간선이 있으면 간선을 그은 그래프를 무엇이라 하나?","explain":"CLRS 는 component graph $G^{SCC}$ 라 부른다. 이 그래프는 항상 DAG 다 (Lemma 1).","src":"10강 p.50","wiki":"SCC graph","tags":["SCC"],"answer":"SCC graph","alts":["component graph","SCC DAG"]},{"id":"u10a-12","type":"mc","q":"Try 1 '가능한 모든 분할(partition)을 시도해 검사' 가 안 되는 이유는?","explain":"분할 수는 Bell number 로 지수적으로 늘어난다. 교수 표현으로 intractable.","src":"10강 p.10","wiki":"SCC 알고리즘","tags":["SCC"],"choices":["정답이 여러 개라서","분할의 개수가 지수적이라서","DFS 를 쓸 수 없어서","cycle 이 있으면 정의가 안 돼서"],"answer":1,"introCard":3},{"id":"u10a-13","type":"tf","q":"서로 다른 두 SCC 사이에 양방향 간선(왕복)이 있을 수 있다.","explain":"양방향으로 오갈 수 있으면 두 SCC 는 합쳐져야 한다(maximality). SCC 사이 간선은 한 방향뿐이다.","src":"10강 p.6","wiki":"SCC graph","tags":["SCC"],"answer":false,"introCard":1},{"id":"u10a-14","type":"num","q":"G: 1→2, 2→3, 3→1, 3→4, 4→5. SCC 의 개수는?","explain":"{1,2,3} 은 cycle 이라 하나, 4 와 5 는 돌아오는 간선이 없어 각자 SCC. 총 3.","src":"10강 p.5–6 (연습)","wiki":"strongly connected component","tags":["SCC","figure"],"answer":3,"tol":0,"img":"img/algo10-gen-u10a-14.png","imgAlt":"directed graph: 1→2, 2→3, 3→1, 3→4, 4→5","introCard":0},{"id":"u10a-15","type":"num","q":"그림의 웹 그래프에서 SCC 를 정점 하나로 줄인 SCC graph 에는 간선이 몇 개인가? (같은 SCC 쌍 사이 여러 간선은 하나로 센다)","explain":"SCC 는 {DGIST, Wiki, YouTube}, {Puppy, Google}, {KAIST} 셋이다. SCC 사이 간선은 큰 SCC → {Puppy, Google}, KAIST → 큰 SCC, KAIST → {Puppy, Google} 세 개다. 반대 방향 간선은 하나도 없다. 하나라도 있었다면 두 SCC 가 합쳐졌을 것이다(Lemma 1).","src":"10강 p.13–14, 51","wiki":"SCC graph","tags":["SCC","그림"],"img":"img/algo10-p13-web.png","imgAlt":"p.13 웹 그래프: DGIST, Wikipedia, YouTube, KAIST, Puppy, Google 사이 directed edge","explainImg":"img/algo10-p51-sccgraph-ans.png","answer":3,"tol":0,"introCard":1},{"id":"u10a-16","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) SCC 들은 $V$ 의 partition 이다 (2) SCC graph 는 DAG 다 (3) strongly connected 인 그래프는 방향을 무시해도 connected 다 (4) 간선을 하나 추가하면 SCC 개수가 늘 수 있다 (5) $G^T$ 의 SCC 는 $G$ 의 SCC 와 다를 수 있다","explain":"(1) 참: '서로 도달 가능' 이 equivalence relation 이라 겹치지 않게 나뉜다. (2) 참: Lemma 1. (3) 참: 양방향 path 가 있으면 방향을 무시해도 당연히 이어져 있다. 반대는 거짓이다. (4) 거짓: 간선을 더하면 SCC 가 합쳐질 수만 있고 쪼개지지는 않는다. (5) 거짓: $u\\rightsquigarrow v$, $v\\rightsquigarrow u$ 를 모두 뒤집어도 두 path 가 그대로 있어 SCC 가 똑같다. 2차 DFS 를 $G^T$ 에서 돌려도 되는 근거가 이것이다.","src":"10강 p.5–6, 30, 51 · 중간 1번 형식","wiki":"strongly connected component","tags":["SCC","circle-all"],"choices":["(1)(2)(3)","(1)(2)","(1)(2)(3)(5)","(2)(3)(4)"],"answer":0,"introCard":0}],"intro":[{"title":"strongly connected","body":"directed graph 에서 모든 $v,w$ 에 대해 $v\\rightsquigarrow w$ path 와 $w\\rightsquigarrow v$ path 가 **둘 다** 있으면 strongly connected. '서로 도달 가능' 은 equivalence relation 이라 정점을 겹치지 않게 나눈다. 그 조각이 **SCC**(strongly connected component), 정점 하나짜리 SCC 도 있다.","src":"10강 p.5–6"},{"title":"웹 그래프 예제","body":"DGIST, Wikipedia, YouTube 는 서로 오갈 수 있어 SCC 하나, Puppy 와 Google 이 또 하나, KAIST 는 들어오는 간선이 없어 혼자 SCC 다. SCC 를 점 하나로 줄인 그래프가 **SCC graph** 이고, 항상 DAG 다(왕복이 있으면 두 SCC 가 합쳐졌어야 한다).","img":"img/algo10-p14-web-ans.png","imgAlt":"웹 그래프와 SCC 세 개(점선)","src":"10강 p.13–14"},{"title":"DFS 시작점이 문제다","body":"DFS 는 시작점에서 도달 가능한 정점을 전부 한 tree 로 묶는다. SCC {A,B,C} 에서 C→D 로 {D,E,F} 에 갈 수 있으면 A 에서 시작한 DFS 는 두 SCC 를 섞는다. **SCC graph 의 sink**(나가는 간선 없는 SCC)에서 시작해야 tree 하나 = SCC 하나다.","src":"10강 p.11"},{"title":"순진한 방법은 느리다","body":"정점마다 DFS 를 돌려 reachability 를 다 구하면 $O(n(n+m))$, 모든 분할을 시도하면 지수 시간. 목표는 DFS 두 번, $O(n+m)$.","src":"10강 p.10"}]},{"id":"u10b","title":"DFS 두 번 알고리즘 손으로 돌리기","items":[{"id":"u10b-01","type":"order","q":"SCC 를 찾는 DFS 두 번 알고리즘(Kosaraju)의 단계를 순서대로","explain":"교수: 'only these two (p.11, p.12) are important'. DFS 를 독립적으로 두 번 → $O(n+m)$.","src":"10강 p.12 · 10/27 녹음","wiki":"Kosaraju 알고리즘","prof":true,"tags":["SCC","algorithm"],"answer":["G 에서 DFS 를 돌려 finish time 을 기록한다 (시작점은 아무 순서)","모든 간선을 뒤집어 $G^T$ 를 만든다","$G^T$ 에서 1차 finish time 이 큰 정점부터 시작점으로 골라 DFS 한다","두 번째 DFS forest 의 각 tree 를 SCC 하나로 출력한다"],"introCard":0},{"id":"u10b-02","type":"cloze","q":"코드 빈칸: dfs1 끝에서 `order.___(u)`, 전치는 `for v in G[u]: GT[v].append(___)`, 2차는 `for u in ___(order)`.","explain":"finish 시점에 append → order 는 finish 오름차순. 간선 $(u,v)$ 를 $(v,u)$ 로 → GT[v] 에 u. 역순으로 돌면 finish 내림차순.","src":"10강 p.12","wiki":"SCC 알고리즘","tags":["SCC","pseudocode"],"answer":["append","u","reversed"],"bank":["append","u","reversed","sorted","v","pop"],"introCard":0},{"id":"u10b-03","type":"num","q":"G: A→B, B→C, C→A, B→D, D→E, E→D, E→F, F→G, G→F, C→F. 이웃 알파벳 순, 1차 DFS 는 A 부터(수업 DFS 시각 규약, 0 부터). A 의 finish time 은?","explain":"A0 → B1 → C2 → (C→A 방문됨) C→F: F3 → G4, G 는 F 방문됨이라 G5 → F6 → C7 → B→D: D8 → E9, E 의 이웃 D·F 방문됨 → E10 → D11 → B12 → A13.","src":"10강 p.15–28 (연습)
