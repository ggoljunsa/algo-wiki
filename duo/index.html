\min\\{D^{(k-1)}[u,v],\\ D^{(k-1)}[u,k] + D^{(k-1)}[k,v]\\}$. Case 1: k 가 필요 없다. Case 2: k 를 지난다 — negative cycle 이 없으면 최단경로가 simple 이라 k 를 정확히 한 번 지나고 두 조각의 내부가 {1..k−1}.","img":"img/algo12-p50-case2.png","imgAlt":"Case 2: u ⇝ k ⇝ v","src":"12강 p.46–51"},{"title":"알고리즘과 비용","body":"$D^{(0)}[u,u]=0$, 간선이면 weight, 아니면 ∞. **k 를 가장 바깥 루프**로 $k=1..n$, 모든 $(u,v)$ 에 점화식 → bottom-up. min 계산 $n^3$ 번, 공간은 배열 두 개 $O(n^2)$.","img":"img/algo12-p53-fw.png","imgAlt":"Floyd-Warshall 의사코드","src":"12강 p.53–54"}]},{"id":"u12d","title":"FW 표 채우기 · negative cycle · longest path","items":[{"id":"u12d-01","type":"num","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(0)}[s,v]$ 는?","explain":"$D^{(0)}$ 은 직접 간선만. s→v 5.","src":"12강 p.42, 53","wiki":"D^(k)(u,v)","tags":["FW","trace"],"answer":5,"tol":0,"img":"img/algo12-p42-graph.png","imgAlt":"directed graph: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2","introCard":0},{"id":"u12d-02","type":"num","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(2)}[s,v]$ ($k$ = u 까지 허용) 는?","explain":"$\\min(D^{(1)}[s,v] = 5,\\ D^{(1)}[s,u] + D^{(1)}[u,v] = 2+2) = 4$.","src":"12강 p.42 (교수: 직접 채워 보라)","wiki":"D^(k)(u,v)","prof":true,"tags":["FW","trace"],"answer":4,"tol":0,"img":"img/algo12-p42-graph.png","imgAlt":"p.42 directed graph: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2","introCard":0},{"id":"u12d-03","type":"num","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(3)}[s,t]$ ($k$ = v 까지 허용) 는?","explain":"$D^{(2)}[s,v] + D^{(2)}[v,t] = 4 + (-2) = 2$. 앞 단계에서 개선된 4 를 다시 쓴다(overlap).","src":"12강 p.42","wiki":"D^(k)(u,v)","tags":["FW","trace"],"answer":2,"tol":0,"img":"img/algo12-fw-D2.png","imgAlt":"p.42 그래프의 D(2) 표: s 행 0 2 4 ∞, u 행 1 0 2 ∞, v 행 ∞ ∞ 0 −2, t 행 ∞ ∞ ∞ 0","introCard":0},{"id":"u12d-04","type":"num","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(3)}[u,t]$ 는?","explain":"$D^{(2)}[u,v] + D^{(2)}[v,t] = 2 - 2 = 0$.","src":"12강 p.42","wiki":"D^(k)(u,v)","tags":["FW","trace"],"answer":0,"tol":0,"img":"img/algo12-fw-D2.png","imgAlt":"p.42 그래프의 D(2) 표: s 행 0 2 4 ∞, u 행 1 0 2 ∞, v 행 ∞ ∞ 0 −2, t 행 ∞ ∞ ∞ 0","introCard":0},{"id":"u12d-05","type":"tf","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(1)} = D^{(0)}$ 이다 (k = s 를 허용해도 바뀌는 칸이 없다).","explain":"개선 후보는 u→s→· 뿐: u→s→v = 1+5 = 6 > 2, u→s→u = 3 > 0. 변화 없음.","src":"12강 p.42","wiki":"D^(k)(u,v)","tags":["FW","trace"],"answer":true,"img":"img/algo12-p42-graph.png","imgAlt":"directed graph: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2","introCard":0},{"id":"u12d-06","type":"mc","q":"directed G: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2. 정점 순서 1=s, 2=u, 3=v, 4=t. $D^{(4)} = D^{(3)}$ 인 이유는?","explain":"$D[t,\\cdot] = \\infty$ 라 $D[u,t]+D[t,v]$ 가 항상 ∞. 최종 행렬 s(0,2,4,2), u(1,0,2,0), v(∞,∞,0,−2), t(∞,∞,∞,0) 이 슬라이드 답과 같다.","src":"12강 p.42","wiki":"D^(k)(u,v)","tags":["FW","trace"],"choices":["t 에서 나가는 간선이 없어서 t 를 거쳐 개선되는 경로가 없다","음수 간선이 있어서","k = 4 는 안 돌려서","대각선이 0 이라서"],"answer":0,"img":"img/algo12-p42-graph.png","imgAlt":"directed graph: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2","introCard":0},{"id":"u12d-07","type":"num","q":"G: 1→2 3, 2→3 −1, 1→3 4, 3→1 2. FW 의 $D^{(3)}[2,1]$ 은?","explain":"2→3→1 = −1 + 2 = 1. 2 에서 1 로 가는 다른 길은 없다. 대각선은 모두 0 이라 negative cycle 은 없다.","src":"12강 p.53 (연습)","wiki":"Floyd-Warshall","tags":["FW","trace"],"answer":1,"tol":0,"img":"img/algo12-gen-u12d-07.png","imgAlt":"weighted directed graph: 1→2 3, 2→3 −1, 1→3 4, 3→1 2","introCard":0},{"id":"u12d-08","type":"mc","q":"FW 로 negative cycle 을 검출하는 방법은?","explain":"대각선은 0 에서 시작하고, v 를 지나는 음수 cycle 이 있으면 그 cycle 의 최대 라벨 단계에서 음수가 된다. 교수 11/3 도 같은 말.","src":"12강 p.55 · 11/3 녹음","wiki":"negative cycle","tags":["FW","negative"],"choices":["한 라운드 더 돌린다","$D^{(n)}$ 의 대각선에 음수가 있다 ($D^{(n)}[v,v] \u003c 0$)","$D^{(n)}$ 에 ∞ 가 남는다","검출할 수 없다"],"answer":1,"introCard":1},{"id":"u12d-09","type":"tf","q":"FW 는 negative cycle 이 있어도 올바른 거리를 준다.","explain":"검출만 한다. 정리는 'negative cycle 이 없으면 $D^{(n)}[u,v] = d(u,v)$'.","src":"12강 p.54–55","wiki":"Floyd-Warshall","tags":["FW","trap"],"answer":false,"introCard":1},{"id":"u12d-10","type":"match","q":"APSP 방법과 시간을 연결하시오","explain":"FW 는 'Not really better than running Dijkstra n times. But it's simpler to implement and handles negative weights.'","src":"12강 p.54","wiki":"all-pairs shortest path","tags":["FW","running time"],"pairs":[["Bellman-Ford 를 n 번","$O(n^2 m)$"],["Dijkstra 를 n 번 (Fibonacci heap)","$O(nm + n^2\\log n)$"],["Floyd-Warshall","$\\Theta(n^3)$"],["BFS 를 n 번 (unweighted)","$O(n(n+m))$"]],"introCard":3},{"id":"u12d-11","type":"tf","q":"FW 는 Dijkstra 를 n 번 돌리는 것보다 점근적으로 항상 빠르다.","explain":"sparse 면 Dijkstra×n 이 $O(n^2\\log n)$ 으로 더 빠르다. FW 의 장점은 단순함과 음수 간선 처리.","src":"12강 p.54","wiki":"all-pairs shortest path","tags":["FW","trap"],"answer":false,"introCard":3},{"id":"u12d-12","type":"mc","q":"longest simple path 에 optimal substructure 가 없는 이유는?","explain":"교수 11/3: 해 사이에 dependency 가 있어 optimal substructure 를 정의할 수 없다.","src":"12강 p.59–60 · 11/3 녹음","wiki":"longest simple path","prof":true,"tags":["DP","longest path"],"choices":["path 가 너무 길어서","subproblem 이 independent 하지 않다 — 한쪽에서 쓴 정점(b)을 다른 쪽이 쓰면 안 된다","음수 간선이 없어서","DAG 가 아니라서"],"answer":1,"introCard":2},{"id":"u12d-13","type":"num","q":"정점 s, a, b, t 가 사각형 s–a–b–t–s 로 이어져 있다(모든 간선 양방향, weight 1). s 에서 t 까지의 longest simple path 길이는?","explain":"s→a→b→t. longest s⇝a (3, s→t→b→a) + longest a⇝t (2) 를 이으면 5 지만 b, t 를 두 번 지나 simple 이 아니다.","src":"12강 p.58–59","wiki":"longest simple path","tags":["longest path"],"answer":3,"tol":0,"explainImg":"img/algo12-p58-longest-ans.png","img":"img/algo12-gen-u12d-13.png","imgAlt":"사각형 s–a–b–t–s, 모든 간선 weight 1","introCard":2},{"id":"u12d-14","type":"tf","q":"longest simple path 는 NP-complete 라 polynomial-time 알고리즘이 알려져 있지 않다.","explain":"교수: '최단경로는 쉬운데 최장경로는 매우 어렵다 — isn't it interesting?' polynomial 을 찾으면 P = NP.","src":"12강 p.60 · 11/3 녹음","wiki":"longest simple path","prof":true,"tags":["longest path"],"answer":true,"introCard":2},{"id":"u12d-15","type":"mc","q":"선행 조건이 cycle 없는 작업들(각자 걸리는 시간이 있음)의 가장 빠른 완료 시각을 구하려 한다. 어떤 방법이 맞나?","explain":"일반 그래프의 longest simple path 는 어렵지만 **DAG** 에서는 topo order DP 로 $O(n+m)$ 이다(cycle 이 없으니 subproblem 이 독립).","src":"HW3 Problem 4 · 12강 p.60","wiki":"topological sort","prof":true,"tags":["DP","DAG","HW3"],"choices":["Dijkstra","topological order 를 따라 '선행 작업 완료 시각의 max + 자기 시간' 을 DP 로 채운다 (DAG 의 longest path)","BFS layer","longest simple path 는 NP-complete 라 지수 시간이 필요하다"],"answer":1,"introCard":2},{"id":"u12d-16","type":"mc","q":"그림은 directed graph(s→u 2, u→s 1, s→v 5, u→v 2, v→t −2)의 APSP 결과 표다(행 = source, 열 = destination). 가린 ① $D[s,v]$ 와 ② $D[v,s]$ 는?","explain":"① s→v 직접 간선은 5지만 s→u→v 가 $2+2=4$ 로 더 짧다. FW 로는 $k=u$ 단계에서 $D^{(2)}[s,v] = \\min(5,\\ 2+2)$ 로 바뀐다. ② v 에서 나가는 간선은 v→t 하나뿐이고 t 에서는 나가는 간선이 없다. 그래서 v 에서 s 로 돌아오는 path 가 없어 ∞ 다. directed graph 의 APSP 표는 대칭이 아니다. 대칭처럼 읽으면 ②를 틀린다.","src":"12강 p.42","wiki":"all-pairs shortest path","tags":["FW","그림"],"img":"img/algo12-p42-apsp.png","imgAlt":"p.42 APSP 결과 표(행 source, 열 destination)와 그래프, 두 칸이 ①② 로 가려져 있다","explainImg":"img/algo12-p42-apsp-ans.png","choices":["① 4, ② ∞","① 5, ② ∞","① 4, ② 2","① 5, ② 6"],"answer":0,"introCard":0},{"id":"u12d-17","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) Floyd-Warshall 은 $O(n^3)$ (2) Floyd-Warshall 은 음수 간선이 있어도 된다 (3) $D^{(n)}[v,v] \u003c 0$ 인 $v$ 가 있으면 negative cycle 이 있다 (4) 세 겹 루프에서 $k$ 를 가장 안쪽에 둬도 된다 (5) longest simple path 도 같은 방식의 DP 로 polynomial 시간에 풀린다","explain":"(1) 참. (2) 참: negative cycle 만 없으면 된다. (3) 참: p.55 'Negative cycle ⇔ ∃v s.t. $D^{(n)}[v,v] \u003c 0$'. (4) 거짓: $D^{(k)}$ 는 $D^{(k-1)}$ 전체가 끝나야 계산할 수 있다. $k$ 가 안쪽이면 아직 덜 채워진 값을 쓴다. (5) 거짓: subproblem 이 independent 하지 않아(한쪽이 쓴 정점을 다른 쪽이 못 쓴다) optimal substructure 가 깨진다. NP-complete 다.","src":"12강 p.53–60 · 중간 1번 형식","wiki":"Floyd-Warshall","tags":["FW","circle-all"],"choices":["(1)(2)(3)","(1)(2)(3)(4)","(1)(3)","(1)(2)(3)(5)"],"answer":0,"introCard":1}],"intro":[{"title":"예제 그래프","body":"directed: s→u 2, u→s 1, s→v 5, u→v 2, v→t −2, 순서 1=s, 2=u, 3=v, 4=t. $D^{(1)}=D^{(0)}$, $D^{(2)}[s,v]=\\min(5, 2+2)=4$, $D^{(3)}[s,t]=4-2=2$, $D^{(3)}[u,t]=0$. t 는 나가는 간선이 없어 $D^{(4)}=D^{(3)}$. 표는 대칭이 아니다($D[v,s]=\\infty$).","img":"img/algo12-p42-apsp-ans.png","imgAlt":"APSP 결과 표와 그래프","src":"12강 p.42"},{"title":"negative cycle 검출","body":"$D^{(n)}[v,v] \u003c 0$ 인 v 가 있으면 negative cycle. 이때 FW 의 거리는 의미가 없다.","src":"12강 p.55"},{"title":"longest simple path 는 안 된다","body":"s→t longest simple path 를 's→a 최장 + a→t 최장' 으로 나누면 두 조각이 같은 정점을 써 버릴 수 있다. subproblem 이 independent 하지 않아 optimal substructure 가 없다. NP-complete. (DAG 의 longest path 는 topological order 로 DP 가능.)","img":"img/algo12-p58-longest-ans.png","imgAlt":"s, a, b, t 사각형의 longest path","src":"12강 p.58–60"},{"title":"APSP 방법 비교","body":"BF × n: $O(n^2 m)$ · Dijkstra × n (Fib heap, 음수 없음): $O(nm + n^2\\log n)$ · FW: $\\Theta(n^3)$ · BFS × n (unweighted): $O(n(n+m))$. sparse·음수 없음이면 Dijkstra n 번이 FW 보다 빠를 수 있다.","src":"12강 p.54"}]}]},{"id":"u13","title":"13강 DP II","desc":"LCS · unbounded / 0/1 knapsack · 트리 independent set","lessons":[{"id":"u13a","title":"LCS 정의와 점화식","items":[{"id":"u13a-01","type":"mc","q":"다음 중 ABCDEFGH 의 **subsequence** 인 것은?","explain":"순서는 유지하고 일부를 지우면 된다(연속일 필요 없음). HGF, BAD 는 순서가 뒤집혔다.","src":"13강 p.5–8","wiki":"subsequence와 prefix","tags":["LCS"],"choices":["BDFH","HGF","BAD","ABCDEFGHI"],"answer":0,"introCard":0},{"id":"u13a-02","type":"tf","q":"subsequence 는 원래 열에서 **연속**한 부분이어야 한다.","explain":"연속이어야 하는 건 substring 이다. subsequence 는 순서만 지키면 된다.","src":"13강 p.7","wiki":"subsequence와 prefix","tags":["LCS"],"answer":false,"introCard":0},{"id":"u13a-03","type":"sa","q":"ABCDEFGH 와 ABDFGHI 의 LCS 는?","explain":"공통으로 순서대로 나오는 가장 긴 열. 길이 6.","src":"13강 p.8","wiki":"longest common subsequence","tags":["LCS"],"answer":"ABDFGH","introCard":0},{"id":"u13a-04","type":"cloze","q":"LCS 점화식: $X[i]=Y[j]$ 이면 $C[i,j] =$ ___ $+ 1$, 다르면 $C[i,j] = \\max\\{$ ___ $,\\ C[i-1,j]\\}$.","explain":"끝 글자가 같으면 둘 다 떼고 +1. 다르면 둘 중 하나의 끝 글자는 LCS 에 안 쓰이니 X 를 줄이거나 Y 를 줄인 쪽의 max. $i=0$ 또는 $j=0$ 이면 0.","src":"13강 p.14–16","wiki":"C(i,j) (LCS)","tags":["LCS","pseudocode"],"answer":["C[i−1,j−1]","C[i,j−1]"],"bank":["C[i−1,j−1]","C[i,j−1]","C[i,j]","C[i+1,j]","C[i−1,j+1]"],"introCard":2},{"id":"u13a-05","type":"mc","q":"LCS DP 의 subproblem 은?","explain":"$C[i,j]$ = length of LCS($X_i$, $Y_j$), $X_i$ = X 의 앞 i 글자. 마지막 글자를 보며 줄여 간다.","src":"13강 p.10–12","wiki":"C(i,j) (LCS)","tags":["LCS"],"choices":["X 와 Y 의 suffix 쌍","X 와 Y 의 prefix 쌍 $(X_i, Y_j)$","X 의 모든 부분집합","Y 의 길이"],"answer":1,"introCard":1},{"id":"u13a-06","type":"tf","q":"$X[i]=Y[j]$ 인 경우에도 'X[i] 를 버리는 경우' 와 'Y[j] 를 버리는 경우' 를 함께 비교해야 정답이 보장된다.","explain":"끝 글자가 같으면 매칭하는 게 손해가 아니다(버려서 얻는 길이가 $C[i-1,j-1]+1$ 보다 클 수 없다). 그래서 Case 1 은 한 줄.","src":"13강 p.14","wiki":"C(i,j) (LCS)","tags":["LCS","proof"],"answer":false},{"id":"u13a-07","type":"num","q":"|X| = 5, |Y| = 4 인 LCS 표는 칸이 몇 개인가? (0번 행·열 포함)","explain":"$(m+1)\\times(n+1) = 6 \\times 5 = 30$. 칸마다 $O(1)$ 이라 $O(mn)$.","src":"13강 p.18","wiki":"C(i,j) (LCS)","tags":["LCS"],"answer":30,"tol":0,"introCard":2},{"id":"u13a-08","type":"mc","q":"길이 m, n 인 두 문자열의 LCS 를 DP 로 구하는 시간은?","explain":"표 $(m+1)(n+1)$ 칸, 칸마다 세 이웃만 보고 $O(1)$.","src":"13강 p.18, 34","wiki":"longest common subsequence","tags":["LCS","running time"],"choices":["$O(m+n)$","$O(mn)$","$O(2^m)$","$O(mn\\log n)$"],"answer":1,"introCard":2},{"id":"u13a-09","type":"mc","q":"LCS 의 응용이 **아닌** 것은?","explain":"p.9: bioinformatics, diff, version control merge.","src":"13강 p.9","wiki":"longest common subsequence","diff":1,"tags":["LCS"],"choices":["bioinformatics (DNA 유사도)","unix diff","git/svn merge","최단경로 routing"],"answer":3,"introCard":0},{"id":"u13a-10","type":"order","q":"DP 로 문제를 풀 때의 recipe 를 순서대로","explain":"p.10, 13, 17, 21, 32 에 반복되는 표지. 시험 'DP 를 설계하라' 는 subproblem 정의 → 점화식 → base → 채우는 순서 → 시간 순으로 쓴다.","src":"13강 p.10","wiki":"DP 레시피 4단계","tags":["DP"],"answer":["optimal substructure 찾기","최적값에 대한 재귀식 찾기","DP 로 값 계산","(필요하면) 해를 복원할 정보 기록","코드로 옮기기"],"introCard":1},{"id":"u13a-11","type":"tf","q":"LCS 의 **길이만** 필요하면 표의 행 2개만 보관해도 된다.","explain":"한 행은 바로 위 행에만 의존한다. 해를 복원하려면 표 전체가 필요하다.","src":"13강 p.33","wiki":"longest common subsequence","tags":["LCS"],"answer":true,"introCard":2},{"id":"u13a-12","type":"tf","q":"LCS 를 $O(mn)$ 보다 다항식만큼(polynomially) 빠르게 푸는 것은 open problem 이다.","explain":"log factor 정도 개선은 알려져 있다.","src":"13강 p.33–34","wiki":"longest common subsequence","diff":3,"tags":["LCS"],"answer":true,"introCard":2},{"id":"u13a-13","type":"num","q":"X = ABCBDAB, Y = BDCABA 의 LCS 길이는?","explain":"예: BCBA, BDAB. 표를 채우면 $C[7,6] = 4$.","src":"13강 p.18 (연습)","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":4,"tol":0,"img":"img/algo13-gen-u13a-13.png","imgAlt":"X = ABCBDAB(세로), Y = BDCABA(가로) 의 빈 LCS 표"},{"id":"u13a-14","type":"mc","q":"[Circle all 형식] 옳은 것을 **모두** 고른 조합은? (1) LCS 길이 DP 는 $O(mn)$ (2) 표가 있으면 LCS 하나를 $O(m+n)$ 에 복원한다 (3) knapsack 의 $O(nW)$ 는 polynomial time 이다 (4) unbounded knapsack 은 1차원 표 $K[x]$ 로 충분하다 (5) 트리 MIS 점화식을 memo 없이 재귀로만 돌려도 $O(|V|)$ 다","explain":"(1) 참: 칸 $mn$ 개, 칸마다 $O(1)$. (2) 참: 한 걸음마다 $i$ 나 $j$ 가 줄어든다. (3) 거짓: $W$ 는 $\\log W$ 비트로 적히니 입력 길이에 대해 지수다(pseudo-polynomial). (4) 참: 이미 쓴 item 을 기억할 필요가 없다. (5) 거짓: $A[u]$ 가 손자들의 $A$ 를 다시 부르며 같은 subtree 를 여러 번 계산해 지수 시간이 될 수 있다. 교수 11/10: 'Only difference is memoization. But it gives you a lot of difference.'","src":"13강 p.18–34, 46, 92, 105 · 중간 1번 형식","wiki":"longest common subsequence","tags":["DP","circle-all"],"choices":["(1)(2)(4)","(1)(2)(3)(4)","(1)(4)","(1)(2)(4)(5)"],"answer":0,"introCard":2}],"intro":[{"title":"subsequence 와 LCS","body":"**subsequence** = 순서는 지키되 **연속일 필요 없이** 골라낸 열 (ABCDEFGH 의 BDFH). 두 열 X, Y 의 **LCS** = 공통 subsequence 중 가장 긴 것(여러 개일 수 있다). 응용: DNA 유사도, diff, merge.","src":"13강 p.5–9"},{"title":"DP recipe","body":"① optimal substructure 찾기 ② 최적값의 재귀식 ③ DP 로 값 계산 ④ (필요하면) 해를 복원할 정보 기록 ⑤ 코드로. LCS 의 subproblem 은 prefix 쌍 $(X_i, Y_j)$.","src":"13강 p.10–17"},{"title":"LCS 점화식","body":"$C[i,j]=0$ ($i=0$ 또는 $j=0$). $X[i]=Y[j]$ 면 $C[i-1,j-1]+1$, 다르면 $\\max(C[i,j-1], C[i-1,j])$. 같을 때는 그 글자를 쓰는 게 항상 안전해 다른 두 경우를 비교할 필요가 없다. 표 $(m+1)(n+1)$ 칸, $O(mn)$. 길이만 필요하면 행 2개로 충분.","img":"img/algo13-p16-lcsrec.png","imgAlt":"LCS 점화식과 Case 0/1/2","src":"13강 p.14–18"}]},{"id":"u13b","title":"LCS 표 채우기와 복원","items":[{"id":"u13b-01","type":"num","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. $C[2,3]$ (X₂ = AC, Y₃ = ACT) 은?","explain":"C ≠ T → $\\max(C[1,3], C[2,2]) = \\max(1, 2) = 2$.","src":"13강 p.19–23","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":2,"tol":0,"img":"img/algo13-p19-lcs-empty.png","imgAlt":"p.19 X = ACGGA(세로), Y = ACTG(가로) LCS 빈 표, 0번 행·열만 0","explainImg":"img/algo13-p20-lcs-ans.png","introCard":0},{"id":"u13b-02","type":"num","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. $C[3,4]$ (X₃ = ACG, Y = ACTG) 는?","explain":"G = G 일치 → $C[2,3] + 1 = 3$.","src":"13강 p.19–23","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":3,"tol":0,"img":"img/algo13-p19-lcs-empty.png","imgAlt":"p.19 X = ACGGA(세로), Y = ACTG(가로) LCS 빈 표, 0번 행·열만 0","explainImg":"img/algo13-p20-lcs-ans.png","introCard":0},{"id":"u13b-03","type":"num","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. 표의 마지막 칸 $C[5,4]$ 는?","explain":"A ≠ G → $\\max(C[4,4], C[5,3]) = \\max(3, 2) = 3$. 슬라이드의 'LCM' 은 LCS 오타.","src":"13강 p.20","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":3,"tol":0,"img":"img/algo13-p19-lcs-empty.png","imgAlt":"X = ACGGA(세로), Y = ACTG(가로) LCS 빈 표, 0번 행·열만 0","introCard":0},{"id":"u13b-04","type":"sa","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. 표를 거슬러 올라가 얻은 LCS 는?","explain":"C[5,4] → 위 C[4,4] → G=G 대각선(G) → C[3,3] → … → C[2,2] C=C(C) → C[1,1] A=A(A). 뒤에서부터 모아 ACG.","src":"13강 p.24–30","wiki":"LCS 역추적","tags":["LCS","trace"],"answer":"ACG","img":"img/algo13-p24-lcs-back.png","imgAlt":"p.24 다 채운 LCS 표, 오른쪽 아래 칸(3)에서 거슬러 올라가기 시작","explainImg":"img/algo13-p30-lcs-back-ans.png","introCard":1},{"id":"u13b-05","type":"mc","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. $C[1,2]$ (A vs AC) 를 구하는 식은?","explain":"$X[1]$ = A, $Y[2]$ = C 로 다르다. 위(0)와 왼쪽(1) 중 큰 1.","src":"13강 p.19–23","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"choices":["일치하므로 $C[0,1]+1 = 1$","A ≠ C 이므로 $\\max(C[0,2], C[1,1]) = 1$","$C[1,1]+1 = 2$","0"],"answer":1,"img":"img/algo13-p19-lcs-empty.png","imgAlt":"X = ACGGA(세로), Y = ACTG(가로) LCS 빈 표, 0번 행·열만 0","introCard":0},{"id":"u13b-06","type":"cloze","q":"복원: $X[i]=Y[j]$ 이면 ___ 으로 이동하며 그 글자를 LCS 에 넣고, 다르면 위·왼쪽 중 ___ 쪽으로 이동한다.","explain":"'대각선 점프 = LCS 의 원소를 찾았다'. 값이 같으면 어느 쪽이든 된다(p.27).","src":"13강 p.24–31","wiki":"LCS 역추적","tags":["LCS"],"answer":["대각선(↖)","값이 큰"],"bank":["대각선(↖)","값이 큰","오른쪽","값이 작은","아래"],"introCard":1},{"id":"u13b-07","type":"mc","q":"LCS 복원(거슬러 올라가기)에 드는 시간은?","explain":"한 번 움직일 때마다 행이나 열이 하나 준다. 전체는 표 채우기 $O(mn)$ 이 지배.","src":"13강 p.31","wiki":"LCS 역추적","tags":["LCS","running time"],"choices":["$O(mn)$","$O(m+n)$","$O(\\log mn)$","$O(m\\cdot n^2)$"],"answer":1,"introCard":1},{"id":"u13b-08","type":"tf","q":"두 문자열의 LCS 는 항상 하나뿐이다.","explain":"동률일 때 어느 쪽으로 가느냐에 따라 달라질 수 있다. 예: ABCBDAB / BDCABA 는 BCBA, BDAB 둘 다 길이 4.","src":"13강 p.27","wiki":"LCS 역추적","tags":["LCS","trap"],"answer":false,"introCard":1},{"id":"u13b-09","type":"num","q":"X = ABCB, Y = BDCAB 의 LCS 길이는?","explain":"B, C, B 가 두 문자열 모두에 순서대로 있다. 길이 4 짜리는 없다.","src":"13강 p.18 (연습)","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":3,"tol":0,"img":"img/algo13-gen-u13b-09.png","imgAlt":"X = ABCB(세로), Y = BDCAB(가로) 의 빈 LCS 표","introCard":0},{"id":"u13b-10","type":"mc","q":"X = ABCB, Y = BDCAB 의 LCS 는?","explain":"ABB 는 Y 에서 A 다음 B 가 하나뿐이라 안 된다. BDB 는 X 에 D 가 없고, CAB 는 X 에서 C 다음 A 가 없다.","src":"13강 p.24–30 (연습)","wiki":"LCS 역추적","tags":["LCS","trace"],"choices":["BCB","ABB","BDB","CAB"],"answer":0,"img":"img/algo13-gen-u13b-09.png","imgAlt":"X = ABCB(세로), Y = BDCAB(가로) 의 빈 LCS 표","introCard":1},{"id":"u13b-11","type":"num","q":"X = GATTA, Y = ATTAG 의 LCS 길이는?","explain":"ATTA. G 는 X 에서 맨 앞, Y 에서 맨 뒤라 ATTA 와 함께 쓸 수 없다.","src":"13강 p.18 (연습)","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":4,"tol":0,"img":"img/algo13-gen-u13b-11.png","imgAlt":"X = GATTA(세로), Y = ATTAG(가로) 의 빈 LCS 표","introCard":0},{"id":"u13b-12","type":"order","q":"X = ACGGA (세로, i), Y = ACTG (가로, j) 의 LCS 표를 오른쪽 아래 $C[5,4]$ 부터 거슬러 올라가 LCS 를 복원하는 경로를 순서대로 (같을 땐 대각선, 다르면 값이 큰 쪽, 동점이면 위)","explain":"p.27 'That 2 may as well have come from this other 2' — C[3,3] 에서 위·왼쪽 둘 다 가능.","src":"13강 p.24–30","wiki":"LCS 역추적","tags":["LCS","trace"],"answer":["C[5,4] = 3 은 위 C[4,4] 에서 왔다","C[4,4]: G = G, 대각선으로 이동하며 G 확보","C[3,3] → 위 C[2,3] → 왼쪽 C[2,2]","C[2,2]: C = C 대각선, C 확보 → C[1,1]: A = A 대각선, A 확보","뒤에서부터 모은 글자를 뒤집어 ACG"],"explainImg":"img/algo13-p30-lcs-back-ans.png","img":"img/algo13-p24-lcs-back.png","imgAlt":"다 채운 LCS 표, 오른쪽 아래 칸(3)에서 거슬러 올라가기 시작","introCard":1},{"id":"u13b-13","type":"tf","q":"LCS 표의 한 칸 $C[i,j]$ 는 왼쪽, 위, 왼쪽 위 대각선 세 칸에만 의존한다.","explain":"그래서 행 우선(위→아래, 왼→오)으로 채우면 필요한 칸이 항상 먼저 있다.","src":"13강 p.18","wiki":"C(i,j) (LCS)","tags":["LCS"],"answer":true,"introCard":0},{"id":"u13b-14","type":"num","q":"X = ACGGA (세로, i), Y = ACTG (가로, j), 0번 행·열은 0. $C[4,2]$ (X₄ = ACGG, Y₂ = AC) 는?","explain":"G ≠ C → $\\max(C[3,2], C[4,1]) = \\max(2, 1) = 2$.","src":"13강 p.19–23","wiki":"C(i,j) (LCS)","tags":["LCS","trace"],"answer":2,"tol":0,"img":"img/algo13-p19-lcs-empty.png","imgAlt":"p.19 X = ACGGA(세로), Y = ACTG(가로) LCS 빈 표, 0번 행·열만 0","explainImg":"img/algo13-p20-lcs-ans.png","introCard":0},{"id":"u13b-15","type":"mc","q":"그림은 X = ACGGA(세로), Y = ACTG(가로)의 LCS 표다. 가린 ① $C[3,4]$, ② $C[4,2]$, ③ $C[5,4]$ 는?","explain":"① $X_3 = $ G, $Y_4 = $ G 로 같으니 대각선 $C[2,3] + 1 = 2 + 1 = 3$. ② $X_4 = $ G, $Y_2 = $ C 는 다르니 $\\max(C[4,1], C[3,2]) = \\max(1, 2) = 2$. ③ $X_5 = $ A, $Y_4 = $ G 는 다르니 $\\max(C[5,3], C[4,4]) = \\max(2, 3) = 3$. 같을 때만 대각선 +1, 다를 때는 왼쪽·위 중 큰 값이다.","src":"13강 p.19–20","wiki":"C(i,j) (LCS)","tags":["LCS","그림"],"img":"img/algo13-p20-lcs.png","imgAlt":"p.20 X = ACGGA, Y = ACTG 의 LCS 표, 세 칸이 ①②③ 으로 가려져 있다","explainImg":"img/algo13-p20-lcs-ans.png","choices":["① 3, ② 2, ③ 3","① 3, ② 2, ③ 2","① 2, ② 2, ③ 3","① 3, ② 1, ③ 3"],"answer":0,"introCard":0}],"intro":[{"title":"표 채우기","body":"X 를 세로(i), Y 를 가로(j)로, 0번 행·열은 0. 칸마다 왼쪽·위·왼쪽 위 대각선만 본다: 글자가 같으면 대각선 +1, 다르면 왼쪽과 위 중 큰 값. X = ACGGA, Y = ACTG 면 마지막 칸 3.","img":"img/algo13-p20-lcs-ans.png","imgAlt":"X = ACGGA, Y = ACTG 의 LCS 표","src":"13강 p.19–23"},{"title":"거슬러 올라가 복원","body":"오른쪽 아래에서 시작: 글자가 같으면 ↖ 대각선으로 가며 그 글자를 LCS 에 넣고, 다르면 값이 큰 쪽(위/왼쪽)으로. 한 걸음마다 i 나 j 가 줄어 $O(m+n)$. 예제 결과 ACG. 동점에서 다른 쪽으로 가면 다른 LCS 가 나올 수 있다.","img":"img/algo13-p30-lcs-back-ans.png","imgAlt":"복원 경로가 칠해진 LCS 표","src":"13강 p.24–31"},{"title":"손으로 돌릴 때 요령","body":"한 칸은 왼쪽·위·왼쪽 위 대각선 세 칸에만 의존하니 행 단위로 왼쪽→오른쪽 채우면 된다. 연습: X = ABCB, Y = BDCAB 의 LCS 길이 3 (BCB), GATTA 와 ATTAG 는 4 (ATTA).","src":"13강 p.18"}]},{"id":"u13c","title":"Unbounded knapsack","items":[{"id":"u13c-01","type":"mc","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 와 0/1 의 최적 가치는 각각?","explain":"unbounded 는 item 4 두 개 + item 2 두 개(무게 10, 가치 42). 0/1 은 item 2, 3, 4(무게 9, 가치 35).","src":"13강 p.35–37","wiki":"knapsack problem","tags":["knapsack"],"choices":["42 와 35","39 와 35","42 와 42","35 와 34"],"answer":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":0},{"id":"u13c-02","type":"cloze","q":"unbounded: $K[x] = \\max_{i:\\ w_i \\le x}\\{$ ___ $+ v_i\\}$, 넣을 수 있는 i 가 없으면 $K[x] =$ ___ .","explain":"용량 x 의 최적해에 item i 가 하나 있으면 그걸 뺀 나머지는 용량 $x-w_i$ 의 최적해다(cut-and-paste).","src":"13강 p.41–43","wiki":"K(x) (unbounded)","tags":["knapsack","pseudocode"],"answer":["K[x−w_i]","0"],"bank":["K[x−w_i]","0","K[x]","K[x−1]","∞"],"introCard":1},{"id":"u13c-03","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 의 $K[4]$ 는?","explain":"후보: $K[2]+8 = 16$, $K[0]+14 = 14$, $K[1]+13 = 13$ → 16 (item 2 두 개).","src":"13강 p.43 (예제 표)","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"answer":16,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u13c-04","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 의 $K[6]$ 은?","explain":"$K[0]+20 = 20$, $K[4]+8 = 24$, $K[2]+14 = 22$, $K[3]+13 = 26$ → 26 (item 4 두 개).","src":"13강 p.43 (예제 표)","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"answer":26,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u13c-05","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 의 $K[9]$ 는?","explain":"$K[3]+20 = 33$, $K[7]+8 = 37$, $K[5]+14 = 35$, $K[6]+13 = 39$ → 39.","src":"13강 p.43 (예제 표)","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"answer":39,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u13c-06","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 의 $K[10]$ 은?","explain":"$K[8]+8 = 34+8$, $K[7]+13 = 29+13$ 둘 다 42. 슬라이드 p.37 답과 같다.","src":"13강 p.37","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"answer":42,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u13c-07","type":"mc","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. unbounded 최적 42 의 구성은?","explain":"무게 3+3+2+2 = 10, 가치 13+13+8+8 = 42. item 4 × 3 은 39 (greedy 의 답, L14).","src":"13강 p.37","wiki":"unbounded knapsack","tags":["knapsack"],"choices":["item 4 × 3","item 4 × 2 + item 2 × 2","item 1 + item 3","item 2 × 5"],"answer":1,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":0},{"id":"u13c-08","type":"num","q":"무게 1, 2, 3 / 가치 1, 4, 6, 용량 4 인 unbounded knapsack 의 $K[4]$ 는?","explain":"K = [0, 1, 4, 6, 8]. $K[4]$: item1 → $K[3]+1 = 7$, item2 → $K[2]+4 = 8$, item3 → $K[1]+6 = 7$.","src":"13강 p.50–57","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"answer":8,"tol":0,"img":"img/algo13-p50-items.png","imgAlt":"unbounded knapsack: 무게 1, 2, 3 / 가치 1, 4, 6, 용량 4, 빈 K·ITEMS 표","introCard":1},{"id":"u13c-09","type":"mc","q":"unbounded knapsack: 무게 1, 2, 3 / 가치 1, 4, 6, 용량 4. 최적값을 내는 ITEMS[4] 는?","explain":"$K[4]$ 가 item 2 로 갱신될 때 ITEMS[4] = ITEMS[2] ∪ {item 2} 이고 ITEMS[2] = {item 2}.","src":"13강 p.49–57","wiki":"K(x) (unbounded)","tags":["knapsack","trace"],"choices":["{item 1, item 3}","{item 2, item 2}","{item 1 × 4}","{item 3}"],"answer":1,"img":"img/algo13-p50-items.png","imgAlt":"p.50 unbounded knapsack 예제: 무게 1, 2, 3 / 가치 1, 4, 6, 용량 4, 빈 K·ITEMS 표","explainImg":"img/algo13-p57-items-ans.png","introCard":2},{"id":"u13c-10","type":"tf","q":"knapsack 의 $O(nW)$ 알고리즘은 polynomial time 이다.","explain":"pseudo-polynomial 이다. 입력 크기는 W 의 비트 수 $\\log W$ 인데 시간이 W 에 비례한다.","src":"13강 p.46","wiki":"pseudo-polynomial","tags":["knapsack","trap"],"answer":false,"introCard":3},{"id":"u13c-11","type":"mc","q":"$O(nW)$ 를 pseudo-polynomial 이라 부르는 이유는?","explain":"polynomial 알고리즘이 있는지는 open 이고, 있으면 P = NP 라 아마 없다.","src":"13강 p.46","wiki":"pseudo-polynomial","tags":["knapsack"],"choices":["n 이 작아서","W 를 적는 데는 $\\log W$ 비트면 되는데 시간이 W 에 비례하므로(입력 길이에 대해 지수)","근사 알고리즘이라서","randomized 라서"],"answer":1,"introCard":3},{"id":"u13c-12","type":"tf","q":"unbounded knapsack 이 1차원 표 $K[x]$ 로 충분한 이유는 어떤 item 을 이미 썼는지 기억할 필요가 없어서다.","explain":"item 이 무한히 있으니 같은 item 을 또 써도 된다. 0/1 은 이게 안 돼서 2차원.","src":"13강 p.92","wiki":"unbounded knapsack","tags":["knapsack"],"answer":true,"introCard":1},{"id":"u13c-13","type":"mc","q":"unbounded knapsack 의 optimal substructure 논증은?","explain":"cut-and-paste. 둘째 보기는 L14 에서 틀린다고 보인 greedy 다.","src":"13강 p.41","wiki":"K(x) (unbounded)","tags":["knapsack","proof"],"choices":["용량 x 의 최적해에서 item i 를 빼면 용량 $x-w_i$ 의 최적해가 남는다. 더 좋은 게 있으면 i 를 다시 넣어 원래 해를 개선 → 모순","가치/무게 비율이 가장 큰 item 이 항상 들어 있다","가장 무거운 item 이 들어 있다","item 을 정렬하면 된다"],"answer":0,"introCard":1},{"id":"u13c-14","type":"sa","q":"입력 수치 W 에 비례하는 $O(nW)$ 같은 수행 시간을 가리키는 용어는?","explain":"W 가 작으면 빠르지만 W 를 2배 키우는 데 비트 하나면 되니 입력 길이 기준으로는 지수다.","src":"13강 p.46","wiki":"pseudo-polynomial","tags":["knapsack"],"answer":"pseudo-polynomial","alts":["pseudo polynomial","pseudopolynomial"]},{"id":"u13c-15","type":"num","q":"그림은 unbounded knapsack(무게 1, 2, 3 / 가치 1, 4, 6) 표를 채우는 중이다. $x = 3$ 에서 item 1, 2 까지 보고 $K[3] = 5$ 를 적었다. 안쪽 루프가 item 3(수박)까지 돌고 나면 $K[3]$ 은?","explain":"코드는 `K[x] = max{K[x], K[x − w_i] + v_i}` 를 item 마다 갱신한다. item 3 은 $w_3 = 3 \\le 3$ 이라 $K[0] + 6 = 6 > 5$ 로 바뀐다. 그래서 ITEMS[3] = ITEMS[0] ∪ {수박} 이 된다(p.55). 5 는 아직 안쪽 루프가 끝나지 않은 중간값이다.","src":"13강 p.54–55","wiki":"K(x) (unbounded)","tags":["knapsack","그림"],"img":"img/algo13-p54-unb.png","imgAlt":"p.54 unbounded knapsack 표 진행: K = 0, 1, 4, 5, (빈칸), ITEMS[3] = ITEMS[2] + 거북이","explainImg":"img/algo13-p55-unb-ans.png","answer":6,"tol":0,"introCard":1},{"id":"u13c-16","type":"cloze","q":"[빈칸 의사코드] 해까지 복원하는 UnboundedKnapsack: `if w_i ≤ x:` `K[x] = max{K[x], K[x − w_i] + v_i}` / `if K[x] was updated: ITEMS[x] = ITEMS[` ___ `] ∪ {item i}` / 마지막에 `return` ___","explain":"$K[x]$ 를 $K[x-w_i] + v_i$ 로 갱신했다면, 그 해는 '용량 $x-w_i$ 의 최적해에 item $i$ 를 하나 더 넣은 것' 이다. 그래서 ITEMS 도 같은 칸 $x - w_i$ 에서 가져온다. `x − 1` 은 용량을 1씩 줄이는 착각이다. 값이 아니라 해를 돌려주므로 ITEMS[W] 를 반환한다(Recipe Step 4).","src":"13강 p.49–57","wiki":"unbounded knapsack","tags":["knapsack","빈칸"],"answer":["x − w_i","ITEMS[W]"],"bank":["x − w_i","ITEMS[W]","x − 1","K[W]","x"],"introCard":1}],"intro":[{"title":"knapsack 두 가지","body":"item 마다 무게 $w_i$, 가치 $v_i$, 배낭 용량 W. **unbounded**: 같은 item 을 몇 개든. **0/1**: item 마다 한 번. 예: 무게 6,2,4,3,11 / 가치 20,8,14,13,35, W=10 이면 unbounded 42(4번 둘 + 2번 둘), 0/1 35.","src":"13강 p.35–37"},{"title":"unbounded 점화식","body":"$K[x]$ = 용량 x 의 최적값. $K[x] = \\max_{i:\\,w_i\\le x}\\{K[x-w_i]+v_i\\}$, 넣을 수 있는 i 가 없으면 0. 최적해에서 item i 하나를 빼면 용량 $x-w_i$ 의 최적해가 남는다(아니면 개선 가능 → 모순). 어떤 item 을 썼는지 기억할 필요가 없어 1차원 표.","src":"13강 p.39–45"},{"title":"해까지 복원: ITEMS","body":"`K[x]` 를 `K[x−w_i]+v_i` 로 갱신할 때 `ITEMS[x] = ITEMS[x−w_i] ∪ {item i}`, 마지막에 ITEMS[W] 반환. 예: 무게 1,2,3 / 가치 1,4,6, 용량 4 → K = 0,1,4,6,8, ITEMS[4] = 전구 둘.","img":"img/algo13-p57-items-ans.png","imgAlt":"K 와 ITEMS 표를 다 채운 장면","src":"13강 p.49–57"},{"title":"pseudo-polynomial","body":"$O(nW)$ 는 W 의 **값**에 비례한다. W 를 적는 데는 $\\log W$ 비트면 되니 입력 길이에 대해 지수다. 그래서 polynomial 이 아니라 pseudo-polynomial.","src":"13강 p.46"}]},{"id":"u13d","title":"0/1 knapsack","items":[{"id":"u13d-01","type":"cloze","q":"0/1 점화식: $K[x,j] = \\max\\{\\ K[x,$ ___ $],\\ K[x-w_j,\\ j-1] +$ ___ $\\}$ (두 번째 항은 $w_j \\le x$ 일 때만)","explain":"Case 1 item j 안 씀 / Case 2 item j 씀(나머지는 용량 $x-w_j$, 앞 j−1 개). $K[\\cdot, j-1]$ 을 참조해 item j 가 두 번 쓰이지 않는다.","src":"13강 p.70–72","wiki":"K(x,j) (0/1)","tags":["knapsack","pseudocode"],"answer":["j−1","v_j"],"bank":["j−1","v_j","j","w_j","j+1"],"introCard":1},{"id":"u13d-02","type":"mc","q":"0/1 knapsack 에서 unbounded 식 subproblem(용량만)을 그대로 쓰면 실패하는 이유는?","explain":"Try 1 실패(p.62–63). 그래서 'item 을 앞에서부터 j 개만 쓴다' 를 subproblem 에 넣는다(Try 2).","src":"13강 p.60–65","wiki":"0/1 knapsack","tags":["knapsack"],"choices":["표가 너무 커서","용량만으로는 어떤 item 을 이미 썼는지 알 수 없어서","음수 가치 때문에","정렬이 필요해서"],"answer":1,"introCard":0},{"id":"u13d-03","type":"num","q":"0/1 knapsack: 거북이(무게 1, 가치 1), 전구(2, 4), 수박(3, 6), W = 3. 그림의 표에서 가린 $K[3,2]$ (용량 3, 앞 2 item) 는?","explain":"$\\max(K[3,1] = 1,\\ K[1,1] + 4 = 5) = 5$ — 전구 + 거북이.","src":"13강 p.73–89","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":5,"tol":0,"img":"img/algo13-p86-01.png","imgAlt":"p.86 0/1 knapsack 표(거북이 1/1, 전구 2/4, 수박 3/6, 용량 3), K[3,2] 칸이 가려져 있다","explainImg":"img/algo13-p86-01-ans.png","introCard":2},{"id":"u13d-04","type":"num","q":"0/1 knapsack: 거북이(무게 1, 가치 1), 전구(2, 4), 수박(3, 6), W = 3. 그림은 $K[3,3]$ 칸에 먼저 $K[3,2]$ 를 복사해 둔 장면이다. 최종 $K[3,3]$ 은?","explain":"$\\max(K[3,2] = 5,\\ K[0,2] + 6 = 6) = 6$. 'So the optimal solution is to put one watermelon in your knapsack!'","src":"13강 p.89","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":6,"tol":0,"img":"img/algo13-p87-01.png","imgAlt":"p.87 0/1 knapsack 표, current entry K[3,3] 에 K[3,2] 를 복사한 5 가 들어 있다","explainImg":"img/algo13-p88-01-ans.png","introCard":2},{"id":"u13d-05","type":"mc","q":"0/1 knapsack: 거북이(무게 1, 가치 1), 전구(2, 4), 수박(3, 6), W = 3. 최적해는?","explain":"가치 6 > 5. 0/1 이라 거북이 셋은 불가.","src":"13강 p.89","wiki":"0/1 knapsack","tags":["knapsack"],"choices":["전구 + 거북이","수박 하나","거북이 셋","전구 하나"],"answer":1,"img":"img/algo13-p86-01.png","imgAlt":"0/1 knapsack 표(거북이 1/1, 전구 2/4, 수박 3/6, 용량 3) 채우는 중","introCard":2},{"id":"u13d-06","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 0/1 표의 $K[9,4]$ (용량 9, 앞 4 item) 는?","explain":"$\\max(K[9,3] = 28,\\ K[6,3] + 13 = 22 + 13 = 35) = 35$.","src":"13강 p.73–89 (큰 예제)","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":35,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10"},{"id":"u13d-07","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 0/1 표의 $K[10,3]$ (앞 3 item) 은?","explain":"item 1 + item 3 = 무게 10, 가치 34. 또는 2+3 은 22.","src":"13강 p.73–89 (큰 예제)","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":34,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10"},{"id":"u13d-08","type":"mc","q":"item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 0/1 knapsack 최적해(가치 35)를 DP 표를 거슬러 올라가 복원하면?","explain":"$K[10,4]$ = Case 2(item 4) → $K[7,3] = 22 > K[7,2]$ 라 item 3 → $K[3,2] = 8$ 은 item 2. 무게 9.","src":"13강 p.73–89 (큰 예제)","wiki":"0/1 knapsack","tags":["knapsack","trace"],"choices":["{1, 3}","{2, 3, 4}","{4, 4, 2, 2}","{5}"],"answer":1,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10"},{"id":"u13d-09","type":"tf","q":"item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 0/1 knapsack 표 $K[x, j]$ 에서 j = 5 행은 j = 4 행과 같다.","explain":"item 5 는 무게 11 > 10 이라 어느 칸에도 못 들어가 Case 1 만 남는다.","src":"13강 p.73–89 (큰 예제)","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":true,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":3},{"id":"u13d-10","type":"tf","q":"unbounded 의 1차원 점화식 $K[x] = \\max_i\\{K[x-w_i]+v_i\\}$ 를 그대로 쓰면 0/1 knapsack 도 풀린다.","explain":"그 식은 같은 item 을 여러 번 쓴다. 0/1 은 item 인덱스 j 를 subproblem 에 넣어 2차원 표로 푼다.","src":"13강 p.60–72","wiki":"0/1 knapsack","tags":["knapsack","trap"],"answer":false,"introCard":0},{"id":"u13d-11","type":"mc","q":"0/1 knapsack DP 의 시간과 표 크기는?","explain":"unbounded 와 같은 $O(nW)$ 지만 2차원 표다.","src":"13강 p.72, 90","wiki":"K(x,j) (0/1)","tags":["knapsack","running time"],"choices":["$O(nW)$, $(W+1)\\times(n+1)$","$O(2^n)$, $2^n$","$O(n^2)$, $n\\times n$","$O(W)$, $W+1$"],"answer":0,"introCard":1},{"id":"u13d-12","type":"match","q":"문제와 DP 수행 시간을 연결하시오","explain":"교수가 이 표를 띄우고 'this is the whole dynamic programming' 으로 DP 단원을 끝냈다.","src":"13강 p.109–111 · 11/10 녹음","wiki":"DP 예제 비교표","prof":true,"tags":["DP"],"pairs":[["LCS","$O(|X||Y|)$"],["Unbounded knapsack","$O(nW)$, 1차원 표"],["0/1 knapsack","$O(nW)$, 2차원 표"],["트리의 maximum independent set","$O(|V|)$"]],"introCard":3},{"id":"u13d-13","type":"mc","q":"unbounded 와 0/1 knapsack 에 서로 다른 substructure 를 쓴다. 어떤 variant 에 어떤 substructure 를 쓸지는 어떻게 정하나?","explain":"정답 공식은 없다. 다만 '무엇을 기억해야 하나'(unbounded 는 없음, 0/1 은 쓴 item) 로 판단한다.","src":"13강 p.92","wiki":"DP 레시피 4단계","tags":["DP"],"choices":["정해진 공식이 있다","try some stuff, see what works!","항상 2차원 표","greedy 를 먼저 쓴다"],"answer":1,"introCard":0},{"id":"u13d-14","type":"num","q":"knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 0/1 표의 $K[5,4]$ 는?","explain":"$\\max(K[5,3] = 14,\\ K[2,3] + 13 = 8 + 13 = 21) = 21$ — item 2 + item 4.","src":"13강 p.73–89 (큰 예제)","wiki":"K(x,j) (0/1)","tags":["knapsack","trace"],"answer":21,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10"},{"id":"u13d-15","type":"order","q":"[증명 칸 채우기] 0/1 knapsack Case 2 (최적해가 item $j$ 를 쓴다)의 optimal substructure 를 귀류법으로","explain":"p.68 Case 2 그림을 네 칸으로 쓴 것이다. 'item $1..j-1$' 로 줄이는 것이 핵심이다. 용량만 줄이면(unbounded 방식) item $j$ 를 또 쓸 수 있어서 0/1 조건이 깨진다.","src":"13강 p.67–70","wiki":"K(x,j) (0/1)","tags":["knapsack","proof"],"answer":["용량 $x$, item $1..j$ 의 최적해 $S$ 가 item $j$ 를 쓴다고 하자","$S$ 에서 item $j$ 를 빼면 용량 $x - w_j$, item $1..j-1$ 의 해 $S'$ 이 남는다","$S'$ 보다 가치가 큰 해 $T$ 가 있다면 $T \\cup \\{j\\}$ 는 용량 $x$ 안에 들어가고 $S$ 보다 가치가 크다","$S$ 의 최적성에 모순이므로 $S'$ 은 최적이고 $K[x,j] = K[x-w_j,\\ j-1] + v_j$"],"introCard":1},{"id":"u13d-16","type":"num","q":"[분석 템플릿 칸] 0/1 knapsack, item $n = 5$, 용량 $W = 10$. 표 $K[x, j]$ ($x = 0..W$, $j = 0..n$) 의 칸 수는?","explain":"$(W+1)(n+1) = 11 \\times 6 = 66$. 칸마다 max 한 번 $O(1)$ 이니 $O(nW)$. 이 '칸 수 × 칸당 일' 이 DP 수행 시간 분석의 기본 틀이다. LCS 는 $(m+1)(n+1)$ 칸 × $O(1)$, FW 는 $n$ 개 표 × $n^2$ 칸 × $O(1)$ 이다.","src":"13강 p.72, 90","wiki":"K(x,j) (0/1)","tags":["knapsack","running time","analysis"],"answer":66,"tol":0,"introCard":1}],"intro":[{"title":"0/1 은 item 수도 subproblem 에","body":"용량만으로는 어떤 item 을 이미 썼는지 몰라 unbounded 식을 그대로 쓰면 같은 item 을 또 쓴다. $K[x,j]$ = 용량 x, **앞 j 개 item** 만 쓸 때의 최적값.","src":"13강 p.60–68"},{"title":"0/1 점화식","body":"$K[x,j] = \\max\\{K[x,j-1],\\ K[x-w_j, j-1]+v_j\\}$ (둘째 항은 $w_j\\le x$ 일 때). Case 1 item j 안 씀, Case 2 씀(용량과 item 수가 같이 준다). 표 $(W+1)(n+1)$ 칸, $O(nW)$.","src":"13강 p.69–72"},{"title":"작은 예제 표","body":"거북이(1, 1), 전구(2, 4), 수박(3, 6), W = 3. 코드는 먼저 $K[x,j]=K[x,j-1]$ 을 복사한 뒤 item j 를 넣는 쪽과 비교한다. $K[3,2]=5$(거북이+전구), $K[3,3]=6$(수박 하나).","img":"img/algo13-p88-01-ans.png","imgAlt":"0/1 knapsack 표 완성","src":"13강 p.73–89"},{"title":"문제별 DP 비용","body":"LCS $O(|X||Y|)$ · unbounded $O(nW)$ 1차원 · 0/1 $O(nW)$ 2차원 · 트리 MIS $O(|V|)$. 어떤 substructure 를 쓸지는 정해진 공식이 없다: try some stuff, see what works.","src":"13강 p.92, 111"}]},{"id":"u13e","title":"트리의 maximum independent set","items":[{"id":"u13e-01","type":"mc","q":"independent set 의 정의는?","explain":"정점에 가중치가 있고 총 가중치가 최대인 independent set 을 찾는다. 이번엔 weight 가 간선이 아니라 정점에 붙는다(교수 11/10).","src":"13강 p.93–95","wiki":"independent set","tags":["MIS"],"choices":["모든 정점을 덮는 간선 집합","어느 두 정점 사이에도 간선이 없는 정점 집합","서로 모두 연결된 정점 집합","cycle 이 없는 간선 집합"],"answer":1,"introCard":0},{"id":"u13e-02","type":"tf","q":"일반 그래프의 maximum (weight) independent set 은 NP-complete 지만, tree 로 제한하면 DP 로 효율적으로 풀린다.","explain":"cycle 이 없는 tree 에서는 subtree 가 자연스러운 subproblem 이 된다.","src":"13강 p.95 · 11/10 녹음","wiki":"트리의 maximal independent set","prof":true,"tags":["MIS"],"answer":true,"introCard":0},{"id":"u13e-03","type":"cloze","q":"$A[u] = \\max\\{\\ \\sum_{v\\in u.\\text{children}} A[v],\\ \\ \\text{weight}(u) + \\sum_{v} $ ___ $[v]\\ \\}$, $B[u] = \\sum_{v} $ ___ $[v]$","explain":"B[u] = u 를 안 쓸 때 subtree 최적 = 자식들의 A 합. 자식들의 B 합 = 손자들의 A 합이라 손자를 직접 들고 다니지 않아도 된다.","src":"13강 p.101–102 · 11/10 녹음","wiki":"A(u)와 B(u)","prof":true,"tags":["MIS","pseudocode"],"answer":["B","A"],"bank":["B","A","C","K","D"],"introCard":1},{"id":"u13e-04","type":"mc","q":"$B[u]$ 의 뜻은?","explain":"교수 질문 '손자들의 합을 어떻게 들고 다니나?' 의 답으로 도입된 두 번째 배열.","src":"13강 p.102","wiki":"A(u)와 B(u)","tags":["MIS"],"choices":["u 를 반드시 포함하는 최적값","u 를 쓰지 않을 때 u 의 subtree 최적값 (= 자식들의 A 합)","u 의 손자 수","u 의 깊이"],"answer":1,"introCard":1},{"id":"u13e-05","type":"tf","q":"leaf u 에서는 $A[u] = \\text{weight}(u)$, $B[u] = 0$ 이다.","explain":"p.104 의사코드의 base. u 를 쓰면 weight, 안 쓰면 빈 집합.","src":"13강 p.104","wiki":"A(u)와 B(u)","tags":["MIS"],"answer":true,"introCard":1},{"id":"u13e-06","type":"num","q":"트리(root r 무게 1): r 의 자식 a(5), t(2), leaf 5, leaf 5 / a 의 자식 c(3) / c 의 자식 leaf 3, 2, 2 / t 의 자식 leaf 3. $A[a]$ 는?","explain":"c: $A[c] = \\max(3+2+2,\\ 3+0) = 7$, $B[c] = 7$. a: $\\max(A[c] = 7,\\ 5 + B[c] = 12) = 12$.","src":"13강 p.95, 107 (연습)","wiki":"A(u)와 B(u)","tags":["MIS","trace"],"answer":12,"tol":0,"img":"img/algo13-p95-tree.png","imgAlt":"p.95 트리: r(1) 의 자식 a(5), t(2), 5, 5 / a 의 자식 c(3) / c 의 자식 3, 2, 2 / t 의 자식 3","explainImg":"img/algo13-p95-mis-ans.png","introCard":1},{"id":"u13e-07","type":"num","q":"트리(root r 무게 1): r 의 자식 a(5), t(2), leaf 5, leaf 5 / a 의 자식 c(3) / c 의 자식 leaf 3, 2, 2 / t 의 자식 leaf 3. 트리 전체의 최대 가중치 $A[r]$ 은?","explain":"$A[t] = 3$, $B[a] = 7$, $B[t] = 3$. $A[r] = \\max(12+3+5+5 = 25,\\ 1+7+3+0+0 = 11) = 25$. 전수 확인도 25.","src":"13강 p.95, 107 (연습)","wiki":"A(u)와 B(u)","tags":["MIS","trace"],"answer":25,"tol":0,"img":"img/algo13-p95-tree.png","imgAlt":"p.95 트리: r(1) 의 자식 a(5), t(2), 5, 5 / a 의 자식 c(3) / c 의 자식 3, 2, 2 / t 의 자식 3","explainImg":"img/algo13-p95-mis-ans.png","introCard":1},{"id":"u13e-08","type":"mc","q":"트리(root r 무게 1): r 의 자식 a(5), t(2), leaf 5, leaf 5 / a 의 자식 c(3) / c 의 자식 leaf 3, 2, 2 / t 의 자식 leaf 3. 최적해에 root r 이 들어가는가?","explain":"r 을 쓰는 쪽은 11, 안 쓰는 쪽은 25. 해는 a(5) + c 의 leaf 3, 2, 2 + t 의 leaf 3 + leaf 5, 5.","src":"13강 p.95 (연습)","wiki":"트리의 maximal independent set","tags":["MIS","trace"],"choices":["들어간다","들어가지 않는다","동률이라 둘 다 된다","알 수 없다"],"answer":1,"img":"img/algo13-p95-tree.png","imgAlt":"p.95 트리: r(1) 의 자식 a(5), t(2), 5, 5 / a 의 자식 c(3) / c 의 자식 3, 2, 2 / t 의 자식 3","explainImg":"img/algo13-p95-mis-ans.png","introCard":2},{"id":"u13e-09","type":"num","q":"트리: root r(6) 의 자식 x(3), y(5) / x 의 자식 p(2), q(2) / y 의 자식 z(1). 최대 가중치 independent set 의 가중치는?","explain":"x: $A = \\max(2+2, 3) = 4$, $B = 4$. y: $A = \\max(1, 5) = 5$, $B = 1$. r: $\\max(4+5 = 9,\\ 6 + 4 + 1 = 11) = 11$ → {r, p, q, z}.","src":"13강 p.104 (연습)","wiki":"A(u)와 B(u)","tags":["MIS","trace"],"answer":11,"tol":0,"img":"img/algo13-tree2.png","imgAlt":"연습 트리: r(6) 의 자식 x(3), y(5) / x 의 자식 p(2), q(2) / y 의 자식 z(1)","introCard":2},{"id":"u13e-10","type":"mc","q":"트리 MIS DP 의 수행 시간은?","explain":"정점마다 한 번 방문, 정점당 $O(1)$ (자식 합은 간선마다 한 번씩이라 전체 $O(|V|)$).","src":"13강 p.104 · 11/10 녹음","wiki":"트리의 maximal independent set","tags":["MIS","running time"],"choices":["$O(|V|^2)$","$O(|V|)$","$O(2^{|V|})$","$O(|V|\\log|V|)$"],"answer":1},{"id":"u13e-11","type":"mc","q":"트리 MIS 에서 A, B 표 없이 같은 점화식을 재귀로만 계산하는 D&C 구현과 DP 의 차이는?","explain":"표 없이 재귀하면 한 정점 값을 부모 쪽·조부모 쪽에서 두 번 묻고, 내려갈수록 반복이 쌓여 지수 시간.","src":"13강 p.105–106 · 11/10 녹음","wiki":"top-down과 memoization","prof":true,"tags":["MIS","DP"],"choices":["점화식이 다르다","Only difference is memoization. But it gives you a lot of difference.","D&C 가 더 빠르다","DP 는 재귀를 안 쓴다"],"answer":1,"introCard":3},{"id":"u13e-12","type":"tf","q":"트리 MIS 의 A, B 표 없이 같은 점화식을 재귀로만 계산하면 지수 시간이 걸릴 수 있다.","explain":"overlapping subproblem 이므로 memo 가 필요하다.","src":"13강 p.105","wiki":"A(u)와 B(u)","tags":["MIS","DP"],"answer":true},{"id":"u13e-13","type":"mc","q":"트리 문제의 DP 를 구현할 때 더 자연스러운 방식은?","explain":"p.108 '이 예제는 top-down 구현이 자연스러웠다'.","src":"13강 p.108 · 11/10 녹음","wiki":"top-down과 memoization","tags":["MIS","DP"],"choices":["bottom-up","top-down (root 에서 재귀, 자식 먼저 계산)","greedy","BFS"],"answer":1,"prof":true,"introCard":3},{"id":"u13e-14","type":"mc","q":"'dynamic programming 이 무엇인가' 를 divide-and-conquer·greedy 와 구별되게 한 문장으로 답하면? (대학원 면접 단골 질문)","explain":"DP = optimal substructure + overlapping subproblems + 표(memo) 재사용. 둘째 보기는 D&C(subproblem 이 disjoint), 셋째는 greedy(subproblem 하나에만 의존), 넷째는 randomized 다. 트리 MIS 에서 A, B 표를 버리면 같은 점화식이라도 D&C 가 되어 지수 시간이 될 수 있다는 것이 11/10 의 요지였다.","src":"11/10 녹음","wiki":"dynamic programming","prof":true,"diff":1,"tags":["DP"],"choices":["subproblem 이 겹칠 때, 각 subproblem 을 한 번만 풀어 표에 저장하고 재사용해 큰 문제를 푼다","문제를 겹치지 않는 부분으로 나눠 재귀로 풀고 합친다","매 단계 가장 좋아 보이는 선택을 하고 되돌아보지 않는다","무작위 선택으로 기대 수행 시간을 줄인다"],"answer":0,"introCard":3}],"intro":[{"title":"independent set","body":"어느 두 정점 사이에도 간선이 없는 정점 집합. 정점 weight 합이 최대인 것을 찾는 문제는 일반 그래프에서 NP-complete 지만 **tree** 면 DP 로 $O(|V|)$.","src":"13강 p.93–95"},{"title":"두 경우와 A, B 표","body":"u 를 root 로 한 subtree 에서 root 를 안 쓰면 자식들의 최적해 합, 쓰면 자식은 못 쓰고 손자 아래 최적해. 그래서 두 배열: $A[u]$ = u subtree 의 최적값, $B[u] = \\sum_{v\\in u.children} A[v]$ (u 를 안 쓸 때). $A[u] = \\max\\{\\sum_v A[v],\\ weight(u) + \\sum_v B[v]\\}$. leaf: $A = weight$, $B = 0$.","img":"img/algo13-p102-mis.png","imgAlt":"A[u], B[u] 점화식","src":"13강 p.97–104"},{"title":"예제 트리","body":"root r(1) 의 자식 a(5), t(2), 5, 5 / a 의 자식 c(3) / c 의 자식 3, 2, 2 / t 의 자식 3. 진한 정점이 최적 independent set, 합 25. root 는 들어가지 않는다.","img":"img/algo13-p95-mis-ans.png","imgAlt":"예제 트리와 최적 independent set(진한 정점)","src":"13강 p.95"},{"title":"memo 가 차이를 만든다","body":"A, B 표 없이 같은 점화식을 재귀로만 계산하면 같은 subtree 를 여러 번 계산해 지수 시간이 될 수 있다. 'Only difference is memoization.' 트리 문제는 root 에서 재귀하는 top-down 이 자연스럽다.","src":"13강 p.105–108"}]}]},{"id":"u14","title":"14강 Greedy I","desc":"greedy 정의 · activity selection · job scheduling · Huffman","lessons":[{"id":"u14a","title":"greedy 란 · 실패하는 knapsack · subproblem 그림","items":[{"id":"u14a-01","type":"cloze","q":"greedy 알고리즘을 한 줄로: Make choices ___ . Never ___ . Hope for the best.","explain":"backtracking 이 없다. 설계는 쉽고 빠르지만 정확성 검증이 어렵다.","src":"14강 p.4","wiki":"greedy algorithm","tags":["greedy"],"answer":["one-at-a-time","look back"],"bank":["one-at-a-time","look back","all at once","stop","branch"]},{"id":"u14a-02","type":"tf","q":"greedy 는 설계가 단순하고 직관적이지만, 어려운 부분은 정확성 증명이다.","explain":"11/10·11/12 모두 'The difficult part is to prove its correctness.'","src":"14강 p.4 · 11/10 녹음","wiki":"greedy algorithm","prof":true,"tags":["greedy"],"answer":true,"introCard":0},{"id":"u14a-03","type":"num","q":"unbounded knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 'value/weight 비율이 가장 큰 item 을 들어가는 만큼 계속 담는' greedy 를 쓰면 얻는 가치는?","explain":"비율 최대는 item 4(13/3 ≈ 4.33). 세 개 담으면 무게 9, 가치 39, 남은 1 에는 아무것도 안 들어간다. 최적은 42.","src":"14강 p.6–7","wiki":"greedy가 실패하는 knapsack","tags":["greedy","knapsack"],"answer":39,"tol":0,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u14a-04","type":"mc","q":"unbounded knapsack: item 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 W = 10. 비율 greedy 가 첫 번째로 고르는 item 은?","explain":"비율: 3.33, 4, 3.5, 4.33, 3.18. item 4 가 최대.","src":"14강 p.6","wiki":"greedy가 실패하는 knapsack","tags":["greedy","knapsack"],"choices":["item 1 (20/6)","item 2 (8/2)","item 4 (13/3)","item 5 (35/11)"],"answer":2,"img":"img/algo13-gen-u13c-01.png","imgAlt":"knapsack item 표: 무게 6, 2, 4, 3, 11 / 가치 20, 8, 14, 13, 35, 용량 10","introCard":1},{"id":"u14a-05","type":"mc","q":"knapsack 비율 greedy 가 틀리는 이유는?","explain":"'배제' 가 이후 모든 증명의 핵심 개념이다. 올바른 greedy 는 매 선택이 최적해를 배제하지 않음을 보인다.","src":"14강 p.7","wiki":"greedy가 실패하는 knapsack","tags":["greedy"],"choices":["비율 계산이 틀려서","남는 용량을 낭비하며, 한 번의 선택이 최적해를 배제해 버려서","item 이 무한해서","정렬이 느려서"],"answer":1,"introCard":1},{"id":"u14a-06","type":"match","q":"설계 기법과 subproblem 그래프의 모양을 연결하시오","explain":"'이 그림만 기억하면 두 알고리즘의 차이를 분명히 설명할 수 있다.' 11/12 복습에서도 'that's the most important part'.","src":"14강 p.38–43 · 11/10 녹음","wiki":"sub-problem graph 비교","prof":true,"tags":["greedy","DP","D&C"],"pairs":[["Divide-and-conquer","겹치지 않는 subproblem 들의 tree"],["Dynamic programming","subproblem 이 겹치는 DAG"],["Greedy","subproblem 하나에만 의존하는 사슬"],["Dijkstra","greedy 의 예"],["Bellman-Ford","DP 의 예"]],"introCard":2},{"id":"u14a-07","type":"mc","q":"Dijkstra 가 greedy 인 이유는?","explain":"subproblem 하나만 풀고 다음으로 간다. BF 는 매번 모든 정점을 갱신하니 DP.","src":"14강 p.42 · 11/10 녹음","wiki":"sub-problem graph 비교","prof":true,"tags":["greedy","Dijkstra"],"choices":["모든 정점을 n−1 번 갱신해서","추정치가 가장 작은 정점 하나만 골라 그 이웃만 갱신하고 되돌아보지 않아서","heap 을 써서","음수 간선을 못 다뤄서"],"answer":1,"introCard":0},{"id":"u14a-08","type":"tf","q":"greedy 는 각 문제가 subproblem 하나에만 의존하는 특별한 DP 로 볼 수 있다.","explain":"optimal substructure 가 있고, 추가로 의존하는 subproblem 이 하나뿐이다.","src":"14강 p.39–42","wiki":"sub-problem graph 비교","tags":["greedy","DP"],"answer":true,"introCard":2},{"id":"u14a-09","type":"mc","q":"greedy 알고리즘의 좋은 후보가 되는 문제의 조건이 **아닌** 것은?","explain":"많이 겹치는 건 DP 의 조건이다. greedy 는 사슬 모양.","src":"14강 p.97","wiki":"greedy algorithm","tags":["greedy"],"choices":["optimal substructure 가 있다","그 substructure 가 REALLY NICE 하다","해가 다른 subproblem 하나에만 의존한다","subproblem 이 서로 많이 겹친다"],"answer":3,"introCard":3},{"id":"u14a-10","type":"tf","q":"knapsack 비율 greedy 의 문제는 마지막에 용량이 어중간하게 남는 것이다. 이런 용량 제한이 없다면 비율 greedy 가 최적이다.","explain":"용량이 있어서 마지막에 1 이 남는 게 문제였다. 그걸 고치려면 되돌아봐야 하고 그건 backtracking 이다.","src":"14강 p.6–7 · 11/10 녹음","wiki":"greedy가 실패하는 knapsack","prof":true,"tags":["greedy","knapsack"],"answer":true,"introCard":1},{"id":"u14a-11","type":"mc","q":"knapsack 비율 greedy 가 틀리는 corner case 를 하나씩 고쳐 나가다 보면 결국 어떤 기법에 이르나?","explain":"'taco 를 빼고 다른 걸 넣을까?' 는 backtracking 이고, 모든 경우를 체계적으로 보면 DP 다. '모든 문제를 greedy 로 풀 수는 없다.'","src":"11/10 녹음","wiki":"greedy가 실패하는 knapsack","prof":true,"tags":["greedy","DP"],"choices":["randomized algorithm","DP","BFS","정렬"],"answer":1,"introCard":1},{"id":"u14a-12","type":"sa","q":"선택을 하나씩 하고 되돌아가지 않는 알고리즘 설계 기법의 이름은?","explain":"Greedy algorithm. 증명은 '선택이 최적해를 배제하지 않는다' + 귀납법.","src":"14강 p.4","wiki":"greedy algorithm","tags":["greedy"],"answer":"greedy","alts":["greedy algorithm","탐욕 알고리즘"],"introCard":0},{"id":"u14a-13","type":"tf","q":"자연스럽게 떠오르는 greedy 는 대체로 항상 최적해를 준다.","explain":"p.97: 'The natural greedy algorithm may not always be correct.' knapsack 이 그 예.","src":"14강 p.97","wiki":"greedy algorithm","tags":["greedy","trap"],"answer":false,"introCard":3},{"id":"u14a-14","type":"mc","q":"그림의 subproblem 그래프는 어떤 설계 기법의 모양인가? (설명 글자는 가렸다)","explain":"같은 sub-sub-problem 에 위쪽 subproblem 여러 개가 선을 잇고 있다. subproblem 이 **겹치는** DAG 이니 DP 다. D&C 는 겹치지 않는 tree(p.39), greedy 는 각 문제가 subproblem **하나**에만 의존하는 사슬(p.41–42)이다. 교수가 '다른 건 잊어도 이 그림은 기억하라' 고 한 세 장 중 하나다.","src":"14강 p.39–42 · 11/10 녹음","wiki":"sub-problem graph 비교","prof":true,"tags":["greedy","그림"],"img":"img/algo14-p40-spg.png","imgAlt":"p.40 Big problem 아래 sub-problem 3개, 그 아래 sub-sub-problem 4개가 여러 선으로 겹쳐 이어진 그래프","explainImg":"img/algo14-p40-spg-ans.png","choices":["Dynamic programming","Divide-and-conquer","Greedy","Randomized"],"answer":0,"introCard":2},{"id":"u14a-15","type":"mc","q":"[Circle all 형식] 최적해를 **보장하는** greedy 규칙을 **모두** 고른 조합은? (1) activity selection: 끝나는 시각이 가장 빠른 것 (2) activity selection: 시작 시각이 가장 빠른 것 (3) Huffman: 빈도가 가장 작은 두 노드를 합친다 (4) 0/1 knapsack: 가치/무게 비율이 큰 것 (5) job scheduling: $c_i/t_i$ 가 큰 것부터","explain":"(1) 참: 남은 시간을 가장 많이 남긴다. (2) 거짓: 일찍 시작해 아주 길게 이어지는 활동 하나가 여러 개를 막는다. (3) 참: Lemma 1(교환)과 Lemma 2. (4) 거짓: L13 예제에서 비율 greedy 는 39, 최적은 42(unbounded)였다. 용량을 낭비한다. (5) 참: 인접 교환 비용 변화가 $c_A t_B - c_B t_A \\le 0$. 함정은 '자연스러워 보이는' (2)(4)다.","src":"14강 p.6–7, 10, 50, 71 · 중간 1번 형식","wiki":"greedy algorithm","tags":["greedy","circle-all"],"choices":["(1)(3)(5)","(1)(3)(4)(5)","(1)(5)","(1)(2)(3)(5)"],"answer":0,"introCard":1}],"intro":[{"title":"greedy 란","body":"Make choices one-at-a-time. Never look back. Hope for the best. 설계는 쉽지만 **정확성 증명**이 어렵다. Dijkstra 가 대표적: 추정치 최소 정점을 확정하고 되돌아보지 않는다.","src":"14강 p.4"},{"title":"knapsack 비율 greedy 는 실패","body":"value/weight 비율이 큰 item 부터 담으면 마지막에 용량이 어중간하게 남는다. 무게 6,2,4,3,11 / 가치 20,8,14,13,35, W=10 (unbounded): 비율 최대 item 4(13/3)를 3개 담고 남은 1 을 못 써 39, 최적은 42. 용량 제한(남는 문제)이 없으면 비율 greedy 가 최적이고, corner case 를 고쳐 가면 결국 DP 가 된다.","src":"14강 p.6–7"},{"title":"subproblem 그래프 세 모양","body":"D&C: 겹치지 않는 subproblem 의 **tree**. DP: 겹치는 **DAG**. Greedy: 각 문제가 subproblem **하나**에만 의존하는 사슬. '다른 건 잊어도 이 그림은 기억하라.'","img":"img/algo14-p41-greedy-spg.png","imgAlt":"greedy 의 subproblem 그래프: 사슬","src":"14강 p.39–42"},{"title":"언제 greedy 가 통하나","body":"optimal substructure 가 있고, 그것이 아주 좋아서(REALLY NICE) 해가 다른 subproblem **하나**에만 의존할 때. 자연스러운 greedy 가 늘 맞는 건 아니다.","src":"14강 p.97"}]},{"id":"u14b","title":"Activity selection","items":[{"id":"u14b-01","type":"mc","q":"activity selection greedy 가 매번 고르는 활동은?","explain":"교수가 후보(시작 빠른 것, 끝 빠른 것, 짧은 것)를 물은 뒤 finish time 이 답이라고 했다. 미래 선택을 위해 여유 시간을 가장 많이 남긴다.","src":"14강 p.10–17 · 11/10 녹음","wiki":"activity selection","prof":true,"tags":["greedy","activity"],"choices":["시작 시각이 가장 빠른 것","길이가 가장 짧은 것","지금 추가할 수 있는 것 중 종료(finish) 시각이 가장 빠른 것","다른 활동과 덜 겹치는 것"],"answer":2,"introCard":0},{"id":"u14b-02","type":"tf","q":"activity selection 은 시작 시각이 가장 빠른 활동부터 고르면 최적이다.","explain":"반례: (0, 10) 하나가 (1, 2), (3, 4) 를 다 막는다. 정답 규칙은 종료 시각.","src":"14강 p.10","wiki":"activity selection","tags":["activity","trap"],"answer":false,"introCard":0},{"id":"u14b-03","type":"order","q":"활동 (s, f): a1(1,4), a2(3,5), a3(0,6), a4(5,7), a5(3,9), a6(5,9), a7(6,10), a8(8,11), a9(8,12), a10(2,14), a11(12,16). 끝난 시각에 바로 시작 가능. greedy 가 고르는 활동을 순서대로","explain":"f 순: a1(4) 선택 → s ≥ 4 중 f 최소 a4(7) → s ≥ 7 중 a8(11) → s ≥ 11 중 a11(16).","src":"14강 p.10–17 (연습)","wiki":"activity selection","tags":["activity","trace"],"answer":["a1","a4","a8","a11"],"img":"img/algo14-gen-u14b-03.png","imgAlt":"활동 a1~a11 의 (start, finish) 막대 그림","introCard":0},{"id":"u14b-04","type":"num","q":"활동 (s, f): a1(1,4), a2(3,5), a3(0,6), a4(5,7), a5(3,9), a6(5,9), a7(6,10), a8(8,11), a9(8,12), a10(2,14), a11(12,16). 끝난 시각에 바로 시작 가능. 동시에 할 수 있는 최대 활동 수는?","explain":"greedy 가 4개를 고르고, 전수 확인해도 5개는 불가능하다.","src":"14강 p.10–17 (연습)","wiki":"activity selection","tags":["activity","trace"],"answer":4,"tol":0,"img":"img/algo14-gen-u14b-03.png","imgAlt":"활동 a1~a11 의 (start, finish) 막대 그림","introCard":0},{"id":"u14b-05","type":"mc","q":"활동 p(0,5), q(4,7), r(6,10). 다음 규칙 중 최적(2개)을 **놓치는** 것은?","explain":"가장 짧은 q(길이 3)를 고르면 p, r 둘 다와 겹쳐 1개. 종료 순이면 p → r 로 2개.","src":"14강 p.10 (연습)","wiki":"activity selection","tags":["activity","trap"],"choices":["종료 시각 빠른 것부터","길이가 가장 짧은 것부터","둘 다 최적","둘 다 놓친다"],"answer":1,"introCard":0},{"id":"u14b-06","type":"mc","q":"activity selection greedy 의 수행 시간은?","explain":"한 번 훑으면서 '마지막 종료 시각 이후에 시작하는가' 만 본다.","src":"14강 p.18","wiki":"activity selection","tags":["activity","running time"],"choices":["항상 $O(n^2)$","종료 시각순으로 정렬돼 있으면 $O(n)$, 아니면 정렬 때문에 $O(n\\log n)$","$O(2^n)$","$O(nW)$"],"answer":1,"introCard":1},{"id":"u14b-07","type":"cloze","q":"Claim: $a_k$ 가 $a_i$ 종료 이후 가능한 활동 중 가장 일찍 끝나는 것이면 $A[i] = A[$ ___ $] +$ ___ .","explain":"A[i] = $a_i$ 가 끝난 뒤 할 수 있는 최대 활동 수. $\\ge$ 는 $a_k$ 를 붙이면 되고, $\\le$ 는 교환 논증.","src":"14강 p.25–30","wiki":"A(i) (activity selection)","tags":["activity","proof"],"answer":["k","1"],"bank":["k","1","i","0","2"],"introCard":2},{"id":"u14b-08","type":"order","q":"Claim 의 $A[i] \\le A[k]+1$ 방향 증명을 순서대로","explain":"exchange argument. 교수: '더 좋은 해의 첫 활동 $a_j$ 를 $a_k$ 로 바꾸면 크기가 같은 해가 나온다.'","src":"14강 p.27–30 · 11/10 녹음","wiki":"activity selection 정확성 증명","tags":["activity","proof"],"answer":["$A[i] > A[k]+1$ 이라고 가정한다 (모순법)","그러면 $a_k$ 를 안 쓰는 더 좋은 해가 있고, 그 첫 활동을 $a_j$ 라 한다","$f_k \\le f_j$ 이므로 $a_j$ 를 빼고 $a_k$ 를 넣어도 여전히 가능한 해이고 크기도 같다","그 해는 $a_k$ 를 포함하므로 크기가 $A[k]+1$ 이하 — 모순"],"introCard":2},{"id":"u14b-09","type":"tf","q":"지금까지 x 개를 했고 남은 최대가 $A[i]$ 일 때 $a_k$ 를 고르면, x+1 개를 했고 $A[i]-1$ 개가 남아 합 $x + A[i]$ 가 유지된다.","explain":"합이 유지된다 = 최적해를 배제하지 않았다. 교수가 여러 번 반복한 문장.","src":"14강 p.31 · 11/10 녹음","wiki":"activity selection 정확성 증명","prof":true,"tags":["activity","proof"],"answer":true,"introCard":2},{"id":"u14b-10","type":"mc","q":"greedy 정확성 증명의 기본 전략은?","explain":"'최적해를 배제하지 않는다는 관점에서 생각하면 왜 finish time 을 골라야 하는지 쉽게 이해된다.'","src":"14강 p.22–24 · 11/10 녹음","wiki":"greedy 증명 전략","prof":true,"tags":["greedy","proof"],"choices":["모든 해를 나열해 비교한다","매번 한 선택이 최적해를 배제하지 않음(never rule out an optimal solution)을 보이고 귀납으로 잇는다","점화식을 세워 master method","확률로 기대값을 구한다"],"answer":1,"introCard":2},{"id":"u14b-11","type":"mc","q":"그림의 활동 7개에 'finish 가 가장 빠른 것부터' greedy 를 쓰면 a2 → a5 → a3 → a7 순으로 고른다(그림은 a2 를 고른 직후). 두 번째로 고른 활동은?","explain":"버려진 것은 a1, a4, a6(회색 빗금). 총 4개.","src":"14강 p.17 · 11/10 녹음","wiki":"activity selection","diff":1,"tags":["activity"],"choices":["a2","a5","a3","a1"],"answer":1,"img":"img/algo14-p12-act.png","imgAlt":"p.12 활동 a1~a7 막대: a2 가 선택됨(주황), a1 은 겹쳐서 제외(빗금)","explainImg":"img/algo14-p17-act-ans.png","introCard":0},{"id":"u14b-12","type":"tf","q":"activity selection 은 greedy 말고 DP 나 (나누는 부분 없는) divide-and-conquer 관점으로도 볼 수 있다.","explain":"p.38. greedy 로 보는 게 가장 자연스러울 뿐이다.","src":"14강 p.38","wiki":"sub-problem graph 비교","tags":["activity"],"answer":true,"introCard":0},{"id":"u14b-13","type":"mc","q":"activity selection 의 subproblem $i$ 와 $A[i]$ 의 뜻은?","explain":"$a_k$ 를 고르면 문제가 subproblem $k$ 하나로 줄어든다 — greedy 의 사슬 모양.","src":"14강 p.25","wiki":"A(i) (activity selection)","tags":["activity"],"choices":["활동 $a_i$ 가 끝난 **뒤**의 activity selection, $A[i]$ = 그 뒤에 할 수 있는 최대 활동 수","앞 i 개 활동, 최대 길이","$a_i$ 를 포함하는 해의 수","i 시각까지 끝나는 활동 수"],"answer":0,"introCard":0},{"id":"u14b-14","type":"num","q":"활동 (s, f): b1(1,3), b2(2,5), b3(4,7), b4(1,8), b5(5,9), b6(8,10), b7(9,11), b8(11,14), b9(13,16). greedy 가 고르는 활동 수는?","explain":"b1(3) → b3(7) → b6(10) → b8(14). b9 는 13 에 시작해 b8 과 겹친다.","src":"14강 p.10–17 (연습)","wiki":"activity selection","tags":["activity","trace"],"answer":4,"tol":0,"img":"img/algo14-gen-u14b-14.png","imgAlt":"활동 b1~b9 의 (start, finish) 막대 그림","introCard":0},{"id":"u14b-15","type":"num","q":"그림은 활동 $a_1 \\sim a_7$ 을 시간축 위 막대로 그린 것이다. '지금 추가할 수 있는 활동 중 finish 가 가장 빠른 것을 고른다' 를 반복하면 몇 개를 고르나?","explain":"가장 먼저 끝나는 $a_2$ 를 고르면 겹치는 $a_1$ 이 빠진다. 다음으로 끝나는 $a_5$ 를 고르면 $a_4$ 가 빠지고, 이어서 $a_3$ 를 고르면 $a_6$ 이 빠지고, 마지막에 $a_7$ 을 고른다. $a_2, a_5, a_3, a_7$ 로 4개(p.17). 막대의 **오른쪽 끝**(finish)만 보고 고른다. 왼쪽 끝(start)이나 길이를 보면 틀린다.","src":"14강 p.10–17","wiki":"activity selection","tags":["activity","그림"],"img":"img/algo14-p10-act.png","imgAlt":"p.10 시간축 위 활동 막대 a1~a7","explainImg":"img/algo14-p17-act-ans.png","answer":4,"tol":0,"introCard":0},{"id":"u14b-16","type":"cloze","q":"[빈칸 의사코드] activity selection: 활동을 ___ 시각 순으로 정렬한다. 차례로 보며 `if a.start ≥` ___ `:` a 를 고르고 lastFinish = a.finish 로 바꾼다.","explain":"정렬 기준은 finish 다(start 로 정렬하면 p.10 의 반례 구조에 걸린다). 고를 수 있는지는 '직전에 고른 활동이 끝난 뒤 시작하는가' 로 본다. 정렬 $O(n\\log n)$ 뒤 한 번 훑기 $O(n)$ 이라, 이미 정렬돼 있으면 $O(n)$ (p.18).","src":"14강 p.10–18","wiki":"activity selection","tags":["activity","빈칸"],"answer":["finish","lastFinish"],"bank":["finish","lastFinish","start","lastStart","length"],"introCard":0}],"intro":[{"title":"activity selection","body":"활동마다 (start, finish). 겹치지 않게 최대한 많이 고른다. greedy: **지금 추가할 수 있는 것 중 finish 가 가장 빠른 것**을 고르고 반복. 끝난 시각에 바로 시작 가능. start 가 빠른 것·짧은 것부터는 반례가 있다.","img":"img/algo14-p17-act-ans.png","imgAlt":"막대 그림에서 고른 활동(주황)","src":"14강 p.9–17"},{"title":"수행 시간","body":"finish 순으로 정렬돼 있으면 한 번 훑기 $O(n)$, 아니면 정렬 때문에 $O(n\\log n)$. 코드: finish 순으로 보며 `a.start ≥ lastFinish` 면 고른다.","src":"14강 p.18"},{"title":"왜 맞나: A[i] = A[k] + 1","body":"subproblem i = 활동 $a_i$ 가 끝난 **뒤**의 문제, $A[i]$ = 그 뒤 최대 활동 수. $a_k$ 가 그 뒤 가장 먼저 끝나면 $A[i] = A[k]+1$: 최적해의 첫 활동 $a_j$ 를 $a_k$ 로 바꿔도($f_k \\le f_j$) 겹치지 않는다(exchange). 매 선택이 최적해를 배제하지 않는다.","src":"14강 p.25–31"},{"title":"다른 관점","body":"activity selection 은 greedy 가 가장 자연스럽지만, DP(표로) 나 dividing 없는 divide-and-conquer 로도 볼 수 있다.","src":"14강 p.38"}]},{"id":"u14c","title":"greedy 증명 틀과 job scheduling","items":[{"id":"u14c-01","type":"order","q":"greedy 정확성 귀납 증명 4칸을 순서대로","explain":"p.36–37 의 일반 틀. activity, scheduling, Huffman, Prim, Kruskal 모두 이 틀이다.","src":"14강 p.33–37","wiki":"greedy 증명 전략","tags":["greedy","proof"],"answer":["IH: t 번 선택한 뒤에도 현재 해를 확장하는 최적해가 존재한다","Base: 선택 0개일 때는 당연히 존재한다","Step: 다음 greedy 선택도 최적해를 배제하지 않는다 (보통 exchange)","Conclusion: 끝났을 때 현재 해를 확장하는 해는 현재 해뿐이므로 최적"],"introCard":0},{"id":"u14c-02","type":"num","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. HW(10시간, $c$=2) 를 먼저, Sleep(8시간, $c$=3) 을 나중에 하면 총비용은?","explain":"완료 시각 × 시간당 비용의 합: $10\\cdot2 + (10+8)\\cdot3 = 20 + 54 = 74$.","src":"14강 p.45–46 · 11/10 녹음","wiki":"job scheduling","tags":["scheduling","trace"],"answer":74,"tol":0,"introCard":1},{"id":"u14c-03","type":"num","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. Sleep(8시간, $c$=3) 을 먼저, HW(10시간, $c$=2) 를 나중에 하면 총비용은?","explain":"$8\\cdot3 + 18\\cdot2 = 24 + 36 = 60$. 잠을 먼저 자는 게 낫다.","src":"14강 p.46 · 11/10 녹음","wiki":"job scheduling","tags":["scheduling","trace"],"answer":60,"tol":0,"introCard":1},{"id":"u14c-04","type":"mc","q":"job scheduling greedy 의 규칙은?","explain":"'What matters is the ratio: cost of delay / time it takes. Do the job with the biggest ratio first.' HW 0.2, Sleep 0.375.","src":"14강 p.50–53 · 11/10 녹음","wiki":"cost/time 비율","prof":true,"tags":["scheduling"],"choices":["걸리는 시간 $t_i$ 가 짧은 것부터","시간당 비용 $c_i$ 가 큰 것부터","비율 $c_i/t_i$ 가 큰 것부터","비율 $t_i/c_i$ 가 큰 것부터"],"answer":2,"introCard":2},{"id":"u14c-05","type":"cloze","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. A($x$시간, 시간당 $z$) 를 B($y$시간, 시간당 $w$) 보다 먼저 하는 게 낫다 ⇔ $xw \\le$ ___ ⇔ $w/y \\le$ ___","explain":"$xz + (x+y)w \\le yw + (x+y)z$ 에서 $xz$, $yw$ 가 소거된다. 그래서 비율 $c/t$ 가 큰 쪽이 먼저.","src":"14강 p.50","wiki":"cost/time 비율","tags":["scheduling","proof"],"answer":["yz","z/x"],"bank":["yz","z/x","xz","yw","x/z"],"introCard":1},{"id":"u14c-06","type":"num","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. job A($t$=2, $c$=6), B($t$=1, $c$=2), C($t$=4, $c$=4). 최소 총비용은?","explain":"비율 3, 2, 1 → A, B, C. 완료 2, 3, 7 → $12 + 6 + 28 = 46$. 여섯 순열 중 최소.","src":"14강 p.55 (연습)","wiki":"job scheduling","tags":["scheduling","trace"],"answer":46,"tol":0,"img":"img/algo14-gen-u14c-06.png","imgAlt":"job 표: A(t 2, c 6), B(1, 2), C(4, 4)","introCard":1},{"id":"u14c-07","type":"order","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. job P($t$=3, $c$=6), Q(2, 8), R(5, 5), S(1, 3) 를 최적 순서대로","explain":"비율 $c/t$: Q 4, S 3, P 2, R 1. 내림차순.","src":"14강 p.53 (연습)","wiki":"job scheduling","tags":["scheduling","trace"],"answer":["Q","S","P","R"],"img":"img/algo14-gen-u14c-07.png","imgAlt":"job 표: P(t 3, c 6), Q(2, 8), R(5, 5), S(1, 3)","introCard":1},{"id":"u14c-08","type":"num","q":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c$) 만큼 비용이 든다. job P($t$=3, $c$=6), Q(2, 8), R(5, 5), S(1, 3) 의 최적 순서 Q, S, P, R 의 총비용은?","explain":"완료 시각 2, 3, 6, 11 → $2\\cdot8 + 3\\cdot3 + 6\\cdot6 + 11\\cdot5 = 16+9+36+55 = 116$. 24가지 순열 중 최소.","src":"14강 p.53 (연습)","wiki":"job scheduling","tags":["scheduling","trace"],"answer":116,"tol":0,"img":"img/algo14-gen-u14c-07.png","imgAlt":"job 표: P(t 3, c 6), Q(2, 8), R(5, 5), S(1, 3)","introCard":1},{"id":"u14c-09","type":"mc","q":"Lemma '비율 최대 job 이 첫째인 최적 순서가 있다' 의 증명 기법은?","explain":"B 가 비율 최대인데 첫째가 아니면 바로 앞 A 와 바꾼다. head-to-head 식으로 비용이 늘지 않는다.","src":"14강 p.51","wiki":"job scheduling","tags":["scheduling","proof"],"choices":["귀납 없이 직접 계산","인접한 두 job 을 맞바꾸는 exchange 를 반복 (비용이 늘지 않음)","master method","확률 분석"],"answer":1,"introCard":2},{"id":"u14c-10","type":"tf","q":"인접한 두 job 의 순서를 바꿔도 나머지 job 들의 완료 시각은 변하지 않는다.","explain":"두 job 이 끝나는 시각은 어느 순서든 $x+y$ 이후로 같다. 그래서 두 job 만 비교하면 된다.","src":"14강 p.50","wiki":"job scheduling","tags":["scheduling"],"answer":true,"introCard":1},{"id":"u14c-11","type":"mc","q":"scheduleJobs 의 수행 시간은?","explain":"의사코드가 정렬뿐이다.","src":"14강 p.53","wiki":"job scheduling","tags":["scheduling","running time"],"choices":["$O(n)$","$O(n\\log n)$ (비율로 정렬)","$O(n^2)$","$O(n!)$"],"answer":1,"introCard":1},{"id":"u14c-12","type":"tf","q":"job scheduling 은 시간당 비용 $c_i$ 가 가장 큰 job 부터 하면 최적이다.","explain":"비율이다. HW/Sleep 예에서 c 만 보면 우연히 맞지만, $c$ 가 크고 아주 오래 걸리는 job 은 뒤로 가야 한다.","src":"14강 p.50","wiki":"cost/time 비율","tags":["scheduling","trap"],"answer":false,"introCard":2},{"id":"u14c-13","type":"match","q":"exchange(맞바꾸기) 논증이 쓰인 곳을 연결하시오","explain":"교수 11/12: 이 교환 기법은 '증명에서 아주 많이 쓰인다'.","src":"14강 · 15강 p.18–23 · 11/12 녹음","wiki":"greedy 증명 전략","prof":true,"tags":["greedy","proof"],"pairs":[["Activity selection","최적해의 첫 활동 $a_j$ 를 $a_k$ 로 바꾼다"],["Job scheduling","비율 최대 job 을 인접 교환으로 앞으로"],["Huffman Lemma 1","x 를 가장 깊은 leaf a 와 swap"],["MST 보조정리","cycle 위 (x,y) 를 light edge (u,v) 로"]]},{"id":"u14c-14","type":"mc","q":"job scheduling 증명에서 'best job 을 먼저 한다' 의 'best' 가 뜻하는 것은?","explain":"교수: 'best 의 뜻은 최적해를 배제하지 않는 선택이다.'","src":"14강 p.49 · 11/10 녹음","wiki":"job scheduling","tags":["scheduling","proof"],"choices":["가장 비용이 큰 job","최적해를 배제하지 않는 선택 — 그 job 이 첫째인 최적 순서가 존재","가장 짧은 job","가장 먼저 들어온 job"],"answer":1,"introCard":0},{"id":"u14c-15","type":"tf","q":"최적 순서에서 첫 job 을 빼면, 남은 job 들의 순서는 그 job 들만의 최적 순서다.","explain":"optimal substructure. 아니면 더 좋은 순서로 바꿔 전체를 개선할 수 있다.","src":"14강 p.47–48","wiki":"job scheduling","tags":["scheduling"],"answer":true,"introCard":1},{"id":"u14c-16","type":"order","q":"[증명 칸 채우기] job scheduling Lemma '비율 $c_i/t_i$ 최대 job B 가 첫째인 최적 순서가 있다' 의 교환 증명을 순서대로","explain":"p.50 의 'swap adjacent jobs' 논증이다. A 가 $t_B$ 만큼 늦게 끝나고($+c_A t_B$) B 가 $t_A$ 만큼 일찍 끝난다($-c_B t_A$). 앞뒤 job 들의 완료 시각은 두 job 의 길이 합만 보니 변하지 않는다. Huffman Lemma 1 과 같은 교환 기법이다.","src":"14강 p.49–51","wiki":"job scheduling","tags":["job","proof"],"answer":["최적 순서에서 B 가 첫째가 아니라고 하자","B 바로 앞의 job A 와 B 의 자리를 맞바꾼다","두 job 의 비용 변화는 $c_A t_B - c_B t_A \\le 0$ ($c_B/t_B \\ge c_A/t_A$), 나머지 job 의 완료 시각은 그대로다","비용이 늘지 않으니 여전히 최적이다. 반복하면 B 가 첫째인 최적 순서를 얻는다"],"introCard":2}],"intro":[{"title":"greedy 증명 4칸","body":"IH: t 번 선택한 뒤에도 지금까지의 선택을 확장하는 최적해가 있다(success 를 배제 안 함). Base: 0개일 때 당연. Step: 다음 greedy 선택도 배제하지 않음을 exchange 로. Conclusion: 끝까지 배제 안 했으면 성공.","src":"14강 p.37"},{"title":"job scheduling","body":"job 을 하나씩 차례로 처리하고, 각 job 은 (완료 시각) × (시간당 비용 $c_i$) 만큼 비용이 든다. 예: HW(10h, c=2) 먼저면 $10\\cdot2 + 18\\cdot3 = 74$, Sleep(8h, c=3) 먼저면 $8\\cdot3 + 18\\cdot2 = 60$.","src":"14강 p.45–46"},{"title":"규칙: $c_i/t_i$ 큰 것부터","body":"인접한 A(x 시간, 시간당 z), B(y, w) 에서 A 먼저가 낫다 ⇔ $xw \\le yz$ ⇔ $w/y \\le z/x$. 그래서 비율 $c/t$ 내림차순 정렬, $O(n\\log n)$. 인접 교환은 다른 job 의 완료 시각을 바꾸지 않는다.","src":"14강 p.49–53"}]},{"id":"u14d","title":"prefix-free code 와 코드 트리","items":[{"id":"u14d-01","type":"mc","q":"Try 0 (6글자 모두 3비트) 의 문제는?","explain":"$2^3 = 8 \\ge 6$ 이라 3비트. 교수: 'two bits are never used'.","src":"14강 p.60 · 11/12 녹음","wiki":"prefix-free code","tags":["Huffman"],"choices":["복호가 모호하다","코드 110, 111 두 개가 안 쓰이고 가장 흔한 A 도 3비트다","글자를 다 표현 못 한다","prefix-free 가 아니다"],"answer":1,"introCard":0},{"id":"u14d-02","type":"mc","q":"Try 1 (A=0, B=00, C=01, D=1, E=10, F=11) 의 문제는?","explain":"'same sequence of binary code may have multiple meanings, which is not good.'","src":"14강 p.61 · 11/12 녹음","wiki":"prefix-free code","tags":["Huffman"],"choices":["너무 길다","000 이 AAA 인지 BA 인지 AB 인지 모호하다","코드가 모자라다","A 가 너무 길다"],"answer":1,"introCard":0},{"id":"u14d-03","type":"cloze","q":"prefix-free code: 어떤 codeword 도 다른 codeword 의 ___ 가 아니다. 트리로 그리면 글자가 모두 ___ 에 있다.","explain":"글자가 다른 글자의 조상이 될 수 없으니 prefix 가 안 생긴다. 왼쪽 = 0, 오른쪽 = 1.","src":"14강 p.62, 66","wiki":"prefix-free code","tags":["Huffman"],"answer":["prefix","leaf"],"bank":["prefix","leaf","suffix","root","내부 노드"],"introCard":1},{"id":"u14d-04","type":"sa","q":"Try 2 코드: A=01, B=101, C=110, D=00, E=111, F=100. 비트열 10010101 을 해독하면?","explain":"100 → F (1, 10 이라는 코드는 없다), 101 → B, 01 → A. 교수가 칠판에서 FBA 로 끊어 읽었다.","src":"14강 p.62–65 · 11/12 녹음","wiki":"prefix-free code","tags":["Huffman","trace"],"answer":"FBA","img":"img/algo14-p66-codetree.png","imgAlt":"p.66 Try 2 코드 트리: A 00, D 01, F 100, B 101, C 110, E 111","introCard":1},{"id":"u14d-05","type":"sa","q":"Try 2 코드: A=01, B=101, C=110, D=00, E=111, F=100. 비트열 0011101 을 해독하면?","explain":"00 → D, 111 → E, 01 → A. prefix-free 라 앞에서부터 끊으면 유일하다.","src":"14강 p.62 (연습)","wiki":"prefix-free code","tags":["Huffman","trace"],"answer":"DEA","img":"img/algo14-p66-codetree.png","imgAlt":"p.66 Try 2 코드 트리: A 00, D 01, F 100, B 101, C 110, E 111","introCard":1},{"id":"u14d-06","type":"num","q":"빈도 A 45, B 13, C 12, D 16, E 9, F 5 (%). Try 2 트리(A, D 는 depth 2, 나머지 depth 3) 의 cost(기대 길이)는?","explain":"$2(0.45+0.16) + 3(0.13+0.12+0.09+0.05) = 1.22 + 1.17 = 2.39$.","src":"14강 p.66–67 · 11/12 녹음","wiki":"코드 트리의 cost","tags":["Huffman","trace"],"answer":2.39,"tol":0.001,"img":"img/algo14-p67-cost.png","imgAlt":"p.67 Try 2 코드 트리와 cost 식, 기대 길이 계산 줄이 가려져 있다","explainImg":"img/algo14-p67-cost-ans.png","introCard":2},{"id":"u14d-07","type":"cloze","q":"코드 트리의 cost = $\\sum_x P(x)\\cdot$ ___ $(x)$ = codeword 길이의 기댓값.","explain":"글자 x 의 codeword 길이가 곧 트리에서 x 의 depth.","src":"14강 p.66 · 11/12 녹음","wiki":"코드 트리의 cost","tags":["Huffman"],"answer":["depth"],"bank":["depth","height","degree","key"],"introCard":2},{"id":"u14d-08","type":"tf","q":"좋은 코드 트리에서 자주 쓰는 글자는 root 가까이, 드문 글자는 깊은 곳에 둔다.","explain":"11/12 학생 문답에서 확인. 그래서 safe choice 는 '드문 글자를 맨 아래 subtree 에'.","src":"14강 p.69–70 · 11/12 녹음","wiki":"코드 트리의 cost","prof":true,"tags":["Huffman"],"answer":true},{"id":"u14d-09","type":"mc","q":"Huffman coding(최적 prefix-free 코드 트리)의 optimal substructure 는?","explain":"더 좋은 subtree 가 있으면 바꿔 끼워 전체가 좋아지니 모순 — 교수가 영어·한국어로 한 번씩 설명한 cut-and-paste.","src":"14강 p.69 · 11/12 녹음","wiki":"Huffman coding","prof":true,"tags":["Huffman","proof"],"choices":["최적 트리의 subtree 는 그 안의 글자들에 대한 최적 트리다","가장 흔한 글자가 root 다","트리는 항상 균형이다","leaf 수가 2의 거듭제곱이다"],"answer":0,"introCard":1},{"id":"u14d-10","type":"tf","q":"Try 1 (A=0, B=00, …) 은 prefix-free code 다.","explain":"A=0 이 B=00, C=01 의 prefix 다. 그래서 모호하다.","src":"14강 p.61","wiki":"prefix-free code","tags":["Huffman","trap"],"answer":false,"introCard":0},{"id":"u14d-11","type":"num","q":"글자 6개를 fixed-length 이진 코드로 구분하려면 최소 몇 비트가 필요한가?","explain":"$2^2 = 4 \u003c 6 \\le 8 = 2^3$.","src":"14강 p.60","wiki":"prefix-free code","diff":1,"tags":["Huffman"],"answer":3,"unit":"bit","tol":0,"introCard":0},{"id":"u14d-12","type":"mc","q":"Huffman 알고리즘이 매 단계 합치는 두 노드는?","explain":"드문 글자를 깊이 보내는 safe choice. 합친 노드의 key = 두 key 의 합.","src":"14강 p.71–77","wiki":"Huffman coding","tags":["Huffman"],"choices":["빈도가 가장 큰 두 노드","빈도(key)가 가장 작은 두 노드","임의의 두 노드","가장 깊은 두 노드"],"answer":1,"introCard":3},{"id":"u14d-13","type":"tf","q":"Huffman 은 빈도가 가장 높은 두 글자부터 합친다.","explain":"가장 **낮은** 둘. 높은 걸 합치면 자주 쓰는 글자가 깊어진다.","src":"14강 p.71","wiki":"Huffman coding","tags":["Huffman","trap"],"answer":false,"introCard":3},{"id":"u14d-14","type":"num","q":"코드 A=0, B=10, C=11 이고 확률이 A 0.5, B 0.3, C 0.2 일 때 기대 길이는?","explain":"$0.5\\cdot1 + 0.3\\cdot2 + 0.2\\cdot2 = 1.5$.","src":"14강 p.66 (연습)","wiki":"코드 트리의 cost","tags":["Huffman","trace"],"answer":1.5,"tol":0.001,"introCard":2}],"intro":[{"title":"fixed-length 와 모호한 코드","body":"글자 6개를 구분하려면 고정 길이 3비트(Try 0)지만 흔한 글자도 3비트라 낭비. Try 1 (A=0, B=00, …)은 000 이 AAA 인지 BA 인지 모호하다.","src":"14강 p.58–61"},{"title":"prefix-free code = 트리","body":"어떤 codeword 도 다른 codeword 의 prefix 가 아니면 앞에서부터 바로 해독된다. 트리로 그리면 글자가 모두 **leaf**(왼쪽 0, 오른쪽 1). Try 2: A 00, D 01, F 100, B 101, C 110, E 111.","img":"img/algo14-p66-codetree.png","imgAlt":"Try 2 의 코드 트리","src":"14강 p.62–66"},{"title":"트리의 cost","body":"$\\text{cost} = \\sum_x P(x)\\cdot \\text{depth}(x)$ = codeword 길이의 기댓값. Try 2 는 2.39. 자주 쓰는 글자는 root 가까이, 드문 글자는 깊게. 최적 트리의 subtree 는 그 글자들에 대한 최적 트리(optimal substructure).","img":"img/algo14-p67-cost-ans.png","imgAlt":"Try 2 트리와 cost 2.39","src":"14강 p.66–69"},{"title":"Huffman 은 작은 것부터","body":"빈도가 가장 **작은** 두 노드를 합쳐 key = 합인 새 노드를 만들고 반복. 드문 글자가 가장 깊이 내려간다.","src":"14강 p.70–71"}]},{"id":"u14e","title":"Huffman 알고리즘과 정당성","items":[{"id":"u14e-01","type":"order","q":"빈도 A 45, B 13, C 12, D 16, E 9, F 5. Huffman 이 만드는 새 노드의 key 를 생기는 순서대로","explain":"F5+E9 = 14 → B13+C12 = 25 → 14+D16 = 30 → 25+30 = 55 → A45+55 = 100. (전사의 'seven' 은 thirty 의 오인식.)","src":"14강 p.71–75 · 11/12 녹음","wiki":"Huffman coding","prof":true,"tags":["Huffman","trace"],"answer":["14","25","30","55","100"],"explainImg":"img/algo14-p76-huff-ans.png","img":"img/algo14-gen-u14e-01.png","imgAlt":"빈도 표: A 45, B 13, C 12, D 16, E 9, F 5","introCard":1},{"id":"u14e-02","type":"num","q":"빈도 A 45, B 13, C 12, D 16, E 9, F 5. Huffman 트리의 기대 길이는?","explain":"A=0, B=100, C=101, D=110, E=1110, F=1111. $0.45 + 3(0.41) + 4(0.14) = 2.24$, Try 2 의 2.39 보다 작다.","src":"14강 p.76 · 11/12 녹음","wiki":"Huffman coding","prof":true,"tags":["Huffman","trace"],"answer":2.24,"tol":0.001,"img":"img/algo14-p76-huff.png","imgAlt":"p.76 Huffman 트리(왼쪽 0, 오른쪽 1), codeword 와 기대 길이 계산이 가려져 있다","explainImg":"img/algo14-p76-huff-ans.png","introCard":1},{"id":"u14e-03","type":"mc","q":"빈도 A 45, B 13, C 12, D 16, E 9, F 5 로 Huffman 트리를 만들었다(그림, 왼쪽 0 · 오른쪽 1). E 의 codeword 는?","explain":"root → 오른쪽 55 → 오른쪽 30 → 오른쪽 14 → 왼쪽 E. 1110. F 는 1111.","src":"14강 p.76","wiki":"Huffman coding","tags":["Huffman","trace"],"choices":["110","1110","1111","100"],"answer":1,"img":"img/algo14-p76-huff.png","imgAlt":"p.76 Huffman 트리(왼쪽 0, 오른쪽 1), E 의 codeword 칸이 E 로 표시돼 가려져 있다","explainImg":"img/algo14-p76-huff-ans.png","introCard":1},{"id":"u14e-04","type":"mc","q":"Huffman 기대 길이를 트리에서 빠르게 검산하는 방법은?","explain":"depth d 인 글자의 빈도는 조상 d 개의 key 에 한 번씩 들어간다. $(14+25+30+55+100)/100 = 2.24$.","src":"14강 p.76 보충","wiki":"코드 트리의 cost","tags":["Huffman"],"choices":["leaf 수 / 높이","합쳐서 만든 내부 노드(root 포함) key 의 합 ÷ 전체 빈도","가장 긴 codeword 길이","빈도의 평균"],"answer":1,"introCard":1},{"id":"u14e-05","type":"num","q":"빈도 a 40, b 25, c 20, d 10, e 5 에 Huffman 을 돌린 트리의 기대 길이는?","explain":"e+d = 15 → 15+c = 35 → b+35 = 60 → a+60 = 100. 내부 노드 합 $15+35+60+100 = 210$ → 2.10.","src":"14강 p.71–77 (연습)","wiki":"Huffman coding","tags":["Huffman","trace"],"answer":2.1,"tol":0.001,"img":"img/algo14-gen-u14e-05.png","imgAlt":"빈도 표: a 40, b 25, c 20, d 10, e 5","introCard":1},{"id":"u14e-06","type":"num","q":"빈도 a 40, b 25, c 20, d 10, e 5 에 Huffman 을 돌린 트리에서 e 의 codeword 길이는?","explain":"e 는 15, 35, 60, 100 네 노드 아래에 있어 depth 4. a 는 1, b 2, c 3, d 4.","src":"14강 p.71–77 (연습)","wiki":"Huffman coding","tags":["Huffman","trace"],"answer":4,"unit":"bit","tol":0,"img":"img/algo14-gen-u14e-05.png","imgAlt":"빈도 표: a 40, b 25, c 20, d 10, e 5","introCard":1},{"id":"u14e-07","type":"mc","q":"Huffman Lemma 1 의 내용은?","explain":"이걸 보이면 첫 선택(x, y 합치기)이 최적해를 배제하지 않는다.","src":"14강 p.78","wiki":"Huffman 정확성 증명","tags":["Huffman","proof"],"choices":["가장 빈도가 높은 글자는 root 의 자식이다","가장 빈도가 낮은 두 글자 x, y 가 형제(sibling)인 최적 트리가 존재한다","모든 최적 트리는 같은 모양이다","트리 높이는 $\\log n$ 이다"],"answer":1,"introCard":2},{"id":"u14e-08","type":"order","q":"Lemma 1 의 교환 증명을 순서대로","explain":"교수 11/12: 'only lower or stay equal'. 그리고 '이 방법은 증명에서 아주 많이 쓰인다'.","src":"14강 p.78–80 · 11/12 녹음","wiki":"Huffman 정확성 증명","prof":true,"tags":["Huffman","proof"],"answer":["어떤 최적 트리에서 가장 깊은 층의 형제 leaf 쌍을 본다","그중 x 도 y 도 아닌 글자 a 를 잡는다","x 와 a 를 swap 한다: $p_a \\ge p_x$ 이고 a 가 더 깊었으므로 cost 는 줄거나 같다","y 도 같은 방법으로 옮겨 x, y 가 형제인 최적 트리를 얻는다"],"introCard":2},{"id":"u14e-09","type":"mc","q":"Huffman Lemma 2 의 내용은?","explain":"예: {A..F} 의 최적 트리 ↔ {A, G=25, H=30} 의 최적 트리. 그래서 매 단계 CURRENT 를 leaf 만 있는 것처럼 본다.","src":"14강 p.81–85","wiki":"Huffman 정확성 증명","tags":["Huffman","proof"],"choices":["합쳐 만든 subtree 를 빈도가 key 인 leaf 하나로 취급해도 최적성이 유지된다","가장 흔한 글자는 depth 1 이다","Huffman 은 유일하다","트리는 complete 다"],"answer":0,"introCard":3},{"id":"u14e-10","type":"tf","q":"Huffman Lemma 2(합쳐 만든 subtree 를 빈도가 key 인 leaf 하나로 취급해도 최적성이 유지된다)는 수업에서 증명까지 했다.","explain":"슬라이드도 수업도 증명은 생략했다(CLRS Lemma 16.3 참조). 교수는 두 그림을 가리키며 '차이가 없다' 고만 설명했다.","src":"14강 p.84 · 11/12 녹음","wiki":"Huffman 정확성 증명","tags":["Huffman","proof"],"answer":false,"introCard":3},{"id":"u14e-11","type":"cloze","q":"Huffman 의사코드: `while len(CURRENT) > ___ :` key 가 가장 ___ 두 노드 X, Y 를 골라 Z.key = X.key + Y.key 로 합친다.","explain":"하나 남을 때까지 반복하고 CURRENT[0] 을 돌려준다.","src":"14강 p.77 · 11/12 녹음","wiki":"Huffman coding","tags":["Huffman","pseudocode"],"answer":["1","작은"],"bank":["1","작은","0","2","큰"],"introCard":0},{"id":"u14e-12","type":"mc","q":"heap 으로 구현한 Huffman 의 수행 시간은? (n = 글자 수)","explain":"n−1 번 반복, 매번 최솟값 둘 추출 + 하나 삽입이 $O(\\log n)$. 슬라이드에는 적혀 있지 않다.","src":"14강 p.77 보충","wiki":"Huffman coding","diff":3,"tags":["Huffman","running time"],"choices":["$O(n)$","$O(n\\log n)$","$O(n^2)$","$O(2^n)$"],"answer":1,"introCard":0},{"id":"u14e-13","type":"tf","q":"Huffman Lemma 1 의 교환(exchange) 기법은 greedy 증명에서 아주 많이 쓰인다.","explain":"최적해 하나를 놓고 내 선택과 다른 부분을 바꿔도 cost 가 늘지 않음을 보이는 것. L15 MST 보조정리에서 바로 다시 쓴다.","src":"14강 p.79 · 11/12 녹음","wiki":"Huffman 정확성 증명","prof":true,"tags":["Huffman","proof"],"answer":true,"introCard":2},{"id":"u14e-14","type":"num","q":"글자 5개의 빈도가 모두 20% 일 때 Huffman 트리의 기대 길이는?","explain":"20+20 = 40, 20+20 = 40, 20+40 = 60, 40+60 = 100. 내부 노드 합 240 → 2.4 (depth 2 셋, 3 둘).","src":"14강 p.71–77 (연습)","wiki":"Huffman coding","tags":["Huffman","trace"],"answer":2.4,"tol":0.001},{"id":"u14e-15","type":"mc","q":"Huffman 정확성 귀납의 IH 는?","explain":"Step: Lemma 2 로 subtree 를 글자로 보고 → Lemma 1 로 가장 드문 x, y 가 형제 → Lemma 2 로 합친 a 를 leaf 로.","src":"14강 p.86–94 · 11/12 녹음","wiki":"Huffman 정확성 증명","tags":["Huffman","proof"],"choices":["t 단계 후 트리 높이가 t 다","t 단계 후, 현재 subtree 들을 leaf 로 갖는 최적 트리가 존재한다","t 단계 후 모든 글자의 depth 가 같다","t 단계 후 cost 가 감소한다"],"answer":1,"introCard":3},{"id":"u14e-16","type":"mc","q":"그림은 빈도 A 45, B 13, C 12, D 16, E 9, F 5 에 Huffman 을 돌려 E+F → 14, 14+D → 30, B+C → 25 까지 합친 상태다. 다음에 합쳐지는 두 노드와 새 노드의 key 는?","explain":"CURRENT 에 남은 노드는 A:45, 25, 30 세 개다. key 가 가장 작은 둘은 25 와 30 이라 55 를 만든다(p.74). 마지막에 A:45 + 55 = 100 이 root 가 된다. 가장 큰 A 가 마지막까지 남아 depth 1 이 되는 이유다.","src":"14강 p.73–75","wiki":"Huffman coding","tags":["Huffman","그림"],"img":"img/algo14-p73-huff.png","imgAlt":"p.73 Huffman 진행: A:45 와 subtree 25(B,C), 30(D, 14(E,F))","explainImg":"img/algo14-p74-huff-ans.png","choices":["25 와 30 → 55","A:45 와 25 → 70","A:45 와 30 → 75","D:16 과 14 → 30"],"answer":0,"introCard":1},{"id":"u14e-17","type":"cloze","q":"[분석 템플릿 칸] heap 으로 구현한 Huffman ($n$ 글자): merge 를 ___ 번 하고, merge 마다 removeMin 두 번과 insert 한 번이 각각 $O($___$)$ → 전체 $O($___$)$.","explain":"노드가 $n$ 개에서 1개가 될 때까지 merge 한 번에 하나씩 줄어드니 $n-1$ 번. heap 연산은 $O(\\log n)$. 처음 heap 을 만드는 데 $O(n)$ (또는 $O(n\\log n)$). 합쳐서 $O(n\\log n)$. 매번 배열에서 최솟값을 찾으면 $O(n^2)$ 이 된다.","src":"14강 p.77","wiki":"Huffman coding","tags":["Huffman","running time","analysis"],"answer":["n−1","log n","n log n"],"bank":["n−1","log n","n log n","n","1","n^2"],"introCard":0}],"intro":[{"title":"Huffman 의사코드","body":"글자마다 key = 빈도인 노드, CURRENT = 그 목록. `while len(CURRENT) > 1`: key 가 가장 작은 X, Y 를 빼고 Z.key = X.key + Y.key, Z.left = X, Z.right = Y 를 넣는다. return CURRENT[0]. heap 이면 $O(n\\log n)$.","src":"14강 p.77"},{"title":"예제: A45 B13 C12 D16 E9 F5","body":"E+F→14, B+C→25, 14+D→30, 25+30→55, A+55→100. A 0, B 100, C 101, D 110, E 1110, F 1111. 기대 길이 2.24 = 합쳐 만든 내부 노드 key 합(14+25+30+55+100) ÷ 100.","img":"img/algo14-p76-huff-ans.png","imgAlt":"완성된 Huffman 트리와 codeword","src":"14강 p.71–76"},{"title":"Lemma 1 (exchange)","body":"가장 빈도가 낮은 두 글자 x, y 가 형제인 최적 트리가 있다. 어떤 최적 트리의 가장 깊은 형제 쌍에서 x, y 가 아닌 a 를 x 와 바꾸면 a 가 더 얕아지고($p_a\\ge p_x$) cost 가 늘지 않는다. 이 교환 기법은 증명에 아주 많이 쓰인다.","src":"14강 p.78–80"},{"title":"Lemma 2 와 귀납","body":"합쳐 만든 subtree 를 key 가 빈도 합인 leaf 하나로 취급해도 최적성이 유지된다(수업에서는 증명 생략). IH: t 단계 후 현재 subtree 들을 leaf 로 갖는 최적 트리가 있다.","src":"14강 p.81–84"}]}]},{"id":"u15","title":"15강 Greedy II (MST)","desc":"cut · light edge · MST 보조정리 · Prim · Kruskal · union-find","lessons":[{"id":"u15a","title":"MST · cut · light edge","items":[{"id":"u15a-01","type":"mc","q":"spanning tree 의 정의는?","explain":"tree = 'connected graph with no cycles'. 정점 n 개면 간선 n−1 개.","src":"15강 p.4","wiki":"spanning tree","tags":["MST"],"choices":["모든 정점을 지나는 cycle","모든 정점을 잇는 tree (connected, no cycle)","간선 가중치가 가장 작은 path","모든 간선을 포함하는 subgraph"],"answer":1,"introCard":0},{"id":"u15a-02","type":"num","q":"정점 9개 그래프의 spanning tree 는 간선이 몇 개인가?","explain":"tree 는 간선 $n-1$ 개. p.8 MST 도 8개 간선.","src":"15강 p.4, 8","wiki":"spanning tree","tags":["MST"],"answer":8,"tol":0,"introCard":0},{"id":"u15a-03","type":"num","q":"그림의 9정점 14간선 그래프(CLRS 23.1)의 MST cost 는?","explain":"A–B 4, B–C 8, C–I 2, C–D 7, C–F 4, D–E 9, H–G 1, G–F 2 → 37. p.5 노란 트리는 67.","src":"15강 p.5–8 · 11/12 녹음","wiki":"minimum spanning tree","tags":["MST"],"answer":37,"tol":0,"explainImg":"img/algo15-p8-mst.png","img":"img/algo15-p4-graph.png","imgAlt":"9정점 undirected weighted graph: A–B 4, A–H 8, B–C 8, B–H 11, C–I 2, C–D 7, C–F 4, D–E 9, D–F 14, E–F 10, F–G 2, G–H 1, G–I 6, H–I 7","introCard":0},{"id":"u15a-04","type":"tf","q":"MST 는 항상 하나뿐이다.","explain":"예제에서 A–H 8 을 B–C 8 대신 넣어도 cost 37. 동점 간선이 있으면 여러 개일 수 있다.","src":"15강 p.8","wiki":"minimum spanning tree","tags":["MST","trap"],"answer":false,"introCard":0},{"id":"u15a-05","type":"cloze","q":"cut 은 정점 집합의 ___ 이고, 간선 집합 S 의 간선이 하나도 cut 을 건너지 않으면 cut 이 S 를 ___ 한다고 한다.","explain":"교수가 정의 세 개(cut, respect, light edge)를 한국어로 한 번 더 정리한 뒤 'This is important.'","src":"15강 p.12–14 · 11/12 녹음","wiki":"cut이 S를 respect","prof":true,"tags":["MST","cut"],"answer":["partition","respect"],"bank":["partition","respect","subset","cross","cover"],"introCard":1},{"id":"u15a-06","type":"mc","q":"cut 에 대한 light edge 의 정의는?","explain":"'this edge is light with respect to this cut.' 그래프 전체 최소 간선과는 다를 수 있다.","src":"15강 p.14","wiki":"light edge","tags":["MST","cut"],"choices":["가중치가 가장 작은 간선 전체 중 하나","cut 을 건너는 간선 중 가중치가 가장 작은 것","S 에 들어 있는 가장 가벼운 간선","cut 의 한쪽 안에서 가장 가벼운 간선"],"answer":1,"introCard":1},{"id":"u15a-07","type":"num","q":"그림의 그래프에서 cut {A, B, D, E} / {C, I, H, G, F} 를 건너는 간선은 B–C 8, A–H 8, B–H 11, C–D 7, D–F 14, E–F 10 이다. light edge 의 가중치는?","explain":"C–D 7. S = {A–B, C–I, C–F, H–G, G–F} 는 모두 같은 쪽끼리 이어 이 cut 이 S 를 respect 한다.","src":"15강 p.15","wiki":"light edge","tags":["MST","cut","figure"],"answer":7,"tol":0,"img":"img/algo15-p12-cut.png","imgAlt":"p.12 9정점 그래프와 cut {A,B,D,E} / {C,I,H,G,F} (빨간 점선)","explainImg":"img/algo15-p15-light-ans.png","introCard":1},{"id":"u15a-08","type":"tf","q":"cut 의 두 부분은 각각 연결(connected)되어 있어야 한다.","explain":"p.13: {B, C, E, G, H} / {A, D, I, F} 처럼 한쪽이 끊겨 있어도 valid cut 이다.","src":"15강 p.13 · 11/12 녹음","wiki":"cut","tags":["MST","cut","trap"],"answer":false,"introCard":1},{"id":"u15a-09","type":"mc","q":"G: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9 (무향, 가중치 모두 다름). cut {A, B} / {C, D, E, F} 의 light edge 는?","explain":"건너는 간선은 A–C 3, B–C 1, B–D 2. A–B 4 는 같은 쪽끼리라 건너지 않는다.","src":"15강 p.14–15 (연습)","wiki":"light edge","tags":["MST","cut","figure"],"choices":["A–C 3","B–C 1","B–D 2","A–B 4"],"answer":1,"img":"img/algo15-gen-u15a-09.png","imgAlt":"undirected weighted graph: B–C 1, B–D 2, A–C 3, A–B 4, C–D 5, C–E 6, D–F 7, D–E 8, E–F 9","introC
