<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
/* 테마: 저장값 > 시스템 설정. 첫 페인트 전에 정해 깜빡임 없음 */
(function(){var t=null;try{t=localStorage.getItem("algo-theme");}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);})();
</script>
<title>알고위키 — DGIST CSE301 Introduction to Algorithms Wiki</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --text: #222;
    --muted: #777;
    --link: #1d65b3;
    --link-visited: #6a4fa3;
    --header: #2a3b5a;
    --header-text: #fff;
    --border: #d8d8d8;
    --code-bg: #f3f3f3;
    --info-bg: #fff8d8;
    --info-border: #e0c060;
    --warn-bg: #ffe9e9;
    --warn-border: #d68080;
    --tip-bg: #e8f3ff;
    --tip-border: #80a8d6;
    --analogy-bg: #f0ecff;
    --analogy-border: #8a74d8;
    --def-bg: #e9f8ea;
    --def-border: #62b36a;
    --quiz-bg: #fff2e0;
    --quiz-border: #e09a40;
    --exam-bg: #ffe4ea;
    --exam-border: #d6465f;
    --table-head: #ecf0f6;
    --h3: #34466b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  header.top {
    background: var(--header);
    color: var(--header-text);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 3px solid #1c2840;
  }
  header.top .logo {
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  header.top .logo span { color: #ffd75e; }
  header.top .search { flex: 1; min-width: 160px; max-width: 420px; }
  header.top .search input {
    width: 100%;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid #1c2840;
    background: #fff;
    color: #222;
    font-size: 14px;
  }
  .nav-toggle {
    display: none; background: #1c2840; color: #fff; border: 1px solid #3a4a6a;
    border-radius: 3px; padding: 5px 9px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  header.top .tagline {
    margin-left: auto;
    color: #c8d4e6;
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 18px;
    max-width: 1280px;
    margin: 16px auto;
    padding: 0 16px;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px 1fr; }
    .toc-side { display: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; gap: 12px; padding: 0 12px; }
    /* 폰에서는 문서 목록을 기본 접고 ☰ 버튼으로 연다 (aside.nav-side 규칙보다 우선하도록 선택자 명시) */
    aside.nav-side { display: none; position: static; max-height: 60vh; }
    body.nav-open aside.nav-side { display: block; }
    .nav-toggle { display: inline-block; }
    header.top { padding: 8px 12px; gap: 8px; }
    header.top .tagline { display: none; }
    main.article { padding: 16px 14px 40px; }
    main h1 { font-size: 22px; }
    main h2 { font-size: 17px; }
  }

  aside.nav-side, aside.toc-side {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 13px;
    align-self: start;
    position: sticky;
    top: 70px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  aside h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside ul li { padding: 3px 0; }
  aside ul li a {
    color: var(--link);
    text-decoration: none;
    display: block;
    padding: 2px 4px;
    border-radius: 3px;
  }
  aside ul li a:hover { background: #f0f4fa; text-decoration: underline; }
  aside ul li a.active { background: var(--header); color: #fff; font-weight: 600; }
  aside .cat { color: var(--muted); font-size: 11px; margin-top: 10px; }
  aside.toc-side .toc-item { padding-left: 0; }
  aside.toc-side .toc-item.l2 { padding-left: 12px; }
  aside.toc-side .toc-item.l3 { padding-left: 24px; }
  aside.toc-side .toc-item a { font-size: 12px; }

  main.article {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px 32px 60px;
    min-height: 70vh;
    min-width: 0;
  }
  main h1 {
    margin: 0 0 4px;
    font-size: 28px;
    border-bottom: 2px solid var(--header);
    padding-bottom: 8px;
  }
  main .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  main h2 {
    margin-top: 28px;
    font-size: 20px;
    background: #f0f4fa;
    padding: 6px 10px;
    border-left: 4px solid var(--header);
  }
  main h3 {
    margin-top: 18px;
    font-size: 16px;
    color: #34466b;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 4px;
  }
  main h4 { margin-top: 14px; font-size: 14px; color: #34466b; }
  main p { margin: 8px 0; }
  main a { color: var(--link); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main a.wiki { font-weight: 500; }
  main a.wiki-stub { color: #888; font-style: italic; }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 3px 0; }
  main ul ul { margin: 3px 0; }

  main hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  main code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  main pre {
    background: #2b2b2b;
    color: #d0d4d8;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  main pre.c, main pre.asm, main pre.sh, main pre.txt {
    background: #2b2b2b;
    color: #d0d4d8;
  }
  main pre.ascii {
    background: #f8f8f4;
    color: #222;
    border: 1px solid var(--border);
  }

  main table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 14px;
  }
  main table th, main table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  main table th { background: var(--table-head); font-weight: 600; }

  .info, .warn, .tip, .analogy, .def, .quiz, .exam {
    border-left: 4px solid;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
    font-size: 14px;
  }
  .info { background: var(--info-bg); border-color: var(--info-border); }
  .warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .tip  { background: var(--tip-bg);  border-color: var(--tip-border); }
  .info::before { content: "📝 참고  "; font-weight: 700; }
  .warn::before { content: "⚠ 주의  "; font-weight: 700; }
  .tip::before  { content: "💡 팁  "; font-weight: 700; }

  .analogy { background: var(--analogy-bg); border-color: var(--analogy-border); }
  .analogy::before { content: "🎭 비유  "; font-weight: 700; color: #5b45a8; }
  .def { background: var(--def-bg); border-color: var(--def-border); }
  .def::before { content: "📖 정의  "; font-weight: 700; color: #2f7a38; }
  .quiz { background: var(--quiz-bg); border-color: var(--quiz-border); }
  .quiz::before { content: "❓ 예상문제  "; font-weight: 700; color: #a8650c; }
  .exam {
    background: var(--exam-bg);
    border-color: var(--exam-border);
    border-left-width: 6px;
    border-top: 1px solid var(--exam-border);
    border-right: 1px solid var(--exam-border);
    border-bottom: 1px solid var(--exam-border);
    box-shadow: 0 1px 3px rgba(214,70,95,0.18);
  }
  .exam::before { content: "🎯 출제 포인트  "; font-weight: 700; color: #b32741; }

  /* 박스 안에 표·목록 같은 블록이 오면 본문이 renderWikiText 로 재귀 렌더된다.
     첫 문단만 inline 으로 두어 "📝 참고" 라벨과 같은 줄에 붙게 한다. */
  .info > p:first-child, .warn > p:first-child, .tip > p:first-child,
  .joke > p:first-child, .analogy > p:first-child, .def > p:first-child,
  .quiz > p:first-child, .exam > p:first-child { display: inline; }
  .info > :last-child, .warn > :last-child, .tip > :last-child,
  .joke > :last-child, .analogy > :last-child, .def > :last-child,
  .quiz > :last-child, .exam > :last-child { margin-bottom: 0; }
  .info > table, .warn > table, .tip > table, .joke > table,
  .analogy > table, .def > table, .quiz > table, .exam > table { background: #fff; }

  details.answer {
    background: #f4f4f4;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 4px 0 14px;
    font-size: 14px;
  }
  details.answer > summary {
    cursor: pointer;
    font-weight: 700;
    color: #2f6d33;
    list-style: none;
    user-select: none;
  }
  details.answer > summary::-webkit-details-marker { display: none; }
  details.answer > summary::before { content: "▸ "; }
  details.answer[open] > summary::before { content: "▾ "; }
  details.answer[open] > summary { margin-bottom: 6px; border-bottom: 1px dashed #bbb; }

  .joke {
    background: #f5e8ff;
    border-left: 4px solid #a466d6;
    padding: 8px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #555;
    border-radius: 0 4px 4px 0;
  }
  .joke::before { content: "💬 여담  "; font-weight: 700; color: #7440a8; }

  .footnote {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 24px;
  }
  .footnote-ref { font-size: 10px; vertical-align: super; color: var(--link); cursor: pointer; }

  .categories {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .categories .cat-tag, main .meta .cat-tag {
    display: inline-block;
    background: #e8e8e8;
    color: #444;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    font-size: 12px;
  }

  .diagram {
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 10px;
    margin: 12px 0;
    text-align: center;
    border-radius: 4px;
  }
  .diagram .caption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  figure.pdf-img {
    margin: 16px auto;
    text-align: center;
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    max-width: 100%;
  }
  figure.pdf-img img { width: auto; max-width: 100%; height: auto; border: 1px solid #ddd; background: white; }
  figure.pdf-img figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; font-style: italic; }
  /* 크기 옵션은 상한만 정한다 — 본문 칸보다 넓어지지 않도록 100% 와 min() */
  figure.pdf-img.small img  { max-width: min(400px, 100%); }
  figure.pdf-img.medium img { max-width: min(600px, 100%); }
  figure.pdf-img.large img  { max-width: min(850px, 100%); }
  /* grid 자식이 내용물 폭에 끌려 늘어나지 않게 */
  main.article { min-width: 0; overflow-x: hidden; }
  main.article .sim { max-width: 100%; }
  /* 표는 칸보다 넓어지면 가로 스크롤 (폰) */
  .tablewrap { overflow-x: auto; max-width: 100%; margin: 10px 0; }
  .katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }
  .katex { white-space: normal; }
  .tablewrap table { margin: 0; }

  .stub-banner {
    background: #fff3cd;
    border: 1px dashed #d4a017;
    padding: 8px 12px;
    color: #6a5000;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .breadcrumb a { color: var(--link); text-decoration: none; }

  footer.page { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  /* ============================================================
     SimEngine — 단계별 시뮬레이터
     ============================================================ */
  .sim {
    border: 2px solid #3a5480;
    border-radius: 6px;
    background: #fbfcfe;
    margin: 18px 0;
    padding: 0;
    overflow: hidden;
  }
  .sim:focus { outline: 2px solid #ffd75e; }
  .sim .sim-head {
    background: #3a5480;
    color: #fff;
    padding: 8px 12px;
  }
  .sim .sim-head .sim-title { font-weight: 700; font-size: 15px; }
  .sim .sim-head .sim-title::before { content: "🧪 "; }
  .sim .sim-head .sim-subtitle { font-size: 12px; color: #d3ddec; margin-top: 2px; }

  .sim .sim-body { padding: 10px 12px 14px; }

  .sim .sim-opts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 8px;
  }
  .sim .sim-opt { font-size: 12px; color: #34466b; }
  .sim .sim-opt label { font-weight: 600; margin-right: 5px; }
  .sim select {
    font-size: 12px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    color: #222;
    max-width: 100%;
  }

  .sim .sim-ctrl {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }
  .sim .sim-btn {
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    border: 1px solid #3a5480;
    background: #fff;
    color: #2a3b5a;
    border-radius: 4px;
    cursor: pointer;
    min-width: 36px;
  }
  .sim .sim-btn:hover:not(:disabled) { background: #eef2f8; }
  .sim .sim-btn:disabled { opacity: 0.35; cursor: default; }
  .sim .sim-btn.playing { background: #3a5480; color: #fff; }
  .sim .sim-range { flex: 1; min-width: 100px; accent-color: #3a5480; }
  .sim .sim-count {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #34466b;
    white-space: nowrap;
    min-width: 62px;
    text-align: right;
  }

  .sim .sim-panels {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sim .sim-panel {
    flex: 1 1 260px;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .sim .sim-panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: #eef2f8;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: #34466b;
  }
  .sim .sim-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 9px;
    background: #ddd;
    color: #444;
    white-space: nowrap;
  }
  .sim .sim-badge.running { background: #cdefd2; color: #1d6b2a; }
  .sim .sim-badge.ready { background: #fdeec2; color: #8a6000; }
  .sim .sim-badge.spinning { background: #ffd9d9; color: #a52f2f; }
  .sim .sim-badge.blocked, .sim .sim-badge.parked, .sim .sim-badge.sleeping { background: #dcdcf2; color: #3c3c88; }
  .sim .sim-badge.done, .sim .sim-badge.finished { background: #d8d8d8; color: #555; }

  .sim .sim-code {
    position: relative;
    min-width: 0; max-width: 100%;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 6px 0;
    overflow: auto;
    max-height: 280px;
  }
  .sim .sim-line { display: flex; padding: 0 8px; white-space: pre; }
  .sim .sim-line .sim-ln {
    color: #aaa;
    width: 2.4em;
    flex: 0 0 auto;
    text-align: right;
    margin-right: 8px;
    user-select: none;
  }
  .sim .sim-line .sim-mark { width: 1.1em; flex: 0 0 auto; color: #c0392b; font-weight: 700; }
  .sim .sim-line .sim-src { flex: 1 1 auto; }
  .sim .sim-line.cur { background: #fff3bf; }
  .sim .sim-line.cur .sim-src { font-weight: 700; color: #6b4a00; }

  .sim .sim-vars { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  .sim .sim-vars th, .sim .sim-vars td {
    border: 1px solid var(--border);
    padding: 3px 8px;
    text-align: left;
  }
  .sim .sim-vars th { background: #eef2f8; font-weight: 600; width: 40%; }
  .sim .sim-vars tr.sim-group th {
    background: #dde5f0;
    color: #34466b;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  .sim .sim-vars td {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #fff;
  }
  .sim .sim-vars td.changed { background: #fff3bf; font-weight: 700; }
  .sim .sim-vars td .sim-prev { font-size: 10px; color: #9a7b1f; font-weight: 400; margin-right: 4px; }

  .sim .sim-descbox {
    background: #eef4fb;
    border-left: 4px solid #3a5480;
    padding: 8px 12px;
    font-size: 13.5px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-descbox .sim-stepno { font-weight: 700; color: #3a5480; margin-right: 6px; }
  .sim .sim-note {
    background: var(--warn-bg);
    border-left: 4px solid var(--warn-border);
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-note::before { content: "⚠ "; font-weight: 700; }
  .sim .sim-svgbox { text-align: center; overflow-x: auto; margin-top: 4px; }
  .sim .sim-svgbox svg { max-width: 100%; height: auto; }
  .sim .sim-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .sim-missing {
    border: 2px dashed #d6465f;
    background: #ffe4ea;
    color: #b32741;
    padding: 12px;
    border-radius: 4px;
    margin: 14px 0;
    font-weight: 700;
    font-size: 14px;
  }

  @media (max-width: 720px) {
    .sim .sim-panels { flex-direction: column; }
    .sim .sim-panel { flex: 1 1 auto; width: 100%; max-width: 100%; }
    .sim .sim-code { max-height: 220px; }
  }

  /* ---------- 움직이는 그림 (AnimEngine, [[anim:]]) ---------- */
  main.article .anim { max-width: 100%; }
  .anim {
    border: 1px solid #b9c4d8;
    border-left: 5px solid #d6465f;
    border-radius: 6px;
    background: #fff;
    margin: 16px 0;
    overflow: hidden;
    font-size: 13px;
  }
  .anim .anim-head {
    background: #3b2f4a;
    color: #fff;
    padding: 8px 12px;
  }
  .anim .anim-head .anim-title { font-weight: 700; font-size: 15px; }
  .anim .anim-head .anim-title::before { content: "🎞 "; }
  .anim .anim-head .anim-subtitle { font-size: 12px; color: #dcd3ea; margin-top: 2px; }

<script>
(function(){var b=document.getElementById("themeToggle"),r=document.documentElement;
function sync(){var d=r.getAttribute("data-theme")==="dark";b.textContent=d?"☀️":"🌙";b.title=d?"라이트 모드로":"다크 모드로";}
